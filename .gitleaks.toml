# Secret scan config for scripts/security.sh (ticket 46): gitleaks' default
# rules plus an allow-list of the obviously fake test fixtures they flag. Each entry is narrow
# (the exact fixture shape), so a real secret next to it is still found. Decisions:
# docs/security-findings.md.
title = "Bits MFS middleware"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures and samples: UUID idempotency keys, partner config keys, card-token masking samples, a key generated in the test, the base64 of 'not a key', placeholder .env values in shell tests"
regexTarget = "line"
regexes = [
  '''"idempotencyKey"\s*:\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''',
  '''"configKey"\s*:\s*"partner/[a-z0-9-]+"''',
  '''"CARD_TOKEN",\s*"tok_abcdef1234"''',
  '''"-----BEGIN PRIVATE KEY-----\\n"''',
  '''"bm90IGEga2V5"''',
  '''=k3yFromDotEnv''',
  '''=s3cretFromDotEnv''',
]

[[allowlists]]
description = "Committed dev/test settings: obviously fake, documented dev values for the local stack only, copied to the gitignored deploy/.env (ADR D9 amendment 2026-11-13; docs/security-findings.md)"
paths = [
  '''deploy/dev\.env\.defaults''',
]
