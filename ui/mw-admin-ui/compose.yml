# This UI only (spec 15.1, 20.2). Included by deploy/compose/<env>/compose.yml, or run on its own
# with `docker compose -f ui/mw-admin-ui/compose.yml up -d --build` once the platform project is up
# (export MW_ADMIN_UI_AUTH_SECRET first, or use the generated deploy/compose/platform/.env).
#
# Operation zone only (15.1, 18.1): the `ops` network, where APISIX (which routes /console/* here
# and /admin/v1/* to mw-admin-api) and Keycloak are. The browser reaches the console and the
# Keycloak login through APISIX (https://localhost/console, /realms/ops/*); this server calls
# Keycloak inside the stack with the public host as X-Forwarded-* (src/lib/oidc.ts) and
# mw-admin-api through APISIX, so every token carries the public issuer.
networks:
  ops:
    name: ${COMPOSE_PROJECT_NAME:-mw}_ops

services:
  mw-admin-ui:
    image: ${MW_ADMIN_UI_IMAGE:-mw-admin-ui:dev}
    build: .
    restart: unless-stopped
    networks: [ops]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # encrypts the session cookie (JWE) that holds the operator's tokens; generated dev value
      AUTH_SECRET: ${MW_ADMIN_UI_AUTH_SECRET:?run scripts/gen-dev-env.sh (make up does)}
      # public origin of the edge (APISIX); a non-default MW_HTTPS_PORT needs e.g. https://localhost:18443
      AUTH_URL: ${MW_ADMIN_UI_PUBLIC_URL:-https://localhost}/console/api/auth
      AUTH_KEYCLOAK_ISSUER: ${MW_ADMIN_UI_PUBLIC_URL:-https://localhost}/realms/ops
      AUTH_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      AUTH_KEYCLOAK_ID: mw-admin-ui
      ADMIN_API_URL: http://apisix:9080
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/console/api/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
