# Low-resource override for the MVP project: merged over compose.yml by every make target
# (scripts/lib/modules.sh mvp_compose) and baked into the generated root compose.yml
# (scripts/compose-flat.sh). The stack is for functional runs (dev, `make e2e`), never load tests:
# the goal is the smallest footprint that still passes e2e. Hard guard: the memory limits of all
# long-running containers (no mw.oneshot label) must add up to <= 10240 MiB; `make compose-check`
# (and `make verify`) fail above that, or when a long-running service has no memory limit.
#
# Only limits, JVM heap sizes, the JVM build arg, PostgreSQL memory and DB pool sizes live here;
# module compose files and Dockerfiles keep their production-like defaults (ZGC,
# MaxRAMPercentage=75, 768M). The JVM flags the AOT cache depends on (GC, hence compressed oops) are
# the image's JVM_OPTS build arg, used by the training run and by every start (JAVA_TOOL_OPTIONS);
# this file sets that arg to Serial GC and adds only sizes at run time (JDK_JAVA_OPTIONS), so the
# cache baked into the image is used (ticket 55; check with -Xlog:aot).
# CPU limits are left as they are: an idle limit reserves nothing, and lower ones slow start-up
# past the health-check windows.
#
#   container            limit MiB   measured peak (one make up + full make e2e, 2026-11-05)
#   mw-* services        512         311-359 after make up + make e2e TAGS=@p2p, 2026-11-06 (Serial GC, tiered JIT, fixed heap 192m; Hikari pool 3, 4 for the busy three)
#     mw-orchestrator    576         381 (352 at 448 with C1 only and heap 32..160m, 2026-11-05)
#     mw-audit-dw        544         326
#     mw-simulators      448         319
#   kafka                640         374  (fixed heap 256m; 3 partitions per topic, MW_KAFKA_PARTITIONS, ~280 in all)
#   keycloak             640         494  (heap 128..384m)
#   apisix               448         368
#   postgres             384         274  (shared_buffers 64MB, max_connections 100; pools total 39)
#   greenmail            192         123  (heap 96m)
#   openbao              160          92
#   etcd 96 (43), valkey 64 (9)
#   mw-admin-ui          256         not yet measured (Node.js standalone server, ticket 40; its own compose limit)
#   long-running total   9568 of the 10240 guard (ticket 55: services +1664 for the tiered JIT and fixed heap, kafka -256)
#   one-shots (exit before their service starts): *-init 128, kafka-init 512 (3 parallel CLI
#   JVMs; 8 were OOM-killed at 384), apisix-init 256, etcd-init 64
#
# Recalibrate by sampling `docker stats` through one `make up` + `make e2e`: limit about
# peak x 1.3 (JVMs less: their RSS is bounded by the flags), rounded to 32 MiB.

x-jvm-small: &jvm-small
  # Sizes only, on top of the image's JAVA_TOOL_OPTIONS (the trained flags, see x-jvm-build):
  # a fixed heap (BitsPay pattern), normal tiered JIT.
  JDK_JAVA_OPTIONS: >-
    -Xms192m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -Xss512k
    -XX:MaxDirectMemorySize=64m
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

x-jvm-build: &jvm-build
  # The image's JVM_OPTS (JAVA_TOOL_OPTIONS of the AOT training run and of every start), in place of
  # its ZGC + MaxRAMPercentage=75: Serial GC suits a 192m heap; a change here rebuilds the images.
  args:
    JVM_OPTS: -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError

x-limit-svc: &limit-svc
  resources:
    limits:
      memory: 512M

services:
  # --- platform ---
  kafka:
    # 3 partitions per topic (kafka-init MW_KAFKA_PARTITIONS), about 280 in all: a fixed 256m heap.
    # A volume from before ticket 55 holds ~3050 partitions and needs 512m: make down DOWN_ARGS=-v.
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    deploy:
      resources: { limits: { memory: 640M } }
  kafka-init:
    # apply-topics.sh runs PARALLEL Kafka CLI JVMs at once for the creates on a fresh stack (none
    # on a second run: done marker): 3 small, C1-only ones fit (8 were OOM-killed at 384M).
    environment:
      PARALLEL: "3"
      KAFKA_HEAP_OPTS: -Xms16m -Xmx96m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1
    deploy:
      resources: { limits: { memory: 512M } }
  postgres:
    command:
      - postgres
      - -c
      - synchronous_commit=on
      - -c
      - max_connections=100
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    deploy:
      resources: { limits: { memory: 384M } }
  keycloak:
    environment:
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    deploy:
      resources: { limits: { memory: 640M } }
  apisix:
    deploy:
      resources: { limits: { memory: 448M } }
  greenmail:
    environment:
      JAVA_OPTS: -Xmx96m
    deploy:
      resources: { limits: { memory: 192M } }
  valkey:
    deploy:
      resources: { limits: { memory: 64M } }
  openbao:
    deploy:
      resources: { limits: { memory: 160M } }
  etcd:
    deploy:
      resources: { limits: { memory: 96M } }

  # --- modules (limit 512M, Serial-GC image, fixed 192m heap; pool 3, or 4 where the module's yml sets 10) ---
  mw-core-mock:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: *limit-svc
  mw-simulators:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: { resources: { limits: { memory: 448M } } }
  mw-adapter-telco:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: *limit-svc
  mw-adapter-billpay:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: *limit-svc
  mw-adapter-bank:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: *limit-svc
  mw-orchestrator:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4" }
    build: *jvm-build
    deploy: { resources: { limits: { memory: 576M } } }
  mw-audit-dw:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: { resources: { limits: { memory: 544M } } }
  mw-app-gateway:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4" }
    build: *jvm-build
    deploy: *limit-svc
  mw-notify:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: *limit-svc
  mw-ussd:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: *limit-svc
  mw-portal-api:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    build: *jvm-build
    deploy: *limit-svc
  mw-checkout:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4" }
    build: *jvm-build
    deploy: *limit-svc
  mw-admin-api:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2" }
    build: *jvm-build
    deploy: *limit-svc
