# Low-resource override for the MVP project: merged over compose.yml by every make target
# (scripts/lib/modules.sh mvp_compose) and baked into the generated root compose.yml
# (scripts/compose-flat.sh). The stack is for functional runs (dev, `make e2e`), never load tests:
# the goal is the smallest footprint that still passes e2e. Hard guard: the memory limits of all
# long-running containers (no mw.oneshot label) must add up to <= 10240 MiB; `make compose-check`
# (and `make verify`) fail above that, or when a long-running service has no memory limit.
#
# Only limits, JVM heap/GC flags, PostgreSQL memory and DB pool sizes live here; module compose
# files and Dockerfiles keep their production-like defaults (ZGC, MaxRAMPercentage=75, 768M).
# CPU limits are left as they are: an idle limit reserves nothing, and lower ones slow start-up
# past the health-check windows.
#
#   container            limit MiB   measured peak (one make up + full make e2e, 2026-11-05)
#   mw-* services        384         272-316 (Serial GC, C1 only, heap 32..160m; Hikari pool 3, 4 for the busy three)
#     mw-orchestrator    448         352
#     mw-audit-dw        416         322
#     mw-simulators      320         238
#   kafka                896         726  (heap 256..512m; ~3050 partitions: 256m does not start)
#   keycloak             640         494  (heap 128..384m)
#   apisix               448         368
#   postgres             384         274  (shared_buffers 64MB, max_connections 100; pools total 39)
#   greenmail            192         123  (heap 96m)
#   openbao              160          92
#   etcd 96 (43), valkey 64 (9)
#   long-running total   7520 of the 10240 guard
#   one-shots (exit before their service starts): *-init 128, kafka-init 512 (3 parallel CLI
#   JVMs; 8 were OOM-killed at 384), apisix-init 256, etcd-init 64
#
# Recalibrate by sampling `docker stats` through one `make up` + `make e2e`: limit about
# peak x 1.3 (JVMs less: their RSS is bounded by the flags), rounded to 32 MiB.

x-jvm-small: &jvm-small
  # Replaces the image's ZGC + MaxRAMPercentage=75 for this stack only.
  JAVA_TOOL_OPTIONS: >-
    -XX:+UseSerialGC -Xms32m -Xmx160m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m
    -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Xss512k -XX:MaxDirectMemorySize=64m
    -XX:+ExitOnOutOfMemoryError
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

x-limit-svc: &limit-svc
  resources:
    limits:
      memory: 384M

services:
  # --- platform ---
  kafka:
    # ~3050 partitions (deploy/kafka/topics.txt with retry/DLQ tiers): LogManager does not start
    # with a 256m heap (OutOfMemoryError while loading the logs), so 512m.
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    # The probe is a JVM too and would inherit KAFKA_HEAP_OPTS: give it its own small heap.
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx96m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
    deploy:
      resources: { limits: { memory: 896M } }
  kafka-init:
    # apply-topics.sh runs PARALLEL Kafka CLI JVMs at once (default 8 x 256m heap): 3 small,
    # C1-only ones fit 384M (8 were OOM-killed).
    environment:
      PARALLEL: "3"
      KAFKA_HEAP_OPTS: -Xms16m -Xmx96m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1
    deploy:
      resources: { limits: { memory: 512M } }
  postgres:
    command:
      - postgres
      - -c
      - synchronous_commit=on
      - -c
      - max_connections=100
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    deploy:
      resources: { limits: { memory: 384M } }
  keycloak:
    environment:
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    deploy:
      resources: { limits: { memory: 640M } }
  apisix:
    deploy:
      resources: { limits: { memory: 448M } }
  greenmail:
    environment:
      JAVA_OPTS: -Xmx96m
    deploy:
      resources: { limits: { memory: 192M } }
  valkey:
    deploy:
      resources: { limits: { memory: 64M } }
  openbao:
    deploy:
      resources: { limits: { memory: 160M } }
  etcd:
    deploy:
      resources: { limits: { memory: 96M } }

  # --- modules (limit 384M, small JVM; pool 3, or 4 where the module's yml sets 10) ---
  mw-core-mock:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: *limit-svc
  mw-simulators:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: { resources: { limits: { memory: 320M } } }
  mw-adapter-telco:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: *limit-svc
  mw-adapter-billpay:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: *limit-svc
  mw-adapter-bank:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: *limit-svc
  mw-orchestrator:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4" }
    deploy: { resources: { limits: { memory: 448M } } }
  mw-audit-dw:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: { resources: { limits: { memory: 416M } } }
  mw-app-gateway:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4" }
    deploy: *limit-svc
  mw-notify:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: *limit-svc
  mw-ussd:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: *limit-svc
  mw-portal-api:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" }
    deploy: *limit-svc
  mw-checkout:
    environment: { <<: *jvm-small, SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4" }
    deploy: *limit-svc
