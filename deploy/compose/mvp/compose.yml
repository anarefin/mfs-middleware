# MVP environment project (spec "Single-host topology", 20.2): the platform file plus
# each module's own compose.yml, pulled in with Compose `include`.
#
#   make up               # docker compose -f deploy/compose/mvp/compose.yml up -d
#   make smoke            # scripts/smoke.sh: waits for health, then live checks
#   make down             # stop (add DOWN_ARGS=-v to drop the volumes)
#
# Parallel stacks on one host: set COMPOSE_PROJECT_NAME (e.g. mw-t02) and
# MW_HTTPS_PORT (e.g. 0 for a random host port).
name: mw

include:
  - path: ../platform/compose.yml
  # Module compose files are added here as the modules land, e.g.
  # - path: ../../../services/mw-orchestrator/compose.yml
  # A module that needs platform credentials (POSTGRES_PASSWORD...) also takes the generated env.
  - path: ../../../services/mw-core-mock/compose.yml
    env_file: ../platform/.env
  - path: ../../../services/mw-simulators/compose.yml
  - path: ../../../services/mw-adapter-telco/compose.yml
  - path: ../../../services/mw-orchestrator/compose.yml
    env_file: ../platform/.env
