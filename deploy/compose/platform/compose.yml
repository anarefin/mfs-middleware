# Platform tools and zone networks for the single-host stack (spec WP02, 20.2, D11, D12).
# One instance of each. Included by every environment project (deploy/compose/<env>/);
# module compose files join the zone networks defined here.
#
# Zones (18.1): dmz = internet-facing edge, app = services + Kafka + Valkey,
# data = PostgreSQL, ops = Keycloak, OpenBao, etcd, APISIX admin.
# Only APISIX publishes a host port (443 -> 9443; override with MW_HTTPS_PORT). The
# SMPP/USSD port is published later by mw-ussd / mw-simulators.
#
# Images are pinned by tag and digest (20.1). Dev credentials live in env/*.env
# (obviously fake values); this file references no secret values (18.4).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  dmz:
  app:
  data:
  ops:

volumes:
  kafka-data:
  postgres-data:
  valkey-data:
  keycloak-data:
  openbao-data:
  etcd-data:
  apisix-tls:

services:
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    restart: unless-stopped
    networks: [app]
    environment:
      CLUSTER_ID: mw-kraft-single-node-0
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 6.1: single node, RF 1, min ISR 1, topics only from deploy/kafka (kafka-init)
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    logging: *logging

  kafka-init:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    restart: "no"
    networks: [app]
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/deploy/kafka/apply-topics.sh", "/deploy/kafka/topics.txt"]
    environment:
      BOOTSTRAP: kafka:9092
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      PARALLEL: "8"
    volumes:
      - ../../kafka:/deploy/kafka:ro
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    logging: *logging

  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    networks: [data]
    env_file: [env/postgres.env]
    command: ["postgres", "-c", "synchronous_commit=on"]
    volumes:
      - postgres-data:/var/lib/postgresql
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    logging: *logging

  valkey:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    restart: unless-stopped
    networks: [app]
    env_file: [env/valkey.env]
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    volumes:
      - valkey-data:/data
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    networks: [ops]
    env_file: [env/keycloak.env]
    # start-dev: H2 file database on the keycloak-data volume and HTTP inside the ops
    # network; realms in keycloak/realms are imported on start when missing.
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--http-port=8080"]
    environment:
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    logging: *logging

  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    restart: unless-stopped
    networks: [app, ops]
    # dev-unseal.sh starts the server, initialises on first start and unseals on every
    # start (dev only; see the script header)
    entrypoint: ["/bin/sh", "/openbao/dev/dev-unseal.sh"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao/dev-unseal.sh:/openbao/dev/dev-unseal.sh:ro
      - openbao-data:/openbao/file
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging

  etcd:
    image: quay.io/coreos/etcd:v3.6.16@sha256:a9c7cc12156f4b26ca41f0b57ba5b76c45037ff6c1e47ea3d68cb7908d48a965
    restart: unless-stopped
    networks: [ops]
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging

  apisix:
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    restart: unless-stopped
    networks: [dmz, app, ops]
    depends_on:
      etcd: { condition: service_healthy }
    env_file: [env/apisix.env]
    ports:
      - target: 9443
        published: "${MW_HTTPS_PORT:-443}"
        protocol: tcp
    volumes:
      - ../../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    logging: *logging

  apisix-init:
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    restart: "no"
    networks: [ops]
    depends_on:
      apisix: { condition: service_healthy }
    env_file: [env/apisix.env]
    entrypoint: ["/bin/bash", "/deploy/apisix/apply.sh"]
    environment:
      APISIX_ADMIN: apisix:9180
    volumes:
      - ../../apisix:/deploy/apisix:ro
      - apisix-tls:/usr/local/apisix/conf/cert
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }
    logging: *logging

  greenmail:
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    restart: unless-stopped
    networks: [app]
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
      JAVA_OPTS: -Xmx256m
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/service/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging
