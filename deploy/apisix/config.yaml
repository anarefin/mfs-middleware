# APISIX static config (spec 8, 20.2): traditional role, routes and SSL objects in etcd.
# Routes, upstreams and SSL objects are code in deploy/apisix/ and applied by the
# one-shot apisix-init container (deploy/apisix/apply.sh).
apisix:
  node_listen: 9080              # plain HTTP: internal only, never published
  enable_server_tokens: false    # Server: APISIX without its version (ZAP 10036, ticket 46)
  enable_ipv6: false
  ssl:
    enable: true
    listen:
      - port: 9443               # published on the host as 443 (MW_HTTPS_PORT)
    fallback_sni: localhost      # requests without SNI get the edge-default cert
  status:                        # /status and /status/ready, used by the healthcheck
    ip: 0.0.0.0
    port: 7085

nginx_config:
  # Environment variables the workers may read: limit-count's Valkey password is the secret
  # reference "$env://VALKEY_PASSWORD" in the route, so the password is never stored in etcd.
  envs:
    - VALKEY_PASSWORD
  # Access log (spec 18.3, root CLAUDE.md "Masking", M6 gate): APISIX's default format with the
  # request URI, the referrer and the upstream URI replaced by masked copies. Each copy drops the
  # query string (it can carry personal data: ?msisdn=...) and masks up to three MSISDNs
  # (01XXXXXXXXX, 880/+880/%2B880 1XXXXXXXXX, not part of a longer digit run) to 0171****789
  # (first 4, ****, last 3). An 11-digit run inside a UUID is masked too (harmless: the id
  # stays in the services' logs and $apisix_request_id is whole). scripts/log-scan.sh checks the
  # result; scripts/test/test_apisix_edge.sh checks this format uses only the masked copies.
  http:
    access_log_format: '$remote_addr - $remote_user [$time_local] $http_host "$request_method $mw_log_uri $server_protocol" $status $body_bytes_sent $request_time "$mw_log_referer" "$http_user_agent" $upstream_addr $upstream_status $upstream_response_time "$upstream_scheme://$upstream_host$mw_log_upstream_uri" "$apisix_request_id"'
  http_configuration_snippet: |
    map $request_uri $mw_log_uri_0 { "~^([^?#]*)" $1; }
    map $mw_log_uri_0 $mw_log_uri_1 { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_uri_0; }
    map $mw_log_uri_1 $mw_log_uri_2 { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_uri_1; }
    map $mw_log_uri_2 $mw_log_uri { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_uri_2; }
    map $http_referer $mw_log_referer_0 { "~^([^?#]*)" $1; }
    map $mw_log_referer_0 $mw_log_referer_1 { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_referer_0; }
    map $mw_log_referer_1 $mw_log_referer_2 { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_referer_1; }
    map $mw_log_referer_2 $mw_log_referer { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_referer_2; }
    map $upstream_uri $mw_log_upstream_uri_0 { "~^([^?#]*)" $1; }
    map $mw_log_upstream_uri_0 $mw_log_upstream_uri_1 { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_upstream_uri_0; }
    map $mw_log_upstream_uri_1 $mw_log_upstream_uri_2 { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_upstream_uri_1; }
    map $mw_log_upstream_uri_2 $mw_log_upstream_uri { "~^(.*?)(?<![0-9])((?:\+|%2[Bb])?880|0)(1[3-9][0-9])[0-9]{4}([0-9]{3})(?![0-9])(.*)$" $1$2$3****$4$5; default $mw_log_upstream_uri_2; }

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key_required: true
    # Key generated per host into deploy/.env (scripts/gen-dev-env.sh);
    # Compose refuses to start without it.
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    # The Admin API port 9180 is never published on the host. Callers must also come
    # from the ops network's fixed subnet (MW_OPS_SUBNET) or from inside the container;
    # APISIX also sits on dmz and app, and callers from those networks are refused (403).
    allow_admin:
      - 127.0.0.0/8
      - ${{MW_OPS_SUBNET}}
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://etcd:2379"   # on the internal etcd network, shared only with APISIX
    prefix: /apisix
    timeout: 30
    # etcd auth (set up by etcd-init): this user may only use the /apisix prefix
    user: apisix
    password: ${{ETCD_APISIX_PASSWORD}}
