# Accepted HIGH/CRITICAL findings in the pinned upstream platform images (scripts/security.sh,
# ticket 46). These images are pulled by digest (spec 20.1, test_platform_images_are_pinned_by_digest),
# not rebuilt here, so a fix arrives with a new upstream digest. Every entry below has NO fixed
# upstream image as of 2026-11-06 (latest tag rebuilt and re-scanned); each expires so that the
# next scan after the date forces a re-check and a re-pin. Register: docs/security-findings.md.
vulnerabilities:
  # --- apache/apisix:3.19.0-debian (edge). No newer 3.19.0-debian digest. ---------------------
  - id: CVE-2026-13221
    statement: &apisix-perl >-
      perl-base in the Debian 12 base of the APISIX image. APISIX is OpenResty + Lua; perl is only
      used by Debian maintainer scripts, never on a request path, and the container runs as user
      apisix without a shell entry point exposed. Re-pin when apache/apisix publishes a rebuilt digest.
    expired_at: 2027-02-01
  - id: CVE-2026-42496
    statement: *apisix-perl
    expired_at: 2027-02-01
  - id: CVE-2026-42497
    statement: *apisix-perl
    expired_at: 2027-02-01
  - id: CVE-2026-48962
    statement: *apisix-perl
    expired_at: 2027-02-01
  - id: CVE-2026-57432
    statement: *apisix-perl
    expired_at: 2027-02-01
  - id: CVE-2026-57433
    statement: *apisix-perl
    expired_at: 2027-02-01
  - id: CVE-2026-8376
    statement: *apisix-perl
    expired_at: 2027-02-01
  - id: CVE-2026-84782
    statement: >-
      Debian libssl3/openssl in the APISIX image: information disclosure in DTLS handshake
      retransmission. The edge terminates TLS over TCP only (no DTLS listener), with the OpenSSL
      bundled in apisix-runtime. Re-pin with the next upstream digest.
    expired_at: 2027-02-01
  - id: CVE-2026-103111
    statement: >-
      pcre2 out-of-bounds write via a crafted regular expression (APISIX image). Regular
      expressions at the edge come only from our route config (deploy/apisix), never from a
      request. Re-pin with the next upstream digest.
    expired_at: 2027-02-01
  # --- apt in apisix (Debian 12) and greenmail (Debian 13) -----------------------------------
  - id: CVE-2026-109518
    statement: >-
      apt: on-path attacker during apt downloads. The running containers never run apt; only an
      image build would, and these images are pulled, not built here. (Our own service images,
      built on eclipse-temurin, accept it in .trivyignore.yaml for the same reason.)
    expired_at: 2027-02-01
  # --- brotli: apache/kafka (Alpine) and greenmail/standalone (Debian 13) --------------------
  - id: CVE-2026-111497
    statement: >-
      Out-of-bounds write in the system brotli decoder library. Kafka (JVM) and GreenMail (JVM,
      dev-only SMTP sink) never load the native libbrotli; the network protocol paths are Java.
      No rebuilt apache/kafka:4.3.2 or greenmail 2.1.15 digest yet.
    expired_at: 2027-02-01
  # --- expat in apache/kafka (Alpine) ----------------------------------------------------------
  - id: CVE-2026-113351
    statement: &kafka-expat >-
      libexpat in the Alpine base of apache/kafka: Kafka parses no XML with the native expat (JVM
      only, internal app network). No rebuilt 4.3.2 digest yet.
    expired_at: 2027-02-01
  - id: CVE-2026-117610
    statement: *kafka-expat
    expired_at: 2027-02-01
  - id: CVE-2026-118370
    statement: *kafka-expat
    expired_at: 2027-02-01
  - id: CVE-2026-77214
    statement: *kafka-expat
    expired_at: 2027-02-01
  # --- keycloak 26.8.1 (26.8.2 still ships guava 33.6.0) ----------------------------------------
  - id: CVE-2026-102554
    statement: >-
      Guava DoS via unthrottled allocation during deserialization, inside Keycloak. Keycloak does
      not deserialize Guava objects from requests; 26.8.2 (latest) carries the same version.
      Upgrade Keycloak when a release ships guava >= 33.7.2.
    expired_at: 2027-02-01
  # --- openbao 2.7.2 (latest) --------------------------------------------------------------------
  - id: CVE-2026-116587
    paths:
      - "usr/bin/bao"
    statement: >-
      go-jose DoS via crafted RSA parameters in a JWK, in OpenBao 2.7.2 (latest release). The MVP
      enables no JWT/OIDC auth method on OpenBao (AppRole and token only), so no foreign JWK is
      parsed. Upgrade when OpenBao ships go-jose >= 4.1.6.
    expired_at: 2027-02-01
  # --- gosu in postgres:18.6-alpine (Go 1.24.6 stdlib) -----------------------------------------
  - id: CVE-2025-61726
    paths: &gosu ["usr/local/bin/gosu"]
    statement: &gosu-why >-
      Go stdlib CVEs in gosu, which the postgres entrypoint runs once to drop root before exec'ing
      postgres: it opens no socket, parses no input and exits immediately. The postgres image is
      the newest 18.6-alpine digest (2026-11-05). Our init images remove gosu.
    expired_at: 2027-02-01
  - { id: CVE-2025-61729, paths: *gosu, statement: *gosu-why, expired_at: 2027-02-01 }
