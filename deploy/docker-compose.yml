# Bits MFS middleware: the whole single-host stack in one hand-written file (spec "Single-host
# topology", 20.2; ADR D16 replaces the per-module compose.yml files). Edit this file directly.
#
# Start the whole stack without any script (from deploy/, after `./gradlew clean build` made the
# boot jars and `cp dev.env.defaults .env` made the settings file Compose reads on its own), in one
# command: platform, every mw-* service, both consoles, the seed and the test-only routes; it builds
# the images and returns once everything is healthy and seeded (non-zero: `docker compose logs mw-seeder`):
#   docker compose --profile core --profile seed --profile tester up -d --build --wait
# Without the test console and its routes: `--profile core --profile seed up -d --build`, then
# `docker compose --profile core --profile seed wait mw-seeder` (nothing else waits for the seeder there).
# Every one-shot is reached from that command: kafka-init and provision gate every mw-* service
# (x-infra-deps), etcd-init gates apisix, apisix-init gates mw-app-gateway and mw-admin-ui (and
# mw-seeder and apisix-init-tester), apisix-init-tester and mw-seeder gate mw-test-console. provision re-runs on every `up` (an exited one-shot is started again) and creates
# missing roles and schemas idempotently, so a new service's schema appears without `down -v`.
# ./reset.sh drops every container and volume of every profile.
#
# Profiles:
#   (none)    platform services and one-shots: always start
#   minimal   the P2P and cash path the API suite folders 01 and 03 need (orchestrator, core mock,
#             app gateway, simulators, notify, audit-dw, ussd, admin-api; softhsm and mw-crypto, the HSM
#             gateway, and mw-auth, wallet authentication: the security tickets 67-72 put them on that path)
#   core      every mw-* service and mw-admin-ui
#   seed      mw-seeder (ticket 57)
#   tester    mw-test-console (ADR D17, dev/test only) and apisix-init-tester, the one-shot that turns the
#             test-only routes on; the console waits for mw-seeder when the seed profile is on
#
# Credentials (18.4): this file holds no secret value. deploy/.env (gitignored, a copy of the
# committed dev.env.defaults with fixed, obviously fake dev values; ADR D9) holds every one, and Compose reads it to interpolate ${VAR} placeholders (it is not
# passed into the containers: services get their secrets from Vault). env/*.env hold only
# identities and settings. The Keycloak realm files reference their credentials as ${VAR}
# placeholders, which Keycloak resolves from its environment on import.
#
# Zones (18.1): dmz = internet-facing edge, app = services + Kafka + Valkey, data = PostgreSQL,
# ops = Keycloak, Vault, APISIX Admin API callers. ops has a fixed subnet (MW_OPS_SUBNET)
# because the APISIX Admin API only accepts callers from it. etcd sits alone on the internal
# `etcd` network with APISIX (and its init step). Host ports (dev stack, BitsPay pattern; ADR D3
# amendment): APISIX on 443 -> 9443 (MW_HTTPS_PORT) is the edge; every mw-* service (8081-8095), the
# two consoles (3000, 3001) and the platform (postgres 5432, valkey 6379, kafka 9094, keycloak 8180,
# vault 8200, greenmail 8025 / 3025, softhsm 5657 / 5658) also publish a port on 127.0.0.1 only
# (MW_PORT_<NAME> moves one). The direct ports skip the edge policies (JWT, HMAC, quotas) and are for poking at one
# service; the console login still needs https://localhost on 443. etcd and the APISIX Admin API
# stay unpublished. Production publishes the edge only (18.1).
#
# Images are pinned by tag and digest (20.1); the ones built here are mfs-mw/<svc>:local.
#
# Test timers: the ${MW_...} placeholders marked "timer" default to the production values of the
# services' application.yml; dev.env.defaults (copied to deploy/.env) sets the short ones.
#
# Memory (laptop demo footprint: functional runs and feature exploration only, never load tests).
# Target: the whole core profile + seed inside Docker Desktop at 8 GB on a personal laptop.
# Hard guard: the limits of all long-running containers (no mw.oneshot label) must add up to
# <= 8192 MiB; scripts/compose-check.sh fails above that (it sums the knob defaults below, or the
# values set in the shell or deploy/.env), or when a long-running service has no limit.
# The GC flags are the image's JVM_OPTS build arg (x-jvm-build-args, JAVA_TOOL_OPTIONS of every
# start); the run adds only sizes (JDK_JAVA_OPTIONS in x-jvm-env). CPU: at most 1 CPU per JVM
# service and platform container (keycloak 2: its start-up is CPU-bound and the health window
# would pass), so the stack never takes the whole laptop.
#
# Every long-running limit is an optional knob (BitsPay pattern): set it in the shell or in
# deploy/.env, e.g. `APP_MEM_LIMIT=512M APP_XMX=192m docker compose ... up -d`. The defaults are
# the laptop values in the table.
#
#   knob (default)              containers           measured peak MiB (RUNNING.html start + seed +
#                                                    api-test folders 00, 01, 05, 2026-11-06, heap 160m;
#                                                    *: full Cucumber run 2026-11-05)
#   APP_MEM_LIMIT (384M)        every other mw-*     313-362 (Serial GC, tiered JIT; Hikari pool 3, 4 for the busy three;
#                                                    416 -> 384 in ticket 67 to free memory for mw-auth: 10 x 32 MiB)
#   APP_MEM_LIMIT_LARGE (448M)  mw-orchestrator,     369, 320
#                               mw-audit-dw
#   SIM_MEM_LIMIT (384M)        mw-simulators        287
#   CRYPTO_MEM_LIMIT (320M)     mw-crypto            275 (ticket 62: start + key bootstrap, heap CRYPTO_XMX)
#   CRYPTO_XMX (112m)           heap (-Xms = -Xmx) of mw-crypto: no Kafka consumers, a pool of 3
#   AUTH_MEM_LIMIT (320M)       mw-auth              not measured yet (ticket 67: sized like mw-crypto, which
#                                                    peaks at 275 with the same heap; ticket 68 adds a Lettuce
#                                                    client for Valkey; re-measure at the gate)
#   AUTH_XMX (112m)             heap (-Xms = -Xmx) of mw-auth: one Kafka consumer group, a pool of 3
#   APP_XMX (160m)              heap (-Xms = -Xmx) of every mw-* service (x-jvm-env)
#   KAFKA_MEM (576M)            kafka                469  (KAFKA_HEAP (256m) fixed heap; 1 partition per topic, MW_KAFKA_PARTITIONS)
#   KEYCLOAK_MEM (608M)         keycloak             483  (heap 128..384m)
#   APISIX_MEM (384M)           apisix               290, 368*
#   POSTGRES_MEM (320M)         postgres             140, 274*  (shared_buffers 64MB, max_connections 100; pools total 39)
#   GREENMAIL_MEM (160M)        greenmail            125  (heap 96m)
#   VAULT_MEM (128M)            vault                 95
#   SOFTHSM_MEM (48M)           softhsm               new (ticket 61): socat + one p11-kit remote per client
#   ETCD_MEM (64M)              etcd                  34
#   VALKEY_MEM (64M)            valkey                 8
#   ADMIN_UI_MEM (64M)          mw-admin-ui           46  (Node.js standalone server; 160 -> 64 in ticket 62
#                                                    to free memory for mw-crypto: peak x 1.3, rounded up)
#   long-running total with the defaults: 8176 of the 8192 guard (ticket 67: -320 APP_MEM_LIMIT, +320
#                                                    mw-auth; sum of the measured peaks: 6249 without mw-auth)
#   fixed (outside the guard): one-shots exit before their service starts: provision 128,
#   kafka-init 512 (3 parallel CLI JVMs; 8 were OOM-killed at 384), apisix-init 256 (apisix-init-tester
#   the same), etcd-init 64,
#   mw-seeder 256; mw-test-console 192 and partner-sftp 64 (profile tester)
#
# Recalibrate by sampling `docker stats` through one stack start + API suite run: limit about
# peak x 1.3 (JVMs less: their RSS is bounded by the flags), rounded to 32 MiB.
name: mfs-mw

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by every mw-* service: hardening (no root, read-only root fs, no capabilities), restart,
# logs, the app + data zones. mw-admin-ui overrides the networks.
x-app: &app
  restart: unless-stopped
  networks: [app, data]
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  healthcheck:
    # Readiness (20.1); the image has bash but no curl or wget.
    test:
      - CMD
      - bash
      - -c
      - >-
        exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"status":"UP"' <&3
    interval: 5s
    timeout: 3s
    start_period: 30s
    start_interval: 1s
    retries: 3

# Every mw-* JVM service starts once the platform is ready: PostgreSQL, Kafka, Keycloak and
# Vault healthy, the topics created (kafka-init) and every service provisioned (provision).
x-infra-deps: &infra-deps
  postgres: { condition: service_healthy }
  kafka: { condition: service_healthy }
  keycloak: { condition: service_healthy }
  vault: { condition: service_healthy }
  kafka-init: { condition: service_completed_successfully }
  provision: { condition: service_completed_successfully }

# Environment every mw-* JVM service shares. Secrets come from Vault via Spring Cloud Vault
# (18.4): the DB password and the service's other secrets from secret/<svc>, the AppRole
# credentials from the configtree at /run/mw/approle (application.yml). Each service owns its
# schema in the shared PostgreSQL (16.2).
x-jvm-env: &jvm-env
  MW_ENV: ${MW_ENV:-local}
  # The dev stack runs every service in profile dev: among others it turns on the generated
  # /v3/api-docs and Swagger UI (ticket 101), which are off without it (production).
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  VAULT_ENABLED: ${VAULT_ENABLED:-true}
  VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
  DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/mw}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  # Sizes only, on top of the image's JAVA_TOOL_OPTIONS (the GC flags, see x-jvm-build-args):
  # a fixed heap of APP_XMX (BitsPay pattern), normal tiered JIT.
  JDK_JAVA_OPTIONS: >-
    -Xms${APP_XMX:-160m} -Xmx${APP_XMX:-160m} -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -Xss512k
    -XX:MaxDirectMemorySize=64m
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  # timer: non-blocking retry topics <topic>.<group>.retry.1..3 (19.2), three delays
  MW_KAFKA_RETRY_DELAYS: ${MW_KAFKA_RETRY_DELAYS:-10s,1m,10m}

# The image's JVM_OPTS (JAVA_TOOL_OPTIONS of every start), in place of its ZGC +
# MaxRAMPercentage=75: Serial GC suits a 160m heap; a change here rebuilds the images.
x-jvm-build-args: &jvm-build-args
  JVM_OPTS: -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError

x-minimal: &minimal [minimal, core]
x-core: &core [core]

networks:
  dmz:
  app:
  data:
  ops:
    ipam:
      config:
        - subnet: ${MW_OPS_SUBNET:-172.31.250.0/24}
  etcd:
    internal: true

volumes:
  kafka-data:
  postgres-data:
  valkey-data:
  vault-data:
  etcd-data:
  apisix-tls:
  # kafka-init's done marker (apply-topics.sh: checksum of the applied plan)
  kafka-init-state:
  # role-id / secret-id written by provision, each read by its own service only (Spring configtree)
  core-mock-approle:
  crypto-approle:
  auth-approle:
  simulators-approle:
  adapter-telco-approle:
  adapter-billpay-approle:
  adapter-bank-approle:
  orchestrator-approle:
  audit-dw-approle:
  app-gateway-approle:
  notify-approle:
  ussd-approle:
  portal-api-approle:
  checkout-approle:
  admin-api-approle:
  # mw-seeder's manifest (ticket 57): seeded ids and personas, no secret
  seed-manifest:
  # SoftHSMv2 token files (ticket 61): mounted only by softhsm, so keys never sit in another container
  softhsm-tokens:
  # mw-audit-dw's export of the signed daily audit anchors (ticket 74; WORM target TBC)
  audit-anchors:

services:
  # ------------------------------------------------------------ platform (no profile: always start)
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    restart: unless-stopped
    networks: [app]
    ports:
      - "127.0.0.1:${MW_PORT_KAFKA:-9094}:9094"
    environment:
      CLUSTER_ID: mw-kraft-single-node-0
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${MW_PORT_KAFKA:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 6.1: single node, RF 1, min ISR 1, topics only from deploy/kafka (kafka-init)
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # 1 partition per topic (kafka-init MW_KAFKA_PARTITIONS; laptop demo footprint): a fixed 256m heap.
      KAFKA_HEAP_OPTS: -Xms${KAFKA_HEAP:-256m} -Xmx${KAFKA_HEAP:-256m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    tmpfs: [/tmp]
    # A TCP check on the client listener, not a Kafka CLI (a JVM per probe). kafka-init's first
    # describe waits for the broker to answer, and every service waits for kafka-init.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "1", memory: "${KAFKA_MEM:-576M}" }
    logging: *logging

  kafka-init:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    restart: "no"
    labels: { mw.oneshot: "true" }
    networks: [app]
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/deploy/kafka/apply-topics.sh", "/deploy/kafka/topics.txt"]
    environment:
      BOOTSTRAP: kafka:9092
      # apply-topics.sh runs PARALLEL Kafka CLI JVMs at once for the creates on a fresh stack (none
      # on a second run: done marker): 3 small, C1-only ones fit (8 were OOM-killed at 384M).
      PARALLEL: "3"
      KAFKA_HEAP_OPTS: -Xms16m -Xmx96m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1
      # Dev stack: every topic gets 1 partition (laptop footprint; topics.txt keeps the production counts).
      MW_KAFKA_PARTITIONS: ${MW_KAFKA_PARTITIONS:-1}
      # Done marker: a second run with the same plan exits at once, without a Kafka CLI JVM.
      # /var/lib/kafka/data is owned by the image's appuser, so the fresh volume is writable.
      STATE_DIR: /var/lib/kafka/data
    volumes:
      - ./kafka:/deploy/kafka:ro
      - kafka-init-state:/var/lib/kafka/data
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "2", memory: 512M }
    logging: *logging

  postgres:
    image: postgres:18.6-alpine@sha256:8a334ab9502c8ccb8d7dec4e83b36b5ce8ed7b396e585f1c86b0e69c416f4fca
    restart: unless-stopped
    # tini as PID 1: reaps the pg_isready of a healthcheck that timed out (BitsPay deploy pattern)
    init: true
    networks: [data]
    ports:
      - "127.0.0.1:${MW_PORT_POSTGRES:-5432}:5432"
    env_file: [env/postgres.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cp dev.env.defaults .env}
      # postgres/initdb/10-keycloak.sh creates the keycloak role and database with it
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?cp dev.env.defaults .env}
    # One shared dev instance serves Keycloak and every service's pool. max_connections sizing
    # (sum of the worst case, one replica each; keep it below max_connections minus the 3
    # superuser_reserved_connections when a pool or a replica is added): the dev stack caps each
    # service's Hikari pool (SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE below: 2-4, 39 in all with
    # audit-dw's extra pools and Keycloak's 20), so 100 leaves room for psql sessions and the provision one-shot.
    # Production sizes max_connections per instance (pool x replicas, summed).
    command:
      - postgres
      - -c
      - synchronous_commit=on
      - -c
      - max_connections=100
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      # A constraint error's DETAIL line quotes the key, e.g. an unmasked MSISDN wallet id
      # (change_request_one_pending_idx, ticket 59); terse drops DETAIL/HINT/CONTEXT so
      # scripts/log-scan.sh stays clean. The STATEMENT line keeps $n placeholders, no values.
      - -c
      - log_error_verbosity=terse
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "1", memory: "${POSTGRES_MEM:-320M}" }
    logging: *logging

  valkey:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    restart: unless-stopped
    networks: [app]
    ports:
      - "127.0.0.1:${MW_PORT_VALKEY:-6379}:6379"
    environment:
      # --requirepass and valkey-cli (REDISCLI_AUTH) share the generated password
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?cp dev.env.defaults .env}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    volumes:
      - valkey-data:/data
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${VALKEY_MEM:-64M}" }
    logging: *logging

  keycloak:
    image: mfs-mw/keycloak:local
    build: ./keycloak
    restart: unless-stopped
    networks: [ops, data]
    ports:
      - "127.0.0.1:${MW_PORT_KEYCLOAK:-8180}:8080"
    # Pre-built (deploy/keycloak/Dockerfile: `kc.sh build` on the pinned image), so a start skips
    # the Quarkus re-augmentation; its entrypoint is `start --optimized --import-realm`.
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [env/keycloak.env]
    # Production mode on PostgreSQL (its own keycloak database and role, created by
    # postgres/initdb). Plain HTTP inside the ops network behind APISIX, which terminates
    # TLS; realms in keycloak/realms are imported on start when missing.
    environment:
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?cp dev.env.defaults .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?cp dev.env.defaults .env}
      # resolved by Keycloak in the realm files (${VAR} placeholders) on import
      KC_OPS_TEST_PASSWORD: ${KC_OPS_TEST_PASSWORD:?cp dev.env.defaults .env}
      # TOTP secret of the dev-only e2e operators ops-e2e-maker01 / ops-e2e-checker01 (ticket 37)
      KC_OPS_TEST_TOTP_SECRET: ${KC_OPS_TEST_TOTP_SECRET:?cp dev.env.defaults .env}
      KC_PORTALS_TEST_PASSWORD: ${KC_PORTALS_TEST_PASSWORD:?cp dev.env.defaults .env}
      # pre-set TOTP secret of the portals test users (ticket 73)
      KC_PORTALS_TEST_TOTP_SECRET: ${KC_PORTALS_TEST_TOTP_SECRET:?cp dev.env.defaults .env}
      # realm services: internal API clients (/internal/v1/** of mw-orchestrator, mw-audit-dw)
      KC_MW_PORTAL_API_SECRET: ${KC_MW_PORTAL_API_SECRET:?cp dev.env.defaults .env}
      KC_MW_ADMIN_API_SECRET: ${KC_MW_ADMIN_API_SECRET:?cp dev.env.defaults .env}
      KC_MW_AUDIT_DW_SECRET: ${KC_MW_AUDIT_DW_SECRET:?cp dev.env.defaults .env}
      KC_MW_AUTH_SECRET: ${KC_MW_AUTH_SECRET:?cp dev.env.defaults .env}
      KC_MW_APP_GATEWAY_SECRET: ${KC_MW_APP_GATEWAY_SECRET:?cp dev.env.defaults .env}
      KC_MW_USSD_SECRET: ${KC_MW_USSD_SECRET:?cp dev.env.defaults .env}
      KC_MW_CHECKOUT_SECRET: ${KC_MW_CHECKOUT_SECRET:?cp dev.env.defaults .env}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "2", memory: "${KEYCLOAK_MEM:-608M}" }
    logging: *logging

  vault:
    image: hashicorp/vault:2.2.2@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
    restart: unless-stopped
    networks: [app, ops]
    ports:
      - "127.0.0.1:${MW_PORT_VAULT:-8200}:8200"
    # dev-unseal.sh starts the server, initialises on first start and unseals on every
    # start (dev only; see the script header; ADR D30)
    entrypoint: ["/bin/sh", "/vault/dev/dev-unseal.sh"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # mlock is off (config.hcl disable_mlock), so the image's entrypoint needs no IPC_LOCK capability
      SKIP_SETCAP: "true"
      # the fixed tester token dev-unseal.sh creates on first start (a new vault-data volume)
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/dev-unseal.sh:/vault/dev/dev-unseal.sh:ro
      - vault-data:/vault/file
    tmpfs: [/tmp]
    # Healthy once unsealed and the dev engines exist (dev-unseal.sh writes dev-ready after them):
    # provision reads the root token and writes every service's secrets as soon as this is healthy.
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null && test -f /vault/file/dev-ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${VAULT_MEM:-128M}" }
    logging: *logging

  etcd:
    image: quay.io/coreos/etcd:v3.6.16@sha256:a9c7cc12156f4b26ca41f0b57ba5b76c45037ff6c1e47ea3d68cb7908d48a965
    restart: unless-stopped
    networks: [etcd]          # internal network shared only with APISIX; 2379 never published
    environment:
      # healthcheck user: no role, so it can read nothing; etcdctl counts "permission
      # denied" as healthy, and with auth on an anonymous health check is refused
      ETCDCTL_USER: healthcheck:${ETCD_HEALTH_PASSWORD:?cp dev.env.defaults .env}
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${ETCD_MEM:-64M}" }
    logging: *logging

  etcd-init:
    # Turns on etcd auth: root user, and an apisix user limited to the /apisix prefix.
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    restart: "no"
    labels: { mw.oneshot: "true" }
    networks: [etcd]
    depends_on:
      etcd: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/deploy/etcd/init-auth.sh"]
    environment:
      ETCD_ENDPOINT: http://etcd:2379
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?cp dev.env.defaults .env}
      ETCD_APISIX_PASSWORD: ${ETCD_APISIX_PASSWORD:?cp dev.env.defaults .env}
      ETCD_HEALTH_PASSWORD: ${ETCD_HEALTH_PASSWORD:?cp dev.env.defaults .env}
    volumes:
      - ./etcd:/deploy/etcd:ro
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64m }
    logging: *logging

  apisix:
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    restart: unless-stopped
    networks: [dmz, app, ops, etcd]
    depends_on:
      etcd-init: { condition: service_completed_successfully }
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?cp dev.env.defaults .env}
      ETCD_APISIX_PASSWORD: ${ETCD_APISIX_PASSWORD:?cp dev.env.defaults .env}
      # limit-count counters in Valkey (8.3); routes reference it as $env://VALKEY_PASSWORD
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?cp dev.env.defaults .env}
      MW_OPS_SUBNET: ${MW_OPS_SUBNET:-172.31.250.0/24}
    ports:
      - target: 9443
        published: "${MW_HTTPS_PORT:-443}"
        protocol: tcp
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "1", memory: "${APISIX_MEM:-384M}" }
    logging: *logging

  apisix-init: &apisix-init
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    restart: "no"
    labels: { mw.oneshot: "true" }
    networks: [ops]
    depends_on:
      apisix: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/deploy/apisix/apply.sh"]
    environment: &apisix-init-env
      APISIX_ADMIN: apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?cp dev.env.defaults .env}
      # Test-only objects (deploy/apisix/routes-test, consumers-test): off unless scripts/api-test.sh
      # (tests/api/run.sh) or scripts/tester.sh re-runs this one-shot with MW_E2E_ROUTES=1; off also removes them.
      MW_E2E_ROUTES: ${MW_E2E_ROUTES:-0}
      # Public host of the edge (route auth-ops-browser: the only Host it answers for, and the
      # X-Forwarded-Host Keycloak sees, never the client's); the edge certificate's name.
      MW_PUBLIC_HOST: ${MW_PUBLIC_HOST:-localhost}
      MW_E2E_API_KEY: ${MW_E2E_API_KEY:?cp dev.env.defaults .env}
      # hmac-auth secrets of the test-only checkout merchant consumers (ticket 31; consumers-test/merchant_*).
      CHECKOUT_DEMO_MERCHANT_SECRET: ${CHECKOUT_DEMO_MERCHANT_SECRET:?cp dev.env.defaults .env}
      CHECKOUT_PHARMACY_MERCHANT_SECRET: ${CHECKOUT_PHARMACY_MERCHANT_SECRET:?cp dev.env.defaults .env}
      CHECKOUT_FASHION_MERCHANT_SECRET: ${CHECKOUT_FASHION_MERCHANT_SECRET:?cp dev.env.defaults .env}
      # MNO USSD gateways (consumers ussd_<mno>, routes ussd-http-<mno>): basic-auth passwords from
      # deploy/.env (dev.env.defaults) (the simulator gets the same values via Vault), and each MNO's
      # source allow-list (comma-separated CIDRs, required: no fallback, so a missing list stops the
      # stack instead of opening the route). Dev values: dev.env.defaults; production lists
      # each MNO's gateway addresses.
      USSD_GP_GATEWAY_SECRET: ${USSD_GP_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_ROBI_GATEWAY_SECRET: ${USSD_ROBI_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_BL_GATEWAY_SECRET: ${USSD_BL_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_TELETALK_GATEWAY_SECRET: ${USSD_TELETALK_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_GP_ALLOWED_CIDRS: ${USSD_GP_ALLOWED_CIDRS:?cp dev.env.defaults .env}
      USSD_ROBI_ALLOWED_CIDRS: ${USSD_ROBI_ALLOWED_CIDRS:?cp dev.env.defaults .env}
      USSD_BL_ALLOWED_CIDRS: ${USSD_BL_ALLOWED_CIDRS:?cp dev.env.defaults .env}
      USSD_TELETALK_ALLOWED_CIDRS: ${USSD_TELETALK_ALLOWED_CIDRS:?cp dev.env.defaults .env}
    volumes:
      - ./apisix:/deploy/apisix:ro
      - apisix-tls:/usr/local/apisix/conf/cert
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }
    logging: *logging

  # apisix-init-tester (profile tester, ADR D17 amendment 2026-11-16): apisix-init once more with the
  # test-only objects on (MW_E2E_ROUTES=1: routes-test/, consumers-test/, the console's /tester), after
  # apisix-init, so `--profile tester up` turns them on by itself. apply.sh is idempotent; a later `up`
  # without the tester profile re-runs apisix-init (MW_E2E_ROUTES=0), which removes them again.
  apisix-init-tester:
    <<: *apisix-init
    profiles: [tester]
    depends_on:
      apisix-init: { condition: service_completed_successfully }
    environment:
      <<: *apisix-init-env
      MW_E2E_ROUTES: "1"

  greenmail:
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    restart: unless-stopped
    networks: [app]
    ports:
      - "127.0.0.1:${MW_PORT_GREENMAIL:-8025}:8080"
      - "127.0.0.1:${MW_PORT_GREENMAIL_SMTP:-3025}:3025"
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
      JAVA_OPTS: -Xmx96m
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/service/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${GREENMAIL_MEM:-160M}" }
    logging: *logging

  # ------------------------------------------------------------ HSM stand-in (minimal and core)
  # SoftHSMv2 PKCS#11 tokens for dev and test (ticket 61, spec 18.8 / 22.2, ADR D23; deploy/softhsm/README.md):
  # mw-crypto's token on 5657, the payShield simulator's LMK store on 5658, each served over TCP as the
  # p11-kit RPC protocol, so SoftHSM and the token files stay in this container. The tokens are created
  # on a fresh softhsm-tokens volume with the fake, documented labels and PINs of deploy/.env and kept
  # on every later `up`; no keys are generated here (mw-crypto's key API does that).
  softhsm:
    profiles: *minimal
    image: mfs-mw/softhsm:local
    build: ./softhsm
    restart: unless-stopped
    # tini as PID 1: reaps the per-connection p11-kit remote processes and the healthcheck's
    init: true
    networks: [app]
    ports:
      - "127.0.0.1:${MW_PORT_SOFTHSM_MWCRYPTO:-5657}:5657"
      - "127.0.0.1:${MW_PORT_SOFTHSM_PAYSIM:-5658}:5658"
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SOFTHSM_MWCRYPTO_LABEL: ${SOFTHSM_MWCRYPTO_LABEL:-mw-crypto}
      SOFTHSM_MWCRYPTO_SO_PIN: ${SOFTHSM_MWCRYPTO_SO_PIN:?cp dev.env.defaults .env}
      SOFTHSM_MWCRYPTO_USER_PIN: ${SOFTHSM_MWCRYPTO_USER_PIN:?cp dev.env.defaults .env}
      SOFTHSM_PAYSIM_LABEL: ${SOFTHSM_PAYSIM_LABEL:-paysim}
      SOFTHSM_PAYSIM_SO_PIN: ${SOFTHSM_PAYSIM_SO_PIN:?cp dev.env.defaults .env}
      SOFTHSM_PAYSIM_USER_PIN: ${SOFTHSM_PAYSIM_USER_PIN:?cp dev.env.defaults .env}
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    # pkcs11-tool --list-slots through both sockets sees both tokens
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/softhsm/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "${SOFTHSM_MEM:-48M}" }
    logging: *logging

  # ------------------------------------------------------------ provisioning (minimal and core)
  # The dev stack's one provisioning one-shot (deploy/provision; ADR D16): for every service of
  # deploy/provision/services.sh, in order, its secret/<svc> in Vault, its database role(s) and
  # schema and the AppRole it logs in with, written to that service's own <dir>-approle volume.
  # Idempotent on every `up`; only this one-shot holds the Vault root token and the
  # PostgreSQL admin password. Starts once both are healthy, so provision.sh never polls. Dev/MVP only.
  provision:
    profiles: *minimal
    image: mfs-mw/provision:local
    build: ./provision
    restart: "no"
    labels: { mw.oneshot: "true" } # one-shot: exits 0 before any mw-* service starts
    networks: [app, data]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
      # registers partner-sim's private_key_jwt certificate in realm partners (ticket 73)
      keycloak: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-mw_admin}
      PGDATABASE: ${POSTGRES_DB:-mw}
      PGPASSWORD: ${POSTGRES_PASSWORD:?cp dev.env.defaults .env}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      INIT_FILE: /vault/file/dev-init.json
      # Keycloak admin REST on the data network (lib.sh partner_sim_client_key, ticket 73)
      KC_URL: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: kc-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?cp dev.env.defaults .env}
      OUT_ROOT: /out
      # deploy/.env values synced into the services' secrets on every run (services.sh sync_env)
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?cp dev.env.defaults .env}
      BILLAGG_HMAC_SECRET: ${BILLAGG_HMAC_SECRET:?cp dev.env.defaults .env}
      BILLAGG_WS_PASSWORD: ${BILLAGG_WS_PASSWORD:?cp dev.env.defaults .env}
      C2WBANK_HMAC_SECRET: ${C2WBANK_HMAC_SECRET:?cp dev.env.defaults .env}
      CHECKOUT_DEMO_MERCHANT_SECRET: ${CHECKOUT_DEMO_MERCHANT_SECRET:?cp dev.env.defaults .env}
      KC_MW_ADMIN_API_SECRET: ${KC_MW_ADMIN_API_SECRET:?cp dev.env.defaults .env}
      KC_MW_AUDIT_DW_SECRET: ${KC_MW_AUDIT_DW_SECRET:?cp dev.env.defaults .env}
      KC_MW_AUTH_SECRET: ${KC_MW_AUTH_SECRET:?cp dev.env.defaults .env}
      KC_MW_APP_GATEWAY_SECRET: ${KC_MW_APP_GATEWAY_SECRET:?cp dev.env.defaults .env}
      KC_MW_USSD_SECRET: ${KC_MW_USSD_SECRET:?cp dev.env.defaults .env}
      KC_MW_CHECKOUT_SECRET: ${KC_MW_CHECKOUT_SECRET:?cp dev.env.defaults .env}
      KC_MW_PORTAL_API_SECRET: ${KC_MW_PORTAL_API_SECRET:?cp dev.env.defaults .env}
      USSD_GP_GATEWAY_SECRET: ${USSD_GP_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_ROBI_GATEWAY_SECRET: ${USSD_ROBI_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_BL_GATEWAY_SECRET: ${USSD_BL_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_TELETALK_GATEWAY_SECRET: ${USSD_TELETALK_GATEWAY_SECRET:?cp dev.env.defaults .env}
      # the other two dev checkout merchants' signing secrets, into secret/mw-checkout
      CHECKOUT_PHARMACY_MERCHANT_SECRET: ${CHECKOUT_PHARMACY_MERCHANT_SECRET:?cp dev.env.defaults .env}
      CHECKOUT_FASHION_MERCHANT_SECRET: ${CHECKOUT_FASHION_MERCHANT_SECRET:?cp dev.env.defaults .env}
      # the softhsm mw-crypto token's user PIN, into secret/mw-crypto (tickets 61, 62)
      SOFTHSM_MWCRYPTO_USER_PIN: ${SOFTHSM_MWCRYPTO_USER_PIN:?cp dev.env.defaults .env}
      # the softhsm paysim token's user PIN, into secret/mw-simulators (payShield simulator, ticket 64)
      SOFTHSM_PAYSIM_USER_PIN: ${SOFTHSM_PAYSIM_USER_PIN:?cp dev.env.defaults .env}
    volumes:
      - vault-data:/vault/file:ro
      # one volume per service, at /out/<dir> as listed in services.sh
      - core-mock-approle:/out/core-mock
      - crypto-approle:/out/crypto
      - auth-approle:/out/auth
      - simulators-approle:/out/simulators
      - orchestrator-approle:/out/orchestrator
      - audit-dw-approle:/out/audit-dw
      - app-gateway-approle:/out/app-gateway
      - notify-approle:/out/notify
      - ussd-approle:/out/ussd
      - admin-api-approle:/out/admin-api
      - adapter-telco-approle:/out/adapter-telco
      - adapter-billpay-approle:/out/adapter-billpay
      - adapter-bank-approle:/out/adapter-bank
      - portal-api-approle:/out/portal-api
      - checkout-approle:/out/checkout
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging: *logging

  # ------------------------------------------------------------ minimal (and core): P2P and cash path
  # Ledger and PIN check stand-in for the core (spec 13); the PIN private key in Vault.
  mw-core-mock:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_CORE_MOCK:-8084}:8080"
    image: mfs-mw/mw-core-mock:local
    build: { context: ../services/mw-core-mock, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - core-mock-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # Dev stack only: the test-only wallet seed API mw-seeder uses (ticket 57, core-mock-seed.v1).
      MW_COREMOCK_SEED_API_ENABLED: "true"
      # Dev stack only: every wallet as WalletStateChanged SNAPSHOT on start (ticket 67), so mw-auth's
      # wallet projection catches up with a ledger it missed (idempotent by version).
      MW_COREMOCK_WALLET_SNAPSHOT: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # The HSM gateway (ticket 62, spec 18.8, ADR D23): the only HSM client. Logs in to the softhsm
  # mw-crypto token (user PIN from Vault secret/mw-crypto) over the p11-kit proxy of its image and
  # serves key management by keyId on /internal/v1/keys (realm services JWT). Dev stack: the missing
  # key of every purpose is created on start (MW_CRYPTO_BOOTSTRAP_KEYS; production keys come only from
  # the key ceremony, ticket 75).
  mw-crypto:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_CRYPTO:-8094}:8080"
    image: mfs-mw/mw-crypto:local
    build: { context: ../services/mw-crypto, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
      softhsm: { condition: service_healthy }
    volumes:
      - crypto-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      # its own heap knob (CRYPTO_XMX), the other sizes as x-jvm-env
      JDK_JAVA_OPTIONS: >-
        -Xms${CRYPTO_XMX:-112m} -Xmx${CRYPTO_XMX:-112m} -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -Xss512k
        -XX:MaxDirectMemorySize=64m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      MW_CRYPTO_BOOTSTRAP_KEYS: "true"
      # the payShield provider (ticket 64) against the simulator in mw-simulators (host commands on
      # mw-simulators:1500); the bootstrap also creates the PVK, TPK, ZPK (+ _AES) keys there
      MW_CRYPTO_PAYSHIELD_ENABLED: "true"
      # DEV ONLY (ticket 76): the payShield test API on the plain port 8082 (never published; the
      # test-only APISIX route /test/crypto/v1/*) and its test-only client bound to TPK and PVK;
      # off unless deploy/.env sets them (only dev.env.defaults does)
      MW_CRYPTO_TEST_API_ENABLED: ${MW_CRYPTO_TEST_API_ENABLED:-false}
      MW_CRYPTO_AUTHZ_PURPOSES_TPK: ${MW_CRYPTO_AUTHZ_PURPOSES_TPK:-}
      MW_CRYPTO_AUTHZ_PURPOSES_PVK: ${MW_CRYPTO_AUTHZ_PURPOSES_PVK:-}
    # mTLS (D24, ticket 66): 8080 (and the published 8094) needs a client certificate of the Vault
    # intermediate pki_int; the service issues its own at start (pki_int/issue/mw-crypto, provision).
    # Probes and metrics are on the plain management port 8081, inside the network only.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${CRYPTO_MEM_LIMIT:-320M}" }

  # Wallet authentication and PIN custody (ticket 67, spec 18.7, ADRs D20-D22). Keeps auth.wallet, a
  # projection of the core's WalletStateChanged events (core.wallet.event.v1), with the MSISDN hashed
  # and encrypted through mw-crypto (mTLS + realm services client mw-auth). Ports: 8080 public
  # /auth/v1/** (published as 8095; behind APISIX route auth-v1 since ticket 68: device binding, OTP,
  # sessions, with Valkey sessions and nonces), 8443 internal /internal/v1/** with
  # mTLS (D24: client certificate of pki_int + service JWT; not published), 8081 actuator (plain, not
  # published).
  mw-auth:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_AUTH:-8095}:8080"
    image: mfs-mw/mw-auth:local
    build: { context: ../services/mw-auth, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
      mw-crypto: { condition: service_healthy }
    volumes:
      - auth-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      # its own heap knob (AUTH_XMX), the other sizes as x-jvm-env
      JDK_JAVA_OPTIONS: >-
        -Xms${AUTH_XMX:-112m} -Xmx${AUTH_XMX:-112m} -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -Xss512k
        -XX:MaxDirectMemorySize=64m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # Valkey for device sessions and the nonce cache (ticket 68, 18.7); its password comes from Vault.
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      # DEV ONLY: POST /internal/v1/seed/pins, the seeder's first app PINs (ticket 69); dev.env.defaults
      # switches it on, the default is off.
      MW_AUTH_SEED_API_ENABLED: ${MW_AUTH_SEED_API_ENABLED:-false}
      # Binding OTPs per wallet in 15 min (default 5): dev only raises it, so repeated API suite runs
      # (each binds every test user's new device once) do not hit the limit. Moved from mw-app-gateway.
      MW_AUTH_DEVICE_OTP_MAX_SENDS: ${MW_AUTH_DEVICE_OTP_MAX_SENDS:-20}
      # Checkout OTPs per wallet in 15 min (default 5; their own quota, apart from the device OTPs, ticket
      # 72): dev only raises it, so the API suite's checkout sessions for customer01 do not hit it.
      MW_AUTH_CHANNEL_OTP_MAX_SENDS: ${MW_AUTH_CHANNEL_OTP_MAX_SENDS:-20}
      # PIN lockout (ticket 70, spec 18.7, D20): wrong PINs per level and how long levels 1 and 2 last
      # (level 3 is until a reset), and when the level history is forgotten. Defaults are the
      # production values; dev.env.defaults shortens the levels so the lockout can be played by hand.
      MW_AUTH_LOCK_TRIES: ${MW_AUTH_LOCK_TRIES:-3}
      MW_AUTH_LOCK_LEVEL1: ${MW_AUTH_LOCK_LEVEL1:-1h}
      MW_AUTH_LOCK_LEVEL2: ${MW_AUTH_LOCK_LEVEL2:-24h}
      MW_AUTH_LOCK_DECAY: ${MW_AUTH_LOCK_DECAY:-30d}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${AUTH_MEM_LIMIT:-320M}" }

  # Partner, SMSC and USSD gateway simulators (OCS, bill aggregator, C2W bank, merchant IPN).
  mw-simulators:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_SIMULATORS:-8085}:8080"
    image: mfs-mw/mw-simulators:local
    build: { context: ../services/mw-simulators, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
      # the payShield simulator's LMK is in the softhsm paysim token (port 5658, ticket 64)
      softhsm: { condition: service_healthy }
    volumes:
      - simulators-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # Hold time of a simulated partner timeout (amount fraction .13): above the callers' time
      # limits (timer: dev.env.defaults shortens it with them).
      SIM_TIMEOUTDELAY: ${MW_SIM_TIMEOUT_DELAY:-30s}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${SIM_MEM_LIMIT:-384M}" }

  # Transaction saga (spec 7).
  mw-orchestrator:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_ORCHESTRATOR:-8083}:8080"
    image: mfs-mw/mw-orchestrator:local
    build: { context: ../services/mw-orchestrator, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - orchestrator-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      # Valkey for the idempotency lock (7.3 rule 4); its password comes from Vault.
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      # Dev only (A3): org ORG002 of realm portals collects for biller DESCO and merchant
      # 01911000001 (the core mock's merchant01), so the SP query shows those payments as PAYEE.
      # The main config has no org payees (JSON, as env var names would lower-case the org ids).
      SPRING_APPLICATION_JSON: >-
        {"mw":{"orchestrator":{"search":{"org-payees":{"ORG002":["BILLER:DESCO","MERCHANT:01911000001"]}}}}}
      # timers (spec 7.2, 7.4; application.yml mw.orchestrator.*): saga deadlines, the status
      # inquiry schedule of UNKNOWN outcomes and its "not found" grace, the reversal deadline
      MW_ORCHESTRATOR_HOLDINGTIMEOUT: ${MW_ORCHESTRATOR_HOLDING_TIMEOUT:-5s}
      MW_ORCHESTRATOR_POSTINGTIMEOUT: ${MW_ORCHESTRATOR_POSTING_TIMEOUT:-5s}
      MW_ORCHESTRATOR_PARTNERTIMEOUT: ${MW_ORCHESTRATOR_PARTNER_TIMEOUT:-30s}
      MW_ORCHESTRATOR_INQUIRY_SCHEDULE: ${MW_ORCHESTRATOR_INQUIRY_SCHEDULE:-30s,1m,2m,5m,15m,1h}
      MW_ORCHESTRATOR_INQUIRY_NOTFOUNDGRACE: ${MW_ORCHESTRATOR_INQUIRY_NOT_FOUND_GRACE:-30s}
      MW_ORCHESTRATOR_REVERSINGTIMEOUT: ${MW_ORCHESTRATOR_REVERSING_TIMEOUT:-60s}
      # business-duplicate window (FRS PLT-013, ticket 99; 0s = off): same payment under a new key
      MW_DUPLICATE_WINDOW: ${MW_DUPLICATE_WINDOW:-60s}
      # Dev/test only (ticket 58): the test API /test/v1/** (publish a REVERSAL, idempotency
      # lookup) for the host API suite; APISIX routes it only with MW_E2E_ROUTES=1.
      MW_ORCHESTRATOR_TEST_API_ENABLED: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT_LARGE:-448M}" }

  # Append-only audit trail and its query API (spec 14).
  mw-audit-dw:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_AUDIT_DW:-8087}:8080"
    image: mfs-mw/mw-audit-dw:local
    build: { context: ../services/mw-audit-dw, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - audit-dw-approle:/run/mw/approle:ro
      # signed daily audit anchors as <date>.jws (ticket 74; the WORM target is TBC)
      - audit-anchors:/var/lib/mw/audit-anchors
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # mTLS client certificate (pki_int/issue/mw-audit-dw) for the anchor signing at mw-crypto (ticket 74)
      MW_TLS_ENABLED: "true"
      # Runs as the INSERT-only writer; Flyway migrates as the schema owner (14.3, 16.4).
      DB_USERNAME: audit_writer
      SPRING_FLYWAY_USER: audit_dw_rw
      # Test-only audit API (ticket 58; /test/v1/audit/*, reached only through the test-only
      # APISIX route test-audit-dw with MW_E2E_ROUTES=1): dev/test stack only.
      MW_AUDIT_DW_TEST_API_ENABLED: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT_LARGE:-448M}" }

  # Customer app API (spec 9.1).
  mw-app-gateway:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_APP_GATEWAY:-8081}:8080"
    image: mfs-mw/mw-app-gateway:local
    build: { context: ../services/mw-app-gateway, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
      # reached only through the edge: its routes are applied first (and the one-shot is started by
      # a plain `up`, which `up --wait` needs: a one-shot nothing depends on counts as a failure)
      apisix-init: { condition: service_completed_successfully }
      # the device gate asks mw-auth for device keys and sessions (ticket 68; fails closed without it)
      mw-auth: { condition: service_healthy }
    volumes:
      - app-gateway-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      # Valkey for device sessions and the nonce cache (9.1, 18.6); its password comes from Vault.
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      # The app tokens' signing keys: mw-auth's JWK Set on its public port (ticket 69, D21; RS256).
      MW_APP_JWK_SET_URI: ${MW_APP_JWK_SET_URI:-http://mw-auth:8080/auth/v1/.well-known/jwks.json}
      # Synchronous wait for a terminal status before 202 PROCESSING (7.5).
      MW_APP_REPLY_BUDGET: ${MW_APP_REPLY_BUDGET:-25s}
      # mTLS client certificate (pki_int/issue/mw-app-gateway) for mw-auth's internal API: the device
      # gate reads device keys and sessions there (ticket 68, D24)
      MW_TLS_ENABLED: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # SMS over SMPP and email over SMTP (spec 10).
  mw-notify:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_NOTIFY:-8086}:8080"
    image: mfs-mw/mw-notify:local
    build: { context: ../services/mw-notify, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - notify-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # SMSC over SMPP 3.4 (10.2): the simulator in the MVP stack (internal network, no host port).
      SMPP_HOST: ${SMPP_HOST:-mw-simulators}
      SMPP_PORT: ${SMPP_PORT:-2775}
      # Email over SMTP (10.2): the platform's GreenMail (internal network, no auth, no TLS).
      SMTP_HOST: ${SMTP_HOST:-greenmail}
      SMTP_PORT: ${SMTP_PORT:-3025}
      # DEV ONLY: GreenMail offers no STARTTLS. The service's own default requires it.
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      MAIL_FROM: ${MAIL_FROM:-bits <no-reply@bits.test>}
      # Dev/MVP stack only: also apply db/dev (registered emails of the seeded test users).
      MW_NOTIFY_FLYWAY_LOCATIONS: ${MW_NOTIFY_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/dev}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # USSD menus over HTTP and SMPP (spec 9.2); in minimal for the @p2p / @cash USSD scenarios.
  mw-ussd:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_USSD:-8082}:8080"
    image: mfs-mw/mw-ussd:local
    build: { context: ../services/mw-ussd, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
      # every PIN goes to mw-auth for the transaction assertion (ticket 72; fails closed without it)
      mw-auth: { condition: service_healthy }
    volumes:
      - ussd-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # Valkey holds the USSD sessions (spec 9.2); its password comes from Vault.
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      # Final status awaited this long before the menu ends with "being processed" (9.2).
      MW_USSD_SYNC_BUDGET: ${MW_USSD_SYNC_BUDGET:-8s}
      # GP USSD over SMPP (WP19): binds to the USSD gateway simulator's SMPP port in dev.
      MW_USSD_SMPP_GP_HOST: ${MW_USSD_SMPP_GP_HOST:-mw-simulators}
      MW_USSD_SMPP_GP_PORT: ${MW_USSD_SMPP_GP_PORT:-2776}
      # mTLS client certificate (pki_int/issue/mw-ussd) for mw-auth's internal API: the transaction
      # assertion of every PIN (ticket 72, D22, D24)
      MW_TLS_ENABLED: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # Operator admin API (spec 15); in minimal for the @p2p operator and template scenarios.
  mw-admin-api:
    <<: *app
    profiles: *minimal
    ports:
      - "127.0.0.1:${MW_PORT_ADMIN_API:-8088}:8080"
    image: mfs-mw/mw-admin-api:local
    build: { context: ../services/mw-admin-api, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - admin-api-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2"
      # Dev profile (application-dev.yml): the partner seeds mirroring the adapters' dev seeds (ticket 38).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Signing keys of Keycloak realm `ops` (operators, spec 15.1). Keycloak sits on `ops` and, as
      # the recorded MVP deviation of 18.1, on `data`: the service reaches it over `data` and
      # joins no ops network (the ops subnet may call the APISIX Admin API).
      MW_ADMIN_JWK_SET_URI: ${MW_ADMIN_JWK_SET_URI:-http://keycloak:8080/realms/ops/protocol/openid-connect/certs}
      # mTLS client certificate (pki_int/issue/mw-admin-api) for the key screens and the key ceremony
      # at mw-crypto (ticket 75)
      MW_TLS_ENABLED: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # ------------------------------------------------------------ core: the rest of the stack
  # Mobile top-up adapter: OCS (spec 12); the dev profile seeds the partners on the simulator.
  mw-adapter-telco:
    <<: *app
    profiles: *core
    ports:
      - "127.0.0.1:${MW_PORT_ADAPTER_TELCO:-8089}:8080"
    image: mfs-mw/mw-adapter-telco:local
    build: { context: ../services/mw-adapter-telco, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - adapter-telco-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # OCS endpoint; the MVP stack targets the OCS simulator (mw-simulators).
      OCS_BASE_URL: ${OCS_BASE_URL:-http://mw-simulators:8080}
      # Dev stack only: the seed partners on the simulator (application-dev.yml; the packaged
      # config has none) and plain http for the simulator (the packaged default allows none).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MW_PARTNER_INSECURE_HTTP_HOSTS: ${MW_PARTNER_INSECURE_HTTP_HOSTS:-mw-simulators}
      # mw-recon: data lines per reconciliation file (a longer file moves to .error).
      MW_PARTNER_RECON_MAX_LINES: ${MW_PARTNER_RECON_MAX_LINES:-1000000}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # Bill payment adapter: utility bill aggregator (spec 12).
  mw-adapter-billpay:
    <<: *app
    profiles: *core
    ports:
      - "127.0.0.1:${MW_PORT_ADAPTER_BILLPAY:-8090}:8080"
    image: mfs-mw/mw-adapter-billpay:local
    build: { context: ../services/mw-adapter-billpay, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - adapter-billpay-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # Utility bill aggregator endpoint; the MVP stack targets the aggregator simulator
      # (mw-simulators, /billagg/v1/*).
      BILLAGG_BASE_URL: ${BILLAGG_BASE_URL:-http://mw-simulators:8080}
      # The dev partner's time limit and read timeout (application-dev.yml values; timer: dev.env.defaults
      # shortens them, the read timeout staying above the limit).
      MW_PARTNERS_INSTANCES_BILLAGG_TIMEOUTMS: ${MW_BILLAGG_TIMEOUT_MS:-25000}
      MW_PARTNERS_INSTANCES_BILLAGG_READTIMEOUTMS: ${MW_BILLAGG_READ_TIMEOUT_MS:-27000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MW_PARTNER_INSECURE_HTTP_HOSTS: ${MW_PARTNER_INSECURE_HTTP_HOSTS:-mw-simulators}
      # mw-recon: data lines per reconciliation file (a longer file moves to .error).
      MW_PARTNER_RECON_MAX_LINES: ${MW_PARTNER_RECON_MAX_LINES:-1000000}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # Add money adapter: C2W bank (spec 12).
  mw-adapter-bank:
    <<: *app
    profiles: *core
    ports:
      - "127.0.0.1:${MW_PORT_ADAPTER_BANK:-8091}:8080"
    image: mfs-mw/mw-adapter-bank:local
    build: { context: ../services/mw-adapter-bank, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - adapter-bank-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # C2W bank endpoint; the MVP stack targets the bank simulator (mw-simulators, /c2wbank/v1/*).
      C2WBANK_BASE_URL: ${C2WBANK_BASE_URL:-http://mw-simulators:8080}
      # The dev partner's time limit and read timeout (application-dev.yml values; timer: dev.env.defaults
      # shortens them, the read timeout staying above the limit).
      MW_PARTNERS_INSTANCES_C2WBANK_TIMEOUTMS: ${MW_C2WBANK_TIMEOUT_MS:-25000}
      MW_PARTNERS_INSTANCES_C2WBANK_READTIMEOUTMS: ${MW_C2WBANK_READ_TIMEOUT_MS:-27000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MW_PARTNER_INSECURE_HTTP_HOSTS: ${MW_PARTNER_INSECURE_HTTP_HOSTS:-mw-simulators}
      # mw-recon: data lines per reconciliation file (a longer file moves to .error).
      MW_PARTNER_RECON_MAX_LINES: ${MW_PARTNER_RECON_MAX_LINES:-1000000}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # Organisation portal API and bulk disbursement (spec 8.2, 9.4).
  mw-portal-api:
    <<: *app
    profiles: *core
    ports:
      - "127.0.0.1:${MW_PORT_PORTAL_API:-8093}:8080"
    image: mfs-mw/mw-portal-api:local
    build: { context: ../services/mw-portal-api, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
    volumes:
      - portal-api-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # Signing keys of Keycloak realm `portals` (spec 8.2). Keycloak sits on `ops` and, as
      # the recorded MVP deviation of 18.1, on `data`: the service reaches it over `data` and
      # joins no ops network (the ops subnet may call the APISIX Admin API).
      MW_PORTAL_JWK_SET_URI: ${MW_PORTAL_JWK_SET_URI:-http://keycloak:8080/realms/portals/protocol/openid-connect/certs}
      # timer: bulk child txns dispatched per second over all batches (spec 9.4)
      MW_BULK_RATE_PER_SECOND: ${MW_BULK_RATE_PER_SECOND:-50}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # Merchant checkout API and hosted payment page API (spec 9.3).
  mw-checkout:
    <<: *app
    profiles: *core
    ports:
      - "127.0.0.1:${MW_PORT_CHECKOUT:-8092}:8080"
    image: mfs-mw/mw-checkout:local
    build: { context: ../services/mw-checkout, args: *jvm-build-args }
    depends_on:
      <<: *infra-deps
      # the checkout OTP and every PIN go to mw-auth (ticket 72; fails closed without it)
      mw-auth: { condition: service_healthy }
    volumes:
      - checkout-approle:/run/mw/approle:ro
    environment:
      <<: *jvm-env
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      # Where the hosted checkout page lives (front-end TBC, spec open point 16).
      MW_CHECKOUT_PAGE_BASE_URL: ${MW_CHECKOUT_PAGE_BASE_URL:-https://localhost/checkout/page/}
      # Synchronous wait for the payment's terminal status before 202 PAYING (timer: dev.env.defaults shortens it).
      MW_CHECKOUT_REPLY_BUDGET: ${MW_CHECKOUT_REPLY_BUDGET:-25s}
      # Dev stack only: the merchant IPN receiver simulator is plain http at a private address
      # (http://mw-simulators:8080/merchant/ipn/...). The packaged default allows no such host.
      MW_CHECKOUT_IPN_DEV_HOSTS: ${MW_CHECKOUT_IPN_DEV_HOSTS:-mw-simulators}
      # timer: the IPN retry schedule. The dev stack keeps the compressed one e2e was written
      # against (the packaged default is the spec's 1m,5m,30m,2h,6h; set this to try it).
      MW_CHECKOUT_IPN_RETRY_DELAYS: ${MW_CHECKOUT_IPN_RETRY_DELAYS:-10s,20s,30s,1m,2m}
      MW_CHECKOUT_IPN_POLL_PERIOD: ${MW_CHECKOUT_IPN_POLL_PERIOD:-2s}
      # mTLS client certificate (pki_int/issue/mw-checkout) for mw-auth's internal API: the checkout
      # OTP and the transaction assertion (ticket 72, D22, D24)
      MW_TLS_ENABLED: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${APP_MEM_LIMIT:-384M}" }

  # The admin console (Next.js, spec 15.1). Operation zone only (18.1): the `ops` network, where
  # APISIX (which routes /console/* here and /admin/v1/* to mw-admin-api) and Keycloak are. The
  # browser reaches the console and the Keycloak login through APISIX (https://localhost/console,
  # /realms/ops/*); this server calls Keycloak inside the stack with the public host as
  # X-Forwarded-* (src/lib/oidc.ts) and mw-admin-api through APISIX, so every token carries the
  # public issuer.
  mw-admin-ui:
    <<: *app
    profiles: *core
    ports:
      - "127.0.0.1:${MW_PORT_ADMIN_UI:-3000}:3000"
    image: mfs-mw/mw-admin-ui:local
    build: ../ui/mw-admin-ui
    networks: [ops]
    tmpfs: [/tmp, /app/.next/cache]
    depends_on:
      # served only through APISIX (route /console/*), so its routes are applied first
      apisix-init: { condition: service_completed_successfully }
    environment:
      # encrypts the session cookie (JWE) that holds the operator's tokens; generated dev value
      AUTH_SECRET: ${MW_ADMIN_UI_AUTH_SECRET:?cp dev.env.defaults .env}
      # public origin of the edge (APISIX); a non-default MW_HTTPS_PORT needs e.g. https://localhost:18443
      AUTH_URL: ${MW_ADMIN_UI_PUBLIC_URL:-https://localhost}/console/api/auth
      AUTH_KEYCLOAK_ISSUER: ${MW_ADMIN_UI_PUBLIC_URL:-https://localhost}/realms/ops
      AUTH_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      AUTH_KEYCLOAK_ID: mw-admin-ui
      ADMIN_API_URL: http://apisix:9080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/console/api/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${ADMIN_UI_MEM:-64M}" }

  # The test console (ADR D17, dev/test only, profile `tester`, outside the core memory budget):
  # a Next.js app that plays the app, a USSD handset, the partners, the checkout merchant and the
  # org portal against this stack, for testing every feature by hand (docs/testing-guide.html). It
  # calls APISIX only, server-side, with the generated dev credentials below; APISIX serves it at
  # https://localhost/tester only while the test-only routes are on (MW_E2E_ROUTES=1, routes-test/
  # test-console.json): scripts/tester.sh turns them on and starts it.
  mw-test-console:
    <<: *app
    profiles: [tester]
    ports:
      - "127.0.0.1:${MW_PORT_TEST_CONSOLE:-3001}:3000"
    image: mfs-mw/mw-test-console:local
    build: ../ui/mw-test-console
    networks: [app]
    tmpfs: [/tmp, /app/.next/cache]
    environment:
      EDGE_URL: http://apisix:9080
      PUBLIC_URL: ${MW_ADMIN_UI_PUBLIC_URL:-https://localhost}
      MW_E2E_API_KEY: ${MW_E2E_API_KEY:?cp dev.env.defaults .env}
      # the app users log in at mw-auth with the seeded app PIN (ticket 69)
      MW_SEED_APP_PIN: ${MW_SEED_APP_PIN:-}
      KC_PORTALS_TEST_PASSWORD: ${KC_PORTALS_TEST_PASSWORD:?cp dev.env.defaults .env}
      # the portals realm demands TOTP (ticket 73): the org users' pre-set secret
      KC_PORTALS_TEST_TOTP_SECRET: ${KC_PORTALS_TEST_TOTP_SECRET:?cp dev.env.defaults .env}
      # the checkout page's three dev merchants (signing and the redirect / IPN checks)
      CHECKOUT_DEMO_MERCHANT_SECRET: ${CHECKOUT_DEMO_MERCHANT_SECRET:?cp dev.env.defaults .env}
      CHECKOUT_PHARMACY_MERCHANT_SECRET: ${CHECKOUT_PHARMACY_MERCHANT_SECRET:?cp dev.env.defaults .env}
      CHECKOUT_FASHION_MERCHANT_SECRET: ${CHECKOUT_FASHION_MERCHANT_SECRET:?cp dev.env.defaults .env}
      # The credentials and seed-data pages (/tester/credentials, /tester/seed-data) and the fixed account
      # actions: the ops e2e operators (password + TOTP), the Keycloak bootstrap admin (master token through
      # the test route test-kc-admin-token; user from env/keycloak.env), the APISIX Admin API key, the
      # partner-simulator HMAC secrets, the MNO USSD gateway passwords, the SoftHSM token labels and PINs
      # and the Vault tester token. Dev/test stack only: fixed fake values of dev.env.defaults (ADR D9).
      KC_OPS_TEST_PASSWORD: ${KC_OPS_TEST_PASSWORD:?cp dev.env.defaults .env}
      KC_OPS_TEST_TOTP_SECRET: ${KC_OPS_TEST_TOTP_SECRET:?cp dev.env.defaults .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kc-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?cp dev.env.defaults .env}
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?cp dev.env.defaults .env}
      BILLAGG_HMAC_SECRET: ${BILLAGG_HMAC_SECRET:?cp dev.env.defaults .env}
      C2WBANK_HMAC_SECRET: ${C2WBANK_HMAC_SECRET:?cp dev.env.defaults .env}
      USSD_GP_GATEWAY_SECRET: ${USSD_GP_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_ROBI_GATEWAY_SECRET: ${USSD_ROBI_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_BL_GATEWAY_SECRET: ${USSD_BL_GATEWAY_SECRET:?cp dev.env.defaults .env}
      USSD_TELETALK_GATEWAY_SECRET: ${USSD_TELETALK_GATEWAY_SECRET:?cp dev.env.defaults .env}
      SOFTHSM_MWCRYPTO_LABEL: ${SOFTHSM_MWCRYPTO_LABEL:-mw-crypto}
      SOFTHSM_MWCRYPTO_SO_PIN: ${SOFTHSM_MWCRYPTO_SO_PIN:?cp dev.env.defaults .env}
      SOFTHSM_MWCRYPTO_USER_PIN: ${SOFTHSM_MWCRYPTO_USER_PIN:?cp dev.env.defaults .env}
      SOFTHSM_PAYSIM_LABEL: ${SOFTHSM_PAYSIM_LABEL:-paysim}
      SOFTHSM_PAYSIM_SO_PIN: ${SOFTHSM_PAYSIM_SO_PIN:?cp dev.env.defaults .env}
      SOFTHSM_PAYSIM_USER_PIN: ${SOFTHSM_PAYSIM_USER_PIN:?cp dev.env.defaults .env}
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
      # mw-seeder's manifest (personas, wallets, partners): the seed-data page reads it
      SEED_MANIFEST: /run/mw/seed/manifest.json
    volumes:
      - seed-manifest:/run/mw/seed:ro
    # The one-command start (`--profile core --profile seed --profile tester up -d --build --wait`) returns
    # once this console is healthy: after the test routes are on and after mw-seeder exited 0 (skipped
    # when the seed profile is off), so --wait means "seeded" too.
    depends_on:
      apisix: { condition: service_healthy }
      apisix-init-tester: { condition: service_completed_successfully }
      mw-seeder: { condition: service_completed_successfully, required: false }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/tester/api/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  # partner-sftp: a partner SFTP host for the batch partner routes (ticket 86; Kamelets mw-sftp-source /
  # mw-sftp-sink). Dev/test only (profile tester, outside the core budget, no host port): login
  # bits / SFTP_DEV_PASSWORD (deploy/.env), directories recon and out under /home/bits. Drop a file
  # with `docker compose cp recon.csv partner-sftp:/home/bits/recon/`; the host keys are generated at the
  # start of a new container, so a recreated one needs its known hosts again (docs/runbook.md,
  # "Batch partner over SFTP"). A stand-in for the partner's host, not one of ours: sshd needs root
  # for its chroot, so it is not hardened like the mw-* containers.
  partner-sftp:
    profiles: [tester]
    image: atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
    restart: unless-stopped
    networks: [app]
    command: ["bits:${SFTP_DEV_PASSWORD:?cp dev.env.defaults .env}:1001::recon,out"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      start_interval: 1s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
    logging: *logging

  # ------------------------------------------------------------ seed (ticket 57)
  # mw-seeder: one-shot API seeder (profile seed: `--profile core --profile seed up` runs it; it must
  # exit 0). Seeds through the services' APIs only (Keycloak admin REST, mw-core-mock's
  # test-only wallet API, mw-admin-api maker-checker), idempotently; writes the manifest to the
  # seed-manifest volume (scripts/ui-e2e.sh and tests/api/run.sh copy it to build/seed/manifest.json). The test passwords and
  # TOTP secret are interpolated from deploy/.env: dev/test stack only, never a production pattern.
  mw-seeder:
    profiles: [seed]
    image: mfs-mw/mw-seeder:local
    build: { context: ../services/mw-seeder, args: *jvm-build-args }
    restart: "no"
    labels: { mw.oneshot: "true" } # one-shot: exits 0 once the stack is seeded
    networks: [app, data]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    depends_on:
      apisix-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      mw-orchestrator: { condition: service_healthy }
      mw-core-mock: { condition: service_healthy }
      mw-crypto: { condition: service_healthy }
      mw-auth: { condition: service_healthy }
      mw-admin-api: { condition: service_healthy }
      mw-app-gateway: { condition: service_healthy }
      mw-simulators: { condition: service_healthy }
      mw-notify: { condition: service_healthy }
      mw-audit-dw: { condition: service_healthy }
      mw-ussd: { condition: service_healthy }
      mw-adapter-telco: { condition: service_healthy }
      mw-adapter-billpay: { condition: service_healthy }
      mw-adapter-bank: { condition: service_healthy }
      mw-checkout: { condition: service_healthy }
      mw-portal-api: { condition: service_healthy }
    volumes:
      - seed-manifest:/run/mw/seed
    environment:
      MW_ENV: ${MW_ENV:-local}
      JDK_JAVA_OPTIONS: -Xms64m -Xmx96m -XX:MaxMetaspaceSize=96m -Xss512k
      # timer: each seed step's time limit (ticket 57: 10 min)
      MW_SEED_STEP_TIMEOUT: ${MW_SEED_STEP_TIMEOUT:-10m}
      # Baseline time limit of partner ocs in mw-admin-api (application.yml: 20 s; timer: dev.env.defaults
      # seeds a short one, and the API suite reads it back from the manifest). Every field of the
      # list element: an environment list replaces the application.yml one, it does not merge.
      MW_SEEDER_PARTNERS_0_PARTNERID: ocs
      MW_SEEDER_PARTNERS_0_ENABLED: "true"
      MW_SEEDER_PARTNERS_0_TIMEOUTMS: ${MW_SEED_OCS_TIMEOUT_MS:-20000}
      KC_BOOTSTRAP_ADMIN_USERNAME: kc-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?cp dev.env.defaults .env}
      KC_OPS_TEST_PASSWORD: ${KC_OPS_TEST_PASSWORD:?cp dev.env.defaults .env}
      KC_OPS_TEST_TOTP_SECRET: ${KC_OPS_TEST_TOTP_SECRET:?cp dev.env.defaults .env}
      KC_PORTALS_TEST_PASSWORD: ${KC_PORTALS_TEST_PASSWORD:?cp dev.env.defaults .env}
      KC_PORTALS_TEST_TOTP_SECRET: ${KC_PORTALS_TEST_TOTP_SECRET:?cp dev.env.defaults .env}
      # The dev app PIN of the app wallets at mw-auth (ticket 69, step seed-app-pins): a fixed fake value.
      MW_SEED_APP_PIN: ${MW_SEED_APP_PIN:-}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
