# Example partner record (ADR D28): a REST/JSON biller with an API key, as the `value` of a
# mw.config.changed.v1 PARTNER record (configKey partner/waterco), shown as YAML. mw-adapter-billpay
# loads it without a restart and without Java: the route is built from the shipped mw-* Kamelets
# (services/mw-adapter-billpay/src/main/resources/kamelets), checked by the route loader (allowlist,
# allowedHosts, mw-classify then mw-audit), and the key is read from OpenBao
# secret/mw-adapter-billpay/waterco, field api-key, when the route loads. The biller catalogue entry
# (mw.billers.WATERCO.partner-id: waterco) is static config, on purpose.
#
# Try the route locally against mw-simulators with Camel JBang:
#   camel run rest-apikey-biller.yaml --local-kamelet-dir=services/mw-adapter-billpay/src/main/resources/kamelets
family: billpay
allowedHosts: [api.waterco.example]
timeoutMs: 20000
inquiryRetries: 1
sensitiveFields: { account: ACCOUNT }
errorMap:
  E1: { suffix: ACCOUNT_CLOSED, retryable: false }
route: |
  - route:
      from:
        uri: direct:partner-waterco
        steps:
          - choice:
              when:
                - simple: "${header.mwOperation} == 'PAY'"
                  steps:
                    - to: "kamelet:mw-map?mapping=PAY.request"
                    - to: "kamelet:mw-http-call?url=https://api.waterco.example&method=PUT&path=/api/pay&auth=apikey&secretField=api-key&authHeader=X-Water-Key"
                    - to: "kamelet:mw-classify?mapping=PAY.response&definiteStatuses=409"
                - simple: "${header.mwOperation} == 'STATUS_QUERY'"
                  steps:
                    - to: "kamelet:mw-http-call?url=https://api.waterco.example&method=GET&path=/api/pay/{reference}&auth=apikey&secretField=api-key&authHeader=X-Water-Key"
                    - to: "kamelet:mw-classify?mapping=STATUS_QUERY.response&definiteStatuses=200,404"
                - simple: "${header.mwOperation} == 'INQUIRY'"
                  steps:
                    - to: "kamelet:mw-map?mapping=INQUIRY.request"
                    - to: "kamelet:mw-http-call?url=https://api.waterco.example&method=POST&path=/api/lookup&auth=apikey&secretField=api-key&authHeader=X-Water-Key"
                    - to: "kamelet:mw-classify?mapping=INQUIRY.response&definiteStatuses=409"
          - to: "kamelet:mw-audit"
mappings:
  PAY.request: '{"ref": reference, "account": creditParty.id, "amt": amount.major}'
  PAY.response: >-
    status = 200 and body.result = "OK" ? {"outcome": "SUCCESS", "partnerRef": body.receipt}
    : status = 409 ? {"outcome": "FAILED", "code": body.err, "message": body.text}
    : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
  STATUS_QUERY.response: >-
    status = 200 and body.result = "OK" ? {"outcome": "SUCCESS", "partnerRef": body.receipt}
    : status = 200 and body.result = "REJECTED" ? {"outcome": "FAILED", "code": body.err}
    : status = 404 ? {"outcome": "NOT_FOUND", "code": "404"}
    : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
  INQUIRY.request: '{"account": creditParty.id}'
  INQUIRY.response: >-
    status = 200 ? {"outcome": "SUCCESS", "partnerRef": body.account,
    "attributes": {"amount": body.due, "dueDate": body.by}}
    : status = 409 ? {"outcome": "FAILED", "code": body.err}
    : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
