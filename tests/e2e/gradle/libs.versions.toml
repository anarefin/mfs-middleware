# The e2e suite's own pinned versions (no shared catalog).
[versions]
cucumber = "7.34.3"
junit = "5.14.2"
jackson = "3.1.7"
assertj = "3.27.7"

[libraries]
cucumber-bom = { module = "io.cucumber:cucumber-bom", version.ref = "cucumber" }
cucumber-java = { module = "io.cucumber:cucumber-java" }
cucumber-picocontainer = { module = "io.cucumber:cucumber-picocontainer" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
