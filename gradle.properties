# Root composite build only (`./gradlew clean build`, checkAll, bootJarAll; spec 4.2). Sizes the one
# daemon that compiles every included module side by side; nothing here reaches a module built
# from its own folder (each keeps its own gradle.properties). Laptop footprint: at most 4 workers,
# so the build leaves the machine usable, and a heap that holds 4 parallel javac runs.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
