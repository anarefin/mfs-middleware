# Root build settings (spec 4.2). Gradle settings only, not shared build logic: no module inherits
# code from here (D13, D14).
#
# Modules build and test side by side in one daemon. Sized for an 8-core host:
# - workers.max: compile, jar and repo-check tasks of the next modules run while tests run.
# - mwDockerTests: at most this many module test tasks at once. Each one's JVM starts its own
#   PostgreSQL and Kafka (Testcontainers, removed by Ryuk at JVM exit), so this is the Docker and
#   CPU budget; every module's `test` task holds one slot of the shared `mwDockerTests` build
#   service. More than 4 on 8 cores oversubscribes the CPU and timing-sensitive tests start to
#   flake; on a bigger host try `-PmwDockerTests=6` while watching `docker stats`.
org.gradle.parallel=true
org.gradle.workers.max=8
mwDockerTests=4
# Local build cache: after `clean`, a module whose inputs did not change restores its jar and test
# results instead of running them again. Force a full run with --rerun-tasks or --no-build-cache.
org.gradle.caching=true
# Re-runs skip the configuration phase.
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# The only reference outside a module (spec 4.3 rule 2): the root contracts/ folder, read by tests
# only. Resolved against each module's project dir (services/mw-x), so ../../contracts.
mwContractsDir=../../contracts
