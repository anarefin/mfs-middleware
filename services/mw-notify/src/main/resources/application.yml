# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-notify
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:notify_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: notify
      # Explicit, small pool (Kafka-driven or light on the database). PostgreSQL
      # max_connections sizing: deploy/docker-compose.yml (postgres).
      maximum-pool-size: 5
  flyway:
    schemas: notify
    # db/dev (dev seed data: test contacts) is added only by the dev stack's compose.yml.
    locations: ${MW_NOTIFY_FLYWAY_LOCATIONS:classpath:db/migration}
  # Email over SMTP (spec 10.2). STARTTLS is required and the server's certificate must match its
  # host name, so a server (or a man in the middle) cannot downgrade the session to plain text.
  # Only a dev stack turns it off, explicitly (SMTP_STARTTLS_REQUIRED=false in the module's
  # compose.yml for the GreenMail simulator). A username and password, where the server needs
  # them, come from OpenBao (secret/mw-notify: spring.mail.username / .password).
  mail:
    host: ${SMTP_HOST:greenmail}
    port: ${SMTP_PORT:3025}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.notify.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  kafka:
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): claims up to batch-size unsent rows, sends them all
      # without waiting, then stamps sent_at on the acknowledged ones in one statement. Polls
      # again at once while batches come back full; waits one period once the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  notify:
    # Transient SMPP errors: retry after 2 s, 10 s, 30 s, then FAILED (spec 10.4).
    retry-backoff: 2s,10s,30s
    dispatch-batch: 50
    default-sender: Bits
    default-locale: bn
    receipt-buffer-ttl: 1d
    # PROMO is held from start to end local time (spec 10.1) and sent after, unless it expires
    # first; a window whose end is before its start spans midnight.
    quiet-hours:
      enabled: ${MW_NOTIFY_QUIET_HOURS_ENABLED:true}
      start: ${MW_NOTIFY_QUIET_HOURS_START:22:00}
      end: ${MW_NOTIFY_QUIET_HOURS_END:08:00}
      zone: ${MW_NOTIFY_QUIET_HOURS_ZONE:Asia/Dhaka}
    dispatch:
      enabled: true
      period: 200ms
    consumers:
      enabled: true
    email:
      enabled: ${EMAIL_ENABLED:true}
      from: ${MAIL_FROM:Bits <no-reply@bits.local>}
    smpp:
      # SMPP 3.4 to the SMSC (10.2); MVP: the SMSC simulator in mw-simulators. The bind password
      # comes from OpenBao (secret/mw-notify, mw.notify.smpp.password).
      enabled: ${SMPP_ENABLED:true}
      host: ${SMPP_HOST:mw-simulators}
      port: ${SMPP_PORT:2775}
      system-id: ${SMPP_SYSTEM_ID:bits-notify}
      binds: { OTP: 1, TXN: 1, INFO: 1, PROMO: 1 }
      enquire-link: 30s
      transaction-timeout: 5s
      reconnect-min: 1s
      reconnect-max: 60s
