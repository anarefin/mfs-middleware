# Contracts this module produces and consumes (tickets 53, 124); paths relative to contracts/.
# `./gradlew :contractsLint` checks every entry exists; the module's build.gradle.kts tracks the listed
# contracts as test inputs. The EC NID service has no contract file yet: its REST shape is written in
# client/EcNidClient and becomes a contract with the mw-simulators EC mock (ticket 124b).
produces:
  events:
    - events/mw-compliance/mw.kyc.completed.v1.schema.json
  apis:
    - api/mw-compliance/compliance.v1.openapi.yaml
consumes:
  events: []
  apis:
    - api/mw-crypto/crypto-internal.v1.openapi.yaml
