# Test-only overrides, merged over src/main/resources/application.yml.
spring:
  profiles:
    # The tests run on the dev seed partners (application-dev.yml); prod config has none.
    active: dev
mw:
  atm:
    inbound:
      ws-password: test-only-ucbatm-ws-password
    request-consumer:
      # Off by default in tests for the same reason as the relay: a cached context would compete
      # for the request topic. AtmRequestRouteIT switches it on.
      enabled: false
  partners:
    health:
      # Off in tests: a scheduled health run would add route status rows other tests count.
      # PartnerRouteHealthTest drives PartnerHealthMonitor directly.
      enabled: false
    config-consumer:
      # Off in tests: every context would replay mw.config.changed.v1 in a group of its own.
      # PartnerConfigReloadIT switches it on.
      enabled: false
    # The partner secrets come from the fake vault function (partner/FakeVaultFunction); the
    # record's allowed hosts are overridden in config/application-dev.yml.
    security:
      # WireMock runs on localhost over http.
      allowed-hosts:
        c2wbank: mw-simulators,localhost
        ucbatm: mw-simulators,localhost
        gp: localhost
      insecure-http-hosts: mw-simulators,localhost
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
  kafka:
    listener:
      # A closing test context does not wait the default 10 s per listener container for a consumer
      # caught mid-rebalance (cached contexts share the broker); nothing in a test depends on that drain.
      shutdown-timeout: 100ms
