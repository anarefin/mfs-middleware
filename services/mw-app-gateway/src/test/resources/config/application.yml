# Test-only overrides, merged over src/main/resources/application.yml.
mw:
  biller-catalog:
    consumer:
      # Off in tests like the status consumers; BillerProjectionIT switches it on.
      enabled: false
  app-gateway:
    # Off by default in tests: status consumers left running in a cached context would take
    # records another test is checking. Tests that need them switch them on.
    consumers:
      enabled: false
    # Off by default in tests that are not about it (they send no device headers);
    # DeviceBindingIT switches it on with real Redis.
    device-binding:
      enabled: false
    # Off by default in tests that are not about it (no Redis); IdempotentReplayIT switches it on.
    idempotent-replay:
      enabled: false
    # Obviously fake test value; the real key is in Vault (ticket 105).
    preview:
      signing-key: test-only-preview-signing-key-not-a-secret
    # Obviously fake test value; the real key is in Vault (ticket 117b).
    linked-accounts:
      encryption-key: test-only-linked-account-key-not-a-secret
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
  kafka:
    listener:
      # A closing test context does not wait the default 10 s per listener container for a consumer
      # caught mid-rebalance (cached contexts share the broker); nothing in a test depends on that drain.
      shutdown-timeout: 100ms
