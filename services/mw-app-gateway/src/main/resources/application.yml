# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-app-gateway
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://vault:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from Vault's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:app_gateway_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: app_gateway
      # Explicit pool: 10, above the usual 5, because every app request (HTTP, virtual threads) reads or writes its
      # schema. PostgreSQL
      # max_connections sizing: deploy/docker-compose.yml (postgres).
      maximum-pool-size: 10
  flyway:
    schemas: app_gateway
  # Valkey (Lettuce) for the device gate: the device key and session caches and the signed-request nonces (spec 9.1, 18.6,
  # tickets 29, 68). The password comes from Vault (secret/mw-app-gateway, spring.data.redis.password),
  # never written here. Short timeouts; the device gate fails closed (503 MW-SYS-012).
  data:
    redis:
      host: ${VALKEY_HOST:valkey}
      port: ${VALKEY_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false
  # Kafka through Spring Kafka (spec 6.1, 19.2, ADR D27); retry topics, templates and interceptors
  # in config/KafkaConfig, the per-instance reply consumer in config/StatusReplyConsumerConfig.
  # Single KRaft node; topics come from deploy/kafka/ and are never auto-created by the service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      # Exactly one copy per send, every in-sync replica acknowledges, order kept per key (6.1).
      acks: all
      # Strings, and the raw bytes of a record that could not be deserialized when it is parked
      # on the DLQ.
      key-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # An app request waits for the publish: when Kafka is down it must fail fast with
        # 503 MW-SYS-010 (nothing accepted) instead of blocking for the client defaults (60 s, 2 min).
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # One group per service: listeners use groupId = "${spring.kafka.consumer.group-id}", and
      # the group is the middle part of the service's retry and DLQ topic names. The reply
      # consumer has its own group per instance (<group>.reply.<instanceId>).
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      # Offsets are committed per record, only after it is handled (the listener acknowledges)
      # or parked on its next retry topic or the DLQ (the error handler); never on poll or close.
      enable-auto-commit: false
      # A record that is not UTF-8 text fails here, goes straight to the DLQ and never blocks
      # its partition (messaging/Utf8Deserializer wrapped by ErrorHandlingDeserializer).
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: mfs.mw.app.gateway.messaging.Utf8Deserializer
        spring.deserializer.value.delegate.class: mfs.mw.app.gateway.messaging.Utf8Deserializer
    listener:
      # Per-record commit, from the listener (Acknowledgment.acknowledge()) or the error handler.
      ack-mode: manual_immediate
      # Consumer threads per listener container; at most the topic's partition count.
      concurrency: ${MW_KAFKA_LISTENER_CONCURRENCY:1}
      # Micrometer observation: each record continues its traceparent (traceId/spanId in the MDC).
      observation-enabled: true
    admin:
      # Topics belong to the platform (deploy/kafka/); the service never creates any.
      auto-create: false
      # The observed KafkaTemplate asks the admin client for the cluster id on its first send; with
      # Kafka down that must fail as fast as the producer does, not after the client defaults (60 s).
      operation-timeout: 5s
      properties:
        default.api.timeout.ms: 5000
        request.timeout.ms: 5000

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # mw-adapter-billpay internal API (client/BillPayClient). Only unavailability counts; the
      # adapter's error envelope is a normal answer.
      billpay:
        base-config: default
        minimum-number-of-calls: 20
        record-exceptions: mfs.mw.app.gateway.exception.BillPayUnavailableException
        ignore-exceptions: mfs.mw.app.gateway.exception.BillPayRefusedException
      # mw-auth's internal API (client/AuthClient, ticket 68): the device gate fails closed while it
      # is out. Counts calls, not time: opens after half of the last 20 failed (min 10), probes again
      # after 10 s. A 4xx (404 = not bound / no session) is an answer, not an outage.
      mw-auth:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      # mw-orchestrator's query API (client/OrchestratorQueryClient, wallet history, ADR D25): counts
      # calls like mw-auth; only unavailability counts. The history answers 503 MW-SYS-013 while open.
      orchestrator:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 2500ms
        wait-duration-in-open-state: 10s
        record-exceptions: mfs.mw.app.gateway.exception.OrchestratorUnavailableException
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
    instances:
      # Biller list and bill fetch are idempotent reads (19.2: 2 retries, 200 ms -> 1 s).
      billpay:
        base-config: default
        retry-exceptions: mfs.mw.app.gateway.exception.BillPayUnavailableException
        ignore-exceptions: mfs.mw.app.gateway.exception.BillPayRefusedException
      # The wallet history is an idempotent read (19.2: 2 retries, 200 ms -> 1 s).
      orchestrator:
        base-config: default
        retry-exceptions: mfs.mw.app.gateway.exception.OrchestratorUnavailableException

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.app.gateway.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Valkey only serves the device gate, which answers 503 MW-SYS-012 itself while it is down.
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  # This service's certificate from Vault PKI (spec 18.2, 18.4, D24; config/TlsProperties,
  # config/ServiceCertificateManager; ticket 68): on (compose MW_TLS_ENABLED=true), it calls mw-auth's
  # internal API with mTLS. Issued at start from pki_int/issue/mw-app-gateway through Spring Cloud
  # Vault (AppRole policy: that role only; PKI_SERVICES in deploy/provision/services.sh), renewed at
  # two thirds of the life, never written to disk. The app API itself stays plain HTTP behind APISIX.
  tls:
    enabled: ${MW_TLS_ENABLED:false}
    pki-mount: pki_int
    role: ${spring.application.name}
    common-name: ${spring.application.name}
    alt-names: ${MW_TLS_ALT_NAMES:${spring.application.name}}
    ttl: 72h
    retry-period: 1m
    bundle: mw-service
  kafka:
    # How long EventPublisher.publish waits for Kafka's acknowledgement (just above the producer's
    # delivery.timeout.ms, so the producer decides first).
    send-timeout: 12s
    listener:
      # How long a stopping listener container waits for its consumer thread.
      shutdown-timeout: 10s
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
      # Consumed topics without retry topics (none: the reply consumer is not a @KafkaListener).
      exclude-topics: []
  outbox:
    relay:
      # Transactional outbox relay (6.4, scheduler/OutboxRelayScheduler): claims up to batch-size
      # unsent rows, sends them all without waiting, then stamps sent_at on the acknowledged ones
      # in one statement. Polls again at once while batches come back full; waits one period once
      # the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  app-gateway:
    # Synchronous wait for a terminal status before answering 202 PROCESSING (spec 7.5).
    reply-budget: ${MW_APP_REPLY_BUDGET:25s}
    # mw-reply-to value and reply consumer group suffix; the container hostname in Compose,
    # random per start when blank.
    instance-id: ${HOSTNAME:}
    request-topic: mw.txn.request.v1
    status-topic: mw.txn.status.v1
    supported-txn-types: P2P,CASH_IN,CASH_OUT,MERCHANT_PAY,TOPUP,BILL_PAY,ADD_MONEY_BANK
    # Which app role (wallet type) may initiate which txnType (spec WP20). Deny by default: a
    # supported type with no entry is refused for every role (403 MW-AUTH-002).
    txn-type-roles:
      P2P: CUSTOMER
      CASH_IN: AGENT
      CASH_OUT: CUSTOMER
      # the customer pays the merchant; the merchant app initiates nothing (collections view only)
      MERCHANT_PAY: CUSTOMER
      TOPUP: CUSTOMER
      BILL_PAY: CUSTOMER
      ADD_MONEY_BANK: CUSTOMER
    # attributes keys an app may send (a free-text payment reference only, so far)
    allowed-attributes: reference
    # Internal API of mw-adapter-billpay (biller catalogue, bill fetch; ticket 21), over the
    # app zone network. Read timeout above the adapter's 25 s partner limit so it decides first.
    billpay:
      base-url: ${MW_BILLPAY_BASE_URL:http://mw-adapter-billpay:8080}
      connect-timeout: 2s
      read-timeout: 28s
      catalogue-ttl: 60s
    # mw-orchestrator's internal query API (wallet history GET /app/v1/transactions, ADR D25), over
    # the app zone network with the client-credentials token of client mw-app-gateway (the same as for
    # mw-auth; its token carries audience mw-orchestrator too). Wallet-scoped there: walletId always.
    orchestrator:
      base-url: ${MW_ORCHESTRATOR_BASE_URL:http://mw-orchestrator:8080}
      connect-timeout: 1s
      read-timeout: 3s
    # The device gate (spec 9.1, 18.6; ticket 29, a verifier since ticket 68): every /app/** request
    # comes from a device bound to the token's wallet (X-Device-Id, its key from mw-auth, cached) with
    # a live mw-auth session; a submit is signed (ECDSA P-256) and its nonce used once. Binding, the
    # OTP and sessions are mw-auth's (/auth/v1/*). See config/DeviceBindingProperties.
    # Stored first 200 response per idempotency key (FRS PLT-011, ticket 99; service/IdempotentReplay):
    # Valkey/Redis idemresp:<sha256(channel, wallet, key)>, kept as long as the orchestrator's key.
    idempotent-replay:
      enabled: true
      ttl: 72h
    device-binding:
      enabled: true
      clock-skew: 5m
      device-key-ttl: 5m
      session-cache-ttl: 10s
    # mw-auth's internal API (ticket 68, D24): mTLS with this service's Vault certificate (mw.tls)
    # and a Keycloak realm services client-credentials JWT of client mw-app-gateway (audience mw-auth).
    auth:
      base-url: ${MW_AUTH_URL:https://mw-auth:8443}
      token-uri: ${MW_INTERNAL_TOKEN_URI:http://keycloak:8080/realms/services/protocol/openid-connect/token}
      client-id: mw-app-gateway
      # client-secret: from Vault secret/mw-app-gateway (key mw.app-gateway.auth.client-secret), never here
      client-secret: ""
      timeout: 2s
      connect-timeout: 1s
      # the PIN transport key (mw-crypto PIN_TRANSPORT) from mw-auth's internal GET /internal/v1/pin-key
      # over the same mTLS client and token (ticket 72, security review); GET /app/v1/pin-key serves it
      # to the apps, reused for pin-key-ttl
      pin-key-ttl: 5m
    jwt:
      # mw-auth's access tokens (ticket 69, spec 18.7, D21): RS256, typ at+jwt, exact issuer and
      # audience. Keys are fetched on the first token (and again on an unknown kid).
      jwk-set-uri: ${MW_APP_JWK_SET_URI:http://mw-auth:8080/auth/v1/.well-known/jwks.json}
      issuer: ${MW_AUTH_TOKEN_ISSUER:mw-auth}
      audience: mw-app
