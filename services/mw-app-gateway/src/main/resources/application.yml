# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-app-gateway
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:app_gateway_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: app_gateway
  flyway:
    schemas: app_gateway
  # Valkey (Lettuce) for device sessions and the signed-request nonce cache (spec 9.1, 18.6,
  # ticket 29). The password comes from OpenBao (secret/mw-app-gateway, spring.data.redis.password),
  # never written here. Short timeouts; the device gate fails closed (503 MW-SYS-012).
  data:
    redis:
      host: ${VALKEY_HOST:valkey}
      port: ${VALKEY_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # An app request waits for the publish: when Kafka is down it must fail fast with
      # 503 MW-SYS-010 (nothing accepted) instead of blocking for the client defaults (60 s, 2 min).
      max-block-ms: 5000
      request-timeout-ms: 5000
      delivery-timeout-ms: 10000
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # mw-adapter-billpay internal API (client/BillPayClient). Only unavailability counts; the
      # adapter's error envelope is a normal answer.
      billpay:
        base-config: default
        minimum-number-of-calls: 20
        record-exceptions: mfs.mw.app.gateway.exception.BillPayUnavailableException
        ignore-exceptions: mfs.mw.app.gateway.exception.BillPayRefusedException
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
    instances:
      # Biller list and bill fetch are idempotent reads (19.2: 2 retries, 200 ms -> 1 s).
      billpay:
        base-config: default
        retry-exceptions: mfs.mw.app.gateway.exception.BillPayUnavailableException
        ignore-exceptions: mfs.mw.app.gateway.exception.BillPayRefusedException

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.app.gateway.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Valkey only serves the device gate, which answers 503 MW-SYS-012 itself while it is down.
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  kafka:
    retry:
      # Non-blocking retry topics <topic>.retry.1..3, then <topic>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): publishes unsent rows, then stamps sent_at.
      enabled: true
      period: 500ms
      batch-size: 100
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  app-gateway:
    # Synchronous wait for a terminal status before answering 202 PROCESSING (spec 7.5).
    reply-budget: ${MW_APP_REPLY_BUDGET:25s}
    # mw-reply-to value and reply consumer group suffix; the container hostname in Compose,
    # random per start when blank.
    instance-id: ${HOSTNAME:}
    request-topic: mw.txn.request.v1
    status-topic: mw.txn.status.v1
    supported-txn-types: P2P,CASH_IN,CASH_OUT,TOPUP,BILL_PAY,ADD_MONEY_BANK
    # Which app role (wallet type) may initiate which txnType (spec WP20). Deny by default: a
    # supported type with no entry is refused for every role (403 MW-AUTH-002).
    txn-type-roles:
      P2P: CUSTOMER
      CASH_IN: AGENT
      CASH_OUT: CUSTOMER
      TOPUP: CUSTOMER
      BILL_PAY: CUSTOMER
      ADD_MONEY_BANK: CUSTOMER
    # attributes keys an app may send (a free-text payment reference only, so far)
    allowed-attributes: reference
    # Internal API of mw-adapter-billpay (biller catalogue, bill fetch; ticket 21), over the
    # app zone network. Read timeout above the adapter's 25 s partner limit so it decides first.
    billpay:
      base-url: ${MW_BILLPAY_BASE_URL:http://mw-adapter-billpay:8080}
      connect-timeout: 2s
      read-timeout: 28s
      catalogue-ttl: 60s
    # Device binding and request signatures (spec 9.1, 18.6, ticket 29): every /app/** request comes
    # from a bound device (X-Device-Id) with a live session sess:{subject}:{deviceId}; a submit is
    # signed (ECDSA P-256) and its nonce used once. See config/DeviceBindingProperties.
    device-binding:
      enabled: true
      clock-skew: 5m
      idle-timeout: ${MW_APP_SESSION_IDLE_TIMEOUT:5m}
      idle-timeout-by-channel: {}
      single-active-device: true
    jwt:
      # Keycloak realm `customers` (spec 9.1). Keys are fetched on the first token.
      jwk-set-uri: ${MW_APP_JWK_SET_URI:http://keycloak:8080/realms/customers/protocol/openid-connect/certs}
      realm-path: /realms/customers
