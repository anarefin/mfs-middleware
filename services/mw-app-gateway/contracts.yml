# Contracts this module produces and consumes (ticket 53); paths relative to contracts/.
# Ticket 68: the binding OTP / new-device SMS (mw.notify.request.v1) moved to mw-auth with the device
# API; the gateway asks mw-auth's internal API for device keys and sessions (client/AuthClient).
# Ticket 72: the PIN is checked by mw-auth (txn authorisation, internal API over mTLS) under its
# transport key (auth.v1 GET /auth/v1/pin-key, served as GET /app/v1/pin-key); the request carries
# the assertion.
# ADR D25: the wallet history (GET /app/v1/transactions) asks mw-orchestrator's query API
# (client/OrchestratorQueryClient, wallet-scoped caller).
# ADR D26: POST /app/v1/balance publishes mw.txn.request.v1 with txnType BALANCE (amount 0, payer =
# payee = the caller's wallet; ProducedContractsTest fixture) and reads the COMPLETED status's
# `balance` (sample valid-balance-completed.json, ConsumedContractsTest).
produces:
  events:
    - events/mw-orchestrator/mw.txn.request.v1.schema.json
    # ticket 110: PUT /app/v1/notifications/push-token hands the device token to mw-notify (ProducedContractsTest)
    - events/mw-notify/mw.notify.push-token.v1.schema.json
    # ticket 111: POST /app/v1/notifications/opt-out (promotional only)
    - events/mw-notify/mw.notify.opt-out.v1.schema.json
  apis: [api/mw-app-gateway/app.v1.openapi.yaml]
consumes:
  events:
    - events/mw-orchestrator/mw.txn.status.v1.schema.json
    # ticket 113b: BILLER records into the gateway's biller catalogue projection (messaging/BillerCatalogKafkaListener)
    - events/mw-admin-api/mw.config.changed.v1.schema.json
  apis:
    - api/mw-adapter-billpay/billpay.v1.openapi.yaml
    # ticket 117b: account validation before a bank account is linked (client/BankAccountClient)
    - api/mw-adapter-bank/bank.v1.openapi.yaml
    - api/mw-auth/auth-internal.v1.openapi.yaml
    - api/mw-auth/auth.v1.openapi.yaml
    - api/mw-orchestrator/txn-query.v1.openapi.yaml
    # ticket 107a: the customer inbox (GET /internal/v1/inbox), asked for the token's MSISDN only
    - api/mw-notify/notify-internal.v1.openapi.yaml
    # ticket 107b: profile (WAL-01), limits (WAL-05) and the statement (WAL-12), asked for the token's MSISDN
    - api/mw-core-mock/core-wallet.v1.openapi.yaml
    # ticket 124b: eKYC onboarding (POST/GET /app/v1/onboarding/applications...), over mTLS with the subject
    # headers from the app token (client/ComplianceClient)
    - api/mw-compliance/compliance.v1.openapi.yaml
