# Test-only overrides, merged over src/main/resources/application.yml.
mw:
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  portal-api:
    orchestrator:
      auth:
        # Obviously fake; the real one comes from OpenBao. ITs with a stub orchestrator serve a token.
        client-secret: test-only-client-secret-not-a-secret
    # Off by default in tests: they call BulkExecutionService directly (dispatch, apply).
    consumers:
      enabled: false
    bulk:
      dispatch:
        enabled: false
      # Off in tests: BulkLifecycleIT calls the services directly.
      expiry:
        enabled: false
      reconcile:
        enabled: false
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
camel:
  component:
    kafka:
      # A closing test context does not wait the default 30 s per consumer for one caught mid-rebalance
      # (cached contexts share the consumer group); nothing in a test depends on that drain.
      shutdown-timeout: 100
