# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-portal-api
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:portal_api_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: bulk
      # Explicit, small pool (Kafka-driven or light on the database). PostgreSQL
      # max_connections sizing: deploy/compose/platform/compose.yml (postgres).
      maximum-pool-size: 5
  flyway:
    schemas: bulk

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # mw-orchestrator's internal query API (client/OrchestratorQueryClient, ticket 35): only
      # unavailability counts.
      orchestrator:
        base-config: default
        minimum-number-of-calls: 20
        record-exceptions: mfs.mw.portal.api.exception.OrchestratorUnavailableException
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
    instances:
      orchestrator:
        base-config: default
        retry-exceptions: mfs.mw.portal.api.exception.OrchestratorUnavailableException

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.portal.api.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  kafka:
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): publishes unsent rows, then stamps sent_at.
      enabled: true
      period: 500ms
      batch-size: 100
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  portal-api:
    bulk:
      # Org bulk disbursement file (spec 9.4; MVP cap 10,000 data rows, larger files refused with
      # MW-VAL-030). 2 MB holds 10,001 of the longest rows, so the row cap, not the byte cap,
      # answers a 10,001-row file; APISIX caps the route body just above (portal-org-v1).
      max-rows: 10000
      max-bytes: 2MB
      # Core wallet each org pays its batches from (ticket 34; orgId claim -> wallet id). The dev
      # orgs of realm portals pay from the core mock's seeded org wallets.
      org-wallets:
        ORG001: "01311000001"
        ORG002: "01311000002"
      dispatch:
        # Child txns streamed to the orchestrator (spec 9.4 "at a configured rate"), over all
        # running batches; scheduler/BulkDispatchJob runs every period under ShedLock.
        enabled: ${MW_BULK_DISPATCH_ENABLED:true}
        rate-per-second: ${MW_BULK_RATE_PER_SECOND:50}
        period: 200ms
      expiry:
        # A batch nobody approved or rejected within 72 h becomes EXPIRED (M3 gate decision);
        # scheduler/BulkExpiryJob under ShedLock, audited as bulk.batch.expired.
        enabled: ${MW_BULK_EXPIRY_ENABLED:true}
        after: 72h
        period: 5m
        batch-size: 500
      reconcile:
        # SUBMITTED rows without a settled state after `after` are looked up on the orchestrator's
        # internal query API (scheduler/BulkReconcileJob under ShedLock); still unsettled after
        # give-up-after they become UNRESOLVED and the batch ends COMPLETED_WITH_EXCEPTIONS.
        enabled: ${MW_BULK_RECONCILE_ENABLED:true}
        after: 10m
        give-up-after: 24h
        period: 1m
        batch-size: 200
    consumers:
      # route/TxnStatusRoute: the children's mw.txn.status.v1 records (tests switch it off)
      enabled: true
    # mw-orchestrator's internal query API (SP transaction query, ticket 35), over the app network;
    # not routed by APISIX.
    orchestrator:
      base-url: ${MW_ORCHESTRATOR_BASE_URL:http://mw-orchestrator:8080}
      connect-timeout: 2s
      read-timeout: 5s
      # Client credentials of Keycloak realm `services` (M3 gate: /internal/v1/** needs a token for
      # audience mw-orchestrator). The secret comes from OpenBao (secret/mw-portal-api,
      # mw.portal-api.orchestrator.auth.client-secret, synced by the init from KC_MW_PORTAL_API_SECRET).
      auth:
        token-uri: ${MW_INTERNAL_TOKEN_URI:http://keycloak:8080/realms/services/protocol/openid-connect/token}
        client-id: mw-portal-api
    jwt:
      # Keycloak realm `portals` (spec 8.2). Keys are fetched on the first token.
      jwk-set-uri: ${MW_PORTAL_JWK_SET_URI:http://keycloak:8080/realms/portals/protocol/openid-connect/certs}
      realm-path: /realms/portals
    roles:
      # Realm roles of deploy/compose/platform/keycloak/realms/portals-realm.json.
      maker: org-maker
      checker: org-checker
