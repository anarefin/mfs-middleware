# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-checkout
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:checkout_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: checkout
      # Explicit pool: 10, above the usual 5, because every checkout page, pay and OTP call (HTTP, virtual threads) reads
      # or writes its schema. PostgreSQL
      # max_connections sizing: deploy/docker-compose.yml (postgres).
      maximum-pool-size: 10
  flyway:
    schemas: checkout
  # Kafka through Spring Kafka (spec 6.1, 19.2, ADR D27); retry topics, templates and interceptors
  # in config/KafkaConfig, the per-instance reply consumer in config/StatusReplyConsumerConfig.
  # Single KRaft node; topics come from deploy/kafka/ and are never auto-created by the service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      # Exactly one copy per send, every in-sync replica acknowledges, order kept per key (6.1).
      acks: all
      # Strings, and the raw bytes of a record that could not be deserialized when it is parked
      # on the DLQ.
      key-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # A pay request waits for the publish: when Kafka is down it must fail fast with
        # 503 MW-SYS-010 (nothing sent) instead of blocking for the client defaults (60 s, 2 min).
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # One group per service: listeners use groupId = "${spring.kafka.consumer.group-id}", and
      # the group is the middle part of the service's retry and DLQ topic names. The reply
      # consumer has its own group per instance (<group>.reply.<instanceId>).
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      # Offsets are committed per record, only after it is handled (the listener acknowledges)
      # or parked on its next retry topic or the DLQ (the error handler); never on poll or close.
      enable-auto-commit: false
      # A record that is not UTF-8 text fails here, goes straight to the DLQ and never blocks
      # its partition (messaging/Utf8Deserializer wrapped by ErrorHandlingDeserializer).
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: mfs.mw.checkout.messaging.Utf8Deserializer
        spring.deserializer.value.delegate.class: mfs.mw.checkout.messaging.Utf8Deserializer
    listener:
      # Per-record commit, from the listener (Acknowledgment.acknowledge()) or the error handler.
      ack-mode: manual_immediate
      # Consumer threads per listener container; at most the topic's partition count.
      concurrency: ${MW_KAFKA_LISTENER_CONCURRENCY:1}
      # Micrometer observation: each record continues its traceparent (traceId/spanId in the MDC).
      observation-enabled: true
    admin:
      # Topics belong to the platform (deploy/kafka/); the service never creates any.
      auto-create: false
      # The observed KafkaTemplate asks the admin client for the cluster id on its first send; with
      # Kafka down that must fail as fast as the producer does, not after the client defaults (60 s).
      operation-timeout: 5s
      properties:
        default.api.timeout.ms: 5000
        request.timeout.ms: 5000

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # mw-auth (client/AuthClient, ticket 72): the OTP and the assertion fail closed while it is out.
      # Counts calls: opens after half of the last 20 failed (min 10), probes again after 10 s. A 4xx
      # (wrong OTP or PIN, a lock) is an answer, not an outage.
      mw-auth:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
    instances:
      # One IPN attempt (client/MerchantIpnClient); a slow merchant is retried on the IPN schedule.
      merchant-ipn:
        base-config: default
        timeout-duration: 10s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.checkout.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  # This service's certificate from OpenBao PKI (spec 18.2, 18.4, D24; config/TlsProperties,
  # config/ServiceCertificateManager, from the template; ticket 72): the client certificate for
  # mw-auth's internal API. Off by default and in tests; compose sets MW_TLS_ENABLED=true. On, it
  # issues pki_int/issue/mw-checkout at start, renews at two thirds of the life and never writes the
  # key to disk.
  tls:
    enabled: ${MW_TLS_ENABLED:false}
    pki-mount: pki_int
    role: ${spring.application.name}
    common-name: ${spring.application.name}
    alt-names: ${MW_TLS_ALT_NAMES:${spring.application.name}}
    ttl: 72h
    retry-period: 1m
    bundle: mw-service
  kafka:
    # How long EventPublisher.publish waits for Kafka's acknowledgement (just above the producer's
    # delivery.timeout.ms, so the producer decides first).
    send-timeout: 12s
    listener:
      # How long a stopping listener container waits for its consumer thread.
      shutdown-timeout: 10s
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
      # Consumed topics without retry topics (none: the reply consumer is not a @KafkaListener).
      exclude-topics: []
  outbox:
    relay:
      # Transactional outbox relay (6.4, scheduler/OutboxRelayScheduler): claims up to batch-size
      # unsent rows, sends them all without waiting, then stamps sent_at on the acknowledged ones
      # in one statement. Polls again at once while batches come back full; waits one period once
      # the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  checkout:
    # mw-reply-to value and reply consumer group suffix; the container hostname in Compose.
    instance-id: ${HOSTNAME:}
    request-topic: mw.txn.request.v1
    status-topic: mw.txn.status.v1
    # A session can be paid this long after it was created (spec 9.3).
    session-ttl: 15m
    # OTPs one session may ask mw-auth for (ticket 72: mw-auth sends and checks the OTP, 2 min, 3
    # checks, and limits the wallet's OTPs per window too).
    otp-max-sends: 3
    # A pay request waits this long for the final status, then answers 202 PAYING (spec 7.5).
    reply-budget: ${MW_CHECKOUT_REPLY_BUDGET:25s}
    # The hosted page (front-end not built here, spec open point 16); checkoutUrl = this + pay token.
    page-base-url: ${MW_CHECKOUT_PAGE_BASE_URL:https://localhost/checkout/page/}
    # mw-auth (ticket 72; config/AuthClientProperties, client/AuthClient): the checkout OTP and the
    # transaction assertion on its internal port over mTLS (mw.tls) with a Keycloak realm services
    # token of client mw-checkout (audience mw-auth); the PIN transport key on its public port.
    auth:
      base-url: ${MW_AUTH_URL:https://mw-auth:8443}
      token-uri: ${MW_INTERNAL_TOKEN_URI:http://keycloak:8080/realms/services/protocol/openid-connect/token}
      client-id: mw-checkout
      # client-secret: from OpenBao secret/mw-checkout (key mw.checkout.auth.client-secret), never here
      client-secret: ""
      timeout: 2s
      connect-timeout: 1s
      # the PIN transport key: GET /internal/v1/pin-key on base-url (mTLS + token; security review of
      # ticket 72), a PIN_TRANSPORT key only, reused pin-key-ttl
      pin-key-ttl: 5m
    # Checkout merchants by APISIX hmac-auth consumer name. Onboarding through mw-admin-api comes
    # later; until then three dev merchants (core-mock MERCHANT wallets, the APISIX test consumers of
    # deploy/apisix/consumers-test). A secret (signs the redirect result and, ticket 32, the IPN) comes
    # from OpenBao only: mw.checkout.merchants.<id>.secret in secret/mw-checkout.
    merchants:
      merchant_demo:
        wallet: "01911000001"
        name: Karim Traders
      merchant_pharmacy:
        wallet: "01911000002"
        name: Lalbagh Pharmacy
      merchant_fashion:
        wallet: "01911000003"
        name: Gulshan Fashion House
    # Signed IPN to the merchant's ipnUrl (spec 9.3 step 3, ticket 32): attempt 1 at once, then
    # after each failure the next of retry-delays, until a 2xx or the last attempt. Every attempt is a
    # checkout.ipn_delivery row; the job (ShedLock) polls for due rows. The call is bounded by the
    # time limiter resilience4j.timelimiter.instances.merchant-ipn.
    ipn:
      enabled: true
      poll-period: ${MW_CHECKOUT_IPN_POLL_PERIOD:5s}
      retry-delays: ${MW_CHECKOUT_IPN_RETRY_DELAYS:1m,5m,30m,2h,6h}
      batch-size: 50
      connect-timeout: 3s
      # https only and no private/loopback/link-local target, except these hosts (dev/test
      # simulators; empty by default, never in production). The dev Compose stack sets the simulator.
      dev-hosts: ${MW_CHECKOUT_IPN_DEV_HOSTS:}
