# Test-only overrides, merged over src/main/resources/application.yml.
mw:
  checkout:
    # Off by default in tests: reply and projection consumers left running in a cached context
    # are not needed by most tests. CheckoutFlowIT switches them on.
    consumers:
      enabled: false
    page-base-url: https://checkout.example.test/pay/
    # The IPN job is off in tests; IpnDeliveryIT calls IpnDeliveryService.deliverDue() itself.
    ipn:
      enabled: false
    pin:
      key-id: core-pin-test-1
      public-key: not-a-real-key
    # Obviously fake secrets, tests only.
    merchants:
      merchant_demo:
        wallet: "01911000001"
        name: Demo Shop
        secret: test-merchant-secret-not-real
      merchant_other:
        wallet: "01911000002"
        name: Other Shop
        secret: test-other-secret-not-real
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
camel:
  component:
    kafka:
      # A closing test context does not wait the default 30 s per consumer for one caught mid-rebalance
      # (cached contexts share the consumer group); nothing in a test depends on that drain.
      shutdown-timeout: 100
