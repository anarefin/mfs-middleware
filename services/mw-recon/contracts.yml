# Contracts this module produces and consumes (ticket 126). Paths relative to contracts/.
# No command topic and no core write API: mw-recon reports a class and never posts money.
produces:
  events:
    - events/mw-recon/mw.recon.result.v1.schema.json
    # ticket 127b: one event per exception state change (OPEN, EXPLAINED, ACTIONED, RESOLVED)
    - events/mw-recon/mw.recon.exception.v1.schema.json
    - events/mw-audit-dw/mw.audit.event.v1.schema.json
  apis:
    - api/mw-recon/recon.v1.openapi.yaml
    - api/mw-recon/recon-test.v1.openapi.yaml
consumes:
  events:
    - events/mw-adapter-billpay/mw.partner.recon.v1.schema.json
    - events/mw-orchestrator/mw.txn.status.v1.schema.json
    - events/mw-core-mock/core.event.v1.schema.json#TransferPosted
    - events/mw-core-mock/core.event.v1.schema.json#WalletCredited
    - events/mw-core-mock/core.event.v1.schema.json#HoldCommitted
    - events/mw-core-mock/core.event.v1.schema.json#TransactionReversed
  apis:
    # ticket 127c: the trust position job reads only the e-money total report (read only, client/CoreEmoneyClient)
    - api/mw-core-mock/core-wallet.v1.openapi.yaml
