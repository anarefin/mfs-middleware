# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-adapter-bank
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:adapter_bank_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: bank_ref
  flyway:
    schemas: bank_ref

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # C2W bank (ticket 23). Only transport failures, 5xx, timeouts and
      # unreadable replies count as failures; business rejections are normal answers. 80% of
      # the 25 s limit.
      c2wbank:
        base-config: default
        slow-call-duration-threshold: 20s
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
    instances:
      c2wbank:
        base-config: default
        max-concurrent-calls: 100
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
    # Partner calls take their time limit from partner config (mw.partners.instances.<id>.timeout-ms),
    # so a config-changed record can change it without a restart; no per-partner instance here.
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.adapter.bank.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  # Adapter framework (spec 12, package partner; copied from mw-adapter-telco via
  # mw-adapter-billpay). Partner instances are config: route template + endpoint + JSONata
  # mappings + error-code map. These are seeds (version 0); a mw.config.changed.v1 PARTNER record
  # (configKey partner/<id>, same field names in camelCase) replaces or adds an instance without a
  # restart. Secrets are never here: auth.credentials-ref names a property that OpenBao provides
  # (secret/mw-adapter-bank).
  partners:
    # A partnerId without config of its own is served by the C2W bank (until the ~20 partner banks
    # get their own partner/<id> records, spec 11.1).
    default-partner: c2wbank
    config-consumer:
      # Consumer of mw.config.changed.v1 (PartnerConfigRouteBuilder); tests switch it off.
      enabled: true
    # Security (static config only; a config-changed record can never widen it). A partner's
    # baseUrl host must be on its own allowlist, https unless the host is an explicitly allowed
    # dev/test host, and auth.credentials-ref is a bare secret name read from the property
    # mw.partner-secrets.<partner>.<name> (OpenBao secret/mw-adapter-bank). A record breaking
    # a rule is refused (event security.partner_config_refused) and the last good config stays.
    security:
      allowed-hosts:
        c2wbank: ${MW_C2WBANK_ALLOWED_HOSTS:mw-simulators}
      # Plain http only for the simulator; production sets MW_PARTNER_INSECURE_HTTP_HOSTS empty.
      insecure-http-hosts: ${MW_PARTNER_INSECURE_HTTP_HOSTS:mw-simulators}
    instances:
      # Generic partner bank for C2W / ADD_MONEY_BANK (wire format: mw-simulators c2wbank).
      # Async-callback template: a debit is accepted (202 PENDING) and its outcome follows as a
      # signed callback to /partner/c2wbank/callback/debits (APISIX ->
      # controller/PartnerCallbackController); a 200 SUCCESS / 422 FAILED answer is also understood.
      c2wbank:
        template: rest-json-async-callback
        base-url: ${C2WBANK_BASE_URL:http://mw-simulators:8080}
        connect-timeout-ms: 3000
        # Bank timeout (spec 11.1 says 30 s) is 25 s here so the adapter answers before the
        # orchestrator's 30 s partner deadline; the read timeout sits a little above so the time
        # limiter decides first. Resilience4j bulkhead/circuit breaker: instance "c2wbank".
        timeout-ms: 25000
        read-timeout-ms: 27000
        # hmac-sha256 both ways (spec 11.1 "signature"; mTLS per bank is TBC): outbound calls are
        # signed, and a callback is believed only with a valid signature over method, path,
        # timestamp and body (300 s skew). The shared secret is the property
        # mw.partner-secrets.c2wbank.hmac-secret (OpenBao secret/mw-adapter-bank, provisioned by
        # init/init.sh from the generated C2WBANK_HMAC_SECRET in dev); never here.
        auth:
          scheme: hmac-sha256
          credentials-ref: hmac-secret
        # Raw bodies are audited masked: these fields by rule, everything by free-text scrubbing.
        sensitive-fields:
          accountNumber: ACCOUNT
        # Bank codes that do not say whether the debit was applied: reply UNKNOWN.
        ambiguous-codes: ["9876"]
        # Bank code -> MW-PTR-C2WBANK-<suffix>. Unlisted codes become UNMAPPED.
        error-map:
          "[4001]": { suffix: ACCOUNT_NOT_LINKED, retryable: false }
          "[4002]": { suffix: DEBIT_REFUSED, retryable: false }
          "[4003]": { suffix: INSUFFICIENT_FUNDS, retryable: false }
        operations:
          # POST /c2wbank/v1/debits {transactionId, accountNumber, amount:"500.00"}.
          # Only 422 with a code and 400 are rejections; any other non-2xx is UNKNOWN (fail closed).
          "[PAY]":
            method: POST
            path: /c2wbank/v1/debits
            definite-statuses: [400, 422]
            request: |
              {"transactionId": reference, "accountNumber": debitParty.id, "amount": amount.major}
            response: |
              status = 200
                ? (body.status = "SUCCESS" and $type(body.debitRef) = "string" and body.debitRef != ""
                    ? {"outcome": "SUCCESS", "partnerRef": body.debitRef, "code": body.code}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 202
                ? (body.status = "PENDING"
                    ? {"outcome": "PENDING", "partnerRef": body.debitRef, "code": body.code}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 422
                ? ($type(body.code) = "string" and body.code != ""
                    ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 400
                ? {"outcome": "FAILED", "code": "HTTP_400", "message": body.message}
              : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
          # Status inquiry (spec 7.4): GET /c2wbank/v1/debits/{reference}. NOT_FOUND only for a
          # 404 carrying the bank's NOT_FOUND body; anything else indefinite is UNKNOWN.
          "[STATUS_QUERY]":
            method: GET
            path: /c2wbank/v1/debits/{reference}
            definite-statuses: [200, 404]
            response: |
              status = 200
                ? (body.status = "SUCCESS" and $type(body.debitRef) = "string" and body.debitRef != ""
                    ? {"outcome": "SUCCESS", "partnerRef": body.debitRef, "code": body.code}
                    : body.status = "FAILED" and $type(body.code) = "string" and body.code != ""
                      ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                    : body.status = "PENDING"
                      ? {"outcome": "PENDING", "partnerRef": body.debitRef, "code": body.code}
                      : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 404 and body.status = "NOT_FOUND"
                ? {"outcome": "NOT_FOUND", "code": body.code, "message": body.message}
              : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
          # Callback: POST /partner/c2wbank/callback/debits with the debit body {transactionId
          # (our reference), status SUCCESS|FAILED|PENDING, code, message, debitRef}, signed (auth
          # above). Input {headers, body}; anything without a known status is refused. The path is
          # where APISIX forwards it; it is never called outbound.
          "[CALLBACK]":
            method: POST
            path: /partner/c2wbank/callback/debits
            response: |
              $type(body.transactionId) != "string" or body.transactionId = "" ? {}
              : body.status = "SUCCESS" and $type(body.debitRef) = "string" and body.debitRef != ""
                ? {"outcome": "SUCCESS", "partnerRef": body.debitRef, "reference": body.transactionId,
                   "code": body.code, "message": body.message}
              : body.status = "FAILED" and $type(body.code) = "string" and body.code != ""
                ? {"outcome": "FAILED", "partnerRef": body.debitRef, "reference": body.transactionId,
                   "code": body.code, "message": body.message}
              : body.status = "PENDING"
                ? {"outcome": "PENDING", "partnerRef": body.debitRef, "reference": body.transactionId,
                   "code": body.code, "message": body.message}
              : {}
  kafka:
    retry:
      # Non-blocking retry topics <topic>.retry.1..3, then <topic>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): publishes unsent rows, then stamps sent_at.
      enabled: true
      period: 500ms
      batch-size: 100
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
