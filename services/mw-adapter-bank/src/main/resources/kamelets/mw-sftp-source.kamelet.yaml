# mw-sftp-source (ADR D26, ticket 86): the start of a batch partner route
# (`from: kamelet:mw-sftp-source?...`): polls the partner's SFTP directory for reconciliation and
# settlement files.
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mw-sftp-source
  labels:
    camel.apache.org/kamelet.type: source
  annotations:
    camel.apache.org/kamelet.support.level: Stable
    camel.apache.org/provider: Bits MFS middleware
spec:
  definition:
    title: MW SFTP source
    description: >-
      Polls one directory of the partner's SFTP host (camel-sftp) and hands each file to the route as
      a stream (streamDownload, never fully in memory). The host key is checked strictly against the
      partner's known hosts (a field of its own OpenBao secret, never the user's known_hosts file,
      never written); the password or private key is a field of the same secret. A file is processed
      once (JDBC idempotent repository in the adapter's own schema, key name-size-modified), only once
      the partner stopped writing it (readLock=changed), and stays on the host: moved to .done after
      the route (and its outbox write) succeeded, to .error when it failed; never deleted. Output: the
      file content as a stream, the Camel file headers.
    type: object
    required: [host, username, directory, partnerId, knownHosts]
    properties:
      host:
        title: Host
        description: The partner's SFTP host, one of the record's allowedHosts.
        type: string
      port:
        title: Port
        description: SFTP port.
        type: integer
        default: 22
      username:
        title: User name
        description: SFTP login.
        type: string
      directory:
        title: Directory
        description: Directory to poll, relative to the login's home (no .. segments).
        type: string
      delay:
        title: Poll delay
        description: Milliseconds between two polls (daily files need no tight poll; the connection is closed in between).
        type: integer
        default: 60000
      maxMessagesPerPoll:
        title: Files per poll
        description: At most this many files per poll.
        type: integer
        default: 10
      password:
        title: Password secret reference
        description: Set by the route loader from secretField (auth=password) as a registry reference, never the value.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
          - urn:alm:descriptor:com.tectonic.ui:password
      privateKey:
        title: Private key secret reference
        description: Set by the route loader from secretField (auth=key) as a registry reference, never the value.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
          - urn:alm:descriptor:com.tectonic.ui:password
      knownHosts:
        title: Known hosts reference
        description: Set by the route loader from knownHostsField (the host's known_hosts lines in the partner's secret).
        type: string
      partnerId:
        title: Partner id
        description: Set by the route loader.
        type: string
  template:
    from:
      uri: "sftp:{{host}}:{{port}}/{{directory}}?username={{username}}&password={{?password}}&privateKey={{?privateKey}}&knownHosts={{knownHosts}}&strictHostKeyChecking=yes&useUserKnownHostsFile=false&autoCreateKnownHostsFile=false&delay={{delay}}&maxMessagesPerPoll={{maxMessagesPerPoll}}&readLock=changed&readLockCheckInterval=500&readLockTimeout=20000&idempotent=true&idempotentKey={{partnerId}}/${file:name}-${file:size}-${file:modified}&idempotentRepository=#mwSftpFiles&move=.done&moveFailed=.error&streamDownload=true&stepwise=false&disconnect=true&binary=true&connectTimeout=10000&soTimeout=30000"
      steps:
        - to: "kamelet:sink"
