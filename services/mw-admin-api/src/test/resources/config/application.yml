# Test-only overrides, merged over src/main/resources/application.yml.
mw:
  kafka:
    listener:
      # A closing test context does not wait the default 10 s per listener container for a consumer
      # caught mid-rebalance (cached contexts share the broker); nothing in a test depends on that drain.
      shutdown-timeout: 100ms
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  admin-api:
    internal-auth:
      # Obviously fake; the real one comes from OpenBao. ITs with a stub upstream serve a token.
      client-secret: test-only-client-secret-not-a-secret
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
  change-requests:
    # The expiry job is off in tests; ChangeRequestApiIT calls it directly.
    expiry-cron: "-"
  partners:
    # The dev seed (application-dev.yml) is what the ITs change; PartnerConfigApiIT re-seeds it.
    seeds:
      - classpath:partner-seeds/dev/ocs.json
