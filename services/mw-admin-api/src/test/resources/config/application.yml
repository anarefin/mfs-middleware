# Test-only overrides, merged over src/main/resources/application.yml.
mw:
  kafka:
    listener:
      # A closing test context does not wait the default 10 s per listener container for a consumer
      # caught mid-rebalance (cached contexts share the broker); nothing in a test depends on that drain.
      shutdown-timeout: 100ms
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  admin-api:
    internal-auth:
      # Obviously fake; the real one comes from Vault. ITs with a stub upstream serve a token.
      client-secret: test-only-client-secret-not-a-secret
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
  change-requests:
    # The expiry job is off in tests; ChangeRequestApiIT calls it directly.
    expiry-cron: "-"
    # and the claim-first reconciler (ticket 75): KeyApprovalRaceIT calls it directly
    approving-reconcile-cron: "-"
  apisix:
    # ticket 100a: off in tests; ChannelClientChangeRequestIT turns it on against a stand-in Admin API
    reconcile-cron: "-"
  credentials:
    expiry:
      # ticket 131: off in tests; CredentialExpiryJobIT calls the job directly
      cron: "-"
  partner-routes:
    status-consumer:
      # Off in tests: a cached context would compete for the topic; PartnerRouteApiIT switches it on.
      enabled: false
  partners:
    # The dev seeds (application-dev.yml) are what the ITs change; PartnerConfigApiIT re-seeds them.
    seeds:
      - classpath:partner-seeds/dev/ocs.json
      - classpath:partner-seeds/dev/billagg.json
      - classpath:partner-seeds/dev/c2wbank.json
