# Dev profile only (SPRING_PROFILES_ACTIVE=dev, set for this service in deploy/docker-compose.yml).
# The partner seeds mirror the dev seed partners of the adapters (application-dev.yml of
# mw-adapter-telco `ocs` plus the operator profiles `gp-ocs`, `robi-ocs`, `teletalk-ocs`, `bl-ocs`
# (ticket 112a), mw-adapter-billpay `billagg`, mw-adapter-bank `c2wbank`, mw-adapter-merchant `merchant-soap` (ticket 115b); ticket 84): stored
# once at version 0 and never published, so the console can disable a partner, change its timeouts
# or submit a new route and publish the full config as version 1. Keep a seed identical to the
# adapter's (its route with the simulator URL written out), or the first approved change publishes
# the difference.
mw:
  partners:
    seeds:
      - classpath:partner-seeds/dev/ocs.json
      - classpath:partner-seeds/dev/gp-ocs.json
      - classpath:partner-seeds/dev/robi-ocs.json
      - classpath:partner-seeds/dev/teletalk-ocs.json
      - classpath:partner-seeds/dev/bl-ocs.json
      - classpath:partner-seeds/dev/billagg.json
      # BEGIN bill aggregators (generated by deploy/partner-routes/aggregators/generate.mjs)
      - classpath:partner-seeds/dev/sslcommerz.json
      - classpath:partner-seeds/dev/ekpay.json
      - classpath:partner-seeds/dev/agg3.json
      - classpath:partner-seeds/dev/agg4.json
      # END bill aggregators
      - classpath:partner-seeds/dev/c2wbank.json
      # the merchant system of mw-adapter-merchant (ticket 115b)
      - classpath:partner-seeds/dev/merchant-soap.json
      # the card acquirer of mw-adapter-card (ticket 118b; the copy of its application-dev.yml seed)
      - classpath:partner-seeds/dev/cybersource.json
      # BEGIN bank profiles (generated by deploy/partner-routes/bank/generate.mjs)
      - classpath:partner-seeds/dev/bank-dbbl.json
      - classpath:partner-seeds/dev/bank-brac.json
      - classpath:partner-seeds/dev/bank-city.json
      - classpath:partner-seeds/dev/bank-ebl.json
      - classpath:partner-seeds/dev/bank-ucb.json
      - classpath:partner-seeds/dev/bank-mtb.json
      - classpath:partner-seeds/dev/bank-prime.json
      - classpath:partner-seeds/dev/bank-pubali.json
      - classpath:partner-seeds/dev/bank-dhaka.json
      - classpath:partner-seeds/dev/bank-one.json
      - classpath:partner-seeds/dev/bank-southeast.json
      - classpath:partner-seeds/dev/bank-standard.json
      - classpath:partner-seeds/dev/bank-sonali.json
      - classpath:partner-seeds/dev/bank-janata.json
      - classpath:partner-seeds/dev/bank-agrani.json
      - classpath:partner-seeds/dev/bank-rupali.json
      - classpath:partner-seeds/dev/bank-ibbl.json
      - classpath:partner-seeds/dev/bank-ab.json
      - classpath:partner-seeds/dev/bank-premier.json
      - classpath:partner-seeds/dev/bank-nrbc.json
      # END bank profiles
  # The dev biller catalogue (ticket 113): stored and published at version 1 for every code not in
  # the catalogue yet (scheduler/BillerSeedJob).
  billers:
    seeds:
      - classpath:biller-seeds/dev/billers.csv
