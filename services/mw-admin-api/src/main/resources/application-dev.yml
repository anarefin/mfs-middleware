# Dev profile only (SPRING_PROFILES_ACTIVE=dev, set for this service in deploy/docker-compose.yml).
# The partner seeds mirror the dev seed partners of the adapters (application-dev.yml of
# mw-adapter-telco `ocs` plus the operator profiles `gp-ocs`, `robi-ocs`, `teletalk-ocs`, `bl-ocs`
# (ticket 112a), mw-adapter-billpay `billagg`, mw-adapter-bank `c2wbank`; ticket 84): stored
# once at version 0 and never published, so the console can disable a partner, change its timeouts
# or submit a new route and publish the full config as version 1. Keep a seed identical to the
# adapter's (its route with the simulator URL written out), or the first approved change publishes
# the difference.
mw:
  partners:
    seeds:
      - classpath:partner-seeds/dev/ocs.json
      - classpath:partner-seeds/dev/gp-ocs.json
      - classpath:partner-seeds/dev/robi-ocs.json
      - classpath:partner-seeds/dev/teletalk-ocs.json
      - classpath:partner-seeds/dev/bl-ocs.json
      - classpath:partner-seeds/dev/billagg.json
      - classpath:partner-seeds/dev/c2wbank.json
  # The dev biller catalogue (ticket 113): stored and published at version 1 for every code not in
  # the catalogue yet (scheduler/BillerSeedJob).
  billers:
    seeds:
      - classpath:biller-seeds/dev/billers.csv
