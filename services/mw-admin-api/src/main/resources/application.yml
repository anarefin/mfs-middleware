# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-admin-api
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    import: "optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:admin_api_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: admin
      # Explicit, small pool (Kafka-driven or light on the database). PostgreSQL
      # max_connections sizing: deploy/compose/platform/compose.yml (postgres).
      maximum-pool-size: 5
  flyway:
    # admin (change requests, outbox) and partner (partner config, ticket 38; spec 16.2), both
    # owned by this service; the history table lives in the first.
    schemas: admin,partner

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # The internal query APIs (client/, ticket 36): only unavailability counts.
      orchestrator:
        base-config: default
        minimum-number-of-calls: 20
        record-exceptions: mfs.mw.admin.api.exception.QueryUnavailableException
      audit-dw:
        base-config: default
        minimum-number-of-calls: 20
        record-exceptions: mfs.mw.admin.api.exception.QueryUnavailableException
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
    instances:
      orchestrator:
        base-config: default
        retry-exceptions: mfs.mw.admin.api.exception.QueryUnavailableException
      audit-dw:
        base-config: default
        retry-exceptions: mfs.mw.admin.api.exception.QueryUnavailableException

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.admin.api.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  kafka:
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): claims up to batch-size unsent rows, sends them all
      # without waiting, then stamps sent_at on the acknowledged ones in one statement. Polls
      # again at once while batches come back full; waits one period once the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  change-requests:
    # Maker-checker (spec 15.3, ticket 37): a request not decided within ttl expires; the
    # ShedLock-guarded expiry job (scheduler/ChangeRequestExpiryJob) marks and audits them.
    ttl: 72h
    expiry-cron: "0 */5 * * * *"
    expiry-batch: 500
    # UnlockWallet sent on approval of a wallet unlock (ticket 52): expiresAt = issuedAt + this
    unlock-command-ttl: 1h
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  admin-api:
    jwt:
      # Keycloak realm `ops` (operators, password + TOTP; spec 15.1, 18.2). Keys fetched on the first token.
      jwk-set-uri: ${MW_ADMIN_JWK_SET_URI:http://keycloak:8080/realms/ops/protocol/openid-connect/certs}
      realm-path: /realms/ops
    # The internal query APIs (ticket 35/36) over the app network; not routed by APISIX.
    orchestrator:
      base-url: ${MW_ORCHESTRATOR_BASE_URL:http://mw-orchestrator:8080}
    audit-dw:
      base-url: ${MW_AUDIT_DW_BASE_URL:http://mw-audit-dw:8080}
    connect-timeout: 2s
    read-timeout: 5s
    # audit events shown with one transaction (audit-query.v1 caps a page at 500)
    audit-trail-limit: 500
    # Client credentials of Keycloak realm `services` (M3 gate: /internal/v1/** needs a token for
    # audiences mw-orchestrator and mw-audit-dw). The secret comes from OpenBao (secret/mw-admin-api,
    # mw.admin-api.internal-auth.client-secret, synced by the init from KC_MW_ADMIN_API_SECRET).
    internal-auth:
      token-uri: ${MW_INTERNAL_TOKEN_URI:http://keycloak:8080/realms/services/protocol/openid-connect/token}
      client-id: mw-admin-api
