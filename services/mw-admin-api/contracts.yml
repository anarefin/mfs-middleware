# Contracts this module produces and consumes (ticket 53); paths relative to contracts/.
# `#<Msg>` names one message type of a multi-type topic, e.g.
#   events/mw-orchestrator/core.command.v1.schema.json#HoldFunds
# `make contracts-lint` checks every entry exists; `make verify-changed` uses this list to pick the
# modules a contract change affects. Ticket 39: approved USSD menu and notify template versions
# go out on mw.config.changed.v1 (own contract, dto/ConfigChangedEvent). Ticket 37: approved operator
# actions go to mw-orchestrator on mw.txn.action.v1 (own contract) and, for a reversal, as a
# REVERSAL on mw.txn.request.v1 (mw-orchestrator's contract).
produces:
  events:
    - events/mw-audit-dw/mw.audit.event.v1.schema.json
    - events/mw-admin-api/mw.txn.action.v1.schema.json
    - events/mw-admin-api/mw.config.changed.v1.schema.json
    - events/mw-orchestrator/mw.txn.request.v1.schema.json
  apis:   [api/mw-admin-api/admin.v1.openapi.yaml]
consumes:
  events: []
  apis:   [api/mw-orchestrator/txn-query.v1.openapi.yaml, api/mw-audit-dw/audit-query.v1.openapi.yaml]
