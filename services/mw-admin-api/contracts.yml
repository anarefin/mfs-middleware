# Contracts this module produces and consumes (ticket 53); paths relative to contracts/.
# `#<Msg>` names one message type of a multi-type topic, e.g.
#   events/mw-core-mock/core.event.v1.schema.json#WalletStateChanged
# `./gradlew :contractsLint` checks every entry exists; the module's build.gradle.kts tracks the listed
# contracts as test inputs, so a contract change re-runs only the modules it affects. Ticket 38: approved partner changes, ticket 39: approved
# USSD menu and notify template versions go out as full values on mw.config.changed.v1 (own
# contract, dto/ConfigChangedEvent). Ticket 37: approved operator
# actions go to mw-orchestrator on mw.txn.action.v1 (own contract) and, for a reversal, as a
# REVERSAL on mw.txn.request.v1 (mw-orchestrator's contract).
# Ticket 52: an approved wallet unlock lifts the core's lock; since ticket 95b (ADR D31) over REST
# (core-wallet.v1 POST /core/v1/accounts/{walletId}/unlock, client/CoreAccountClient), no Kafka command.
# Ticket 127b: an approved recon_exception action is a ticket 37 message (mw.txn.action.v1 FORCE_COMMIT or a
# REVERSAL on mw.txn.request.v1), then recorded at mw-recon (recon.v1 POST .../exceptions/{id}/actions).
produces:
  events:
    - events/mw-audit-dw/mw.audit.event.v1.schema.json
    - events/mw-admin-api/mw.txn.action.v1.schema.json
    - events/mw-admin-api/mw.config.changed.v1.schema.json
    - events/mw-orchestrator/mw.txn.request.v1.schema.json
    # ticket 70: the ops unlock also lifts mw-auth's PIN lock
    - events/mw-auth/auth.wallet-lock.v1.schema.json
    # ticket 131: the ops email of a partner credential expiry alert (template OPS_CREDENTIAL_EXPIRING)
    - events/mw-notify/mw.notify.request.v1.schema.json
  apis:   [api/mw-admin-api/admin.v1.openapi.yaml]
consumes:
  # ticket 83: the adapters' LIVE / REJECTED report per partner route version (messaging/PartnerRouteStatusListener)
  events:
    - events/mw-adapter-billpay/mw.partner.route.status.v1.schema.json
  # ticket 75: the key list, approved key changes and the key ceremony at mw-crypto
  apis:   [api/mw-orchestrator/txn-query.v1.openapi.yaml, api/mw-audit-dw/audit-query.v1.openapi.yaml,
           api/mw-crypto/crypto-internal.v1.openapi.yaml,
           api/mw-core-mock/core-wallet.v1.openapi.yaml,
           # ticket 127b: the recon exception (read) and the record of an approved action
           api/mw-recon/recon.v1.openapi.yaml]
