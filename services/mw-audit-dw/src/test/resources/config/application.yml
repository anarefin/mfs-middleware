# Test-only overrides, merged over src/main/resources/application.yml.
mw:
  kafka:
    listener:
      # A closing test context does not wait the default 10 s per listener container for a consumer
      # caught mid-rebalance (cached contexts share the broker); nothing in a test depends on that drain.
      shutdown-timeout: 100ms
  internal-auth:
    # Test-only issuer of security/InternalTokens (TestInfrastructure registers its JWKS).
    issuer: http://keycloak.test/realms/services
  audit-dw:
    # The mw.audit.event.v1 consumer is off unless a test switches it on (AuditEventKafkaIT).
    consumers:
      enabled: false
    # The verify job's schedule is off in tests; AuditChainVerifyIT calls the service directly with
    # this test-only reader password (not a real secret).
    chain-verify:
      cron: "-"
      reader-password: test-only-reader-pw
    # The anchor job's schedule is off in tests and nothing is exported; AuditAnchorIT calls the
    # service with a mw-crypto stand-in (client/CryptoStub) and its own export folder.
    # No mw-crypto in tests: the search projection stores no MSISDN tokens unless a test switches it
    # on with its own MsisdnTokeniser (AuditSearchFiltersIT).
    query:
      tokenise-msisdn: false
    anchor:
      cron: "-"
      export-dir: ""
      crypto:
        client-secret: test-only-client-secret
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
