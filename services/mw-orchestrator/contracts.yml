# Contracts this module produces and consumes (ticket 53); paths relative to contracts/.
# Checked by `./gradlew :contractsLint`, tested by contracts/ProducedContractsTest and ConsumedContractsTest
# (events) and contracts/ApiContractsTest (APIs).
produces:
  events:
    - events/mw-orchestrator/mw.txn.status.v1.schema.json
    - events/mw-orchestrator/mw.partner.request.v1.schema.json#telco
    - events/mw-orchestrator/mw.partner.request.v1.schema.json#billpay
    - events/mw-orchestrator/mw.partner.request.v1.schema.json#bank
    - events/mw-audit-dw/mw.audit.event.v1.schema.json
    # REVERSAL of the test-only API (ticket 58, off unless mw.orchestrator.test-api.enabled)
    - events/mw-orchestrator/mw.txn.request.v1.schema.json
  apis:
    - api/mw-orchestrator/txn-query.v1.openapi.yaml
    - api/mw-orchestrator/orchestrator-test.v1.openapi.yaml
consumes:
  events:
    - events/mw-orchestrator/mw.txn.request.v1.schema.json
    - events/mw-admin-api/mw.txn.action.v1.schema.json
    - events/mw-orchestrator/mw.partner.reply.v1.schema.json#telco
    - events/mw-orchestrator/mw.partner.reply.v1.schema.json#billpay
    - events/mw-orchestrator/mw.partner.reply.v1.schema.json#bank
    - events/mw-orchestrator/mw.partner.inbound.v1.schema.json#telco
    - events/mw-orchestrator/mw.partner.inbound.v1.schema.json#billpay
    - events/mw-orchestrator/mw.partner.inbound.v1.schema.json#bank
  # The core wallet over REST (ADR D31, ticket 95a; client/CoreWalletClient). The core's events on Kafka
  # are not consumed: the core-event listener ignores the result events of its REST calls (95c adds
  # HoldExpired and wallet-state changes).
  apis:
    - api/mw-core-mock/core-wallet.v1.openapi.yaml
