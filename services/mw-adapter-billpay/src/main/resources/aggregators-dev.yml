          "route": "- route:\n    from:\n      uri: direct:partner-agg4\n      steps:\n        - choice:\n            when:\n                - simple: \"${header.mwOperation} == 'INQUIRY'\"\n                  steps:\n                    - to: \"kamelet:mw-map?mapping=INQUIRY.request\"\n                    - to: \"kamelet:mw-http-call?url=${BILL_AGG_BASE_URL:http://mw-simulators:8080}&method=POST&path=/agg4/v1/bills/inquiry&auth=basic&userField=basic-user&secretField=basic-password\"\n                    - to: \"kamelet:mw-classify?mapping=INQUIRY.response&definiteStatuses=200,422\"\n                - simple: \"${header.mwOperation} == 'PAY'\"\n                  steps:\n                    - to: \"kamelet:mw-map?mapping=PAY.request\"\n                    - to: \"kamelet:mw-http-call?url=${BILL_AGG_BASE_URL:http://mw-simulators:8080}&method=POST&path=/agg4/v1/payments&auth=basic&userField=basic-user&secretField=basic-password\"\n                    - to: \"kamelet:mw-classify?mapping=PAY.response&definiteStatuses=400,422&pending=true\"\n                - simple: \"${header.mwOperation} == 'STATUS_QUERY'\"\n                  steps:\n                    - to: \"kamelet:mw-http-call?url=${BILL_AGG_BASE_URL:http://mw-simulators:8080}&method=GET&path=/agg4/v1/payments/{reference}&auth=basic&userField=basic-user&secretField=basic-password\"\n                    - to: \"kamelet:mw-classify?mapping=STATUS_QUERY.response&definiteStatuses=200,404&pending=true\"\n                - simple: \"${header.mwOperation} == 'REVERSE'\"\n                  steps:\n                    - to: \"kamelet:mw-map?mapping=REVERSE.request\"\n                    - to: \"kamelet:mw-http-call?url=${BILL_AGG_BASE_URL:http://mw-simulators:8080}&method=POST&path=/agg4/v1/payments/{reference}/reverse&auth=basic&userField=basic-user&secretField=basic-password\"\n                    - to: \"kamelet:mw-classify?mapping=REVERSE.response&definiteStatuses=404,422\"\n        - to: \"kamelet:mw-audit\"\n",
          "mappings": {
            "[INQUIRY.request]": "{\"req\": {\"svc\": partner.billerCode, \"acct\": creditParty.id, \"month\": billMonth}}\n",
            "[INQUIRY.response]": "status = 200 and body.res.state = \"OPEN\" and $type(body.res.amt) = \"string\"\n  ? {\"outcome\": \"SUCCESS\", \"partnerRef\": body.res.acct,\n     \"attributes\": {\"amount\": body.res.amt, \"dueDate\": body.res.due, \"billPeriod\": body.res.month}}\n: status = 200 and body.res.state = \"DONE\"\n  ? {\"outcome\": \"FAILED\", \"code\": \"X02\", \"message\": \"Bill already paid\"}\n: (status = 422 or status = 404) and $type(body.res.err) = \"string\" and body.res.err != \"\"\n  ? {\"outcome\": \"FAILED\", \"code\": body.res.err, \"message\": body.res.msg}\n: {\"outcome\": \"UNKNOWN\", \"reason\": \"UNEXPECTED_STATUS\"}\n",
            "[PAY.request]": "{\"req\": {\"ref\": reference, \"svc\": partner.billerCode, \"acct\": creditParty.id,\n \"amt\": amount.major}}\n",
            "[PAY.response]": "status = 200 or status = 202\n  ? (body.res.state = \"DONE\" and $type(body.res.rcpt) = \"string\" and body.res.rcpt != \"\"\n      ? {\"outcome\": \"SUCCESS\", \"partnerRef\": body.res.rcpt}\n    : body.res.state = \"WAIT\"\n      ? {\"outcome\": \"PENDING\", \"partnerRef\": body.res.rcpt}\n    : {\"outcome\": \"UNKNOWN\", \"reason\": \"MALFORMED_REPLY\"})\n: (status = 422 or status = 404) and $type(body.res.err) = \"string\" and body.res.err != \"\"\n  ? {\"outcome\": \"FAILED\", \"code\": body.res.err, \"message\": body.res.msg}\n: status = 400\n  ? {\"outcome\": \"FAILED\", \"code\": \"HTTP_400\"}\n: {\"outcome\": \"UNKNOWN\", \"reason\": \"UNEXPECTED_STATUS\"}\n",
            "[STATUS_QUERY.response]": "status = 200\n  ? (body.res.state = \"DONE\" and $type(body.res.rcpt) = \"string\" and body.res.rcpt != \"\"\n      ? {\"outcome\": \"SUCCESS\", \"partnerRef\": body.res.rcpt}\n    : body.res.state = \"WAIT\"\n      ? {\"outcome\": \"PENDING\", \"partnerRef\": body.res.rcpt}\n    : body.res.state = \"FAIL\" and $type(body.res.err) = \"string\"\n      ? {\"outcome\": \"FAILED\", \"code\": body.res.err, \"message\": body.res.msg}\n    : {\"outcome\": \"UNKNOWN\", \"reason\": \"MALFORMED_REPLY\"})\n: status = 404 and body.res.state = \"NOT_FOUND\"\n  ? {\"outcome\": \"NOT_FOUND\", \"code\": body.res.err}\n: {\"outcome\": \"UNKNOWN\", \"reason\": \"UNEXPECTED_STATUS\"}\n",
            "[REVERSE.request]": "{\"req\": {\"rev_ref\": reversalReference, \"amt\": amount.major}}\n",
            "[REVERSE.response]": "status = 200\n  ? (body.res.state = \"VOID\" and $type(body.res.rev_rcpt) = \"string\" and body.res.rev_rcpt != \"\"\n      ? {\"outcome\": \"SUCCESS\", \"partnerRef\": body.res.rev_rcpt}\n      : {\"outcome\": \"UNKNOWN\", \"reason\": \"MALFORMED_REPLY\"})\n: (status = 422 or status = 404) and $type(body.res.err) = \"string\" and body.res.err != \"\"\n  ? {\"outcome\": \"FAILED\", \"code\": body.res.err, \"message\": body.res.msg}\n: {\"outcome\": \"UNKNOWN\", \"reason\": \"UNEXPECTED_STATUS\"}\n",
            "[CALLBACK.response]": "$type(body.ref) != \"string\" or body.ref = \"\" ? {}\n: body.state = \"DONE\" and $type(body.rcpt) = \"string\" and body.rcpt != \"\"\n  ? {\"outcome\": \"SUCCESS\", \"partnerRef\": body.rcpt, \"reference\": body.ref}\n: body.state = \"FAIL\" and $type(body.err) = \"string\" and body.err != \"\"\n  ? {\"outcome\": \"FAILED\", \"partnerRef\": body.rcpt, \"reference\": body.ref,\n     \"code\": body.err, \"message\": body.msg}\n: {}\n"
          }
        }
      }
    }
  }
}
