# Dev profile only (SPRING_PROFILES_ACTIVE=dev): set by deploy/docker-compose.yml for the dev stack
# and by the test config. The seed partner (version 0) points at mw-simulators over plain http; the
# packaged application.yml has none, so a production start has no partners. Plain http still needs
# MW_PARTNER_INSECURE_HTTP_HOSTS (docker-compose.yml sets it).
mw:
  partners:
    # Dry-runs of new partner versions go to mw-simulators' programmable stub (ticket 83).
    dry-run:
      base-url: ${MW_PARTNER_DRY_RUN_BASE_URL:http://mw-simulators:8080/sim/partners/{partnerId}}
    instances:
      # Utility bill aggregator REST/JSON (wire format: mw-simulators billagg), a partner route as
      # config (ADR D26). A payment is answered at once (200 SUCCESS / 422 FAILED) or accepted (202
      # PENDING) with the outcome following as a signed callback to /partner/billagg/callback/payments
      # (APISIX -> controller/PartnerCallbackController), verified with auth below.
      billagg:
        family: billpay
        base-url: ${BILLAGG_BASE_URL:http://mw-simulators:8080}
        # The hosts the route may call (approved with the record; the static floor in application.yml
        # narrows them).
        allowed-hosts: ${MW_BILLAGG_ALLOWED_HOSTS:mw-simulators}
        connect-timeout-ms: 3000
        # Aggregator timeout (spec 11.1 says 30 s) is 25 s here so the adapter answers before the
        # orchestrator's 30 s partner deadline; the read timeout sits a little above so the time
        # limit decides first. Circuit breaker and bulkhead: the resilience4j instance "billagg".
        timeout-ms: 25000
        read-timeout-ms: 27000
        # A bill fetch or a status inquiry goes again once after a timeout, 5xx, reset or failed
        # connect; a payment never.
        inquiry-retries: 1
        # Every call is signed hmac-sha256 (mw-http-call auth), and a callback is believed only with a
        # valid signature over method, path, timestamp and body (300 s skew). The shared secret is the
        # field hmac-secret of OpenBao secret/mw-adapter-billpay/billagg (dev value BILLAGG_HMAC_SECRET,
        # deploy/provision/services.sh); never here.
        auth:
          scheme: hmac-sha256
          credentials-ref: hmac-secret
        # Raw bodies are audited masked: these fields by rule, everything by free-text scrubbing.
        sensitive-fields:
          billNumber: ACCOUNT
        # Aggregator codes that do not say whether the payment was applied: reply UNKNOWN.
        ambiguous-codes: ["9876"]
        # Aggregator code -> MW-PTR-BILLAGG-<suffix>. Unlisted codes become UNMAPPED.
        error-map:
          "[3001]": { suffix: BILL_NOT_FOUND, retryable: false }
          "[3002]": { suffix: BILL_ALREADY_PAID, retryable: false }
          "[3003]": { suffix: PAYMENT_REFUSED, retryable: false }
          "[3004]": { suffix: UNKNOWN_BILLER, retryable: false }
        # The route: one branch per operation, then mw-audit. PAY: POST /billagg/v1/payments
        # {transactionId, billerCode, billNumber, amount:"667.00"} (only 422 with a code and 400 are
        # rejections; any other non-2xx is UNKNOWN). STATUS_QUERY (spec 7.4): GET
        # /billagg/v1/payments/{reference}. INQUIRY (bill fetch, ticket 21): POST
        # /billagg/v1/bills/fetch {billerCode, billNumber}. The base URL is the record's base-url.
        route: |
          - route:
              from:
                uri: direct:partner-billagg
                steps:
                  - choice:
                      when:
                        - simple: "${header.mwOperation} == 'PAY'"
                          steps:
                            - to: "kamelet:mw-map?mapping=PAY.request"
                            - to: "kamelet:mw-http-call?url=${mw.partners.instances.billagg.base-url}&method=POST&path=/billagg/v1/payments&auth=hmac-sha256&secretField=hmac-secret"
                            - to: "kamelet:mw-classify?mapping=PAY.response&definiteStatuses=400,422&pending=true"
                        - simple: "${header.mwOperation} == 'STATUS_QUERY'"
                          steps:
                            - to: "kamelet:mw-http-call?url=${mw.partners.instances.billagg.base-url}&method=GET&path=/billagg/v1/payments/{reference}&auth=hmac-sha256&secretField=hmac-secret"
                            - to: "kamelet:mw-classify?mapping=STATUS_QUERY.response&definiteStatuses=200,404&pending=true"
                        - simple: "${header.mwOperation} == 'INQUIRY'"
                          steps:
                            - to: "kamelet:mw-map?mapping=INQUIRY.request"
                            - to: "kamelet:mw-http-call?url=${mw.partners.instances.billagg.base-url}&method=POST&path=/billagg/v1/bills/fetch&auth=hmac-sha256&secretField=hmac-secret"
                            - to: "kamelet:mw-classify?mapping=INQUIRY.response&definiteStatuses=400,422"
                  - to: "kamelet:mw-audit"
        mappings:
          "[PAY.request]": |
            {"transactionId": reference, "billerCode": partner.billerCode,
             "billNumber": creditParty.id, "amount": amount.major}
          "[PAY.response]": |
            status = 200
              ? (body.status = "SUCCESS" and $type(body.paymentRef) = "string" and body.paymentRef != ""
                  ? {"outcome": "SUCCESS", "partnerRef": body.paymentRef, "code": body.code}
                  : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
            : status = 202
              ? (body.status = "PENDING"
                  ? {"outcome": "PENDING", "partnerRef": body.paymentRef, "code": body.code}
                  : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
            : status = 422
              ? ($type(body.code) = "string" and body.code != ""
                  ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                  : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
            : status = 400
              ? {"outcome": "FAILED", "code": "HTTP_400", "message": body.message}
            : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
          # NOT_FOUND only for a 404 carrying the aggregator's NOT_FOUND body.
          "[STATUS_QUERY.response]": |
            status = 200
              ? (body.status = "SUCCESS" and $type(body.paymentRef) = "string" and body.paymentRef != ""
                  ? {"outcome": "SUCCESS", "partnerRef": body.paymentRef, "code": body.code}
                  : body.status = "FAILED" and $type(body.code) = "string" and body.code != ""
                    ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                  : body.status = "PENDING"
                    ? {"outcome": "PENDING", "partnerRef": body.paymentRef, "code": body.code}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
            : status = 404 and body.status = "NOT_FOUND"
              ? {"outcome": "NOT_FOUND", "code": body.code, "message": body.message}
            : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
          # 200 DUE carries the amount due (decimal string, major units) as attributes; 422 with a
          # code is a refusal (unknown bill, already paid, unknown biller).
          "[INQUIRY.request]": |
            {"billerCode": partner.billerCode, "billNumber": creditParty.id}
          "[INQUIRY.response]": |
            status = 200
              ? (body.status = "DUE" and $type(body.amount) = "string" and $type(body.billNumber) = "string"
                  ? {"outcome": "SUCCESS", "partnerRef": body.billNumber, "code": body.code,
                     "attributes": {"amount": body.amount, "dueDate": body.dueDate, "billPeriod": body.billPeriod}}
                  : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
            : status = 422
              ? ($type(body.code) = "string" and body.code != ""
                  ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                  : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
            : status = 400
              ? {"outcome": "FAILED", "code": "HTTP_400", "message": body.message}
            : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
          # Callback (ticket 22): the payment body {transactionId (our reference), status
          # SUCCESS|FAILED|PENDING, code, message, paymentRef}, input {headers, body}; anything
          # without a known status is refused.
          "[CALLBACK.response]": |
            $type(body.transactionId) != "string" or body.transactionId = "" ? {}
            : body.status = "SUCCESS" and $type(body.paymentRef) = "string" and body.paymentRef != ""
              ? {"outcome": "SUCCESS", "partnerRef": body.paymentRef, "reference": body.transactionId,
                 "code": body.code, "message": body.message}
            : body.status = "FAILED" and $type(body.code) = "string" and body.code != ""
              ? {"outcome": "FAILED", "partnerRef": body.paymentRef, "reference": body.transactionId,
                 "code": body.code, "message": body.message}
            : body.status = "PENDING"
              ? {"outcome": "PENDING", "partnerRef": body.paymentRef, "reference": body.transactionId,
                 "code": body.code, "message": body.message}
            : {}
