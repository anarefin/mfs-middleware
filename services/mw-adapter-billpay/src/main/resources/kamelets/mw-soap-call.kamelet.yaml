# mw-soap-call (ADR D26, ticket 85): one SOAP call to the partner through camel-cxf in PAYLOAD mode,
# inside the same resilience4j breaker, time limit, bulkhead and host guard as mw-http-call. Never
# retries a PAY; an INQUIRY or STATUS_QUERY goes again at most the record's inquiryRetries. HTTP Basic
# and mTLS reuse mw-http-call's mechanisms (review of 85): the mw-auth-basic Kamelet (auth=basic) and a
# named client context (sslContextRef, PartnerTlsContexts). The body is made and read by an XSLT
# stylesheet of the record or, with request=json / response=json, by the fixed JSON/XML convention
# (JSONata on the JSON side, partner/mapping/JsonXmlMapping). A breaking change ships as mw-soap-call-v2.
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mw-soap-call
  labels:
    camel.apache.org/kamelet.type: action
  annotations:
    camel.apache.org/kamelet.support.level: Stable
    camel.apache.org/provider: Bits MFS middleware
spec:
  definition:
    title: MW SOAP call
    description: >-
      Turns the request mw-map produced (JSON) into the SOAP body element with the record's request
      stylesheet (XSLT 3.0 over the JSON's XPath 3.1 XML form) or, with request=json, the JSON itself
      written as XML in namespace (one root key; keys are elements, @name attributes, arrays repeat),
      sends it to the static address in a
      SOAP 1.1 or 1.2 envelope (CXF PAYLOAD mode, no WSDL: the body element is sent as it is), with a
      WS-Security UsernameToken when wsUsername is set, inside the partner's circuit breaker with its
      time limit and bulkhead, with HTTP Basic (auth=basic, mw-auth-basic) or an mTLS client context
      (sslContextRef) when set. The SOAP body of the answer, or a SOAP fault as <fault
      xmlns="urn:bits:mw:soap-fault" code subcode reason><detail/></fault>, goes through the response
      stylesheet (or, with response=json, the same convention back) to the JSON mw-classify maps (status 200 for both: the partner's application
      answered). The SOAP action and the operation are properties and a header, never part of the
      endpoint URI. A transport error, the time limit or an open breaker ends in the fallback (UNKNOWN,
      or NOT_SENT when nothing left). Input: the request JSON; output: the answer JSON for mw-classify,
      or the decided outcome. partnerId, timeoutMs, connectTimeoutMs, readTimeoutMs and bulkhead are set
      by the route loader from the record, never by the route.
    type: object
    required: [address, request, response, partnerId, timeoutMs, connectTimeoutMs, readTimeoutMs, bulkhead]
    properties:
      address:
        title: Address
        description: Static http(s) URL of the SOAP endpoint; its host must be in the record's allowedHosts.
        type: string
      request:
        title: Request mapping
        description: >-
          The record's *.xsl mapping (or a classpath:partner/xslt/*.xsl resource) that makes the SOAP
          body element, or json: mw-map's JSON written as XML in namespace.
        type: string
      response:
        title: Response mapping
        description: >-
          The record's *.xsl mapping (or a classpath:partner/xslt/*.xsl resource) that turns the SOAP
          body or fault into JSON, or json: the body read back as JSON for mw-classify's mapping.
        type: string
      namespace:
        title: Body namespace
        description: "The namespace (an urn: or http(s) URI) of the body elements of request=json; needed with it."
        type: string
        default: ""
      auth:
        title: HTTP auth
        description: none, or basic (the mw-auth-basic Kamelet, user and password fields of the partner's secret).
        type: string
        enum: [none, basic]
        default: none
      userField:
        title: User secret field
        description: Field of this partner's own OpenBao secret holding the Basic user name (auth=basic); a reference, never the value.
        type: string
        format: password
        default: ""
        x-descriptors:
          - urn:camel:group:credentials
          - urn:alm:descriptor:com.tectonic.ui:password
      secretField:
        title: Password secret field
        description: Field of this partner's own OpenBao secret holding the Basic password (auth=basic); a reference, never the value.
        type: string
        format: password
        default: ""
        x-descriptors:
          - urn:camel:group:credentials
          - urn:alm:descriptor:com.tectonic.ui:password
      sslContextRef:
        title: TLS client context
        description: >-
          Name of a client keystore (mTLS) registered at startup from OpenBao for this partner
          (mw.partners.tls.contexts.<name>, bean mwTls-<name>); https only. Empty = no client certificate.
        type: string
        default: ""
      soapAction:
        title: SOAP action
        description: The SOAPAction (SOAP 1.1 header, SOAP 1.2 action parameter); empty for none.
        type: string
        default: ""
      soapVersion:
        title: SOAP version
        description: 1.1 (text/xml) or 1.2 (application/soap+xml).
        type: string
        enum: ["1.1", "1.2"]
        default: "1.1"
      wsUsername:
        title: WS-Security user
        description: UsernameToken user name; empty sends no WS-Security header.
        type: string
        default: ""
      wsPasswordSecret:
        title: WS-Security password secret
        description: Field of this partner's own OpenBao secret (secret/<service>/<partnerId>) holding the UsernameToken password; a reference, never the value.
        type: string
        format: password
        default: ""
        x-descriptors:
          - urn:camel:group:credentials
          - urn:alm:descriptor:com.tectonic.ui:password
      wsTokenType:
        title: WS-Security password type
        description: PasswordText (over TLS) or PasswordDigest (SHA-1 of nonce, created and password).
        type: string
        enum: [PasswordText, PasswordDigest]
        default: PasswordText
      partnerId:
        title: Partner id
        description: Set by the route loader.
        type: string
      timeoutMs:
        title: Time limit
        description: Set by the route loader from the record's timeoutMs; past it the outcome is UNKNOWN.
        type: integer
      connectTimeoutMs:
        title: Connect timeout
        description: Set by the route loader from the record's connectTimeoutMs.
        type: integer
      readTimeoutMs:
        title: Read timeout
        description: Set by the route loader from the record's readTimeoutMs.
        type: integer
      bulkhead:
        title: Bulkhead
        description: Set by the route loader; concurrent calls allowed to this partner.
        type: integer
  template:
    from:
      uri: "kamelet:source"
      steps:
        - setProperty:
            name: mwSoapAddress
            constant: "{{address}}"
        - setProperty:
            name: mwSoapRequest
            constant: "{{request}}"
        - setProperty:
            name: mwSoapResponse
            constant: "{{response}}"
        - setProperty:
            name: mwSoapNamespace
            constant: "{{namespace}}"
        - setProperty:
            name: mwSoapTlsRef
            constant: "{{sslContextRef}}"
        - setProperty:
            name: mwSoapAction
            constant: "{{soapAction}}"
        - setProperty:
            name: mwSoapUsername
            constant: "{{wsUsername}}"
        - setProperty:
            name: mwSoapPasswordSecret
            constant: "{{wsPasswordSecret}}"
        - setProperty:
            name: mwSoapPasswordType
            constant: "{{wsTokenType}}"
        - setProperty:
            name: mwSoapConnectTimeout
            constant: "{{connectTimeoutMs}}"
        - setProperty:
            name: mwSoapReadTimeout
            constant: "{{readTimeoutMs}}"
        - bean:
            ref: mwSoap
            method: prepare
        - loop:
            doWhile: true
            simple: "${exchangeProperty.mwAttemptAgain} == true"
            steps:
              - to: "kamelet:mw-auth-{{auth}}?secretField={{secretField}}&userField={{userField}}"
              - bean:
                  ref: mwSoap
                  method: beforeAttempt
              - circuitBreaker:
                  resilience4jConfiguration:
                    circuitBreaker: "mw-cb-{{partnerId}}"
                    timeoutEnabled: true
                    timeoutDuration: "{{timeoutMs}}"
                    bulkheadEnabled: true
                    bulkheadMaxConcurrentCalls: "{{bulkhead}}"
                  steps:
                    - doTry:
                        steps:
                          # mTLS: as in mw-http-call, the endpoint with the named client context is resolved only
                          # when used (toD), so a partner without one never needs a bean mwTls-.
                          - choice:
                              when:
                                - simple: "${exchangeProperty.mwSoapTls} == true && '{{soapVersion}}' == '1.2'"
                                  steps:
                                    - toD:
                                        uri: "cxf://{{address}}?dataFormat=PAYLOAD&headerFilterStrategy=#mwSoapHeaderFilter&bindingId=http://www.w3.org/2003/05/soap/bindings/HTTP/&sslContextParameters=#mwTls-{{sslContextRef}}"
                                        cacheSize: 1
                                        allowOptimisedComponents: false
                                - simple: "${exchangeProperty.mwSoapTls} == true"
                                  steps:
                                    - toD:
                                        uri: "cxf://{{address}}?dataFormat=PAYLOAD&headerFilterStrategy=#mwSoapHeaderFilter&sslContextParameters=#mwTls-{{sslContextRef}}"
                                        cacheSize: 1
                                        allowOptimisedComponents: false
                                - simple: "'{{soapVersion}}' == '1.2'"
                                  steps:
                                    - to: "cxf://{{address}}?dataFormat=PAYLOAD&headerFilterStrategy=#mwSoapHeaderFilter&bindingId=http://www.w3.org/2003/05/soap/bindings/HTTP/"
                              otherwise:
                                steps:
                                  - to: "cxf://{{address}}?dataFormat=PAYLOAD&headerFilterStrategy=#mwSoapHeaderFilter"
                          - bean:
                              ref: mwSoap
                              method: response
                        doCatch:
                          - exception:
                              - org.apache.cxf.binding.soap.SoapFault
                            steps:
                              - bean:
                                  ref: mwSoap
                                  method: fault
                  onFallback:
                    steps:
                      - bean:
                          ref: mwHttp
                          method: fallback
