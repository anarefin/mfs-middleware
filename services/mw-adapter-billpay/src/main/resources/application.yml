# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-adapter-billpay
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:adapter_billpay_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: billpay_ref
  flyway:
    schemas: billpay_ref

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # Utility bill aggregator (ticket 21). Only transport failures, 5xx, timeouts and
      # unreadable replies count as failures; business rejections are normal answers. 80% of
      # the 25 s limit.
      billagg:
        base-config: default
        slow-call-duration-threshold: 20s
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
    instances:
      billagg:
        base-config: default
        max-concurrent-calls: 100
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
    # Partner calls take their time limit from partner config (mw.partners.instances.<id>.timeout-ms),
    # so a config-changed record can change it without a restart; no per-partner instance here.
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.adapter.billpay.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  # Biller catalogue (ticket 21): which aggregator (partner instance) serves which biller. Read by
  # the internal API (GET /billpay/v1/billers, bill fetch) that mw-app-gateway calls. Static seed
  # until mw-admin-api publishes the catalogue (spec 11.2 "Biller catalogue", ticket 38).
  billers:
    DESCO: { name: Dhaka Electric Supply Company, category: ELECTRICITY, partner-id: billagg }
    DPDC: { name: Dhaka Power Distribution Company, category: ELECTRICITY, partner-id: billagg }
    WASA: { name: Dhaka WASA, category: WATER, partner-id: billagg }
    TITAS: { name: Titas Gas, category: GAS, partner-id: billagg }
  # Adapter framework (spec 12, package partner; copied from mw-adapter-telco). Partner instances
  # are config: route template + endpoint + JSONata mappings + error-code map. These are seeds
  # (version 0); a mw.config.changed.v1 PARTNER record (configKey partner/<id>, same field names
  # in camelCase) replaces or adds an instance without a restart. Secrets are never here:
  # auth.credentials-ref names a property that OpenBao provides (secret/mw-adapter-billpay).
  partners:
    # A partnerId without config of its own is served by the utility aggregator.
    default-partner: billagg
    config-consumer:
      # Consumer of mw.config.changed.v1 (PartnerConfigRouteBuilder); tests switch it off.
      enabled: true
    # Security (static config only; a config-changed record can never widen it). A partner's
    # baseUrl host must be on its own allowlist, https unless the host is an explicitly allowed
    # dev/test host, and auth.credentials-ref is a bare secret name read from the property
    # mw.partner-secrets.<partner>.<name> (OpenBao secret/mw-adapter-billpay). A record breaking
    # a rule is refused (event security.partner_config_refused) and the last good config stays.
    security:
      allowed-hosts:
        billagg: ${MW_BILLAGG_ALLOWED_HOSTS:mw-simulators}
      # Plain http only for the simulator; production sets MW_PARTNER_INSECURE_HTTP_HOSTS empty.
      insecure-http-hosts: ${MW_PARTNER_INSECURE_HTTP_HOSTS:mw-simulators}
    instances:
      # Utility bill aggregator REST/JSON (wire format: mw-simulators billagg).
      billagg:
        template: rest-json-request-reply
        base-url: ${BILLAGG_BASE_URL:http://mw-simulators:8080}
        connect-timeout-ms: 3000
        # Aggregator timeout (spec 11.1 says 30 s) is 25 s here so the adapter answers before the
        # orchestrator's 30 s partner deadline; the read timeout sits a little above so the time
        # limiter decides first. Resilience4j bulkhead/circuit breaker: instance "billagg".
        timeout-ms: 25000
        read-timeout-ms: 27000
        auth:
          scheme: none
        # Raw bodies are audited masked: these fields by rule, everything by free-text scrubbing.
        sensitive-fields:
          billNumber: ACCOUNT
        # Aggregator codes that do not say whether the payment was applied: reply UNKNOWN.
        ambiguous-codes: ["9876"]
        # Aggregator code -> MW-PTR-BILLAGG-<suffix>. Unlisted codes become UNMAPPED.
        error-map:
          "[3001]": { suffix: BILL_NOT_FOUND, retryable: false }
          "[3002]": { suffix: BILL_ALREADY_PAID, retryable: false }
          "[3003]": { suffix: PAYMENT_REFUSED, retryable: false }
          "[3004]": { suffix: UNKNOWN_BILLER, retryable: false }
        operations:
          # POST /billagg/v1/payments {transactionId, billerCode, billNumber, amount:"667.00"}.
          # Only 422 with a code and 400 are rejections; any other non-2xx is UNKNOWN (fail closed).
          "[PAY]":
            method: POST
            path: /billagg/v1/payments
            definite-statuses: [400, 422]
            request: |
              {"transactionId": reference, "billerCode": partner.billerCode,
               "billNumber": creditParty.id, "amount": amount.major}
            response: |
              status = 200
                ? (body.status = "SUCCESS" and $type(body.paymentRef) = "string" and body.paymentRef != ""
                    ? {"outcome": "SUCCESS", "partnerRef": body.paymentRef, "code": body.code}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 422
                ? ($type(body.code) = "string" and body.code != ""
                    ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 400
                ? {"outcome": "FAILED", "code": "HTTP_400", "message": body.message}
              : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
          # Status inquiry (spec 7.4): GET /billagg/v1/payments/{reference}. NOT_FOUND only for a
          # 404 carrying the aggregator's NOT_FOUND body; anything else indefinite is UNKNOWN.
          "[STATUS_QUERY]":
            method: GET
            path: /billagg/v1/payments/{reference}
            definite-statuses: [200, 404]
            response: |
              status = 200
                ? (body.status = "SUCCESS" and $type(body.paymentRef) = "string" and body.paymentRef != ""
                    ? {"outcome": "SUCCESS", "partnerRef": body.paymentRef, "code": body.code}
                    : body.status = "FAILED" and $type(body.code) = "string" and body.code != ""
                      ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                      : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 404 and body.status = "NOT_FOUND"
                ? {"outcome": "NOT_FOUND", "code": body.code, "message": body.message}
              : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
          # Bill fetch (ticket 21, internal API only; no money moves):
          # POST /billagg/v1/bills/fetch {billerCode, billNumber}. 200 DUE carries the amount due
          # (decimal string, major units) as attributes; 422 with a code is a refusal (unknown
          # bill, already paid, unknown biller).
          "[INQUIRY]":
            method: POST
            path: /billagg/v1/bills/fetch
            definite-statuses: [400, 422]
            request: |
              {"billerCode": partner.billerCode, "billNumber": creditParty.id}
            response: |
              status = 200
                ? (body.status = "DUE" and $type(body.amount) = "string" and $type(body.billNumber) = "string"
                    ? {"outcome": "SUCCESS", "partnerRef": body.billNumber, "code": body.code,
                       "attributes": {"amount": body.amount, "dueDate": body.dueDate, "billPeriod": body.billPeriod}}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 422
                ? ($type(body.code) = "string" and body.code != ""
                    ? {"outcome": "FAILED", "code": body.code, "message": body.message}
                    : {"outcome": "UNKNOWN", "reason": "MALFORMED_REPLY"})
              : status = 400
                ? {"outcome": "FAILED", "code": "HTTP_400", "message": body.message}
              : {"outcome": "UNKNOWN", "reason": "UNEXPECTED_STATUS"}
  kafka:
    retry:
      # Non-blocking retry topics <topic>.retry.1..3, then <topic>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): publishes unsent rows, then stamps sent_at.
      enabled: true
      period: 500ms
      batch-size: 100
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
