# This service only (spec 20.2). Included by deploy/compose/<env>/compose.yml, or run on
# its own with `make up M=mw-adapter-billpay` once the platform project is up.
#
# The zone network is named after the platform project (default `mw`, override with
# COMPOSE_PROJECT_NAME) so the same definition works both when included in the
# environment project and when started alone. Join only the zones this service needs
# (18.1): `app` for Kafka, Valkey, OpenBao and other services, `data` for PostgreSQL.
# (The platform puts OpenBao on `app` and `ops`; services reach it over `app`.)
networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-mw}_app
  data:
    name: ${COMPOSE_PROJECT_NAME:-mw}_data

volumes:
  # Same volume as the platform's OpenBao data (dev root token for the init step, read-only).
  openbao-data:
    name: ${COMPOSE_PROJECT_NAME:-mw}_openbao-data
  # role-id / secret-id written by the init step, read by the service (Spring configtree).
  adapter-billpay-approle:

services:
  # Idempotent one-shot (init/init.sh): database role + own schema, the database password in
  # OpenBao (secret/mw-adapter-billpay) and the AppRole the service logs in with. Dev/MVP only. Needs
  # POSTGRES_USER/PASSWORD/DB: `make up` gets them from deploy/compose/platform/.env through the
  # include's env_file; for `make up M=mw-adapter-billpay` export POSTGRES_PASSWORD first.
  mw-adapter-billpay-init:
    image: ${MW_ADAPTER_BILLPAY_INIT_IMAGE:-mw-adapter-billpay-init:dev}
    build: ./init
    restart: "no"
    labels: { mw.oneshot: "true" } # one-shot: scripts/up.sh does not wait for its health
    networks: [app, data]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-mw_admin}
      PGDATABASE: ${POSTGRES_DB:-mw}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-dev-env.sh (make up does)}
      # Dev billagg hmac-sha256 secret (ticket 22), written to OpenBao as mw.partner-secrets.billagg.hmac-secret.
      BILLAGG_HMAC_SECRET: ${BILLAGG_HMAC_SECRET:?run scripts/gen-dev-env.sh (make up does)}
      BAO_ADDR: ${VAULT_ADDR:-http://openbao:8200}
      INIT_FILE: /openbao/file/dev-init.json
      OUT_DIR: /out
    volumes:
      - openbao-data:/openbao/file:ro
      - adapter-billpay-approle:/out
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  mw-adapter-billpay:
    image: ${MW_ADAPTER_BILLPAY_IMAGE:-mw-adapter-billpay:dev}
    build: .
    restart: unless-stopped
    networks: [app, data]
    depends_on:
      mw-adapter-billpay-init: { condition: service_completed_successfully }
    volumes:
      - adapter-billpay-approle:/run/mw/approle:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MW_ENV: ${MW_ENV:-local}
      # Secrets come from OpenBao via Spring Cloud Vault (18.4); no secret values here.
      # On: the DB password comes from secret/mw-adapter-billpay, the AppRole credentials from the
      # configtree at /run/mw/approle (application.yml).
      VAULT_ENABLED: ${VAULT_ENABLED:-true}
      VAULT_ADDR: ${VAULT_ADDR:-http://openbao:8200}
      # Own schema in the shared PostgreSQL (16.2); credentials from OpenBao, not here.
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/mw}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      # Utility bill aggregator endpoint; the MVP stack targets the aggregator simulator
      # (mw-simulators, /billagg/v1/*).
      BILLAGG_BASE_URL: ${BILLAGG_BASE_URL:-http://mw-simulators:8080}
      # Dev stack only: the simulator is plain http. The packaged default allows no http host.
      MW_PARTNER_INSECURE_HTTP_HOSTS: ${MW_PARTNER_INSECURE_HTTP_HOSTS:-mw-simulators}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      # Readiness (20.1); the image has bash but no curl or wget.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
