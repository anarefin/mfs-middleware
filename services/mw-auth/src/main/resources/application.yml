# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-auth
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:auth_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: auth
      # Explicit, small pool (Kafka-driven or light on the database). PostgreSQL
      # max_connections sizing: deploy/docker-compose.yml (postgres).
      maximum-pool-size: 5
  flyway:
    schemas: auth
  # Valkey (Lettuce) for device sessions and the signed-request nonce cache (spec 9.1, 18.7,
  # ticket 68). The password comes from OpenBao (secret/mw-auth, spring.data.redis.password), never
  # written here. Short timeouts; the device API fails closed (503 MW-SYS-012).
  data:
    redis:
      host: ${VALKEY_HOST:valkey}
      port: ${VALKEY_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # A binding OTP request waits for its SMS publish: when Kafka is down it must fail fast with
      # 503 MW-SYS-010 (nothing sent) instead of blocking for the client defaults (60 s, 2 min).
      max-block-ms: 5000
      request-timeout-ms: 5000
      delivery-timeout-ms: 10000
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    instances:
      # client/CryptoClient (spec 18.7: mw-crypto unreachable fails closed). Counts calls, not time:
      # opens after half of the last 20 failed (min 10), probes again after 10 s. A 4xx is a refusal,
      # not an outage.
      mw-crypto:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.auth.logging.JsonLogFormatter

server:
  # Internal API /internal/v1/** (spec 18.7, D24, ticket 67): mTLS as on mw-crypto, a client
  # certificate of the OpenBao intermediate is needed (handshake fails without one); the bundle is
  # this service's own certificate, issued and renewed in memory by config/ServiceCertificateManager.
  # The public plain-HTTP port for /auth/v1/** is mw.auth.public-port (config/PublicConnectorConfig).
  port: 8443
  shutdown: graceful
  ssl:
    enabled: ${mw.tls.enabled}
    bundle: ${mw.tls.bundle}
    client-auth: need
  error:
    include-stacktrace: never
    include-message: never

management:
  # Probes and metrics on their own plain-HTTP port inside the network (the compose healthcheck has
  # no client certificate); never published on the host. ssl.enabled=false, or it would inherit
  # the internal port's mTLS.
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Valkey only serves the device API, which answers 503 MW-SYS-012 itself while it is down.
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  # This service's certificate from OpenBao PKI (spec 18.2, 18.4, D24; config/TlsProperties,
  # config/ServiceCertificateManager): on, mw-auth serves its internal API with mTLS and calls
  # mw-crypto with it. Issued at start from pki_int/issue/mw-auth through Spring Cloud Vault
  # (AppRole policy: that role only; PKI_SERVICES in deploy/provision/services.sh), renewed at two
  # thirds of the life, never written to disk.
  tls:
    enabled: ${MW_TLS_ENABLED:true}
    pki-mount: pki_int
    role: ${spring.application.name}
    common-name: ${spring.application.name}
    alt-names: ${MW_TLS_ALT_NAMES:${spring.application.name}}
    ttl: 72h
    retry-period: 1m
    bundle: mw-service
  auth:
    # The public plain-HTTP connector for /auth/v1/** behind APISIX (tickets 68-69).
    public-port: ${MW_AUTH_PUBLIC_PORT:8080}
    # Device binding, signed requests, sessions and the binding OTP (spec 9.1, 18.6, 18.7; moved from
    # mw-app-gateway in ticket 68): one bound device per wallet (auth.device), sessions
    # sess:{walletId}:{deviceId} in Valkey with a sliding idle timeout, nonces used once. See
    # config/DeviceBindingProperties.
    device-binding:
      clock-skew: 5m
      idle-timeout: ${MW_AUTH_SESSION_IDLE_TIMEOUT:5m}
      idle-timeout-by-channel: {}
      # OTPs (BIND, LOGIN) go by SMS to the wallet of the MSISDN through mw-notify (review A5):
      # checks per OTP and sends per wallet and window are enforced with conditional updates.
      otp:
        ttl: 2m
        max-attempts: 3
        max-sends: ${MW_AUTH_DEVICE_OTP_MAX_SENDS:5}
        send-window: 15m
      notify-topic: mw.notify.request.v1
    # The wallet users' tokens (spec 18.7, D21, ticket 69; config/TokenProperties): access JWT RS256 by
    # the mw-crypto key JWT_SIGN, refresh token opaque and rotated. The issuer is what the discovery
    # document says and what APISIX (route app-v1) and mw-app-gateway compare exactly; jwks-uri is the
    # in-stack URL of GET /auth/v1/.well-known/jwks.json that the discovery document names.
    tokens:
      issuer: ${MW_AUTH_TOKEN_ISSUER:mw-auth}
      audience: mw-app
      access-ttl: ${MW_AUTH_ACCESS_TTL:5m}
      refresh-ttl: 30d
      jwks-cache-ttl: 5m
      jwks-uri: ${MW_AUTH_JWKS_URI:http://mw-auth:8080/auth/v1/.well-known/jwks.json}
    # The transaction authorisation assertion (spec 18.7, D22, ticket 71; config/AssertionProperties):
    # POST /internal/v1/txn-authorisations, ES256 by the mw-crypto key ASSERTION_SIGN, single use by jti
    # at the core, which verifies it with GET /auth/v1/.well-known/assertion-jwks.json. A repeat with the
    # same idempotency key inside the ttl returns the same assertion (Valkey assert:{walletId}:{key}).
    assertion:
      issuer: mw-auth
      audience: core
      ttl: 60s
      new-device-window: 24h
      callers: mw-app-gateway,mw-ussd,mw-checkout
    # Dev only (ticket 69): POST /internal/v1/seed/pins, the seeder's first PINs, without a token
    # (controller/SeedController). Off unless the dev stack sets MW_AUTH_SEED_API_ENABLED=true.
    seed-api:
      enabled: ${MW_AUTH_SEED_API_ENABLED:false}
    consumer:
      # route/CoreWalletEventRoute: the wallet projection from the core (D5). Off in tests by default.
      enabled: true
    crypto:
      base-url: ${MW_CRYPTO_URL:https://mw-crypto:8080}
      token-uri: ${MW_INTERNAL_TOKEN_URI:http://keycloak:8080/realms/services/protocol/openid-connect/token}
      client-id: mw-auth
      # client-secret: from OpenBao secret/mw-auth (key mw.auth.crypto.client-secret), never here
      client-secret: ""
      timeout: 2s
      connect-timeout: 1s
  internal-auth:
    jwk-set-uri: ${MW_INTERNAL_JWK_SET_URI:http://keycloak:8080/realms/services/protocol/openid-connect/certs}
    issuer: ${MW_INTERNAL_ISSUER:http://keycloak:8080/realms/services}
    audience: mw-auth
    # spec 18.7: the channels (txn authorisation, ticket 71) and the admin API (PIN locks, ticket 70)
    allowed-clients: mw-app-gateway,mw-ussd,mw-checkout,mw-admin-api
  kafka:
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): claims up to batch-size unsent rows, sends them all
      # without waiting, then stamps sent_at on the acknowledged ones in one statement. Polls
      # again at once while batches come back full; waits one period once the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
