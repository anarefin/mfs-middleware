# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-auth
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://vault:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from Vault's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:auth_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: auth
      # Explicit, small pool (Kafka-driven or light on the database). PostgreSQL
      # max_connections sizing: deploy/docker-compose.yml (postgres).
      maximum-pool-size: 5
  flyway:
    schemas: auth
  # Redis (Lettuce) for device sessions and the signed-request nonce cache (spec 9.1, 18.7,
  # ticket 68). The password comes from Vault (secret/mw-auth, spring.data.redis.password), never
  # written here. Short timeouts; the device API fails closed (503 MW-SYS-012).
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false
  # Kafka through Spring Kafka (spec 6.1, 19.2, ADR D27); retry topics, templates and interceptors
  # in config/KafkaConfig. Single KRaft node; topics come from deploy/kafka/ and are never
  # auto-created by the service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      # Exactly one copy per send, every in-sync replica acknowledges, order kept per key (6.1).
      acks: all
      # Strings, and the raw bytes of a record that could not be deserialized when it is parked
      # on the DLQ.
      key-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Kafka down must fail a send fast instead of blocking for the client defaults (60 s, 2 min):
        # a binding OTP request waits for its SMS publish and answers 503 MW-SYS-010 (nothing sent);
        # the outbox relay and the retry topics retry it.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # One group per service: listeners use groupId = "${spring.kafka.consumer.group-id}", and
      # the group is the middle part of the service's retry and DLQ topic names.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      # Offsets are committed per record, only after it is handled (the listener acknowledges)
      # or parked on its next retry topic or the DLQ (the error handler); never on poll or close.
      enable-auto-commit: false
      # A record that is not UTF-8 text fails here, goes straight to the DLQ and never blocks
      # its partition (messaging/Utf8Deserializer wrapped by ErrorHandlingDeserializer).
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: mfs.mw.auth.messaging.Utf8Deserializer
        spring.deserializer.value.delegate.class: mfs.mw.auth.messaging.Utf8Deserializer
    listener:
      # Per-record commit, from the listener (Acknowledgment.acknowledge()) or the error handler.
      ack-mode: manual_immediate
      # Consumer threads per listener container; at most the topic's partition count.
      concurrency: ${MW_KAFKA_LISTENER_CONCURRENCY:1}
      # Micrometer observation: each record continues its traceparent (traceId/spanId in the MDC).
      observation-enabled: true
    admin:
      # Topics belong to the platform (deploy/kafka/); the service never creates any.
      auto-create: false
      # The observed KafkaTemplate asks the admin client for the cluster id on its first send; with
      # Kafka down that must fail as fast as the producer does, not after the client defaults (60 s).
      operation-timeout: 5s
      properties:
        default.api.timeout.ms: 5000
        request.timeout.ms: 5000

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    instances:
      # client/CryptoClient (spec 18.7: mw-crypto unreachable fails closed). Counts calls, not time:
      # opens after half of the last 20 failed (min 10), probes again after 10 s. A 4xx is a refusal,
      # not an outage.
      mw-crypto:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      # client/CoreClient (ticket 95b): the core wallet API; counts calls, a 4xx answer is no failure
      core:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.auth.logging.JsonLogFormatter

server:
  # Internal API /internal/v1/** (spec 18.7, D24, ticket 67): mTLS as on mw-crypto, a client
  # certificate of the Vault intermediate is needed (handshake fails without one); the bundle is
  # this service's own certificate, issued and renewed in memory by config/ServiceCertificateManager.
  # The public plain-HTTP port for /auth/v1/** is mw.auth.public-port (config/PublicConnectorConfig).
  port: 8443
  shutdown: graceful
  ssl:
    enabled: ${mw.tls.enabled}
    bundle: ${mw.tls.bundle}
    client-auth: need
  error:
    include-stacktrace: never
    include-message: never

management:
  # Probes and metrics on their own plain-HTTP port inside the network (the compose healthcheck has
  # no client certificate); never published on the host. ssl.enabled=false, or it would inherit
  # the internal port's mTLS.
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Redis only serves the device API, which answers 503 MW-SYS-012 itself while it is down.
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  # This service's certificate from Vault PKI (spec 18.2, 18.4, D24; config/TlsProperties,
  # config/ServiceCertificateManager): on, mw-auth serves its internal API with mTLS and calls
  # mw-crypto with it. Issued at start from pki_int/issue/mw-auth through Spring Cloud Vault
  # (AppRole policy: that role only; PKI_SERVICES in deploy/provision/services.sh), renewed at two
  # thirds of the life, never written to disk.
  tls:
    enabled: ${MW_TLS_ENABLED:true}
    pki-mount: pki_int
    role: ${spring.application.name}
    common-name: ${spring.application.name}
    alt-names: ${MW_TLS_ALT_NAMES:${spring.application.name}}
    ttl: 72h
    retry-period: 1m
    bundle: mw-service
  auth:
    # The public plain-HTTP connector for /auth/v1/** behind APISIX (tickets 68-69).
    public-port: ${MW_AUTH_PUBLIC_PORT:8080}
    # Device binding, signed requests, sessions and the binding OTP (spec 9.1, 18.6, 18.7; moved from
    # mw-app-gateway in ticket 68): bound devices per wallet follow mw.auth.app-types (auth.device), sessions
    # sess:{walletId}:{deviceId} in Redis with a sliding idle timeout, nonces used once. See
    # config/DeviceBindingProperties.
    device-binding:
      clock-skew: 5m
      idle-timeout: ${MW_AUTH_SESSION_IDLE_TIMEOUT:5m}
      idle-timeout-by-channel: {}
      # OTPs (BIND, LOGIN) go by SMS to the wallet of the MSISDN through mw-notify (review A5):
      # checks per OTP and sends per wallet and window are enforced with conditional updates.
      otp:
        ttl: 2m
        max-attempts: 3
        max-sends: ${MW_AUTH_DEVICE_OTP_MAX_SENDS:5}
        send-window: 15m
      notify-topic: mw.notify.request.v1
    # A channel's OTP bound to its own binding (ticket 72: CHECKOUT, bound to the checkout session;
    # config/ChannelOtpProperties): its own slot and its own sends per wallet and window, apart from
    # the device OTP above (security review of ticket 72). The SMS goes to notify-topic above.
    channel-otp:
      ttl: 2m
      max-attempts: 3
      max-sends: ${MW_AUTH_CHANNEL_OTP_MAX_SENDS:5}
      send-window: 15m
    # The wallet users' tokens (spec 18.7, D21, ticket 69; config/TokenProperties): access JWT RS256 by
    # the mw-crypto key JWT_SIGN, refresh token opaque and rotated. The issuer is what the discovery
    # document says and what APISIX (route app-v1) and mw-app-gateway compare exactly; jwks-uri is the
    # in-stack URL of GET /auth/v1/.well-known/jwks.json that the discovery document names.
    tokens:
      issuer: ${MW_AUTH_TOKEN_ISSUER:mw-auth}
      audience: mw-app
      access-ttl: ${MW_AUTH_ACCESS_TTL:15m}
      refresh-ttl: 30d
      jwks-cache-ttl: 5m
      jwks-uri: ${MW_AUTH_JWKS_URI:http://mw-auth:8080/auth/v1/.well-known/jwks.json}
    # Per app type (ticket 106, FRS CH-APP-02, CH-APP-03, CH-APP-04, CH-APP-07; config/AppTypePolicy).
    # Access token 15 min, one device, one session, idle 5 min. The customer keeps the PIN ladder's
    # first step (3 tries, 1 h). Distributor, DSO, partner, agent and merchant use 5 tries and a 24 h
    # first lock. MW_AUTH_ACCESS_TTL still sets the default access-token life.
    app-types:
      defaults:
        access-ttl: ${MW_AUTH_ACCESS_TTL:15m}
        max-devices: 1
        max-sessions: 1
        idle-timeout: 5m
        pin-tries: 5
        pin-lock: 24h
      types:
        CUSTOMER:
          pin-tries: 3
          pin-lock: 1h
    # The PIN lifecycle (spec 18.7, D20, ticket 70; config/PinProperties): the weak-PIN rules run in
    # mw-crypto with the inputs mw-auth passes; the last `history` PINs may not be reused. Lockout: every
    # `tries` wrong PINs lock the PIN one level up (level 1 for level1, level 2 for level2, level 3 until
    # a reset); the level history is forgotten `decay` after the last lock. Dev compose sets short
    # MW_AUTH_LOCK_* values (deploy/dev.env.defaults).
    pin:
      history: 3
      lock:
        tries: ${MW_AUTH_LOCK_TRIES:3}
        level1: ${MW_AUTH_LOCK_LEVEL1:1h}
        level2: ${MW_AUTH_LOCK_LEVEL2:24h}
        decay: ${MW_AUTH_LOCK_DECAY:30d}
      reset:
        # a self-service reset (and a care reset once its OTP is checked) lives this long
        ttl: 15m
        # an approved care reset waits this long for the customer's OTP
        care-ttl: 72h
      audit-topic: mw.audit.event.v1
    # The transaction authorisation assertion (spec 18.7, D22, ticket 71; config/AssertionProperties):
    # POST /internal/v1/txn-authorisations, ES256 by the mw-crypto key ASSERTION_SIGN, single use by jti
    # at the core, which verifies it with GET /auth/v1/.well-known/assertion-jwks.json. A repeat with the
    # same idempotency key inside the ttl returns the same assertion (Redis assert:{walletId}:{key}).
    assertion:
      issuer: mw-auth
      audience: core
      ttl: 60s
      new-device-window: 24h
      callers: mw-app-gateway,mw-ussd,mw-checkout
    # Dev only (ticket 69): POST /internal/v1/seed/pins, the seeder's first PINs, without a token
    # (controller/SeedController). Off unless the dev stack sets MW_AUTH_SEED_API_ENABLED=true.
    seed-api:
      enabled: ${MW_AUTH_SEED_API_ENABLED:false}
    consumer:
      # messaging/CoreWalletEventListener (the wallet projection from the core, D5) and
      # messaging/WalletLockListener (auth.wallet-lock.v1), retry consumers included. Off in tests by default.
      enabled: true
    crypto:
      base-url: ${MW_CRYPTO_URL:https://mw-crypto:8080}
      token-uri: ${MW_INTERNAL_TOKEN_URI:http://keycloak:8080/realms/services/protocol/openid-connect/token}
      client-id: mw-auth
      # client-secret: from Vault secret/mw-auth (key mw.auth.crypto.client-secret), never here
      client-secret: ""
      timeout: 2s
      connect-timeout: 1s
    # The core wallet API (ADR D31, ticket 95b; config/CoreClientProperties, client/CoreClient): the PIN
    # reset's KYC factors check POST /core/v1/customers/{walletId}/verify-factors, with the realm services
    # token above (client mw-auth, audience mw-core-mock besides mw-crypto). Idempotent by txnId: no definite
    # answer is asked again `attempts` times, `backoff` apart, then the reset stays pending until it expires.
    core:
      base-url: ${MW_CORE_URL:http://mw-core-mock:8080}
      timeout: 2s
      connect-timeout: 1s
      attempts: 3
      backoff: 500ms
  internal-auth:
    jwk-set-uri: ${MW_INTERNAL_JWK_SET_URI:http://keycloak:8080/realms/services/protocol/openid-connect/certs}
    issuer: ${MW_INTERNAL_ISSUER:http://keycloak:8080/realms/services}
    audience: mw-auth
    # spec 18.7: the channels (txn authorisation, ticket 71) and the admin API (PIN locks, ticket 70)
    allowed-clients: mw-app-gateway,mw-ussd,mw-checkout,mw-admin-api
  kafka:
    # How long EventPublisher.publish waits for Kafka's acknowledgement (just above the producer's
    # delivery.timeout.ms, so the producer decides first).
    send-timeout: 12s
    listener:
      # How long a stopping listener container waits for its consumer thread.
      shutdown-timeout: 10s
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
      # Consumed topics without retry topics (none by default).
      exclude-topics: []
  outbox:
    relay:
      # Transactional outbox relay (6.4, scheduler/OutboxRelayScheduler): claims up to batch-size
      # unsent rows, sends them all without waiting, then stamps sent_at on the acknowledged ones
      # in one statement. Polls again at once while batches come back full; waits one period once
      # the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}

# Generated API document and Swagger UI (ticket 101, PLT-050..052): off by default, so a production
# build exposes neither /v3/api-docs nor /swagger-ui; on in the dev and test profiles below (the dev
# stack sets SPRING_PROFILES_ACTIVE=dev). contracts/ stays the source of truth (contracts/README.md);
# contracts/ContractDriftTest proves the code still matches it.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
  # Only what the handler methods declare; the global error advice is documented by the contract.
  override-with-generic-response: false
---
spring:
  config:
    activate:
      on-profile: "dev | test"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # Relative, so the UI works on the service port and behind the dev-only APISIX /docs/<service>/
    # prefix alike (deploy/apisix/routes-test/test-docs-*.json) without forwarded-prefix headers.
    config-url: ../v3/api-docs/swagger-config
    url: ../v3/api-docs
