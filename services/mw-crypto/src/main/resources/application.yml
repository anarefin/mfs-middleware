# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-crypto
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:crypto_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: crypto
      # Explicit, small pool (Kafka-driven or light on the database). PostgreSQL
      # max_connections sizing: deploy/docker-compose.yml (postgres).
      maximum-pool-size: 5
  flyway:
    schemas: crypto

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # The payShield provider (ticket 64, client/PayShieldProvider): only transport failures count
      # (connect, timeout, dropped connection, wrong header); an error code in an answer does not.
      payshield:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 2400ms
        wait-duration-in-open-state: 10s
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.crypto.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  # mTLS (spec 18.2, D24, ticket 66): the API port needs a client certificate of the OpenBao
  # intermediate (handshake fails without one); the bundle is this service's own certificate,
  # issued and renewed in memory by config/ServiceCertificateManager (mw.tls below).
  ssl:
    enabled: ${mw.tls.enabled}
    bundle: ${mw.tls.bundle}
    client-auth: need
  error:
    include-stacktrace: never
    include-message: never

management:
  # Probes and metrics on their own plain-HTTP port inside the network (the compose healthcheck has
  # no client certificate); never published on the host. ssl.enabled=false, or it would inherit
  # the API port's mTLS.
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  kafka:
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): claims up to batch-size unsent rows, sends them all
      # without waiting, then stamps sent_at on the acknowledged ones in one statement. Polls
      # again at once while batches come back full; waits one period once the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  # The HSM gateway (spec 18.8, D23; config/CryptoProperties).
  crypto:
    default-provider: pkcs11
    # Dev only: create the missing key of every purpose below on start (scheduler/KeyBootstrap).
    # Production keys come only from the key ceremony (ticket 75); the dev stack sets
    # MW_CRYPTO_BOOTSTRAP_KEYS=true (deploy/docker-compose.yml).
    bootstrap-keys: ${MW_CRYPTO_BOOTSTRAP_KEYS:false}
    bootstrap-purposes:
      - PIN_TRANSPORT
      - PIN_HMAC
      - JWT_SIGN
      - ASSERTION_SIGN
      - AUDIT_ANCHOR_SIGN
      - TOKENISE_MSISDN
      - TOKENISE_NID
      - TOKENISE_ACCOUNT
      - KEK_COLUMN
      - KEK_FILE
      - XMLDSIG
    bootstrap-period: 30s
    hsm-probe-period: 10s
    pkcs11:
      # The image's p11-kit proxy: its one module is the softhsm mw-crypto token over TCP (Dockerfile).
      library: /usr/lib/libp11-kit.so.0
      slot-list-index: 0
      # From OpenBao secret/mw-crypto (deploy/provision/services.sh); never written here.
      user-pin: ""
      max-sessions: 8
      acquire-timeout: 2s
      call-timeout: 5s
    # The Thales payShield 10K provider (ticket 64, config/PayShieldProperties, client/PayShieldProvider):
    # ISO 9564 PIN block translation and PVV; in dev the mw-simulators simulator. Off unless turned on
    # (the production HSM vendor is open point 22; the dev stack sets MW_CRYPTO_PAYSHIELD_ENABLED=true).
    payshield:
      enabled: ${MW_CRYPTO_PAYSHIELD_ENABLED:false}
      host: ${MW_CRYPTO_PAYSHIELD_HOST:mw-simulators}
      port: 1500
      header-length: 4
      pool-size: 4
      connect-timeout: 2s
      # 80% of it is the breaker's slow-call threshold (resilience4j instance payshield)
      call-timeout: 3s
      acquire-timeout: 2s
      # added to bootstrap-purposes (dev bootstrap) while the provider is on
      bootstrap-purposes: [PVK, TPK, ZPK, TPK_AES, ZPK_AES]
      # PIN block format pairs /pinblock/translate accepts (FROM:TO); never from ISO 0, 3 or 4 into
      # ISO 1, which binds the PIN to no account (CLAUDE.md "payShield provider")
      allowed-translations: [ISO0:ISO0, ISO1:ISO1, ISO3:ISO3, ISO4:ISO4, ISO0:ISO3, ISO3:ISO0, ISO0:ISO4,
        ISO3:ISO4, ISO4:ISO0, ISO4:ISO3, ISO1:ISO0, ISO1:ISO3, ISO1:ISO4]
    # Dev-only payShield test API (ticket 76, config/TestApiProperties): a plain connector on port
    # serving only /test/v1/payshield/** (the LMK blob of a TPK/ZPK for the simulator's pinblock
    # helper, PVV generate/verify as the test-only client). Off unless MW_CRYPTO_TEST_API_ENABLED=true,
    # which only deploy/dev.env.defaults sets; never in another environment.
    test-api:
      enabled: ${MW_CRYPTO_TEST_API_ENABLED:false}
      port: 8082
      client: mw-e2e-crypto
    # Who may run which operation (security/CallerPolicy; caller = the service JWT's azp, which mTLS
    # ties to the client certificate's CN). Deny by default: a purpose without an entry is refused
    # (403 MW-AUTH-002). A caller of a new key purpose (KEK_<x>, TOKENISE_<x>, HMAC_<x>) adds it here.
    authz:
      pin-clients: mw-auth
      purposes:
        JWT_SIGN: mw-auth
        ASSERTION_SIGN: mw-auth
        AUDIT_ANCHOR_SIGN: mw-audit-dw
        TOKENISE_MSISDN: mw-auth,mw-audit-dw
        TOKENISE_NID: mw-auth,mw-audit-dw
        TOKENISE_ACCOUNT: mw-audit-dw
        KEK_COLUMN: mw-auth
        # /pinblock/translate and /pvv/** (ticket 64) check every key's purpose (TPK, ZPK, TPK_AES,
        # ZPK_AES, PVK): no caller yet; the ATM and interop adapters add theirs here. Dev only (ticket
        # 76): the test-only client of the test API below is bound to TPK and PVK through
        # MW_CRYPTO_AUTHZ_PURPOSES_TPK / _PVK=mw-e2e-crypto (deploy/dev.env.defaults); empty elsewhere.
        TPK: ${MW_CRYPTO_AUTHZ_PURPOSES_TPK:}
        PVK: ${MW_CRYPTO_AUTHZ_PURPOSES_PVK:}
        # No caller yet (ticket 65 building blocks): XMLDSIG (/xmldsig/**, also verify with a partner
        # PEM), HTTP_SIGN_RSA and HTTP_SIGN_EC (/http-signature/**, a partner PEM by its key type) and
        # every HMAC_<use> stay denied until the ATM, interop and merchant SOAP adapter tickets add theirs.
  # This service's certificate from OpenBao PKI (spec 18.2, 18.4, D24; config/TlsProperties,
  # config/ServiceCertificateManager): issued at start through Spring Cloud Vault (AppRole policy:
  # pki_int/issue/mw-crypto only), renewed at two thirds of its life, never written to disk.
  tls:
    enabled: ${MW_TLS_ENABLED:true}
    pki-mount: pki_int
    role: ${spring.application.name}
    common-name: ${spring.application.name}
    # the compose DNS name; the HSM ITs add localhost
    alt-names: ${MW_TLS_ALT_NAMES:${spring.application.name}}
    ttl: 72h
    retry-period: 1m
    bundle: mw-service
  # Who may call /internal/v1/** (spec 18.2; config/InternalAuthProperties). Callers: mw-admin-api
  # (key screens and ceremony, ticket 75), mw-auth (PIN, tokens, assertions, ticket 67), mw-audit-dw
  # (audit anchor, ticket 74); each has its own Keycloak realm services client.
  internal-auth:
    jwk-set-uri: ${MW_INTERNAL_JWK_SET_URI:http://keycloak:8080/realms/services/protocol/openid-connect/certs}
    issuer: ${MW_INTERNAL_ISSUER:http://keycloak:8080/realms/services}
    audience: mw-crypto
    allowed-clients: mw-admin-api,mw-auth,mw-audit-dw
    # Generate (only with bootstrap-keys, until the ceremony of ticket 75) and rotate keys.
    key-admin-clients: mw-admin-api
