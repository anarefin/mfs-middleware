# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from OpenBao/Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-ussd
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from OpenBao's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:ussd_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: ussd
  flyway:
    schemas: ussd
  # Valkey (Lettuce) holds the USSD sessions ussd:{mno}:{sessionId} (spec 9.2). The password comes
  # from OpenBao (secret/mw-ussd, spring.data.redis.password), never written here.
  data:
    redis:
      host: ${VALKEY_HOST:valkey}
      port: ${VALKEY_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false

# Kafka through Camel (spec 6.1, 19.2). Single KRaft node; topics come from deploy/kafka/.
camel:
  main:
    name: ${spring.application.name}
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # Producer: exactly one copy per send, every in-sync replica acknowledges (6.1).
      request-required-acks: all
      enable-idempotence: true
      max-in-flight-request: 5
      # A USSD step waits for the publish inside the 8 s budget: when Kafka is down it fails
      # fast ("service unavailable") instead of blocking for the client defaults.
      max-block-ms: 3000
      request-timeout-ms: 3000
      delivery-timeout-ms: 5000
      # Consumers: one group per service; a failure that cannot even be parked on a retry
      # topic stops the partition instead of committing past the record.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      break-on-first-error: true
      # Offsets are committed per record, only after it is handled or parked on its retry
      # topic (RetryTopicRouteBuilder); never on poll or close. Routes that consume Kafka must
      # commit through the CamelKafkaManualCommit header.
      auto-commit-enable: false
      allow-manual-commit: true

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # mw-adapter-billpay internal API (client/BillPayClient). Only unavailability counts; the
      # adapter's error envelope is a normal answer.
      billpay:
        base-config: default
        minimum-number-of-calls: 20
        slow-call-duration-threshold: 4s
        record-exceptions: mfs.mw.ussd.exception.BillPayUnavailableException
        ignore-exceptions: mfs.mw.ussd.exception.BillPayRefusedException
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.ussd.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Valkey is checked per step (fail fast, "service unavailable"), not by readiness.
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  kafka:
    retry:
      # Non-blocking retry topics <topic>.retry.1..3, then <topic>.dlq (19.2).
      delays: 10s,1m,10m
  outbox:
    relay:
      # Transactional outbox relay (6.4): claims up to batch-size unsent rows, sends them all
      # without waiting, then stamps sent_at on the acknowledged ones in one statement. Polls
      # again at once while batches come back full; waits one period once the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  ussd:
    # Final status awaited this long before the menu ends with "being processed" (spec 9.2).
    sync-budget: ${MW_USSD_SYNC_BUDGET:8s}
    # Session TTL in Valkey = MNO session timeout + this grace (spec 9.2).
    session-grace: 30s
    default-language: bn
    max-invalid-attempts: 3
    # mw-reply-to value and reply consumer group suffix; the container hostname in Compose.
    instance-id: ${HOSTNAME:}
    request-topic: mw.txn.request.v1
    status-topic: mw.txn.status.v1
    # Dev seed: stored in ussd.menu and activated for MNOs without a menu or still on an older
    # version of the seed (service/MenuSeeder).
    seed-menu: menus/main-v2.json
    # mw-adapter-billpay internal API (DYNAMIC billers, bill lookup; read-only), over the app zone
    # network. Short read timeout: the MNO holds the USSD step open while the bill is fetched.
    billpay:
      base-url: ${MW_BILLPAY_BASE_URL:http://mw-adapter-billpay:8080}
      connect-timeout: 2s
      read-timeout: 5s
      catalogue-ttl: 60s
    # Static lists of DYNAMIC nodes (service/DynamicLists); the value is what the node stores.
    lists:
      # TOPUP of another number: the operator is the partnerId of mw-adapter-telco.
      operators:
        - { value: gp, label: { bn: গ্রামীণফোন, en: Grameenphone } }
        - { value: robi, label: { bn: রবি, en: Robi } }
        - { value: banglalink, label: { bn: বাংলালিংক, en: Banglalink } }
        - { value: teletalk, label: { bn: টেলিটক, en: Teletalk } }
    pin:
      # The core's PIN key (M11). key-id and public-key come from OpenBao (secret/mw-ussd,
      # mw.ussd.pin.key-id / mw.ussd.pin.public-key), copied there from the core's export.
      key-id: ${MW_USSD_PIN_KEY_ID:core-pin-dev-1}
      public-key: ${MW_USSD_PIN_PUBLIC_KEY:}
    # Per MNO (spec 9.2): transport, short codes, screen limits (GSM-7 / UCS-2), session timeout
    # (MNO limit, TBC), overflow TRUNCATE|PAGE and the HTTP continue/end flag values. GP runs
    # over SMPP (WP19, binds in mw.ussd.smpp below); the others are HTTP until their contracts say otherwise.
    mno:
      gp:
        transport: SMPP
        short-codes: ["*268#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 180s
        overflow: PAGE
        continue-flag: CON
        end-flag: END
      robi:
        transport: HTTP
        short-codes: ["*268#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 120s
        overflow: PAGE
        continue-flag: CON
        end-flag: END
      banglalink:
        transport: HTTP
        short-codes: ["*268#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 120s
        overflow: PAGE
        continue-flag: CON
        end-flag: END
      teletalk:
        transport: HTTP
        short-codes: ["*268#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 120s
        overflow: TRUNCATE
        continue-flag: CON
        end-flag: END
    # SMPP USSD transport (spec 9.2, 9.2.1, WP19, client/UssdSmppClient): one bind group for every
    # MNO above with transport SMPP; the others are config-ready (switch the MNO's transport to
    # SMPP to bind). Window, TPS and bind count are MNO contract values (TBC). Passwords from
    # OpenBao (secret/mw-ussd, mw.ussd.smpp.mno.<mno>.password); the simulator accepts any bind.
    smpp:
      enabled: ${MW_USSD_SMPP_ENABLED:true}
      mno:
        gp:
          host: ${MW_USSD_SMPP_GP_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_GP_PORT:2776}
          system-id: upay-ussd
          binds: 2
          enquire-link: 30s
          enquire-link-misses: 3
          transaction-timeout: 5s
          reconnect-min: 1s
          reconnect-max: 60s
          window: 10
          tps: 50
          retry-delays: [500ms, 1s, 2s]
        robi:
          host: ${MW_USSD_SMPP_ROBI_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_ROBI_PORT:2776}
          system-id: upay-ussd
        banglalink:
          host: ${MW_USSD_SMPP_BANGLALINK_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_BANGLALINK_PORT:2776}
          system-id: upay-ussd
        teletalk:
          host: ${MW_USSD_SMPP_TELETALK_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_TELETALK_PORT:2776}
          system-id: upay-ussd
