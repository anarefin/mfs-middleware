# Static configuration baked into the image (spec 20.4). Per-environment overrides are
# mounted read-only (SPRING_CONFIG_ADDITIONAL_LOCATION); secrets come from Vault
# only (18.4) and are never written here.
spring:
  application:
    name: mw-ussd
  threads:
    virtual:
      enabled: true
  config:
    # Spring Cloud Vault reads secrets at start-up (AppRole) when VAULT_ENABLED=true.
    # The configtree carries the AppRole role-id/secret-id files of a stack (one file per property).
    import: "optional:configtree:${MW_APPROLE_DIR:/run/mw/approle/},optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://vault:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}
  mvc:
    problemdetails:
      enabled: false
  # This service's own schema (16.2), migrated by Flyway on start-up from
  # db/migration/V<n>__*.sql (16.4). Credentials are dynamic from Vault's database engine
  # (role <service>_rw) or DB_USERNAME/DB_PASSWORD; never written here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mw}
    username: ${DB_USERNAME:ussd_rw}
    password: ${DB_PASSWORD:}
    hikari:
      schema: ussd
      # Explicit, small pool (Kafka-driven or light on the database). PostgreSQL
      # max_connections sizing: deploy/docker-compose.yml (postgres).
      maximum-pool-size: 5
  flyway:
    schemas: ussd
  # Redis (Lettuce) holds the USSD sessions ussd:{mno}:{sessionId} (spec 9.2). The password comes
  # from Vault (secret/mw-ussd, spring.data.redis.password), never written here.
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false
  # Kafka through Spring Kafka (spec 6.1, 19.2, ADR D27); retry topics, templates and interceptors
  # in config/KafkaConfig, the per-instance reply consumer in config/StatusReplyConsumerConfig.
  # Single KRaft node; topics come from deploy/kafka/ and are never auto-created by the service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      # Exactly one copy per send, every in-sync replica acknowledges, order kept per key (6.1).
      acks: all
      # Strings, and the raw bytes of a record that could not be deserialized when it is parked
      # on the DLQ.
      key-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # A USSD step waits for the publish inside the 8 s budget: when Kafka is down it fails
        # fast ("service unavailable") instead of blocking for the client defaults.
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      # One group per service: listeners use groupId = "${spring.kafka.consumer.group-id}", and
      # the group is the middle part of the service's retry and DLQ topic names. The reply
      # consumer has its own group per instance (<group>.reply.<instanceId>).
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      # Offsets are committed per record, only after it is handled (the listener acknowledges)
      # or parked on its next retry topic or the DLQ (the error handler); never on poll or close.
      enable-auto-commit: false
      # A record that is not UTF-8 text fails here, goes straight to the DLQ and never blocks
      # its partition (messaging/Utf8Deserializer wrapped by ErrorHandlingDeserializer).
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: mfs.mw.ussd.messaging.Utf8Deserializer
        spring.deserializer.value.delegate.class: mfs.mw.ussd.messaging.Utf8Deserializer
    listener:
      # Per-record commit, from the listener (Acknowledgment.acknowledge()) or the error handler.
      ack-mode: manual_immediate
      # Consumer threads per listener container; at most the topic's partition count.
      concurrency: ${MW_KAFKA_LISTENER_CONCURRENCY:1}
      # Micrometer observation: each record continues its traceparent (traceId/spanId in the MDC).
      observation-enabled: true
    admin:
      # Topics belong to the platform (deploy/kafka/); the service never creates any.
      auto-create: false
      # The observed KafkaTemplate asks the admin client for the cluster id on its first send; with
      # Kafka down that must fail as fast as the producer does, not after the client defaults (60 s).
      operation-timeout: 3s
      properties:
        default.api.timeout.ms: 3000
        request.timeout.ms: 3000

# Resilience defaults for client/ calls (19.2). A partner overrides them under
# resilience4j.<kind>.instances.<partner> (base-config: default). Retry is only for idempotent
# calls (status inquiry, fetch-bill, GET): never annotate a payment call with @Retry.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        # 80% of the default partner timeout (30 s, 11.1); partners override both.
        slow-call-duration-threshold: 24s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # mw-adapter-billpay internal API (client/BillPayClient). Only unavailability counts; the
      # adapter's error envelope is a normal answer.
      billpay:
        base-config: default
        minimum-number-of-calls: 20
        slow-call-duration-threshold: 4s
        record-exceptions: mfs.mw.ussd.exception.BillPayUnavailableException
        ignore-exceptions: mfs.mw.ussd.exception.BillPayRefusedException
      # mw-auth (client/AuthClient, ticket 72): a refusal (4xx envelope) is an answer, not a failure.
      # Core account read (client/CoreAccountClient). A 404 is an answer; transport failures count.
      core:
        base-config: default
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        record-exceptions: mfs.mw.ussd.exception.CoreUnavailableException
      mw-auth:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

logging:
  structured:
    format:
      # JSON lines with the spec 21.1 fields; masking runs in the formatter (18.3).
      console: mfs.mw.ussd.logging.JsonLogFormatter

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Redis is checked per step (fail fast, "service unavailable"), not by readiness.
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

mw:
  # This service's client certificate (mTLS phase 1, spec 18.2, D24; config/ServiceCertificateManager,
  # ticket 72): on (compose MW_TLS_ENABLED=true), it calls mw-auth's internal API with mTLS. Issued at
  # start from pki_int/issue/mw-ussd through Spring Cloud Vault (AppRole policy: that role only;
  # PKI_SERVICES in deploy/provision/services.sh), renewed at two thirds of the life, never written to
  # disk. The USSD HTTP API itself stays plain HTTP behind APISIX.
  tls:
    enabled: ${MW_TLS_ENABLED:false}
    pki-mount: pki_int
    role: ${spring.application.name}
    common-name: ${spring.application.name}
    alt-names: ${MW_TLS_ALT_NAMES:${spring.application.name}}
    ttl: 72h
    retry-period: 1m
    bundle: mw-service
  kafka:
    # How long EventPublisher.publish waits for Kafka's acknowledgement (just above the producer's
    # delivery.timeout.ms, so the producer decides first).
    send-timeout: 6s
    listener:
      # How long a stopping listener container waits for its consumer thread.
      shutdown-timeout: 10s
    retry:
      # Non-blocking retry topics <topic>.<group>.retry.1..3, then <topic>.<group>.dlq (19.2).
      delays: 10s,1m,10m
      # Consumed topics without retry topics (none: the reply consumer is not a @KafkaListener).
      exclude-topics: []
  outbox:
    relay:
      # Transactional outbox relay (6.4, scheduler/OutboxRelayScheduler): claims up to batch-size
      # unsent rows, sends them all without waiting, then stamps sent_at on the acknowledged ones
      # in one statement. Polls again at once while batches come back full; waits one period once
      # the outbox is drained.
      enabled: true
      period: 500ms
      batch-size: 500
  retention:
    # Purge (service/RetentionService via scheduler/OutboxInboxPurgeJob): sent outbox rows and
    # inbox rows older than these; unsent outbox rows never. ShedLock-guarded, one instance at a
    # time, batch-size rows per statement, on a Spring cron ("-" switches it off).
    outbox: 7d
    inbox: 7d
    batch-size: 1000
    cron: "0 0 * * * *"
  service:
    name: ${spring.application.name}
    version: ${MW_VERSION:0.1.0-SNAPSHOT}
    env: ${MW_ENV:local}
  ussd:
    # Final status awaited this long before the menu ends with "being processed" (spec 9.2).
    sync-budget: ${MW_USSD_SYNC_BUDGET:8s}
    # Session TTL in Redis = MNO session timeout + this grace (spec 9.2).
    session-grace: 30s
    default-language: bn
    max-invalid-attempts: 3
    # mw-reply-to value and reply consumer group suffix; the container hostname in Compose.
    instance-id: ${HOSTNAME:}
    request-topic: mw.txn.request.v1
    status-topic: mw.txn.status.v1
    # Dev seed: stored in ussd.menu and activated for MNOs without a menu or still on an older
    # version of the seed (service/MenuSeeder).
    seed-menu: menus/main-v4.json
    # Dev/test only: POST /test/v1/language/reset forgets a remembered language (the suite starts each
    # walk from Bangla). Off unless MW_USSD_TEST_API_ENABLED=true.
    test-api:
      enabled: ${MW_USSD_TEST_API_ENABLED:false}
    # mw-adapter-billpay internal API (DYNAMIC billers, bill lookup; read-only), over the app zone
    # network. Short read timeout: the MNO holds the USSD step open while the bill is fetched.
    billpay:
      base-url: ${MW_BILLPAY_BASE_URL:http://mw-adapter-billpay:8080}
      connect-timeout: 2s
      read-timeout: 5s
      catalogue-ttl: 60s
    # Static lists of DYNAMIC nodes (service/DynamicLists); the value is what the node stores.
    lists:
      # TOPUP of another number: the operator is the partnerId of mw-adapter-telco.
      operators:
        - { value: gp, label: { bn: গ্রামীণফোন, en: Grameenphone } }
        - { value: robi, label: { bn: রবি, en: Robi } }
        - { value: banglalink, label: { bn: বাংলালিংক, en: Banglalink } }
        - { value: teletalk, label: { bn: টেলিটক, en: Teletalk } }
    # Labels of the DYNAMIC source biller-categories (service/DynamicLists), by the category code of
    # mw-adapter-billpay's catalogue; the order on the handset is fixed in DynamicLists.CATEGORY_ORDER.
    biller-categories:
      ELECTRICITY: { bn: বিদ্যুৎ, en: Electricity }
      WATER: { bn: পানি, en: Water }
      GAS: { bn: গ্যাস, en: Gas }
      TELECOM: { bn: টেলিফোন, en: Telecom }
      INTERNET: { bn: ইন্টারনেট, en: Internet }
    # mw-auth (ticket 72; client/AuthClient, config/AuthClientProperties; spec 18.7, D22, D24): the
    # transaction authorisation on the internal port over mTLS (mw.tls) with a Keycloak realm services
    # client-credentials JWT of client mw-ussd (audience mw-auth), also for the PIN transport key
    # (GET /internal/v1/pin-key, a PIN_TRANSPORT key only; security review of ticket 72;
    # service/PinTransport, asked again after pin-key-ttl or a refused PIN block).
    auth:
      base-url: ${MW_AUTH_URL:https://mw-auth:8443}
      token-uri: ${MW_INTERNAL_TOKEN_URI:http://keycloak:8080/realms/services/protocol/openid-connect/token}
      client-id: mw-ussd
      # client-secret: from Vault secret/mw-ussd (key mw.ussd.auth.client-secret), never here
      client-secret: ""
      timeout: 2s
      connect-timeout: 1s
      pin-key-ttl: 10m
    # Core account read (CH-USSD-08): GET /core/v1/accounts/{msisdn} with this service's JWT
    # (audience mw-core-mock). mode=stub is the test double and does not call the core.
    core:
      mode: http
      base-url: http://mw-core-mock:8080
      connect-timeout: 1s
      read-timeout: 2s
    # Per MNO (spec 9.2): transport, short codes (each MNO its own; a BEGIN with another code ends
    # at once with the wrong-code screen), screen limits (GSM-7 / UCS-2), session timeout
    # (MNO limit, TBC), overflow TRUNCATE|PAGE and the HTTP continue/end flag values. GP runs
    # over SMPP (WP19, binds in mw.ussd.smpp below); robi, bl and teletalk stay HTTP in dev so the
    # existing dials keep working, and bind over SMPP when their transport is switched (CH-USSD-01).
    # tlv-profile selects the MNO's TLV adapter (same 3GPP tags; session-info packing differs).
    mno:
      gp:
        transport: SMPP
        short-codes: ["*268#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 180s
        screen-timeout: 30s
        overflow: PAGE
        continue-flag: CON
        end-flag: END
        tlv-profile: gp
      robi:
        transport: HTTP
        short-codes: ["*269#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 120s
        screen-timeout: 30s
        overflow: PAGE
        continue-flag: CON
        end-flag: END
        tlv-profile: robi
      bl:
        transport: HTTP
        short-codes: ["*270#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 120s
        screen-timeout: 30s
        overflow: PAGE
        continue-flag: CON
        end-flag: END
        # spec 9.2 names the MNO bl; mw-adapter-telco's top-up partnerId is banglalink
        operator: banglalink
        tlv-profile: bl
      teletalk:
        transport: HTTP
        short-codes: ["*271#"]
        max-length-gsm: 182
        max-length-ucs2: 70
        session-timeout: 120s
        screen-timeout: 30s
        overflow: TRUNCATE
        continue-flag: CON
        end-flag: END
        tlv-profile: teletalk
    # SMPP USSD transport (spec 9.2, 9.2.1, WP19, client/UssdSmppClient): one bind group for every
    # MNO above with transport SMPP; the others are config-ready (switch the MNO's transport to
    # SMPP to bind). Window, TPS and bind count are MNO contract values (TBC). Passwords from
    # Vault (secret/mw-ussd, mw.ussd.smpp.mno.<mno>.password); the simulator accepts any bind.
    smpp:
      enabled: ${MW_USSD_SMPP_ENABLED:true}
      mno:
        gp:
          host: ${MW_USSD_SMPP_GP_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_GP_PORT:2776}
          system-id: bits-ussd
          binds: 2
          enquire-link: 30s
          enquire-link-misses: 3
          transaction-timeout: 5s
          reconnect-min: 1s
          reconnect-max: 60s
          window: 10
          tps: 50
          retry-delays: [500ms, 1s, 2s]
          bind-mode: TRANSCEIVER
        robi:
          host: ${MW_USSD_SMPP_ROBI_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_ROBI_PORT:2777}
          system-id: bits-ussd
          bind-mode: TRANSMITTER_RECEIVER
        bl:
          host: ${MW_USSD_SMPP_BL_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_BL_PORT:2778}
          system-id: bits-ussd
          bind-mode: TRANSCEIVER
        teletalk:
          host: ${MW_USSD_SMPP_TELETALK_HOST:mw-simulators}
          port: ${MW_USSD_SMPP_TELETALK_PORT:2779}
          system-id: bits-ussd
          bind-mode: TRANSMITTER_RECEIVER

# Generated API document and Swagger UI (ticket 101, PLT-050..052): off by default, so a production
# build exposes neither /v3/api-docs nor /swagger-ui; on in the dev and test profiles below (the dev
# stack sets SPRING_PROFILES_ACTIVE=dev). contracts/ stays the source of truth (contracts/README.md);
# contracts/ContractDriftTest proves the code still matches it.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
  # Only what the handler methods declare; the global error advice is documented by the contract.
  override-with-generic-response: false
---
spring:
  config:
    activate:
      on-profile: "dev | test"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # Relative, so the UI works on the service port and behind the dev-only APISIX /docs/<service>/
    # prefix alike (deploy/apisix/routes-test/test-docs-*.json) without forwarded-prefix headers.
    config-url: ../v3/api-docs/swagger-config
    url: ../v3/api-docs
