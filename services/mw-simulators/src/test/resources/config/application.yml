# Test-only overrides, merged over src/main/resources/application.yml.
spring:
  profiles:
    # The mock-control engine and its API (ADR D33, ticket 102) exist only in this profile; the stack
    # sets it through SPRING_PROFILES_ACTIVE (deploy/docker-compose.yml).
    active: mock-control
mw:
  kafka:
    listener:
      # A closing test context does not wait the default 10 s per listener container for a consumer
      # caught mid-rebalance (cached contexts share the broker); nothing in a test depends on that drain.
      shutdown-timeout: 100ms
  outbox:
    relay:
      # Off by default in tests: Spring caches test contexts, and a relay left running in one
      # would publish rows another test is checking. Tests that need it switch it on and close
      # their context afterwards (@DirtiesContext).
      enabled: false
      # Tests that switch it on want each hop at once, not after a 500 ms idle wait.
      period: 50ms
  retention:
    # The purge job's schedule is off in tests; OutboxInboxPurgeConformanceIT calls it directly.
    cron: "-"
sim:
  billagg:
    # The billagg SOAP front end's WS-Security password (stack: OpenBao secret/mw-simulators, never in the
    # main config); an obviously fake test value.
    ws-password: fake-billagg-ws-password-for-tests
  smsc:
    # The SMPP listener is off in tests (cached contexts would fight over the port);
    # SmscSimulatorIT switches it on with a free port.
    enabled: false
  ussd-gateway:
    smpp:
      # Off in tests (port clashes between cached contexts); UssdSmppGatewayIT switches it on.
      enabled: false
  payshield:
    # Off in tests (port clashes between cached contexts); PayShieldServerTest starts its own and
    # PayShieldSimulatorIT runs the image against the SoftHSM paysim token. No PKCS#11 on the host.
    enabled: false
    lmk-store: memory
