# SoftHSMv2 of the dev/test softhsm container (ticket 61). The token directory is the named volume
# softhsm-tokens (deploy/docker-compose.yml), mounted only into this container.
directories.tokendir = /var/lib/softhsm/tokens/
objectstore.backend = file
log.level = ERROR
slots.removable = false
slots.mechanisms = ALL
library.reset_on_fork = false
