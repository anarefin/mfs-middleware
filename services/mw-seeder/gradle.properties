# The only reference outside this module (spec 4.3 rule 2): the root contracts/ folder,
# read by tests and build-time schema checks only, never packaged into the image.
mwContractsDir=../../contracts
org.gradle.caching=true
# Re-runs skip configuration; unchanged modules come from the build cache (no containers start).
org.gradle.configuration-cache=true
# Tasks of this build run side by side (ticket 54); conformance still waits for integrationTest.
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g -XX:+UseParallelGC
