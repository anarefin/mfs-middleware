      - { client-id: ussd-teletalk, type: MNO, auth-method: BASIC, allowed-routes: [ussd-http-teletalk], ip-allow-list: [], rate-per-sec: 100 }
      - { client-id: billagg, type: PARTNER, auth-method: HMAC, allowed-routes: [partner-billagg-callback], ip-allow-list: [] }
      - { client-id: c2wbank, type: PARTNER, auth-method: HMAC, allowed-routes: [partner-c2wbank-callback], ip-allow-list: [] }
      - { client-id: partner-sim, type: PARTNER, auth-method: OAUTH2_CC, allowed-routes: [test-oauth2-cc], ip-allow-list: [], rate-per-sec: 20, daily-quota: 5000 }
      - { client-id: merchant-demo, type: MERCHANT, auth-method: HMAC, allowed-routes: [checkout-v1-sessions, checkout-v1-session-get, checkout-v1-payments-get, checkout-v1-refunds, checkout-v1-refunds-get], ip-allow-list: [] }
      - { client-id: merchant-pharmacy, type: MERCHANT, auth-method: HMAC, allowed-routes: [checkout-v1-sessions, checkout-v1-session-get, checkout-v1-payments-get, checkout-v1-refunds, checkout-v1-refunds-get], ip-allow-list: [] }
      - { client-id: merchant-fashion, type: MERCHANT, auth-method: HMAC, allowed-routes: [checkout-v1-sessions, checkout-v1-session-get, checkout-v1-payments-get, checkout-v1-refunds, checkout-v1-refunds-get], ip-allow-list: [] }
      - { client-id: org-portal, type: PORTAL, auth-method: JWT, allowed-routes: [portal-org-v1, auth-portals-token], ip-allow-list: [] }
    # First admin versions: copies of what mw-ussd (menus/main-v4.json) and mw-notify (V5) ship,
    # so publishing them changes no text. Keep the copies identical.
    content:
      menus:
        - { menu-id: main, resource: "classpath:seed-content/menus/main.json", mnos: [gp, robi, bl, teletalk] }
      templates:
        - code: TXN_P2P_RECEIVED
          channel: SMS
          locale: en
          body: "You have received Tk {{amount}} from {{counterparty}}. TrxID {{txnId}}"
          sender-id: Bits
        - code: TXN_P2P_RECEIVED
          channel: SMS
          locale: bn
          body: "আপনি {{counterparty}} নম্বর থেকে ৳{{amount}} পেয়েছেন। TrxID {{txnId}}"
          sender-id: Bits
    # The dev app PIN (ticket 69, step seed-app-pins): the app wallets above (CUSTOMER, AGENT, MERCHANT)
    # plus the suites' app users customer01/02, agent01, merchant01/02 (core-mock's own seed wallets)
