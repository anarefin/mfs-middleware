    # Partner baselines in mw-admin-api (the e2e suite's restore values: enabled, 20 s).
    partners:
      - { partner-id: ocs, enabled: true, timeout-ms: 20000 }
    # Today's edge clients as rows of mw-admin-api's channel client registry (ticket 100a), so the
    # registry matches what the edge does. Only BASIC clients (the MNO gateways) become APISIX consumers
    # (ussd_<mno>, password $secret://vault/edge/ussd-<mno>/password, Vault KV v1 apisix/ synced by
    # provision from USSD_<MNO>_GATEWAY_SECRET); their route keeps its own allow-list and per-MSISDN
    # limit-count, so they get a rate limit only (a dailyQuota would replace the route's limit-count
    # for the consumer). JWT and HMAC clients are registry rows only (100 split decision). OAUTH2_CC
    # (ticket 100b) has no consumer and no secret in this row: partner-sim is the Keycloak partners
    # client (private_key_jwt, certificate from provision) and its route test-oauth2-cc gets the bearer
    # check and a limit keyed by the token client id.
    channel-clients:
      - { client-id: customer-app, type: APP, auth-method: JWT, allowed-routes: [app-v1, auth-v1, auth-v1-keys, auth-v1-pin-resets], ip-allow-list: [] }
      - { client-id: agent-app, type: APP, auth-method: JWT, allowed-routes: [app-v1, auth-v1, auth-v1-keys, auth-v1-pin-resets], ip-allow-list: [] }
