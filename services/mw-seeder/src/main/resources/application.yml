      - { wallet-id: "01714190001", type: CUSTOMER, opening-balance-minor: 1000000000, holder-name: "Mehedi Hasan" }
      - { wallet-id: "01714200001", type: CUSTOMER, opening-balance-minor: 1000000000, holder-name: "Shapla Roy" }
      - { wallet-id: "01714210001", type: CUSTOMER, opening-balance-minor: 1000000000, holder-name: "Ashraful Islam" }
