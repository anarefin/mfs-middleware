# Sides of an event contract played by a system outside this repo (ticket 53).
# `make contracts-lint` requires every event schema to have at least one producer and one consumer
# among the services' contracts.yml manifests; a side listed here is exempt. Remove an entry as
# soon as a module in the repo plays that side and lists it in its contracts.yml.
# `make contracts-lint` fails on an entry for a side a manifest in the repo already plays.
producers: {}
consumers:
  # Partner reconciliation lines from the adapters' SFTP batch routes (ticket 86); matched by the future
  # mw-recon service (ticket 88, user decision 2026-11-18), which replaces this entry with its contracts.yml.
  events/mw-adapter-billpay/mw.partner.recon.v1.schema.json: mw-recon (not yet in the repo, ticket 88)
  # The Data Warehouse is outside the repo (ticket 128). mw-data-export produces these.
  events/mw-data-export/dw.txn.created.v1.schema.json: Data Warehouse (outside the repo, ticket 128)
  events/mw-data-export/dw.txn.state-changed.v1.schema.json: Data Warehouse (outside the repo, ticket 128)
  events/mw-data-export/dw.txn.completed.v1.schema.json: Data Warehouse (outside the repo, ticket 128)
  events/mw-data-export/dw.notification.status.v1.schema.json: Data Warehouse (outside the repo, ticket 128)
  events/mw-data-export/dw.recon.exception.v1.schema.json: Data Warehouse (outside the repo, ticket 128)
  events/mw-data-export/dw.kyc.completed.v1.schema.json: Data Warehouse (outside the repo, ticket 128)
  events/mw-data-export/dw.audit.operator-action.v1.schema.json: Data Warehouse (outside the repo, ticket 128)
