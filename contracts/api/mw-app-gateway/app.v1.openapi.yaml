  /app/v1/transactions/{txnId}:
    get:
      operationId: getTransaction
      summary: Current status of one of the caller's transactions
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: txnId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest known status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
components:
  parameters:
    Group:
      name: group
      in: path
      required: true
      description: >-
        The transaction group: send-money (P2P), cash-in (CASH_IN), cash-out (CASH_OUT), payment
        (MERCHANT_PAY), bill-pay (BILL_PAY), top-up (TOPUP), add-money (ADD_MONEY_BANK),
        b2b (B2B_TRANSFER), disburse (BULK_DISBURSE)
      schema: { type: string, enum: [send-money, cash-in, cash-out, payment, bill-pay, top-up, add-money, b2b, disburse] }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The device bound to the token's wallet (POST /auth/v1/devices at mw-auth).
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Signing time, epoch milliseconds; within 5 min of the gateway's clock.
      schema: { type: string, pattern: "^[0-9]{1,15}$" }
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: Unique per signed request of this device; a reused nonce is 401 MW-AUTH-006.
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{16,128}$" }
    Signature:
      name: X-Signature
      in: header
      required: true
      description: Base64 ECDSA P-256 SHA-256 signature of the canonical request text (see info).
      schema: { type: string, maxLength: 256 }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    PinKey:
      type: object
      required: [keyId, algorithm, publicKeyPem]
      properties:
        keyId: { type: string, minLength: 1, maxLength: 128, description: "The kid to send as encryptedPin.keyId (`<keyId>.v<n>`)" }
        algorithm: { type: string, enum: [RSA-OAEP-SHA-256], description: "RSA-OAEP, SHA-256 hash and MGF1" }
        publicKeyPem: { type: string, description: PEM SubjectPublicKeyInfo }
    Msisdn:
      type: string
      description: Accepted forms 01XNNNNNNNN, 8801XNNNNNNNN, +8801XNNNNNNNN; forwarded as 01XNNNNNNNN.
      pattern: "^(01[3-9][0-9]{8}|\\+?8801[3-9][0-9]{8})$"
    BillerCode:
      type: string
      description: A biller of the catalogue (GET /app/v1/billers), e.g. DESCO.
      pattern: "^[A-Z0-9_]{1,32}$"
    AccountNumber:
      type: string
      description: A bank account number, digits only.
      pattern: "^[0-9]{6,20}$"
    BillNumber:
      type: string
      description: Bill or customer number at the biller.
      pattern: "^[0-9A-Za-z-]{1,32}$"
    Biller:
      type: object
      required: [code, name]
      properties:
        code: { $ref: "#/components/schemas/BillerCode" }
        name: { type: string }
        category: { type: string, description: e.g. ELECTRICITY, WATER, GAS }
    BillerList:
      type: object
      required: [billers]
      properties:
        billers:
          type: array
          items: { $ref: "#/components/schemas/Biller" }
    FetchBillRequest:
      type: object
      required: [billNumber]
      properties:
        billNumber: { $ref: "#/components/schemas/BillNumber" }
    Bill:
      type: object
      required: [billerCode, billNumber, amount]
      properties:
        billerCode: { $ref: "#/components/schemas/BillerCode" }
        billNumber: { $ref: "#/components/schemas/BillNumber" }
        amount: { $ref: "#/components/schemas/Money" }
        dueDate: { type: string, format: date }
        billPeriod: { type: string, description: YYYY-MM }
    Amount:
      type: object
      required: [valueMinor, currency]
      additionalProperties: false
      properties:
        valueMinor: { type: integer, minimum: 1, description: Poisha; must be greater than zero }
        currency: { type: string, const: BDT }
    Money:
      type: object
      properties:
        valueMinor: { type: integer, minimum: 0 }
        currency: { type: string, const: BDT }
    Party:
      type: object
      properties:
        type: { type: string }
        id: { type: string }
        walletType: { type: string }
    TransactionRequest:
      type: object
      required: [txnType, amount, encryptedPin]
      properties:
        txnType:
          type: string
          enum: [P2P, CASH_IN, CASH_OUT, MERCHANT_PAY, TOPUP, BILL_PAY, ADD_MONEY_BANK, B2B_TRANSFER, BULK_DISBURSE]
          description: >-
            P2P, CASH_IN, CASH_OUT and MERCHANT_PAY pay the wallet of `creditParty.id`. TOPUP recharges the
            mobile number `creditParty.id` with operator and product `partner` (required for
            TOPUP, refused otherwise, 400 MW-VAL-001); a refusal by the operator is 502
            MW-PTR-<OPERATOR>-<reason> after the held funds were released. BILL_PAY pays bill
            number `creditParty.id` at biller `partner.billerCode` (from GET /app/v1/billers; an
            unknown biller is 400 MW-VAL-001); the middleware picks the aggregator, and a refusal
            by it is 502 MW-PTR-<AGGREGATOR>-<reason> after the held funds were released.
            ADD_MONEY_BANK (C2W) adds money to the caller's own wallet from the linked bank account
            `debitParty` at bank `partner.partnerId` (required; `creditParty` is refused, 400
            MW-VAL-001); nothing is held, the bank confirms the debit (usually by callback) and
            the wallet is credited; a refusal by the bank is 502 MW-PTR-<BANK>-<reason> with
            nothing moved, an outcome not known in time is 202 PROCESSING (status inquiry).
        creditParty:
          type: object
          description: >-
            The payee: a customer wallet for P2P and CASH_IN, an agent wallet for CASH_OUT, a
            merchant wallet for MERCHANT_PAY, an agent wallet for a distributor or DSO float
            (B2B_TRANSFER), a distributor wallet when an agent returns float, a customer wallet for
            a partner disbursement (BULK_DISBURSE),
            the mobile number for TOPUP, the bill number for BILL_PAY. Required for every type
            except ADD_MONEY_BANK, which refuses it (400 MW-VAL-001).
          required: [id]
          properties:
            type:
              type: string
              enum: [WALLET, MSISDN, BILLER_ACCOUNT]
              description: >-
                WALLET for P2P, CASH_IN, CASH_OUT and MERCHANT_PAY, MSISDN for TOPUP (both optional);
                BILLER_ACCOUNT, required, for BILL_PAY. Another value is 400 MW-VAL-001.
            id:
              anyOf:
                - { $ref: "#/components/schemas/Msisdn" }
                - { $ref: "#/components/schemas/BillNumber" }
              description: An MSISDN, except for BILL_PAY (a bill number).
        debitParty:
          type: object
          additionalProperties: false
          description: >-
            ADD_MONEY_BANK only (refused for every other type, 400 MW-VAL-001): the caller's
            linked bank account the money comes from. Shown masked (last 4 digits).
          required: [type, id]
          properties:
            type: { type: string, enum: [BANK_ACCOUNT] }
            id: { $ref: "#/components/schemas/AccountNumber" }
        partner:
          type: object
          additionalProperties: false
          description: >-
            TOPUP: productCode, and optionally the operator (partnerId). When partnerId is absent,
            routing chooses the operator from the MSISDN (ticket 98). When it is present it is
            honoured only if a routing rule allows it; an unknown partner is 502 MW-PTR-UNKNOWN.
            BILL_PAY: the biller only (billerCode). ADD_MONEY_BANK: the partner bank only
            (partnerId c2wbank). Refused for every other type.
          anyOf:
            - required: [productCode]
            - required: [billerCode]
            - required: [partnerId]
          properties:
            partnerId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
            productCode: { type: string, enum: [PREPAID, POSTPAID] }
            billerCode: { $ref: "#/components/schemas/BillerCode" }
        amount: { $ref: "#/components/schemas/Amount" }
        encryptedPin:
          type: object
          required: [keyId, ciphertext]
          description: >-
            PIN encrypted by the app under the PIN transport key of `keyId` (GET /app/v1/pin-key;
            RSA-OAEP, SHA-256 hash and MGF1), base64; passed to mw-auth untouched, never published.
          properties:
            keyId: { type: string, minLength: 1, maxLength: 128 }
            ciphertext: { type: string, minLength: 1, maxLength: 4096 }
        locale: { type: string, enum: [bn, en] }
        confirmDuplicate:
          type: boolean
          description: >-
            The user confirmed a suspected business duplicate (after 400 MW-VAL-024, ticket 99,
            FRS PLT-013): the request goes through although the same payment was sent moments ago.
        attributes:
          type: object
          description: Allow-listed keys only (`reference`); any other key is 400 MW-VAL-001.
          maxProperties: 20
          propertyNames: { enum: [reference] }
          additionalProperties: { type: string, maxLength: 256 }
    PreviewRequest:
      type: object
      required: [amount]
      additionalProperties: false
      description: The transaction of the group, as in TransactionRequest without txnType and PIN.
      properties:
        creditParty: { $ref: "#/components/schemas/TransactionRequest/properties/creditParty" }
        debitParty: { $ref: "#/components/schemas/TransactionRequest/properties/debitParty" }
        partner: { $ref: "#/components/schemas/TransactionRequest/properties/partner" }
        amount: { $ref: "#/components/schemas/Amount" }
        locale: { type: string, enum: [bn, en] }
        attributes: { $ref: "#/components/schemas/TransactionRequest/properties/attributes" }
    ConfirmRequest:
      type: object
      required: [previewId, amount, encryptedPin]
      additionalProperties: false
      description: The previewed transaction again, its previewId and the PIN.
      properties:
        previewId: { type: string, minLength: 1, maxLength: 128, description: From the preview answer }
        creditParty: { $ref: "#/components/schemas/TransactionRequest/properties/creditParty" }
        debitParty: { $ref: "#/components/schemas/TransactionRequest/properties/debitParty" }
        partner: { $ref: "#/components/schemas/TransactionRequest/properties/partner" }
        amount: { $ref: "#/components/schemas/Amount" }
        encryptedPin: { $ref: "#/components/schemas/TransactionRequest/properties/encryptedPin" }
        locale: { type: string, enum: [bn, en] }
        confirmDuplicate: { $ref: "#/components/schemas/TransactionRequest/properties/confirmDuplicate" }
        attributes: { $ref: "#/components/schemas/TransactionRequest/properties/attributes" }
    Preview:
      type: object
      required: [previewId, expiresAt, txnType, amount, fee, vat, commission, total, limits]
      properties:
        previewId: { type: string, description: Confirm with it within 5 minutes }
        expiresAt: { type: string, format: date-time }
        txnType: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money", description: "What the payer pays on top of the amount, VAT included" }
        vat: { $ref: "#/components/schemas/Money", description: The VAT inside the fee }
        commission: { $ref: "#/components/schemas/Money", description: The commission shares of the fee }
        total: { $ref: "#/components/schemas/Money", description: amount + fee (what the payer is debited) }
        counterparty:
          type: object
          description: The payee, masked (MSISDN `0171****789`, account last 4, name to the initial)
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
            walletType: { type: string }
        limits:
          type: object
          description: What is left of the payer's limits before this amount (a limit not set is left out)
          properties:
            remaining:
              type: object
              properties:
                perTxn: { $ref: "#/components/schemas/Money" }
                daily: { $ref: "#/components/schemas/Money" }
                monthly: { $ref: "#/components/schemas/Money" }
                dailyCount: { type: integer, minimum: 0 }
                monthlyCount: { type: integer, minimum: 0 }
        outstanding:
          $ref: "#/components/schemas/Money"
          description: Postpaid outstanding bill the quote fetched (ticket 112b). Absent for any other preview.
        minimum:
          $ref: "#/components/schemas/Money"
          description: Minimum due of that bill. A confirm pays any amount from this through outstanding.
    SaveBillerRequest:
      type: object
      required: [billerCode, accountNo]
      additionalProperties: false
      properties:
        billerCode: { type: string, minLength: 1, maxLength: 32, pattern: "^[A-Z0-9_]{1,32}$" }
        accountNo: { type: string, minLength: 1, maxLength: 32, pattern: "^[0-9A-Za-z-]{1,32}$" }
        nickname: { type: string, maxLength: 40 }
    WalletProfile:
      type: object
      required: [type, status, kycLevel, language]
      additionalProperties: false
      properties:
        name: { type: string, description: "The owner's own holder name" }
        type: { type: string, enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, ORGANISATION, SYSTEM] }
        status: { type: string, enum: [ACTIVE, LOCKED, DORMANT, CLOSED, BLOCKED, HOLD] }
        kycLevel: { type: string, enum: [BASIC, FULL] }
        language: { type: string, enum: [bn, en] }
    WalletLimits:
      type: object
      required: [allowed, remaining]
      additionalProperties: false
      properties:
        allowed: { type: boolean }
        reasonCode: { type: string }
        remaining:
          type: object
          additionalProperties: false
          properties:
            perTxn: { $ref: "#/components/schemas/Money" }
            daily: { $ref: "#/components/schemas/Money" }
            monthly: { $ref: "#/components/schemas/Money" }
            dailyCount: { type: integer, minimum: 0 }
            monthlyCount: { type: integer, minimum: 0 }
    LedgerStatement:
      type: object
      required: [from, to, page, hasMore, entries]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        page: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
    LedgerEntry:
      type: object
      required: [txnId, direction, kind, amount, at]
      additionalProperties: false
      properties:
        txnId: { type: string }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        kind: { type: string, enum: [TRANSFER, FEE, VAT, COMMISSION, REVERSAL, ADJUSTMENT] }
        amount: { $ref: "#/components/schemas/Money" }
        balanceAfter: { $ref: "#/components/schemas/Money" }
        at: { type: string, format: date-time }
    SavedBiller:
      type: object
      required: [id, billerCode, accountNo, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        billerCode: { type: string }
        accountNo: { type: string, description: "The owner's own account number, in the clear" }
        nickname: { type: string }
        createdAt: { type: string, format: date-time }
    SavedBillerList:
      type: object
      required: [billers]
      additionalProperties: false
      properties:
        billers:
          type: array
          items: { $ref: "#/components/schemas/SavedBiller" }
    SaveFavouriteRequest:
      type: object
      required: [msisdn]
      additionalProperties: false
      properties:
        msisdn: { type: string, minLength: 11, maxLength: 14 }
        label: { type: string, maxLength: 40 }
    Favourite:
      type: object
      required: [id, msisdn, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        msisdn: { type: string, description: "The owner's own counterparty, canonical 01…, in the clear" }
        label: { type: string }
        createdAt: { type: string, format: date-time }
    FavouriteList:
      type: object
      required: [favourites]
      additionalProperties: false
      properties:
        favourites:
          type: array
          items: { $ref: "#/components/schemas/Favourite" }
    LinkBankAccountRequest:
      type: object
      required: [bankCode, accountNumber]
      additionalProperties: false
      properties:
        bankCode: { type: string, minLength: 1, maxLength: 41, description: "Bank profile code, e.g. dbbl" }
        accountNumber: { type: string, minLength: 6, maxLength: 20, description: "Digits only; never returned" }
    LinkedBankAccount:
      type: object
      required: [id, bankCode, accountLast4, holderName, verifiedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        bankCode: { type: string }
        accountLast4: { type: string, description: "Last 4 digits of the account number" }
        holderName: { type: string, description: "The holder's first initial, e.g. R." }
        verifiedAt: { type: string, format: date-time }
    LinkedBankAccountList:
      type: object
      required: [accounts]
      additionalProperties: false
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/LinkedBankAccount" }
    InboxMessage:
      type: object
      required: [id, channel, msisdn, priority, body, read, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        channel: { type: string }
        txnId: { type: string }
        msisdn: { type: string, description: "Masked (0171****789)" }
        priority: { type: string, enum: [TXN, INFO, PROMO] }
        body: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    InboxPage:
      type: object
      required: [items, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxMessage" }
        limit: { type: integer }
        offset: { type: integer }
    PushTokenRequest:
      type: object
      required: [token, platform]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 4096, description: "The FCM / APNs device token" }
        platform: { type: string, enum: [ANDROID, IOS] }
    BalanceRequest:
      type: object
      required: [encryptedPin]
      additionalProperties: false
      properties:
        encryptedPin:
          type: object
          required: [keyId, ciphertext]
          description: As in TransactionRequest; passed to mw-auth untouched, never published.
          properties:
            keyId: { type: string, minLength: 1, maxLength: 128 }
            ciphertext: { type: string, minLength: 1, maxLength: 4096 }
        locale: { type: string, enum: [bn, en] }
    Balance:
      type: object
      required: [txnId, available, asOf]
      properties:
        txnId: { type: string, description: The balance check (for support; not in the history) }
        available: { $ref: "#/components/schemas/Money" }
        asOf: { type: string, format: date-time }
    Transaction:
      type: object
      required: [txnId, status]
      properties:
        txnId: { type: string, description: UUIDv7 }
        status:
          type: string
          description: A saga state of mw.txn.status.v1, or PROCESSING on a 202
        txnType: { type: string }
        debitParty: { $ref: "#/components/schemas/Party" }
        creditParty: { $ref: "#/components/schemas/Party" }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        coreRef: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            messageBn: { type: string }
            retryable: { type: boolean }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransactionHistory:
      type: object
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean, description: Another page follows at offset + limit }
    HistoryItem:
      type: object
      required: [txnId, txnType, direction, status, amount, requestedAt, updatedAt]
      properties:
        txnId: { type: string, description: UUIDv7 }
        txnType: { type: string }
        direction:
          type: string
          enum: [IN, OUT]
          description: OUT the wallet paid, IN the wallet was paid
        status: { type: string, description: A saga state of mw.txn.status.v1 }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        counterparty:
          type: object
          description: The other side, masked
          properties:
            type: { type: string, description: e.g. WALLET, MERCHANT, ORG, MSISDN, BILLER_ACCOUNT, BANK_ACCOUNT }
            id: { type: string, description: "Masked: 0171****789, account last 4" }
            name: { type: string, description: The initial only }
            walletType: { type: string }
        coreRef: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            messageBn: { type: string }
            retryable: { type: boolean }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CollectionList:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
    Collection:
      type: object
      required: [txnId, status, amount, payer, requestedAt]
      properties:
        txnId: { type: string, description: UUIDv7 }
        status: { type: string, enum: [COMPLETED, REVERSED] }
        amount: { $ref: "#/components/schemas/Money" }
        payer: { type: string, description: "The paying customer's MSISDN, masked (0171****789)" }
        coreRef: { type: string }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR(-[A-Z0-9_]+)?)(-[A-Z0-9_]+)$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time, description: "When the error was built, UTC ISO-8601 to the millisecond (FRS 3.7, ticket 92). Set by every service; optional for older senders." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
