openapi: 3.1.0
info:
  title: Bits app API (mw-app-gateway)
  version: 1.13.0
  description: |
    Mobile apps API v1 (spec 8.2, 9.1), served by mw-app-gateway behind APISIX route `/app/v1/*`.
    Bearer access JWT from mw-auth (spec 18.7, D21; MSISDN + PIN login on a bound device); the payer
    wallet is the token's `msisdn` claim.
    Every error is the 5.3 envelope. A financial POST waits up to the reply budget (25 s,
    spec 7.5) for a terminal status: 200 with the result, 202 `PROCESSING` otherwise, then poll GET.
    Submit bodies are checked against `TransactionRequest` (a derived copy in mw-app-gateway) on the
    exact bytes sent, which the device signature covers: a body that breaks it, is not one JSON
    object or repeats a key is 400 MW-VAL-001. The APISIX edge answers some errors itself, also as
    the envelope: 401 MW-AUTH-001, 413 MW-VAL-BODY_TOO_LARGE (body over 64 KiB), 429
    MW-SYS-RATE_LIMITED (per-user quota, retryable).

    Device binding (spec 9.1, 18.6; ticket 29, moved to mw-auth in ticket 68). Every request comes
    from a device bound to the token's wallet (`X-Device-Id`, bound at mw-auth with `POST
    /auth/v1/devices`, contract `api/mw-auth/auth.v1.openapi.yaml`) with a live mw-auth session
    (`sess:{walletId}:{deviceId}`, idle timeout 5 min, extended by every request; `POST
    /auth/v1/sessions` opens a new one). One bound device per wallet: binding another device ends
    this one's session. The gateway verifies; it reads the device's public key from mw-auth and keeps
    it up to 5 min, and reuses a confirmed session up to 10 s. Signed requests (transaction submit)
    carry `X-Timestamp` (epoch milliseconds, within ±5 min of the gateway), `X-Nonce` (used once
    per device) and `X-Signature`: base64 ECDSA P-256 SHA-256 (ASN.1 DER or 64-byte r||s) by the
    device key over the UTF-8 text of these six lines joined by a line feed: method, path (with
    "?query" if any), lower-case hex SHA-256 of the exact body bytes (of nothing when there is no
    body), X-Timestamp, X-Nonce, X-Device-Id. Errors (401): MW-AUTH-003 device missing or not
    bound to this wallet, MW-AUTH-004 signature missing or not valid, MW-AUTH-005 timestamp outside
    the window, MW-AUTH-006 nonce already used (replay), MW-AUTH-007 no live session; 503
    MW-SYS-012 (retryable) when mw-auth or the gateway's cache cannot be asked.
    The gateway itself also refuses bodies over 64 KiB with 413 MW-VAL-BODY_TOO_LARGE.

    Wallet history (1.5.0, ADR D25): GET /app/v1/transactions lists the signed-in wallet's
    transactions, sent and received, from every channel (app, USSD, org bulk credits), as
    mw-orchestrator's query API answers it for that wallet. 503 MW-SYS-013 (retryable) when it
    cannot be asked.

    Balance (1.6.0, ADR D26): POST /app/v1/balance answers the signed-in wallet's available balance
    from the core after the PIN check; nothing moves and the gateway never stores it (it is not in
    the history).

    Push token (1.8.0, ticket 110): PUT /app/v1/notifications/push-token registers the app's FCM /
    APNs device token for the signed-in wallet's bound device; mw-notify then pushes transaction
    notices to it (SMS is always sent too). A new device binding drops the old device's token.

    Linked bank accounts (1.13.0, ticket 117b, FRS FL-08): POST /app/v1/bank-accounts {bankCode,
    accountNumber} runs the bank's account validation (AVL, mw-adapter-bank) first and links the
    account only when the bank accepts it; GET lists and DELETE /app/v1/bank-accounts/{id} removes the
    signed-in wallet's own accounts. The number is stored encrypted and never returned: every answer
    carries its last 4 digits and the holder's first initial only. A bank refusal passes through (502
    MW-PTR-BANK_<CODE>-<suffix>, 503 MW-SYS-PARTNER_*, 504 MW-TMO-PARTNER_*); 503 MW-SYS-016 (retryable)
    when the bank adapter cannot be asked. A duplicate is 409 MW-IDEM-001; another wallet's id 404
    MW-VAL-003. Session level, no signature.

    Saved billers, favourites and the inbox (1.10.0, ticket 107a): GET|POST|DELETE
    /app/v1/saved-billers and /app/v1/favourites are the signed-in wallet's own rows, stored by
    mw-app-gateway in the clear (the owner sees the account number and the counterparty MSISDN;
    logs mask them). GET /app/v1/notifications pages that wallet's inbox from mw-notify (OTP
    messages omitted, MSISDN masked); POST /app/v1/notifications/{id}/read marks one read. Session
    level, no signature. Another wallet's row is 404 MW-VAL-003. A duplicate save is 409
    MW-IDEM-001. 503 MW-SYS-014 (retryable) when the inbox cannot be asked.

    Profile, limits and the statement (1.11.0, ticket 107b): GET /app/v1/profile is the signed-in
    wallet's account (WAL-01: name, type, status, KYC level) plus language `bn`. The owner sees the
    name; logs keep the first initial. GET /app/v1/limits is WAL-05 for a P2P of 100 poisha, so
    `remaining` is what is left before that amount. GET /app/v1/statement?from&to is WAL-12 (JSON,
    or CSV when `Accept` is `text/csv`); a range longer than 90 days is 400 MW-VAL-001. The wallet
    is the token's. 503 MW-SYS-015 (retryable) when the core cannot be asked. A core refusal is
    passed through (404 MW-VAL-003, 422 MW-CORE-*).
servers:
  - url: https://localhost
security:
  - bearer: []
paths:
  /app/v1/transactions:
    get:
      operationId: listTransactions
      summary: The signed-in wallet's transaction history, sent and received, newest first
      description: >-
        Any app role (`customer`, `agent`, `merchant`); the wallet is always the token's `msisdn`,
        never a parameter. A bound device with a live session (`X-Device-Id`), no signature:
        nothing moves. Every channel: what the wallet paid (`direction` OUT, in any status) and
        what paid it (`direction` IN: P2P received, cash-in, merchant payments, bulk credits, add
        money), the latter only once the money reached the wallet (COMPLETED, REVERSING,
        REVERSED; a failed transfer to the wallet is not shown). A reversal is the original item
        turning REVERSED. `counterparty` is the other side, masked (MSISDN `0171****789`, account
        last 4, name to the initial; an org bulk credit shows the org's wallet masked); the
        wallet's own side is not repeated; `fee` and `error` only on OUT items. Items are
        self-contained: GET /app/v1/transactions/{txnId} serves only the caller's own app
        submissions. Offset paging: `hasMore` when another page follows. Errors: 400 MW-VAL-001
        (a parameter out of range, `from` not before `to`), 401, 403 MW-AUTH-002 / MW-AUTH-045,
        503 MW-SYS-013 (mw-orchestrator cannot be asked, retryable).
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: txnType
          in: query
          required: false
          description: One transaction type, e.g. P2P, CASH_IN, BULK_DISBURSE
          schema: { type: string, pattern: "^[A-Z0-9_]{1,32}$" }
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [IN, OUT] }
        - name: from
          in: query
          required: false
          description: Inclusive lower bound of requestedAt
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive upper bound of requestedAt
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: One page of the history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionHistory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: submitTransaction
      summary: Submit a transaction (P2P, CASH_IN, CASH_OUT, MERCHANT_PAY, TOPUP, BILL_PAY, ADD_MONEY_BANK)
      description: >-
        Stays for one release (PLT-051, ticket 105) and runs preview then confirm on this body:
        the charges, the payer's limit check and a preview binding, then the PIN and the publish.
        A limit the preview refuses is 422 MW-CORE-* and nothing is published.
        Who may initiate what follows the token's realm role (deny by default): `customer` sends
        P2P, CASH_OUT (the customer's own wallet pays the agent wallet in `creditParty`),
        MERCHANT_PAY (the customer's own wallet pays the merchant wallet in `creditParty`), TOPUP,
        BILL_PAY and ADD_MONEY_BANK (the customer's bank account in `debitParty` pays the
        customer's own wallet);
        `agent` sends CASH_IN (the agent's float pays the customer in `creditParty`); `merchant`
        sends nothing (it reads its collections, GET /app/v1/merchant/collections). The payer is
        the token's wallet (for ADD_MONEY_BANK the receiver) and `encryptedPin` its PIN, under the PIN
        transport key of GET /app/v1/pin-key (ticket 72). Any other combination is 403
        MW-AUTH-002. For P2P, CASH_IN, CASH_OUT and MERCHANT_PAY a counterparty equal to the caller's
        own wallet is 400 MW-VAL-012; the core refuses wallets of the wrong type for
        CASH_IN/CASH_OUT/MERCHANT_PAY (422
        MW-CORE-INVALID_COUNTERPARTY) and a wallet it locked itself (422 MW-CORE-ACCOUNT_LOCKED).
        Before anything is published the gateway asks mw-auth for the transaction assertion (spec
        18.7, D22): mw-auth checks the PIN and its lockout, and its refusal is answered at once with
        its code and status, nothing published: 401 MW-AUTH-040 wrong PIN (`details` triesLeft), 423
        MW-AUTH-041 PIN locked for now (`details` retryAfter) or MW-AUTH-042 until a reset, 403
        MW-AUTH-043 wallet locked, 403 MW-AUTH-045 no PIN set, 401 MW-AUTH-047 device not the
        wallet's bound one, 409 MW-IDEM-001 the key already authorised another transaction;
        mw-auth unreachable 503 MW-SYS-012 (retryable). Business duplicate (FRS PLT-013, ticket 99):
        the same txnType, counterparty and amount sent under another Idempotency-Key within the window
        (default 60 s) is 400 MW-VAL-024 (`retryable` false), nothing recorded or moved; show the user
        a confirmation and, on yes, resend the same body with `confirmDuplicate: true` (the same
        Idempotency-Key may be used: the refused request did not consume it).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            1 to 64 visible ASCII characters. Same key (per wallet) and same content returns the
            stored transaction; same key and other content is 409 MW-IDEM-001 (spec 7.3). Once a
            request under the key was answered 200, a repeat with the same content gets that very
            response body again, byte for byte, for the key's lifetime (72 h; FRS PLT-011), even
            when the transaction changed since (e.g. reversed); `encryptedPin` and
            `confirmDuplicate` are not part of the content compared.
          schema: { type: string, pattern: "^[\\x21-\\x7E]{1,64}$" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionRequest" }
      responses:
        "200":
          description: Terminal status within the budget (COMPLETED or REVERSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "202":
          description: >-
            No terminal status within the budget (status PROCESSING), or a repeated key whose
            stored transaction is still running. Poll the Location.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "423":
          description: The PIN is locked at mw-auth (MW-AUTH-041 with retryAfter, MW-AUTH-042 until a reset)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/Error" }
        "422":
          description: Core rejection (MW-CORE-<reason>), with txnId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502":
          description: >-
            Partner refusal (MW-PTR-<PARTNER>-<reason>), with txnId; the held funds were released.
            A partner that could not be reached is MW-SYS-* (500, retryable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: >-
            Kafka unavailable (MW-SYS-010, retryable) or mw-auth unreachable (MW-SYS-012,
            retryable); nothing was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "504": { $ref: "#/components/responses/Error" }
  /app/v1/{group}/preview:
    post:
      operationId: previewTransaction
      summary: What a transaction would cost and whether the limits allow it, before the PIN (ticket 105)
      description: >-
        Moves no money and needs no PIN: a bound device with a live session (`X-Device-Id`), no
        signature. The same per-flow rules as POST /app/v1/transactions apply to the body (role per
        type, counterparty, partner, bank account, attributes; 400 MW-VAL-001 / MW-VAL-012, 403
        MW-AUTH-002); `txnType` follows from `group`. The gateway asks mw-orchestrator, which asks the
        core: fee (VAT included), VAT, commission and total from the tariff for the payer's wallet type,
        the payer's limit check and, for a wallet payee, the payee's account (masked: MSISDN
        `0171****789`, name to the initial; 422 MW-CORE-CREDIT_WALLET_NOT_FOUND when it does not exist).
        A limit the amount would break is 422 MW-CORE-<reason> (LIMIT_BELOW_MIN_PER_TXN,
        LIMIT_EXCEEDED_PER_TXN, LIMIT_EXCEEDED_DAILY, LIMIT_EXCEEDED_DAILY_COUNT, LIMIT_EXCEEDED_MONTHLY,
        LIMIT_EXCEEDED_MONTHLY_COUNT) with English and Bangla text, and no previewId. Otherwise 200 with
        a `previewId` (5 minutes) to confirm with. 503 MW-SYS-013 (retryable) when mw-orchestrator or
        the core cannot be asked; 503 MW-SYS-012 when the preview cannot be kept.
      parameters:
        - { $ref: "#/components/parameters/Group" }
        - { $ref: "#/components/parameters/DeviceId" }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewRequest" }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/{group}/confirm:
    post:
      operationId: confirmTransaction
      summary: Confirm a previewed transaction with the PIN (ticket 105)
      description: >-
        The only financial call of the two steps: signed like POST /app/v1/transactions (`X-Timestamp`,
        `X-Nonce`, `X-Signature`), with an `Idempotency-Key`, the PIN ciphertext and the `previewId`
        of a preview of the same wallet in the last 5 minutes. The body repeats the previewed
        transaction; anything that differs from the preview (amount, payee, partner, bank account,
        attributes) is 400 MW-VAL-026, an expired, unknown, altered or another wallet's previewId 400
        MW-VAL-027, nothing authorised or moved. Then exactly as POST /app/v1/transactions: mw-auth's
        assertion (its refusals as there), the request to mw-orchestrator, 200 with the terminal result
        or 202 PROCESSING, the stored response for a repeated key, MW-VAL-024 for a business duplicate
        (`confirmDuplicate`), 422 MW-CORE-*, 502 MW-PTR-*. A confirm may be repeated with the same key
        and previewId while the preview lives.
      parameters:
        - { $ref: "#/components/parameters/Group" }
        - name: Idempotency-Key
          in: header
          required: true
          description: As for POST /app/v1/transactions.
          schema: { type: string, pattern: "^[\\x21-\\x7E]{1,64}$" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmRequest" }
      responses:
        "200":
          description: Terminal status within the budget (COMPLETED or REVERSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "202":
          description: No terminal status within the budget (PROCESSING); poll the Location
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /app/v1/balance:
    post:
      operationId: checkBalance
      summary: The signed-in wallet's available balance (PIN required)
      description: >-
        Any app role (`customer`, `agent`, `merchant`); the wallet is always the token's `msisdn`.
        Signed like a transaction submit (`X-Timestamp`, `X-Nonce`, `X-Signature`) and
        authorised the same way (spec 18.7, D22): the gateway asks mw-auth for the assertion of a
        BALANCE request (amount 0, payer = payee = the wallet), then mw-orchestrator asks the core
        (BalanceInquiry, ADR D26). The answer is the core's available balance (balance minus open
        holds) at `asOf`; the middleware never stores it, and a balance check is not in GET
        /app/v1/transactions. mw-auth's refusals are answered as for a submit: 401 MW-AUTH-040
        wrong PIN (`details` triesLeft), 423 MW-AUTH-041 / MW-AUTH-042, 403 MW-AUTH-043 /
        MW-AUTH-045, 401 MW-AUTH-047, 409 MW-IDEM-001, 503 MW-SYS-012. A core refusal is 422
        MW-CORE-<reason> (WALLET_NOT_ACTIVE, ...). No answer within the reply budget is 504
        MW-TMO-001 (retryable): a balance check has nothing to finish, so there is no 202; ask
        again with a new key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            1 to 64 visible ASCII characters, a new one per check. The same key answers the same
            check's result while it is still known; it never stores a balance.
          schema: { type: string, pattern: "^[\\x21-\\x7E]{1,64}$" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BalanceRequest" }
      responses:
        "200":
          description: The wallet's available balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422":
          description: Core rejection (MW-CORE-<reason>), with txnId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "423":
          description: The PIN is locked at mw-auth (MW-AUTH-041 with retryAfter, MW-AUTH-042 until a reset)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/Error" }
        "503":
          description: Kafka unavailable (MW-SYS-010) or mw-auth unreachable (MW-SYS-012), retryable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "504":
          description: The core did not answer within the reply budget (MW-TMO-001, retryable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /app/v1/notifications/push-token:
    put:
      operationId: registerPushToken
      summary: Register the app's push device token for this wallet and device
      description: >-
        Ticket 110 (FRS EXT-04): the FCM (ANDROID) or APNs (IOS) token of the app on the bound device
        (`X-Device-Id`, live session; nothing moves, so no signature). Handed to mw-notify
        (`mw.notify.push-token.v1`), which pushes transaction notices to it next to the SMS. One bound
        device per wallet: the token replaces the wallet's other devices' tokens, and binding another
        device drops it. Repeat it whenever the platform hands the app a new token. 204 once handed
        over; 400 MW-VAL-001 on a body that breaks `PushTokenRequest`; 503 MW-SYS-010 (retryable)
        when it cannot be handed over.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenRequest" }
      responses:
        "204":
          description: Registered (handed to mw-notify)
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/notifications/opt-out:
    post:
      operationId: optOutOfPromotions
      summary: Opt this wallet out of promotional messages
      description: >-
        Ticket 111 (FRS NOT-09). No body. The token's wallet is recorded by mw-notify
        (`mw.notify.opt-out.v1`) and promotional SMS are skipped. OTP and transactional messages
        are never opted out. Session level: `X-Device-Id` and a live session, no signature.
        204 once handed over; 503 MW-SYS-010 (retryable) when it cannot be handed over.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "204":
          description: Recorded (handed to mw-notify)
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/pin-key:
    get:
      operationId: getPinKey
      summary: The PIN transport public key the app encrypts the PIN with
      description: >-
        Ticket 72 (spec 18.7, D20): the newest mw-crypto `PIN_TRANSPORT` key (RSA 3072) as mw-auth
        serves it (`GET /auth/v1/pin-key`), reused by the gateway for up to 5 min. The app encrypts
        the PIN's UTF-8 bytes with RSA-OAEP (SHA-256, MGF1 SHA-256), sends the ciphertext as
        standard base64 and `keyId` as `encryptedPin.keyId`. Needs the token only (no device
        signature). 503 MW-SYS-012 (retryable) when mw-auth cannot be asked and no key is held.
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinKey" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/merchant/collections:
    get:
      operationId: listMerchantCollections
      summary: The merchant's collections (in-app MERCHANT_PAY payments received), newest first
      description: >-
        Merchant app only (realm role `merchant`; any other role 403 MW-AUTH-002). Lists the
        MERCHANT_PAY transactions whose payee is the token's own wallet and that reached the
        merchant (COMPLETED, or REVERSED after a refund); a merchant never sees another merchant's
        collections. The payer's number is shown masked (`0171****789`). Read-only, no money moves.
      parameters:
        - name: limit
          in: query
          required: false
          description: Most recent collections to return (1 to 100, default 50); other values 400 MW-VAL-001.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: The collections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/billers:
    get:
      operationId: listBillers
      summary: The billers a customer can pay (catalogue of mw-adapter-billpay)
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      description: >-
        Read-only, no money moves. Answered from mw-adapter-billpay's catalogue (reused for up to
        60 s); 503 MW-SYS-011 (retryable) when it cannot be asked and no earlier copy exists.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillerList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/billers/{code}/fetch-bill:
    post:
      operationId: fetchBill
      summary: The amount due on a bill, asked of the biller's aggregator
      description: >-
        Read-only, no money moves, no Idempotency-Key. The biller's aggregator is asked through
        mw-adapter-billpay synchronously. Pay the bill with a BILL_PAY transaction. Errors: unknown
        biller 404 MW-VAL-003; refused by the aggregator 502 MW-PTR-<AGGREGATOR>-<reason> (e.g.
        MW-PTR-BILLAGG-BILL_NOT_FOUND, MW-PTR-BILLAGG-BILL_ALREADY_PAID); aggregator not reachable
        503 MW-SYS-*; no answer in time 504 MW-TMO-* (both retryable).
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: code
          in: path
          required: true
          schema: { $ref: "#/components/schemas/BillerCode" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FetchBillRequest" }
      responses:
        "200":
          description: The bill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /app/v1/profile:
    get:
      operationId: getProfile
      summary: The signed-in wallet's profile (WAL-01) and language
      description: >-
        Name, type, status and KYC level from the core, plus language `bn`. The owner sees the
        name. 404 MW-VAL-003 when the core has no such wallet. 503 MW-SYS-015 (retryable) when the
        core cannot be asked.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200":
          description: This wallet's profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/limits:
    get:
      operationId: getLimits
      summary: What the signed-in wallet may still pay (WAL-05)
      description: >-
        The core's limit check for a P2P of 100 poisha. `remaining` is what is left before that
        amount. A limit the rule does not set is left out. 503 MW-SYS-015 (retryable) when the core
        cannot be asked.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200":
          description: The remaining limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletLimits" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/statement:
    get:
      operationId: getStatement
      summary: The signed-in wallet's ledger statement (WAL-12)
      description: >-
        Entries in `[from, to)`, oldest first, one page. JSON, or CSV (`at,txnId,direction,kind,amountMinor,balanceAfterMinor`)
        when `Accept` is `text/csv`. The wallet is not in the body. A range that does not move
        forward, or is longer than 90 days, is 400 MW-VAL-001. 503 MW-SYS-015 (retryable) when the
        core cannot be asked.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerStatement" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/saved-billers:
    get:
      operationId: listSavedBillers
      summary: The signed-in wallet's saved billers
      parameters:
