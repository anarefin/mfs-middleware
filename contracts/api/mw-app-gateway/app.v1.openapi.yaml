          application/json:
            schema: { $ref: "#/components/schemas/SaveBillerRequest" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedBiller" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/saved-billers/{id}:
    delete:
      operationId: deleteSavedBiller
      summary: Remove one saved biller of the signed-in wallet
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/favourites:
    get:
      operationId: listFavourites
      summary: The signed-in wallet's favourite counterparties
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
