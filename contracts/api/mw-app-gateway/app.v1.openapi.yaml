openapi: 3.1.0
info:
  title: upay app API (mw-app-gateway)
  version: 1.1.0
  description: |
    Mobile apps API v1 (spec 8.2, 9.1), served by mw-app-gateway behind APISIX route `/app/v1/*`.
    Bearer JWT from Keycloak realm `customers`; the payer wallet is the token's `msisdn` claim.
    Every error is the 5.3 envelope. A financial POST waits up to the reply budget (25 s,
    spec 7.5) for a terminal status: 200 with the result, 202 `PROCESSING` otherwise, then poll GET.
    The APISIX edge validates submit bodies against `TransactionRequest` (derived copy in
    deploy/apisix/schemas) and answers some errors itself, also as the envelope: 401
    MW-AUTH-001, 400 MW-VAL-001, 413 MW-VAL-BODY_TOO_LARGE (body over 64 KiB), 429
    MW-SYS-RATE_LIMITED (per-user quota, retryable).

    Device binding (spec 9.1, 18.6, ticket 29). Every request comes from a device bound to the
    token's wallet (`X-Device-Id`, bound with `POST /app/v1/devices`) with a live session (Valkey
    `sess:{sub}:{deviceId}`, idle timeout 5 min, extended by every request; `POST /app/v1/sessions`
    opens a new one). One active device per wallet: binding a device replaces the others and
    opening a session ends theirs. Signed requests (binding, session open, transaction submit)
    carry `X-Timestamp` (epoch milliseconds, within ±5 min of the gateway), `X-Nonce` (used once
    per device) and `X-Signature`: base64 ECDSA P-256 SHA-256 (ASN.1 DER or 64-byte r||s) by the
    device key over the UTF-8 text of these six lines joined by a line feed: method, path (with
    "?query" if any), lower-case hex SHA-256 of the exact body bytes (of nothing when there is no
    body), X-Timestamp, X-Nonce, X-Device-Id. Errors (401): MW-AUTH-003 device missing or not
    bound (or replaced), MW-AUTH-004 signature missing or not valid, MW-AUTH-005 timestamp outside
    the window, MW-AUTH-006 nonce already used (replay), MW-AUTH-007 no live session; 503
    MW-SYS-012 (retryable) when the session store cannot be asked.
servers:
  - url: https://localhost
security:
  - bearer: []
paths:
  /app/v1/transactions:
    post:
      operationId: submitTransaction
      summary: Submit a transaction (P2P, CASH_IN, CASH_OUT, MERCHANT_PAY, TOPUP, BILL_PAY, ADD_MONEY_BANK)
      description: >-
        Who may initiate what follows the token's realm role (deny by default): `customer` sends
        P2P, CASH_OUT (the customer's own wallet pays the agent wallet in `creditParty`),
        MERCHANT_PAY (the customer's own wallet pays the merchant wallet in `creditParty`), TOPUP,
        BILL_PAY and ADD_MONEY_BANK (the customer's bank account in `debitParty` pays the
        customer's own wallet);
        `agent` sends CASH_IN (the agent's float pays the customer in `creditParty`); `merchant`
        sends nothing (it reads its collections, GET /app/v1/merchant/collections). The payer is
        the token's wallet (for ADD_MONEY_BANK the receiver) and `encryptedPin` its PIN. Any other combination is 403
        MW-AUTH-002. For P2P, CASH_IN, CASH_OUT and MERCHANT_PAY a counterparty equal to the caller's
        own wallet is 400 MW-VAL-012; the core refuses wallets of the wrong type for
        CASH_IN/CASH_OUT/MERCHANT_PAY (422
        MW-CORE-INVALID_COUNTERPARTY) and locks a wallet after 5 wrong PINs in a row (422
        MW-CORE-ACCOUNT_LOCKED).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            1 to 64 visible ASCII characters. Same key (per wallet) and same content returns the
            stored transaction; same key and other content is 409 MW-IDEM-001 (spec 7.3).
          schema: { type: string, pattern: "^[\\x21-\\x7E]{1,64}$" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionRequest" }
      responses:
        "200":
          description: Terminal status within the budget (COMPLETED or REVERSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "202":
          description: >-
            No terminal status within the budget (status PROCESSING), or a repeated key whose
            stored transaction is still running. Poll the Location.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "422":
          description: Core rejection (MW-CORE-<reason>), with txnId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502":
          description: >-
            Partner refusal (MW-PTR-<PARTNER>-<reason>), with txnId; the held funds were released.
            A partner that could not be reached is MW-SYS-* (500, retryable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: Kafka unavailable (MW-SYS-010, retryable); nothing was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "504": { $ref: "#/components/responses/Error" }
  /app/v1/merchant/collections:
    get:
      operationId: listMerchantCollections
      summary: The merchant's collections (in-app MERCHANT_PAY payments received), newest first
      description: >-
        Merchant app only (realm role `merchant`; any other role 403 MW-AUTH-002). Lists the
        MERCHANT_PAY transactions whose payee is the token's own wallet and that reached the
        merchant (COMPLETED, or REVERSED after a refund); a merchant never sees another merchant's
        collections. The payer's number is shown masked (`0171****789`). Read-only, no money moves.
      parameters:
        - name: limit
          in: query
          required: false
          description: Most recent collections to return (1 to 100, default 50); other values 400 MW-VAL-001.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: The collections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/billers:
    get:
      operationId: listBillers
      summary: The billers a customer can pay (catalogue of mw-adapter-billpay)
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      description: >-
        Read-only, no money moves. Answered from mw-adapter-billpay's catalogue (reused for up to
        60 s); 503 MW-SYS-011 (retryable) when it cannot be asked and no earlier copy exists.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillerList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/billers/{code}/fetch-bill:
    post:
      operationId: fetchBill
      summary: The amount due on a bill, asked of the biller's aggregator
      description: >-
        Read-only, no money moves, no Idempotency-Key. The biller's aggregator is asked through
        mw-adapter-billpay synchronously. Pay the bill with a BILL_PAY transaction. Errors: unknown
        biller 404 MW-VAL-003; refused by the aggregator 502 MW-PTR-<AGGREGATOR>-<reason> (e.g.
        MW-PTR-BILLAGG-BILL_NOT_FOUND, MW-PTR-BILLAGG-BILL_ALREADY_PAID); aggregator not reachable
        503 MW-SYS-*; no answer in time 504 MW-TMO-* (both retryable).
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: code
          in: path
          required: true
          schema: { $ref: "#/components/schemas/BillerCode" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FetchBillRequest" }
      responses:
        "200":
          description: The bill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /app/v1/transactions/{txnId}:
    get:
      operationId: getTransaction
      summary: Current status of one of the caller's transactions
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: txnId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest known status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/devices:
    post:
      operationId: bindDevice
      summary: Bind this device to the token's wallet and open a session
      description: >-
        Signed with the private key of the public key in the body (proof of possession). Binding
        the same X-Device-Id again replaces its key. With one active device per wallet the
        wallet's other devices are replaced (their requests then get MW-AUTH-003) and their
        sessions ended. A key that is not EC P-256 is 400 MW-VAL-001 naming `publicKey`.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceBindingRequest" }
      responses:
        "201":
          description: Bound; a session is open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/sessions:
    post:
      operationId: openSession
      summary: Open a new session on a bound device (no body)
      description: >-
        After the idle timeout (MW-AUTH-007), or to move to this device. Signed by the bound
        device key over an empty body. With one active device per wallet the other devices'
        sessions end.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
      responses:
        "200":
          description: Session open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The device bound to the token's wallet (POST /app/v1/devices).
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Signing time, epoch milliseconds; within 5 min of the gateway's clock.
      schema: { type: string, pattern: "^[0-9]{1,15}$" }
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: Unique per signed request of this device; a reused nonce is 401 MW-AUTH-006.
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{16,128}$" }
    Signature:
      name: X-Signature
      in: header
      required: true
      description: Base64 ECDSA P-256 SHA-256 signature of the canonical request text (see info).
      schema: { type: string, maxLength: 256 }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    DeviceBindingRequest:
      type: object
      additionalProperties: false
      required: [publicKey]
      properties:
        publicKey:
          type: string
          maxLength: 512
          description: The device's EC P-256 public key, base64 X.509 SubjectPublicKeyInfo (DER).
    DeviceSession:
      type: object
      required: [deviceId, idleTimeoutSeconds]
      properties:
        deviceId: { type: string }
        idleTimeoutSeconds: { type: integer, description: Session idle timeout in seconds }
    Msisdn:
      type: string
      description: Accepted forms 01XNNNNNNNN, 8801XNNNNNNNN, +8801XNNNNNNNN; forwarded as 01XNNNNNNNN.
      pattern: "^(01[3-9][0-9]{8}|\\+?8801[3-9][0-9]{8})$"
    BillerCode:
      type: string
      description: A biller of the catalogue (GET /app/v1/billers), e.g. DESCO.
      pattern: "^[A-Z0-9_]{1,32}$"
    AccountNumber:
      type: string
      description: A bank account number, digits only.
      pattern: "^[0-9]{6,20}$"
    BillNumber:
      type: string
      description: Bill or customer number at the biller.
      pattern: "^[0-9A-Za-z-]{1,32}$"
    Biller:
      type: object
      required: [code, name]
      properties:
        code: { $ref: "#/components/schemas/BillerCode" }
        name: { type: string }
        category: { type: string, description: e.g. ELECTRICITY, WATER, GAS }
    BillerList:
      type: object
      required: [billers]
      properties:
        billers:
          type: array
          items: { $ref: "#/components/schemas/Biller" }
    FetchBillRequest:
      type: object
      required: [billNumber]
      properties:
        billNumber: { $ref: "#/components/schemas/BillNumber" }
    Bill:
      type: object
      required: [billerCode, billNumber, amount]
      properties:
        billerCode: { $ref: "#/components/schemas/BillerCode" }
        billNumber: { $ref: "#/components/schemas/BillNumber" }
        amount: { $ref: "#/components/schemas/Money" }
        dueDate: { type: string, format: date }
        billPeriod: { type: string, description: YYYY-MM }
    Amount:
      type: object
      required: [valueMinor, currency]
      additionalProperties: false
      properties:
        valueMinor: { type: integer, minimum: 1, description: Poisha; must be greater than zero }
        currency: { type: string, const: BDT }
    Money:
      type: object
      properties:
        valueMinor: { type: integer, minimum: 0 }
        currency: { type: string, const: BDT }
    Party:
      type: object
      properties:
        type: { type: string }
        id: { type: string }
        walletType: { type: string }
    TransactionRequest:
      type: object
      required: [txnType, amount, encryptedPin]
      properties:
        txnType:
          type: string
          enum: [P2P, CASH_IN, CASH_OUT, MERCHANT_PAY, TOPUP, BILL_PAY, ADD_MONEY_BANK]
          description: >-
            P2P, CASH_IN, CASH_OUT and MERCHANT_PAY pay the wallet of `creditParty.id`. TOPUP recharges the
            mobile number `creditParty.id` with operator and product `partner` (required for
            TOPUP, refused otherwise, 400 MW-VAL-001); a refusal by the operator is 502
            MW-PTR-<OPERATOR>-<reason> after the held funds were released. BILL_PAY pays bill
            number `creditParty.id` at biller `partner.billerCode` (from GET /app/v1/billers; an
            unknown biller is 400 MW-VAL-001); the middleware picks the aggregator, and a refusal
            by it is 502 MW-PTR-<AGGREGATOR>-<reason> after the held funds were released.
            ADD_MONEY_BANK (C2W) adds money to the caller's own wallet from the linked bank account
            `debitParty` at bank `partner.partnerId` (required; `creditParty` is refused, 400
            MW-VAL-001); nothing is held, the bank confirms the debit (usually by callback) and
            the wallet is credited; a refusal by the bank is 502 MW-PTR-<BANK>-<reason> with
            nothing moved, an outcome not known in time is 202 PROCESSING (status inquiry).
        creditParty:
          type: object
          description: >-
            The payee: a customer wallet for P2P and CASH_IN, an agent wallet for CASH_OUT, a
            merchant wallet for MERCHANT_PAY,
            the mobile number for TOPUP, the bill number for BILL_PAY. Required for every type
            except ADD_MONEY_BANK, which refuses it (400 MW-VAL-001).
          required: [id]
          properties:
            type:
              type: string
              enum: [WALLET, MSISDN, BILLER_ACCOUNT]
              description: >-
                WALLET for P2P, CASH_IN, CASH_OUT and MERCHANT_PAY, MSISDN for TOPUP (both optional);
                BILLER_ACCOUNT, required, for BILL_PAY. Another value is 400 MW-VAL-001.
            id:
              anyOf:
                - { $ref: "#/components/schemas/Msisdn" }
                - { $ref: "#/components/schemas/BillNumber" }
              description: An MSISDN, except for BILL_PAY (a bill number).
        debitParty:
          type: object
          additionalProperties: false
          description: >-
            ADD_MONEY_BANK only (refused for every other type, 400 MW-VAL-001): the caller's
            linked bank account the money comes from. Shown masked (last 4 digits).
          required: [type, id]
          properties:
            type: { type: string, enum: [BANK_ACCOUNT] }
            id: { $ref: "#/components/schemas/AccountNumber" }
        partner:
          type: object
          additionalProperties: false
          description: >-
            TOPUP: the mobile operator and its product (partnerId and productCode). BILL_PAY: the
            biller only (billerCode). ADD_MONEY_BANK: the partner bank only (partnerId c2wbank).
            Refused for every other type.
          anyOf:
            - required: [partnerId, productCode]
            - required: [billerCode]
            - required: [partnerId]
          properties:
            partnerId: { type: string, enum: [gp, robi, banglalink, teletalk, c2wbank] }
            productCode: { type: string, enum: [PREPAID, POSTPAID] }
            billerCode: { $ref: "#/components/schemas/BillerCode" }
        amount: { $ref: "#/components/schemas/Amount" }
        encryptedPin:
          type: object
          required: [keyId, ciphertext]
          description: >-
            PIN encrypted by the app with the core's public key (RSA-OAEP, SHA-256 hash and MGF1),
            base64; passed through untouched.
          properties:
            keyId: { type: string, minLength: 1, maxLength: 128 }
            ciphertext: { type: string, minLength: 1, maxLength: 4096 }
        locale: { type: string, enum: [bn, en] }
        attributes:
          type: object
          description: Allow-listed keys only (`reference`); any other key is 400 MW-VAL-001.
          maxProperties: 20
          propertyNames: { enum: [reference] }
          additionalProperties: { type: string, maxLength: 256 }
    Transaction:
      type: object
      required: [txnId, status]
      properties:
        txnId: { type: string, description: UUIDv7 }
        status:
          type: string
          description: A saga state of mw.txn.status.v1, or PROCESSING on a 202
        txnType: { type: string }
        debitParty: { $ref: "#/components/schemas/Party" }
        creditParty: { $ref: "#/components/schemas/Party" }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        coreRef: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            messageBn: { type: string }
            retryable: { type: boolean }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CollectionList:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
    Collection:
      type: object
      required: [txnId, status, amount, payer, requestedAt]
      properties:
        txnId: { type: string, description: UUIDv7 }
        status: { type: string, enum: [COMPLETED, REVERSED] }
        amount: { $ref: "#/components/schemas/Money" }
        payer: { type: string, description: "The paying customer's MSISDN, masked (0171****789)" }
        coreRef: { type: string }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
