          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedBillerList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      operationId: saveBiller
      summary: Save a biller account for the signed-in wallet
