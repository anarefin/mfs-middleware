openapi: 3.1.0
info:
  title: Bits mock-control API v1 (mw-simulators, test-only)
  version: 1.0.0
  description: |
    The one control API of every mock party in mw-simulators (ADR D33, FRS 10.1 MCT-01..03, MCT-06;
    ticket 102), never part of the product. Served only when mw-simulators runs with the Spring
    profile `mock-control` (the dev stack sets it); without it the paths do not exist and every
    mock follows its magic values alone. No auth: the mocks are dev/test only; the test console and
    the API suite reach it through a test-only APISIX route.

    A party (`GET /mock-control/parties`) has operations and scope keys. A scenario sets one of three
    dimensions of a call: the outcome (SUCCESS, BUSINESS_ERROR, TIMEOUT, HTTP_5XX, MALFORMED_RESPONSE,
    CONNECTION_RESET, PARTIAL_SUCCESS), an extra delay (DELAY) or the callback (DUPLICATE_CALLBACK,
    LATE_CALLBACK, OUT_OF_ORDER_CALLBACK, NO_CALLBACK). Per dimension the most specific matching
    scenario wins: next-N scoped, then per key, then per operation, then party-wide; among equals the
    latest. Without one the outcome is the call's magic value (amount ending .13 = timeout and the rest
    of spec 22.2, MCK-03), and SUCCESS when it has none. A next-N scenario counts down only on the calls
    it decided and disappears at zero. A DOWN or MAINTENANCE switch is checked first and uses no
    scenario.

    The SMPP and TCP parties (ticket 102b, MCT-04) carry out a subset of the behaviours (`behaviours`
    of the party): `smsc` (operations bind, submit; BUSINESS_ERROR refuses with `code`, an SMPP
    command_status such as `0x58` ESME_RTHROTTLED, the default on submit, or `0x0D` ESME_RBINDFAIL, the
    default on bind; the DLR is its callback: NO_CALLBACK = missing DLR, LATE_CALLBACK = late DLR,
    DUPLICATE_CALLBACK = two DLRs, OUT_OF_ORDER_CALLBACK = a stale ENROUTE after the final one; DOWN
    closes the connection), `ussdgw` (bind, submit, enquire_link, dial; MALFORMED_RESPONSE answers a
    generic_nack; enquire_link with anything but SUCCESS goes unanswered) and `payshield` (command,
    keyed by the command code; `code` a two-character payShield error code, default `15`).

    The file mocks (ticket 123, FRS EXT-05, EXT-06, EXT-17, MCT-05) work on the partner SFTP host:
    `aml` (operation respond, keys file, date: answers each transaction file of `aml/in` with a response
    file in `aml/out`), `trustbank` (mt940, mt942; keys date, account: the trust account's daily MT940 and
    intraday MT942 in `trustbank/out`, built from mw-core-mock's ledger) and `dw` (validate; keys file,
    date: checks each batch and control file of `dw/in`, verdict in the journal). A fourth dimension FILE
    decides how the next file goes: MISSING_FILE, LATE_FILE (`delayMs`), DUPLICATE_FILE, CORRUPT_FILE,
    INJECTED_MISMATCH (`code` = the kind, `count`, default 1; trustbank MISSING_IN_PARTNER,
    MISSING_IN_UPAY, AMOUNT_MISMATCH, DC_FLIP; aml UNKNOWN_TXN); `dw` takes BUSINESS_ERROR (a forced
    REJECTED verdict). Scope `nextN` = the next N files, `key` = a file name or business date
    (yyyy-MM-dd). The journal lists every file read (READ), written (WRITE), skipped (SKIP) or delayed
    (LATE) with its `sha256` and `bytes` headers, the `fault` applied and the dw `verdict`.

    The old `/sim/{partner}/scenario`, `/sim/{partner}/requests`, `/sim/merchant/ipn/scenario`,
    `/sim/payshield/scenario` and `/sim/ussdgw/smpp/scenario` paths remain as deprecated aliases of
    this engine for one release.
servers:
  - url: http://mw-simulators:8080
paths:
  /mock-control/parties:
    get:
      operationId: listParties
      summary: The mock parties with their operations and scope keys
      responses:
        "200":
          description: Every party
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Party" } }
  /mock-control/reset:
    post:
      operationId: resetAll
      summary: Reset every mock in one call (MCT-07, ticket 103)
      description: |
        Every party of `GET /mock-control/parties` is reset as `DELETE /mock-control/{party}/journal`
        resets it (journal, scenarios, switch, settings, kept state), then mw-core-mock's own `POST
        /mock-control/reset` (contract `api/mw-core-mock/core-mock-control.v1`: ledger back to the seed,
        its scenarios and journal cleared), with `seedVersion` passed on. One line per party, the local
        ones first; a party that could not be reset is `FAILED` with the reason and the others still go.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seedVersion: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9-]{0,31}$", description: "mw-core-mock's seed files; absent = the version in force there" }
      responses:
        "200":
          description: What each party reported
          content:
            application/json:
              schema:
                type: object
                required: [parties]
                properties:
                  parties:
                    type: array
                    items:
                      type: object
                      required: [party, status]
                      properties:
                        party: { type: string }
                        status: { type: string, enum: [RESET, FAILED] }
                        seedVersion: { type: string }
                        detail: { type: string }
        "400":
          description: A bad body (MW-VAL-001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /mock-control/{party}/run:
    parameters:
      - $ref: "#/components/parameters/Party"
    post:
      operationId: runFileMock
      summary: Run a file mock now (ticket 123), as its scheduler job does
      description: |
        `aml`: answers every new file of `aml/in` (operation respond). `trustbank`: writes the MT940 of
        `date` (operation mt940, default yesterday in Asia/Dhaka) or the MT942 of `date` up to `at`
        (operation mt942, default today, now). `dw`: validates every new control file of `dw/in` and the
        batch files it lists. Answers the journal entries this run recorded (a LATE_FILE's WRITE follows
        later in the journal).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileRunRequest" }
      responses:
        "200":
          description: What the run read and wrote
          content:
            application/json:
              schema:
                type: object
                required: [party, operation, entries]
                properties:
                  party: { type: string }
                  operation: { type: string }
                  entries: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
        "400":
          description: Not a file mock, an operation it lacks or a bad body (MW-VAL-001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Unknown party (MW-VAL-003)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: The file host or mw-core-mock cannot be reached (MW-SYS-*)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /mock-control/{party}/files:
    parameters:
      - $ref: "#/components/parameters/Party"
    post:
      operationId: dropFile
      summary: Put a file into a file mock's inbox as the middleware would upload it (ticket 123, test helper)
      description: "`aml` (into `aml/in`) and `dw` (into `dw/in`) only; the mock reads it on its next run."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$", description: "a plain file name" }
                content: { type: string, maxLength: 1048576, description: "the file's text (UTF-8)" }
      responses:
        "201":
          description: Where it landed
          content:
            application/json:
              schema:
                type: object
                required: [path, sha256, bytes]
                properties:
                  path: { type: string }
                  sha256: { type: string }
                  bytes: { type: integer }
        "400":
          description: A party without an inbox or a bad body (MW-VAL-001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Unknown party (MW-VAL-003)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: The file host cannot be reached (MW-SYS-*)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /mock-control/{party}/scenarios:
    parameters:
      - $ref: "#/components/parameters/Party"
    post:
      operationId: addScenario
      summary: Add a scenario (MCT-01, MCT-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioRequest" }
      responses:
        "201":
          description: The stored scenario with its id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scenario" }
        "400":
          description: Invalid scenario, or an operation the party does not have (MW-VAL-001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Unknown party (MW-VAL-003)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    get:
      operationId: listScenarios
      summary: The party's active scenarios, oldest first
      responses:
        "200":
          description: The scenarios
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Scenario" } }
        "404":
          description: Unknown party (MW-VAL-003)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    delete:
      operationId: clearScenarios
      summary: Remove every scenario of the party
      responses:
        "204": { description: Removed }
  /mock-control/{party}/scenarios/{id}:
    parameters:
      - $ref: "#/components/parameters/Party"
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeScenario
      summary: Remove one scenario
      responses:
        "204": { description: Removed }
        "404":
          description: No such scenario (MW-VAL-003)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /mock-control/{party}/switch:
    parameters:
      - $ref: "#/components/parameters/Party"
    put:
      operationId: setSwitch
      summary: Set the party switch (MCT-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Switch" }
      responses:
        "200":
          description: The switch now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Switch" }
        "400":
          description: Invalid switch (MW-VAL-001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    get:
      operationId: getSwitch
      summary: The party switch (UP by default)
      responses:
        "200":
          description: The switch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Switch" }
  /mock-control/{party}/settings:
    parameters:
      - $ref: "#/components/parameters/Party"
    put:
      operationId: setSettings
      summary: Set the party's callback target, callback-only mode and timeout hold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: The settings now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    get:
      operationId: getSettings
      summary: The party's settings
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
  /mock-control/{party}/journal:
    parameters:
      - $ref: "#/components/parameters/Party"
    get:
      operationId: getJournal
      summary: The requests the party received, oldest first (MCK-07, MCT-06)
      parameters:
        - { name: path, in: query, required: false, schema: { type: string }, description: part of the request path }
        - { name: contains, in: query, required: false, schema: { type: string }, description: part of the request body }
        - { name: afterSeq, in: query, required: false, schema: { type: integer, format: int64 }, description: only requests after this sequence number }
      responses:
        "200":
          description: The journal (the last sim.record-limit requests of the party)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
    delete:
      operationId: resetParty
      summary: Clear the journal and reset the party's state (scenarios, switch, settings, ledgers; MCT-06)
      responses:
        "204": { description: Reset }
  /mock-control/{party}/callbacks/{reference}/replay:
    parameters:
      - $ref: "#/components/parameters/Party"
      - { name: reference, in: path, required: true, schema: { type: string } }
    post:
      operationId: replayCallback
      summary: Send the callback for a reference now (to the body's or the settings' callbackUrl)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl: { type: string }
      responses:
        "200":
          description: What the callback target answered (-1 unreachable)
          content:
            application/json:
              schema:
                type: object
                required: [reference, targetStatus]
                properties:
                  reference: { type: string }
                  targetStatus: { type: integer }
        "404":
          description: Unknown reference (MW-VAL-003)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /mock-control/ucb-imt/trigger:
    post:
      operationId: triggerUcbImtCredit
      summary: UCB IMT pushes one inbound remittance to the middleware (ticket 119, MCK-06)
      description: |
        Posts a signed credit to `sim.ucb-imt.credit-url` (default `http://mw-adapter-remit:8080/remit/v1/credits`)
        as partner `ucb-imt`. A DUPLICATE_CALLBACK scenario sends the same body twice (fresh nonce each time);
        LATE_CALLBACK waits `delayMs` first; NO_CALLBACK sends nothing. Answers how many copies were sent and
        the target status of the last one (-1 when nothing was sent or the target was unreachable).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, msisdn, sender, country]
              properties:
                amount: { type: string, pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" }
                msisdn: { type: string }
                sender: { type: string }
                country: { type: string, pattern: "^[A-Z]{2}$" }
      responses:
        "200":
          description: What was pushed
          content:
            application/json:
              schema:
                type: object
                required: [copies, targetStatus]
                properties:
                  partnerRef: { type: string, nullable: true }
                  copies: { type: integer }
                  targetStatus: { type: integer }
        "400":
          description: A field is not valid (MW-VAL-001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
components:
  parameters:
    Party:
      name: party
      in: path
      required: true
      schema: { type: string, examples: [ocs, billagg, c2wbank, merchant, cybersource, ucb-imt, ec, ucbatm, npsb, smsc, ussdgw, payshield, push, aml, trustbank, dw] }
  schemas:
    Behaviour:
      type: string
      enum:
        - SUCCESS
        - BUSINESS_ERROR
        - TIMEOUT
        - DELAY
        - HTTP_5XX
        - MALFORMED_RESPONSE
        - CONNECTION_RESET
        - DUPLICATE_CALLBACK
        - LATE_CALLBACK
        - OUT_OF_ORDER_CALLBACK
        - NO_CALLBACK
        - PARTIAL_SUCCESS
        - MISSING_FILE
        - LATE_FILE
        - DUPLICATE_FILE
        - CORRUPT_FILE
        - INJECTED_MISMATCH
      description: |
        File mocks only (ticket 123): MISSING_FILE delivers nothing, LATE_FILE delivers after `delayMs`
        (default the settings' `timeoutDelayMs`, else `sim.timeout-delay`), DUPLICATE_FILE delivers the file
        and a copy `<name>_DUP<ext>`, CORRUPT_FILE delivers its first half followed by a NUL and `#CORRUPT#`,
        INJECTED_MISMATCH builds the content with `count` mismatches of the kind `code`.

        SUCCESS answers success whatever the magic value. BUSINESS_ERROR is the party's refusal, `code`
        replacing its default code (merchant: `httpStatus`, default 400). TIMEOUT applies the call and
        holds the reply `delayMs` (default the settings' `timeoutDelayMs`, else `sim.timeout-delay`).
        DELAY waits `delayMs` first, the outcome decided as without it. HTTP_5XX applies the call, then
        answers `httpStatus` (default 500). MALFORMED_RESPONSE applies it and cuts the body short.
        CONNECTION_RESET applies it and closes the connection without an answer. PARTIAL_SUCCESS is the
        party's partial reply (status PARTIAL). The callback behaviours change the callback of an
        applied call (sent twice, after `delayMs`, followed by a stale PENDING, or not at all); a callback
        goes only when the settings have a `callbackUrl`.
    ScenarioRequest:
      type: object
      required: [behaviour]
      properties:
        operation: { type: [string, "null"], maxLength: 64, description: "one of the party's operations; absent = all" }
        behaviour: { $ref: "#/components/schemas/Behaviour" }
        code: { type: [string, "null"], maxLength: 32, description: "the refusal code; smsc / ussdgw: an SMPP command_status (0x58 or 88), payshield: a two-character error code; INJECTED_MISMATCH: the mismatch kind" }
        delayMs: { type: [integer, "null"], minimum: 0, maximum: 600000 }
        httpStatus: { type: [integer, "null"], minimum: 400, maximum: 599 }
        key: { type: [string, "null"], maxLength: 64, description: "an MSISDN, account number, biller code, bill number, IPN id or transaction id the call carries" }
        nextN: { type: [integer, "null"], minimum: 1, description: "only the next N matching calls (file mocks: files)" }
        count: { type: [integer, "null"], minimum: 1, maximum: 1000, description: "INJECTED_MISMATCH: how many mismatches, default 1" }
    Scenario:
      allOf:
        - $ref: "#/components/schemas/ScenarioRequest"
        - type: object
          required: [id]
          properties:
            id: { type: string }
            remaining: { type: [integer, "null"], description: "calls left of a nextN scenario" }
    Switch:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [UP, DOWN, MAINTENANCE, SLOW], description: "DOWN closes the connection unanswered; MAINTENANCE answers 503 UNAVAILABLE 5030; nothing applied in either" }
        latencyMinMs: { type: [integer, "null"], minimum: 0, maximum: 600000 }
        latencyMaxMs: { type: [integer, "null"], minimum: 0, maximum: 600000, description: "a latency drawn in [min, max] before every call, in every state" }
        ratio: { type: [number, "null"], minimum: 0, maximum: 1, description: "share of calls DOWN or MAINTENANCE hits; default 1" }
    Settings:
      type: object
      properties:
        callbackUrl: { type: [string, "null"], maxLength: 2048 }
        callbackOnly: { type: [boolean, "null"], description: "billagg: payments answered 202 PENDING, outcome by callback only" }
        timeoutDelayMs: { type: [integer, "null"], minimum: 0, maximum: 600000, description: "hold of a TIMEOUT; ussdgw: also how long a played step waits for its screen" }
    Party:
      type: object
      required: [name, operations, keys]
      properties:
        name: { type: string }
        description: { type: string }
        operations: { type: array, items: { type: string } }
        keys: { type: array, items: { type: string } }
        behaviours: { type: array, items: { $ref: "#/components/schemas/Behaviour" }, description: "what the party carries out; a scenario with another behaviour is refused (400)" }
    FileRunRequest:
      type: object
      properties:
        operation: { type: [string, "null"], maxLength: 64, description: "trustbank: mt940 (default) or mt942; aml: respond; dw: validate" }
        date: { type: [string, "null"], format: date, description: "trustbank: the business day (Asia/Dhaka)" }
        at: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "trustbank mt942: the cut time HH:mm (Asia/Dhaka)" }
    JournalEntry:
      type: object
      required: [seq, at, method, path, headers]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        method: { type: string, description: "the HTTP method, SMPP or TCP; file mocks READ, WRITE, SKIP or LATE" }
        path: { type: string }
        query: { type: [string, "null"] }
        headers: { type: object, additionalProperties: { type: string }, description: "lower-case; no Authorization or Cookie" }
        body: { type: [string, "null"], description: "raw (test data); a WS-Security password is ***" }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
