  /admin/v1/channel-clients/{clientId}/change-requests:
    post:
      operationId: requestChannelClientChange
      summary: Register or change a channel client (maker)
      description: >-
        Role `ops-maker` or `integration-maker`. UPSERT with the full `client` definition registers
        a new client or replaces an existing one (the type and auth method of a client never change:
        400 MW-VAL-001). A change that changes nothing is 409 MW-VAL-030; one open request per client
        (409 MW-VAL-031). `diff` shows the changed fields before and after; `payload.client` the full
        definition and `payload.baseVersion` the version the maker saw (absent for a new client).
