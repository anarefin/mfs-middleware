openapi: 3.1.0
info:
  title: Bits admin API v1 (mw-admin-api)
  version: 1.3.0
  description: |
    Operations console API (ticket 36, spec 15). Reached by mw-admin-ui server-side through the
    internal APISIX route `/admin/v1/*` (Keycloak realm `ops`, password + TOTP); never by a browser
    directly. mw-admin-api checks the bearer token again (signature, expiry, issuer realm `ops`).
    Roles are the realm roles of spec 15.4 (`realm_access.roles`); a role name outside 15.4 grants
    nothing:
      - transactions (search, detail with saga timeline and audit trail): viewer, ops-maker,
        ops-checker, ops-emergency, recon-maker, recon-checker, compliance-officer, auditor;
      - `viewer` and `auditor` are read-only: any method other than GET/HEAD/OPTIONS under
        `/admin/**` is 403 MW-AUTH-002 unless the operator also holds a role that may write;
      - unmasked MSISDN (`reveal=true` on the detail): compliance-officer and auditor only; every
        reveal is audited (`mw.audit.event.v1`, action `admin.txn.msisdn.revealed`). Other roles
        asking for a reveal get the masked view (`revealed: false`) and no audit record.
    Customer data is masked (spec 18.3) as mw-orchestrator returns it: MSISDN `0171****789`,
    accounts last 4, names to the initial. Audit entries are returned as mw-audit-dw stores them
    (already masked). Every error is the 5.3 envelope: 401 MW-AUTH-001 (no or bad token), 403
    MW-AUTH-002 (role), 400 MW-VAL-001, 404 MW-VAL-003, 503 MW-SYS-040 (a query API is down,
    retryable).

    Maker-checker (ticket 37, spec 15.3): an operator action on a transaction (manual TSQ, force
    commit / release from MANUAL_REVIEW, reversal of a COMPLETED one) is never applied directly. The
    maker (`ops-maker`) creates a change request; a checker (`ops-checker`) who is a different user
    (token subject and username) approves or rejects it; a request not decided within 72 h
    expires. On approval the request is marked APPROVED, audited (before/after) and the action is
    sent to mw-orchestrator in one database transaction (`mw.txn.action.v1`, or a REVERSAL on
    `mw.txn.request.v1`); the orchestrator then moves the transaction, which the detail view shows.
    Every decision (create, approve, reject, expire) is audited on `mw.audit.event.v1` with
    `before`/`after`. Codes: 403 MW-AUTH-030 (the maker decides own request), 409 MW-VAL-030 (the
    action does not fit the transaction's current state), 409 MW-VAL-031 (the transaction already
    has an open request), 409 MW-VAL-032 (expired), 409 MW-VAL-033 (already decided).
    Partner config (ticket 38, spec 15.2 Partners, 15.3, 20.4): partners (schema `partner`) are
    changed only through a change request (resourceType `partner`): ENABLE, DISABLE, SET_TIMEOUTS,
    SET_MAINTENANCE, SET_ENDPOINT or UPSERT_ROUTE (onboard / replace the full config, a partner route of ADR D28). Makers `ops-maker` or `integration-maker`,
    checkers `ops-checker` or `integration-checker` (never the maker). On approval the partner
    tables are updated, the version goes up by one and the full config is published on the
    compacted topic `mw.config.changed.v1` (key `partner/<id>`), all in one database transaction;
    the adapters swap it in without a restart. A disabled partner refuses new calls unsent
    (`MW-SYS-PARTNER_DISABLED`). 409 MW-VAL-030 also means the change would change nothing or the
    partner changed after the request was made (the request stays PENDING). When an adapter
    reports the partner's current version REJECTED, the newest version it reported LIVE before is
    republished as the next version (changedBy `system/rollback`, ticket 84), so the latest record
    an adapter replays on start is a good one.

    USSD menus and notification templates (ticket 39, spec 9.2, 10.3, 15.2): customer-facing text
    goes through the same maker-checker. An `ops-maker` proposes a version (checked at once: 400
    MW-VAL-040 with one `details` entry per problem); a different `ops-checker` approves it with
    the same approve endpoint, which marks the version PUBLISHED, audits it (resource
    `ussd_menu/<menuId>` or `notify_template/<code>/<channel>/<locale>`) and broadcasts it on
    `mw.config.changed.v1` in one database transaction. mw-ussd activates a menu per MNO at its
    go-live (running sessions keep their version); mw-notify switches to a template at its
    `validFrom`.

    Keys and the key ceremony (ticket 75, spec 18.8, D23, OWN-08): `GET /admin/v1/keys` lists the
    mw-crypto keys and versions (metadata only; `security-admin` or `auditor`). Generating, rotating
    and retiring a key (KEY_GENERATE, KEY_ROTATE, KEY_RETIRE) and the key ceremony (KEY_CEREMONY)
    are change requests with `resourceType` `key` (resourceId the keyId): maker and checker must be
    two different `security-admin` users, each with a fresh MFA (the token's `auth_time` at most 5
    minutes old when they file, enter a component or decide; else 403 MW-AUTH-031, sign in
    again). On approval mw-admin-api calls the mw-crypto key API (idempotent on the change request
    id). A ceremony: the maker files it, then two custodians (two different `security-admin`
    users, each in their own session) each enter a component (64 hex digits with its 6-digit
    check value); mw-crypto combines them inside the HSM and returns the KCV only, which the
    checker compares with the expected one before approving (approval before both components: 409
    MW-VAL-050). Components are never stored or logged; the audit has who and when. Rejection or
    expiry destroys the staged key. mw-crypto's own refusals pass through with its code (400
    MW-VAL-017 bad component, 409 MW-VAL-018 conflict, ...); mw-crypto down is 503 MW-SYS-042.

    Channel clients (ticket 100a, FRS PLT-003, PLT-004 quota part, ADM-03 API part): the registry of
    every client that calls the edge (app types, MNO USSD gateways, partners, merchants, portals) with
    its auth method, allowed APISIX routes, IP allow-list, rate limit and daily quota. Changed only
    through a change request (resourceType `channel_client`, action UPSERT with the full definition):
    makers `ops-maker` or `integration-maker`, checkers `ops-checker` or `integration-checker` (never
    the maker). The registry is the source of truth and APISIX a projection: after the approval
    commits, a client whose auth method has an APISIX consumer (BASIC in this version) is written as
    consumer `<clientId with - as _>` (its secret a `$secret://vault/...` reference to the Vault KV v1
    mount `apisix/`, never in the registry) plus consumer group `client_<name>` (`limit-req` rate,
    `limit-count` daily quota, `ip-restriction`); a periodic reconcile repairs drift. Secrets (HMAC
    keys, client secrets, passwords) never appear in a registry row.

    Partner credentials and the response-code map (ticket 131, FRS ADM-02, ADM-08): an
    `integration-maker` uploads a partner credential (an API key or HMAC secret, or a client
    certificate with its key as PEM or PKCS#12) as a change request (resourceType
    `partner_credential`, resourceId `<partnerId>/<name>`, action UPLOAD). The upload is write-only:
    its secret parts are staged in Vault at once and never stored in the change request, returned,
    logged or audited; the request carries only the staging reference, the target secret
    (`<adapter>/<partnerId>`) and metadata (type, the Vault field names, `kid` `<name>-v<version>`,
    a certificate's SHA-256 `fingerprint`, `subject`, `serialNumber`, `notAfter`). A different
    `integration-checker` approves it (claim-first, like key changes): the fields are written into
    the partner's Vault secret `secret/<adapter>/<partnerId>` (a secret: field `<name>`; a
    certificate: `<name>-keystore` and `<name>-keystore-password`, the adapters' mTLS fields) and the
    metadata stored; this service can write those secrets but never read them. `GET
    /admin/v1/credentials` lists metadata only, `GET /admin/v1/credentials/expiring` feeds the
    expiry dashboard; ops get an email at 30, 7 and 1 days before `notAfter`. Vault unreachable or
    not enabled: 503 MW-SYS-043 (retryable). The error map (`config.errorMap`, partner code ->
    canonical `MW-PTR-<PARTNER>-<suffix>` and retryability) has its own change request (resourceType
    `partner_error_map`, action SET_ERROR_MAP; makers and checkers as for partner config); approved,
    the full config is published as the partner's next version.
servers:
  - url: https://localhost
security:
  - opsBearer: []
paths:
  /admin/v1/transactions:
    get:
      operationId: searchTransactions
      summary: Search transactions, newest first
      description: >-
        Every filter is optional; filters are ANDed. `msisdn` in any accepted form (01..., 880...,
        +880..., with spaces or dashes) matches the initiator through the orchestrator's keyed hash.
      parameters:
        - { name: txnId, in: query, schema: { type: string, format: uuid } }
        - { name: msisdn, in: query, schema: { type: string, pattern: "^\\+?[0-9 -]{8,20}$" } }
        - { name: partnerRef, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: txnType, in: query, schema: { type: string, pattern: "^[A-Z0-9_]{1,32}$" } }
        - { name: from, in: query, description: Inclusive lower bound of createdAt, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive upper bound of createdAt, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/transactions/{txnId}:
    get:
      operationId: getTransaction
      summary: One transaction with its saga timeline, partner calls and audit trail
      description: >-
        `timeline` lists every state change (kind STATE) and core command (kind CORE) in order;
        `partnerCalls` every partner call; `auditTrail` the transaction's audit events in the order
        they happened (first 500). With `reveal=true` a compliance-officer or auditor gets MSISDN
        party ids unmasked (`revealed: true`) and the reveal is audited; anyone else gets the masked
        view (`revealed: false`).
      parameters:
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reveal, in: query, schema: { type: boolean, default: false } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The transaction, its timeline and its audit trail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/transactions/{txnId}/change-requests:
    post:
      operationId: requestTransactionAction
      summary: Ask for an operator action on a transaction (maker)
      description: >-
        Role `ops-maker`. Allowed actions per current status: INQUIRE in UNKNOWN or MANUAL_REVIEW;
        FORCE_COMMIT / FORCE_RELEASE in MANUAL_REVIEW; REVERSE in COMPLETED (not reversed yet, full
        amount). Nothing is applied until a different user approves. One open request per
        transaction. The request expires 72 h after creation.
      parameters:
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/TxnAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/wallets/{walletId}/change-requests:
    post:
      operationId: requestWalletAction
      summary: Ask for an operator action on a wallet (maker)
      description: >-
        Role `ops-maker` (ticket 52). UNLOCK clears the PIN lockout of a wallet. Nothing is applied
        until a different user (`ops-checker`) approves; the approval sends UNLOCK on
        `auth.wallet-lock.v1` (mw-auth lifts its PIN lock, every level, and any ADMIN lock; ticket 70)
        and `UnlockWallet` to the core (its own LOCKED status; refused when the wallet is not locked
        there). PIN_RESET (ticket 70) is a care PIN reset: `resourceType` `pin_reset`; the approval
        sends PIN_RESET on `auth.wallet-lock.v1` in the approval's transaction, mw-auth opens the reset
        from it and the customer gets an SMS to set a new PIN in the app with a reset OTP. One open request per wallet and type. The
        request expires 72 h after creation. The wallet id is shown masked in every answer.
      parameters:
        - { name: walletId, in: path, required: true, schema: { type: string, pattern: "^01[3-9][0-9]{8}$" }, description: The wallet id (its MSISDN, 11 digits) }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/WalletAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/keys:
    get:
      operationId: listKeys
      summary: The mw-crypto keys and their versions (metadata only)
      description: Roles `security-admin` or `auditor` (ticket 75). 503 MW-SYS-042 when mw-crypto is down.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/keys/change-requests:
    post:
      operationId: requestKeyChange
      summary: Ask for a key generation, rotation or retirement (maker, security-admin)
      description: >-
        Role `security-admin`, fresh MFA (403 MW-AUTH-031). KEY_GENERATE needs `purpose` and a
        keyId that does not exist; KEY_ROTATE an existing key; KEY_RETIRE a VERIFY_ONLY `version`
        (409 MW-VAL-030 otherwise). Applied by mw-crypto when a different security-admin approves.
      parameters:
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, keyId, reason]
              additionalProperties: false
              properties:
                action: { type: string, enum: [KEY_GENERATE, KEY_ROTATE, KEY_RETIRE] }
                keyId: { $ref: "#/components/schemas/KeyId" }
                purpose: { $ref: "#/components/schemas/KeyPurpose" }
                version: { type: integer, minimum: 1, maximum: 999999 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/key-ceremonies:
    post:
      operationId: startKeyCeremony
      summary: Start a key ceremony (maker, security-admin)
      description: >-
        A KEY_CEREMONY change request for `keyId` (version 1 of a new key or the next version of
        an existing one). HMAC-SHA256 purposes only (PIN_HMAC, TOKENISE_<domain>, HMAC_<use>; 400
        MW-VAL-001 otherwise). Role `security-admin`, fresh MFA.
      parameters:
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId, purpose, reason]
              additionalProperties: false
              properties:
                keyId: { $ref: "#/components/schemas/KeyId" }
                purpose: { $ref: "#/components/schemas/KeyPurpose" }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/key-ceremonies/{id}:
    get:
      operationId: getKeyCeremony
      summary: A key ceremony's progress (who entered which share, when; the KCV once combined)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The ceremony
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCeremony" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/key-ceremonies/{id}/components:
    post:
      operationId: enterKeyComponent
      summary: One custodian's component (security-admin, own session, fresh MFA)
      description: >-
        The component goes to mw-crypto and is never stored or logged here; the answer shows the
        KCV once both components are in. The same custodian cannot enter both (409 MW-VAL-018).
        Only while the request is PENDING (409 MW-VAL-033 / MW-VAL-032).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [component, checkValue]
              additionalProperties: false
              properties:
                component: { type: string, pattern: "^[0-9A-Fa-f]{64}$", description: "32 bytes as hex; never stored" }
                checkValue: { type: string, pattern: "^[0-9A-Fa-f]{6}$" }
      responses:
        "200":
          description: The ceremony after the share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCeremony" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/partners:
    get:
      operationId: listPartners
      summary: Partner configs (ticket 38)
      description: Roles that may read transactions, and integration-maker / integration-checker.
      parameters:
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Every partner, by id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/partners/kamelet-usage:
    get:
      operationId: partnerKameletUsage
      summary: Which live partner route uses which mw-* Kamelet (ticket 83)
      description: >-
        From the adapters' route status reports (mw.partner.route.status.v1): for each Kamelet, the
        partners whose live route version uses it, so ops see who is still on a Kamelet before its
        `-v2` replaces it. Same roles as the partner list.
      parameters:
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Kamelets by name, routes by partner id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KameletUsage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/partners/{partnerId}:
    get:
      operationId: getPartner
      summary: One partner config, as published
      parameters:
        - { name: partnerId, in: path, required: true, schema: { $ref: "#/components/schemas/PartnerId" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/partners/{partnerId}/change-requests:
    post:
      operationId: requestPartnerChange
      summary: Ask for a partner config change (maker)
      description: >-
        Role `ops-maker` or `integration-maker`. ENABLE / DISABLE / SET_TIMEOUTS / SET_MAINTENANCE /
        SET_ENDPOINT change an existing partner (404 MW-VAL-003 otherwise) and republish its route
        without a dry-run (it already runs); SET_TIMEOUTS needs `timeouts`. SET_MAINTENANCE (ticket
        131b) sets `config.maintenance` and `config.maintenanceWindow` and SET_ENDPOINT sets
        `config.endpoint` (`MOCK` or `REAL`) and `config.endpoints`; neither accepts `route`,
        `mappings` or `family` (400 MW-VAL-001), and the approval republishes the rest of the live
        config unchanged. UPSERT_ROUTE (ADR D28, ticket 83) needs `config`
        (`route`, `mappings`, `allowedHosts`, `dryRun`, ...) and, for a new partner, `family`: the route is checked with the adapters' loader rules first and refused 400
        MW-VAL-041 with one detail per problem (`field` config.route, `issue` "line N: construct:
        problem"); approved, it goes live in its adapter only once its dry-run passed (`route.status`
        of the partner). A change that changes nothing is 409
        MW-VAL-030. One open request per partner (409 MW-VAL-031). `diff` shows the changed fields
        before and after; `payload.config` the full config that is published on approval.
      parameters:
        - { name: partnerId, in: path, required: true, schema: { $ref: "#/components/schemas/PartnerId" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/PartnerAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
                family: { $ref: "#/components/schemas/PartnerFamily" }
                timeouts: { $ref: "#/components/schemas/PartnerTimeouts" }
                config: { $ref: "#/components/schemas/PartnerConfig" }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/partners/{partnerId}/error-map/change-requests:
    post:
      operationId: requestPartnerErrorMapChange
      summary: Replace a partner's response-code map (maker, ticket 131)
      description: >-
        Role `ops-maker` or `integration-maker`. `errorMap` replaces the partner's whole map (partner
        code -> `{suffix, retryable}`, the canonical code being `MW-PTR-<PARTNER>-<suffix>`);
        `ambiguousCodes` replaces the ambiguous codes when given. Unknown partner 404 MW-VAL-003; a
        bad suffix 400 MW-VAL-001; nothing changes 409 MW-VAL-030; one open request per partner (409
        MW-VAL-031). `payload` has the partner request's shape (`family`, `baseVersion`, the full
        `config`); `diff` the map before and after. Approved by a different `ops-checker` /
        `integration-checker`: published on `mw.config.changed.v1` as the next version.
      parameters:
        - { name: partnerId, in: path, required: true, schema: { $ref: "#/components/schemas/PartnerId" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason, errorMap]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/ErrorMapAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
                errorMap: { $ref: "#/components/schemas/PartnerErrorMap" }
                ambiguousCodes: { $ref: "#/components/schemas/PartnerAmbiguousCodes" }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/partners/{partnerId}/credentials/{name}/change-requests:
    post:
      operationId: uploadPartnerCredential
      summary: Upload a partner credential into Vault (maker, ticket 131)
      description: >-
        Role `integration-maker`. Write-only: the secret parts are staged in Vault at once and never
        stored, returned, logged or audited. API_KEY / HMAC_SECRET: `secret` (16 to 4096 characters)
        and an optional future `notAfter`; `name` is the field name `auth.credentialsRef` names
        (lower-case letters, digits, hyphens, at most 64). CLIENT_CERT: `certificatePem` (leaf first,
        chain optional) with its PKCS#8 `privateKeyPem`, or `pkcs12` (base64) with `pkcs12Password`;
        the key must belong to the certificate and the certificate must not have expired; `name` (at
        most 46) is the adapters' TLS context name. A credential keeps its type. Unknown partner 404
        MW-VAL-003; problems 400 MW-VAL-001 (never repeating what was uploaded); one open request per
        credential (409 MW-VAL-031); Vault unavailable 503 MW-SYS-043. Approved by a different
        `integration-checker` on the shared approve endpoint.
      parameters:
        - { name: partnerId, in: path, required: true, schema: { $ref: "#/components/schemas/PartnerId" } }
        - { name: name, in: path, required: true, schema: { $ref: "#/components/schemas/CredentialName" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason, type]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/CredentialAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
                type: { $ref: "#/components/schemas/CredentialType" }
                secret: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
                certificatePem: { type: string, minLength: 1, maxLength: 65536 }
                privateKeyPem: { type: string, minLength: 1, maxLength: 65536, writeOnly: true }
                pkcs12: { type: string, minLength: 1, maxLength: 131072, writeOnly: true, description: base64 }
                pkcs12Password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
                notAfter: { type: string, format: date-time, description: "API_KEY / HMAC_SECRET only: when it expires" }
      responses:
        "201":
          description: The change request, PENDING (payload and diff hold metadata only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
