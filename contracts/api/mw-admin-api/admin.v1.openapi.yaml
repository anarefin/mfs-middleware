          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/maintenance-messages/{id}/change-requests:
    post:
      operationId: proposeMaintenanceMessage
      summary: Propose a maintenance message (maker)
      description: >-
        Ticket 98, FRS PLT-043. The value names a partnerId or a billerCode and carries messageEn
        and messageBn. Approval publishes configType MAINTENANCE_MESSAGE.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
