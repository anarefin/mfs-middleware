        the row is written (version + 1) and audited in one transaction, then projected to APISIX.
      parameters:
        - { name: clientId, in: path, required: true, schema: { $ref: "#/components/schemas/ChannelClientId" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason, client]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/ChannelClientAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
                client: { $ref: "#/components/schemas/ChannelClientSpec" }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
