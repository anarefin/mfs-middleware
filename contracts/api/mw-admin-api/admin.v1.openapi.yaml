              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/ussd-menus/{menuId}/change-requests:
    post:
      operationId: proposeUssdMenu
      summary: Propose a new version of a USSD menu and its go-live per MNO (maker)
      description: >-
        Role `ops-maker` (ticket 39, spec 9.2, 15.2). The tree is mw-ussd's menu JSON (`start`,
        `messages`, `nodes`); `menuId` and `version` inside it are set by the service. The tree is
        checked before anything is stored: every reference resolves, every node has what its type
        needs, a PIN input leads straight to an ACTION and is never stored, and every text (node
        texts, option labels, validator errors, the six engine messages) has both `bn` and `en`;
        otherwise 400 MW-VAL-040 with one `details` entry per problem. `activations` names each MNO
        (gp, robi, bl, teletalk) once, with an optional go-live time (the approval time when absent or
        earlier). The new version is PENDING with its change request (one open request per menu, 409
        MW-VAL-031); a different `ops-checker` approves it with `/admin/v1/change-requests/{id}/approve`,
        which publishes it on `mw.config.changed.v1` (configType USSD_MENU, configKey
        `ussd-menu/<menuId>`). mw-ussd then serves it to sessions that start after the go-live;
        running sessions finish on the version they started with.
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu, activations, reason]
              additionalProperties: false
              properties:
                menu:
                  type: object
                  required: [start, messages, nodes]
                  properties:
                    start: { type: string, minLength: 1 }
                    messages: { type: object }
                    nodes: { type: object, minProperties: 1 }
                activations:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [mno]
                    additionalProperties: false
                    properties:
                      mno: { type: string, minLength: 1, maxLength: 16 }
                      goLiveAt: { type: string, format: date-time }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING (`payload` = the version to publish)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/ussd-menus/{menuId}/versions:
    get:
      operationId: listUssdMenuVersions
      summary: Versions of a USSD menu, newest first (without the tree)
      description: Any spec 15.4 role.
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersionPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/ussd-menus/{menuId}/versions/{version}:
    get:
      operationId: getUssdMenuVersion
      summary: One version of a USSD menu, with its tree and go-live schedule
      description: Any spec 15.4 role.
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The version (`value` = `{menuId, version, menu, activations}`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/notify-templates/{code}/{channel}/{locale}/change-requests:
    post:
      operationId: proposeNotifyTemplate
      summary: Propose a new version of a notification template (maker)
      description: >-
        Role `ops-maker` (ticket 39, spec 10.3, 15.2). One template is a code (`A-Z0-9_`), channel
        (SMS, EMAIL) and locale (bn, en). The texts are logic-less: only plain `{{name}}`
        placeholders (no sections, partials, comments or triple braces); EMAIL needs a `subject` and
        may carry an `htmlBody`, SMS takes neither; `senderId` 1-11 letters, digits or spaces.
        Otherwise 400 MW-VAL-040 with one `details` entry per problem. The version is PENDING with its
        change request (one open request per template, 409 MW-VAL-031); a different `ops-checker`
        approves it with `/admin/v1/change-requests/{id}/approve`, which publishes it on
        `mw.config.changed.v1` (configType TEMPLATE, configKey `template/<code>/<channel>/<locale>`);
        mw-notify uses it for every message rendered from `validFrom` on (the approval time when
        absent or earlier).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" } }
        - { name: channel, in: path, required: true, schema: { type: string, enum: [SMS, EMAIL] } }
        - { name: locale, in: path, required: true, schema: { type: string, enum: [bn, en] } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, reason]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                subject: { type: string, minLength: 1, maxLength: 200 }
                htmlBody: { type: string, minLength: 1, maxLength: 20000 }
                senderId: { type: string, minLength: 1, maxLength: 11 }
                validFrom: { type: string, format: date-time }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING (`payload` = the version to publish)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/notify-templates/{code}/{channel}/{locale}/versions:
    get:
      operationId: listNotifyTemplateVersions
      summary: Versions of a notification template, newest first (without the texts)
      description: Any spec 15.4 role. Lists the versions made through this API (the seeded first versions live in mw-notify).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: channel, in: path, required: true, schema: { type: string } }
        - { name: locale, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersionPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/notify-templates/{code}/{channel}/{locale}/versions/{version}:
    get:
      operationId: getNotifyTemplateVersion
      summary: One version of a notification template, with its texts
      description: Any spec 15.4 role.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: channel, in: path, required: true, schema: { type: string } }
        - { name: locale, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: "The version (`value` = `{code, channel, locale, version, body, subject?, htmlBody?, senderId?, validFrom?}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    opsBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of Keycloak realm `ops` (Authorization Code + PKCE, TOTP required)
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Status:
      type: string
      enum:
        [RECEIVED, VALIDATING, HOLDING, POSTING, PARTNER_PENDING, COMMITTING, RELEASING, UNKNOWN,
         COMPLETED, REJECTED, FAILED, REVERSING, REVERSED, MANUAL_REVIEW]
    Amount:
      type: object
      required: [valueMinor, currency]
      properties:
        valueMinor: { type: integer, minimum: 0, description: Poisha }
        currency: { type: string, const: BDT }
    Party:
      type: object
      description: A party; id masked by type unless revealed, name reduced to the initial.
      properties:
        type: { type: string }
        id: { type: string }
        name: { type: string }
        walletType: { type: string }
    Txn:
      type: object
      required: [txnId, txnType, channel, status, createdAt, updatedAt, amount]
      properties:
        txnId: { type: string, format: uuid }
        txnType: { type: string }
        channel: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        previousStatus: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        correlationId: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        fee: { $ref: "#/components/schemas/Amount" }
        initiator: { $ref: "#/components/schemas/Party" }
        debitParty: { $ref: "#/components/schemas/Party" }
        creditParty: { $ref: "#/components/schemas/Party" }
        partner:
          type: object
          properties:
            partnerId: { type: string }
            productCode: { type: string }
            billerCode: { type: string }
        partnerRef: { type: string }
        coreRef: { type: string }
        originalTxnId: { type: string }
        reversalTxnId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            messageBn: { type: string }
            retryable: { type: boolean }
        attributes:
          type: object
          additionalProperties: { type: string }
    TxnPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Txn" }
        limit: { type: integer }
        offset: { type: integer }
    TimelineEntry:
      type: object
      required: [kind, at]
      properties:
        kind: { type: string, enum: [STATE, CORE] }
        from: { $ref: "#/components/schemas/Status" }
        to: { $ref: "#/components/schemas/Status" }
        trigger: { type: string }
        command: { type: string }
        commandId: { type: string }
        sends: { type: integer, minimum: 1 }
        result: { type: string }
        outcome: { type: string, enum: [SUCCESS, FAILURE] }
        reasonCode: { type: string }
        at: { type: string, format: date-time }
        resultAt: { type: string, format: date-time }
    PartnerCall:
      type: object
      required: [requestId, operation, family, sentAt]
      properties:
        requestId: { type: string }
        operation: { type: string, enum: [PAY, STATUS_QUERY, CALLBACK] }
        family: { type: string }
        partnerId: { type: string }
        sentAt: { type: string, format: date-time }
        outcome: { type: string }
        partnerRef: { type: string }
        errorCode: { type: string }
        answeredAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [auditId, at, correlationId, actor, action, resource, outcome, service]
      properties:
        auditId: { type: string, format: uuid }
        month: { type: string }
        seq: { type: integer }
        recordedAt: { type: string, format: date-time }
        at: { type: string, format: date-time }
        txnId: { type: string, format: uuid }
        correlationId: { type: string }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        service: { type: string }
        sourceIp: { type: string }
        payloadRef: { type: string }
        before: { type: object }
        after: { type: object }
    TxnDetail:
      type: object
      required: [transaction, timeline, partnerCalls, auditTrail, revealed]
      properties:
        transaction: { $ref: "#/components/schemas/Txn" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        partnerCalls:
          type: array
          items: { $ref: "#/components/schemas/PartnerCall" }
        auditTrail:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        auditAnchor:
          type: object
          description: >-
            Status of the signed daily audit anchors (ticket 74, mw-audit-dw audit-query.v1
            AuditPage.anchor): INTACT, BROKEN (a signature, the anchor chain or a chain head does not
            check out), UNVERIFIED (not checked yet or the signing keys could not be read), OFF.
          required: [status]
          properties:
            status: { type: string, enum: [INTACT, BROKEN, UNVERIFIED, "OFF"] }
            lastAnchorDate: { type: string, format: date }
            verifiedAt: { type: string, format: date-time }
        revealed:
          type: boolean
          description: true when MSISDN party ids are unmasked (and the reveal was audited)
    TxnAction:
      type: string
      enum: [INQUIRE, FORCE_COMMIT, FORCE_RELEASE, REVERSE]
    WalletAction:
      type: string
      enum: [UNLOCK, PIN_RESET]
    WalletStatus:
      type: string
      description: >-
        The wallet's PIN-lock state an UNLOCK expects (LOCKED) and leads to (ACTIVE); a PIN_RESET
        leads to RESET (a new PIN set by the customer).
      enum: [LOCKED, ACTIVE, RESET]
    RoutingChange:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        action: { type: string, enum: [UPSERT, DELETE], default: UPSERT }
        value: { type: object, description: The full resource. Required for UPSERT. }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ChangeRequestStatus:
      type: string
      description: APPROVING (ticket 75) = claimed by a checker whose approval calls mw-crypto; reject and expiry refuse it
      enum: [PENDING, APPROVING, APPROVED, REJECTED, EXPIRED]
    ChangeRequest:
      type: object
      description: >-
        An `admin.change_request` (spec 15.3). For a transaction `diff` is the status the maker saw
        and the one the action leads to; `payload` what will be (or was) sent: for REVERSE the
        amount and, once approved, `reversalTxnId`; for the other actions, once approved,
        `actionId`. For a partner `diff` holds the changed config fields before and after;
        `payload` the `family`, the `baseVersion` the maker saw, the full `config` and, once
        approved, the published `version`.
        A `wallet` request (UNLOCK, ticket 52): `resourceId` the masked wallet id, `diff` LOCKED ->
        ACTIVE, `payload.unlockTxnId` (the UUIDv7 the core command and the audit carry) and, once
        approved, `commandId` and `authCommandId`. A `pin_reset` request (PIN_RESET, ticket 70): the
        same, `diff` LOCKED -> RESET and, once approved, `authCommandId` (the PIN_RESET command to mw-auth). A `ussd_menu` / `notify_template` request (ticket 39, action PUBLISH):
        `payload` the version to publish and, once approved, its `configKey` and `version`.
        A `key` request (ticket 75): `payload` the `keyId`, `purpose`, `version` (retire) and, for a
        ceremony, the `kid` it makes, the `shares` entered (share, custodian, enteredAt) and the
        combined `checkValue`; `diff` the key version before and after (`kid`, `state`).
        A `channel_client` request (ticket 100a): `payload` the full `client` definition and the
        `baseVersion` the maker saw (absent for a new client) and, once approved, the stored
        `version`; `diff` the changed fields before and after.
        A `partner_credential` request (ticket 131, action UPLOAD): `payload` the `partnerId`,
        `name`, `adapter`, the target `vaultPath` (`<adapter>/<partnerId>`), the `stagedRef` (where
        the upload waits in Vault) and `meta` (type, vaultFields, kid, fingerprint, subject,
        serialNumber, notAfter) and, once approved, the stored `version`; `diff` the metadata before
        and after. Never a secret. A `partner_error_map` request (action SET_ERROR_MAP): as a partner
        request; `diff` the `errorMap` / `ambiguousCodes` before and after.
      required: [id, resourceType, resourceId, action, payload, diff, makerId, status, reason, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: "#/components/schemas/ResourceType" }
        resourceId: { type: string, description: "txnId; wallet id (masked); partnerId; menuId; <code>/<channel>/<locale>; keyId; clientId; or <partnerId>/<name> (credential)" }
        action:
          anyOf:
            - { $ref: "#/components/schemas/TxnAction" }
            - { $ref: "#/components/schemas/WalletAction" }
            - { $ref: "#/components/schemas/PartnerAction" }
            - { $ref: "#/components/schemas/ContentAction" }
            - { $ref: "#/components/schemas/KeyAction" }
            - { $ref: "#/components/schemas/ChannelClientAction" }
            - { $ref: "#/components/schemas/CredentialAction" }
            - { $ref: "#/components/schemas/ErrorMapAction" }
        payload: { type: object }
        diff:
          type: object
          required: [before, after]
          properties:
            before: { $ref: "#/components/schemas/ChangeSide" }
            after: { $ref: "#/components/schemas/ChangeSide" }
        makerId: { type: string }
        status: { $ref: "#/components/schemas/ChangeRequestStatus" }
        checkerId: { type: string }
        reason: { type: string, description: The maker's reason }
        decisionReason: { type: string, description: The checker's reason for a rejection }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ChangeSide:
      type: object
      description: >-
        A transaction or wallet request: the `status`. A partner request: the changed config
        fields. A menu / template request (ticket 39): its `configKey` and `version` (before: the
        latest published version made here, absent for the first).
      properties:
        status:
          anyOf:
            - { $ref: "#/components/schemas/Status" }
            - { $ref: "#/components/schemas/WalletStatus" }
        configKey: { type: string }
        version: { type: integer, minimum: 1 }
    ContentVersion:
      type: object
      description: >-
        A version of a USSD menu or notification template (`admin.content_version`, ticket 39).
        PENDING while its change request waits, then PUBLISHED, REJECTED or EXPIRED. `value` (single
        version only) is what is (or would be) broadcast on `mw.config.changed.v1`; once published,
        its go-live times are the resolved ones.
      required: [configKey, version, status, changeRequestId, makerId, createdAt]
      properties:
        configKey: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [PENDING, PUBLISHED, REJECTED, EXPIRED] }
        changeRequestId: { type: string, format: uuid }
        makerId: { type: string }
        checkerId: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        value: { type: object }
    ContentVersionPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContentVersion" }
        limit: { type: integer }
        offset: { type: integer }
    ChangeRequestPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChangeRequest" }
        limit: { type: integer }
        offset: { type: integer }
    ResourceType:
      type: string
      enum: [transaction, wallet, pin_reset, partner, ussd_menu, notify_template, key, channel_client, partner_credential,
        partner_error_map]
    KeyAction:
      type: string
      description: Key changes and the key ceremony (ticket 75)
      enum: [KEY_GENERATE, KEY_ROTATE, KEY_RETIRE, KEY_CEREMONY]
    KeyId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    KeyPurpose:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{0,63}$"
    Key:
      type: object
      required: [keyId, purpose, algorithm, provider, versions]
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/KeyPurpose" }
        algorithm: { type: string }
        provider: { type: string }
        versions:
          type: array
          items:
            type: object
            required: [version, kid, state, createdAt]
            properties:
              version: { type: integer, minimum: 1 }
              kid: { type: string }
              state: { type: string, enum: [ACTIVE, VERIFY_ONLY, RETIRED] }
              createdAt: { type: string, format: date-time }
              rotatedAt: { type: [string, "null"], format: date-time }
    KeyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Key" }
    KeyCeremony:
      type: object
      required: [changeRequestId, keyId, purpose, status, shares]
      properties:
        changeRequestId: { type: string, format: uuid }
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/KeyPurpose" }
        kid: { type: string, description: "The key version it makes, once the first share is in" }
        status: { $ref: "#/components/schemas/ChangeRequestStatus" }
        shares:
          type: array
          maxItems: 2
          items:
            type: object
            required: [share, custodian, enteredAt]
            properties:
              share: { type: integer, enum: [1, 2] }
              custodian: { type: string }
              enteredAt: { type: string, format: date-time }
        checkValue: { type: string, pattern: "^[0-9A-F]{6}$", description: The combined key's KCV, once both shares are in }
    ContentAction:
      type: string
      description: A USSD menu or notify template version to publish (ticket 39)
      enum: [PUBLISH]
    PartnerAction:
      type: string
      enum: [ENABLE, DISABLE, SET_TIMEOUTS, UPSERT_ROUTE, SET_MAINTENANCE, SET_ENDPOINT]
    PartnerId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    PartnerFamily:
      type: string
      enum: [telco, billpay, bank]
      description: The adapter that serves the partner
    PartnerTimeouts:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        connectTimeoutMs: { type: integer, minimum: 1, maximum: 120000 }
        timeoutMs: { type: integer, minimum: 1, maximum: 120000, description: Time limit of one call (past it UNKNOWN) }
        readTimeoutMs: { type: integer, minimum: 1, maximum: 125000, description: Socket read timeout (default timeoutMs + 2000) }
    PartnerConfig:
      type: object
      description: >-
        The full config of one partner, in the field names of the adapters' partner record (spec
        12.1, ADR D28): a route + mappings + allowedHosts (+ dryRun for UPSERT_ROUTE); published
        unchanged as the `value` of `mw.config.changed.v1`. Never a secret: `auth.credentialsRef`
        names one of the partner's secrets in Vault (callback verification). The adapters check
        it again (host allowlist, https, JSONata compiles, dry-run) and keep the previous version
        when they refuse it. The old template shape (template, baseUrl, operations) went with
        ticket 84.
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: "false: every new call is refused unsent (default true)" }
        connectTimeoutMs: { type: integer, minimum: 1, maximum: 120000 }
        timeoutMs: { type: integer, minimum: 1, maximum: 120000 }
        readTimeoutMs: { type: integer, minimum: 1, maximum: 125000 }
        headers:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 256 }
        auth:
          type: object
          additionalProperties: false
          properties:
            scheme: { type: string, enum: [none, api-key, hmac-sha256] }
            credentialsRef: { type: string, maxLength: 64, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
            params:
              type: object
              maxProperties: 20
              additionalProperties: { type: string, maxLength: 256 }
        errorMap: { $ref: "#/components/schemas/PartnerErrorMap" }
        ambiguousCodes: { $ref: "#/components/schemas/PartnerAmbiguousCodes" }
        sensitiveFields:
          type: object
          maxProperties: 100
          additionalProperties: { type: string, enum: [MSISDN, NID, ACCOUNT, NAME, SECRET, PARTY_ID] }
        resilience: { type: string, minLength: 1, maxLength: 64 }
        route:
          type: string
          minLength: 1
          maxLength: 65536
          description: The partner's Camel YAML DSL route from direct:partner-<id>, built from the mw-* Kamelets (ticket 83)
        mappings:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 8000 }
          description: "JSONata mappings the route names (<OPERATION>.request, <OPERATION>.response, CALLBACK.response)"
        allowedHosts:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 253, pattern: "^[A-Za-z0-9.-]+$" }
          description: The hosts the route may call (guardrail 4)
        dryRun: { $ref: "#/components/schemas/PartnerDryRun" }
        maintenance:
          type: boolean
          description: "In maintenance now, until cleared (ticket 97): health MAINTENANCE, every call refused MW-SYS-PARTNER_MAINTENANCE (ticket 131b)"
        healthCheck: { type: boolean, description: "The route has a HEALTH_CHECK branch the adapter probes on a schedule (ticket 97)" }
        maintenanceWindow: { $ref: "#/components/schemas/PartnerMaintenanceWindow" }
        endpoint:
          type: string
          enum: [MOCK, REAL]
          description: "The selected endpoint profile (ticket 131b): the route's url={{endpoint}} is filled from endpoints[endpoint]"
        endpoints: { $ref: "#/components/schemas/PartnerEndpoints" }
    PartnerMaintenanceWindow:
      type: object
      additionalProperties: false
      description: >-
        A maintenance window (ticket 131b, FRS PLT-043): from start (absent: now) until end (absent:
        until cleared); inside it the adapter refuses every call with MW-SYS-PARTNER_MAINTENANCE and
        the bn/en message (absent: the adapters' default text), and its health is MAINTENANCE.
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        messageEn: { type: string, minLength: 1, maxLength: 500 }
        messageBn: { type: string, minLength: 1, maxLength: 500 }
    PartnerEndpoints:
      type: object
      additionalProperties: false
      description: >-
        The base URL of each endpoint profile (ticket 131b, FRS 10.4 criterion 3): http(s), host,
        port and plain path segments, host in allowedHosts. Switching the profile is a config
        change, never a route edit.
      properties:
        MOCK: { type: string, minLength: 8, maxLength: 512, pattern: "^https?://[A-Za-z0-9.-]{1,253}(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*/?$" }
        REAL: { type: string, minLength: 8, maxLength: 512, pattern: "^https?://[A-Za-z0-9.-]{1,253}(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*/?$" }
    PartnerDryRun:
      type: object
      required: [operation]
      additionalProperties: false
      description: >-
        What the adapter sends through the candidate route before the version goes live: operation
        with sample as the canonical input; against baseUrl (a partner sandbox, must be in
        allowedHosts) or the environment's simulator.
      properties:
        operation: { type: string, enum: [PAY, INQUIRY, STATUS_QUERY] }
        sample: { type: object, maxProperties: 50 }
        baseUrl: { type: string, minLength: 8, maxLength: 512, format: uri }
    PartnerRouteState:
      type: object
      required: [version, status]
      description: The route version last approved and what its adapter reported (mw.partner.route.status.v1)
      properties:
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [PENDING_DRY_RUN, LIVE, REJECTED] }
        problems: { type: array, items: { type: string } }
        kamelets: { type: array, items: { type: string } }
        statusAt: { type: string, format: date-time }
        liveVersion: { type: integer, minimum: 1, description: The newest version reported LIVE (absent while none is) }
    KameletUsage:
      type: object
      required: [kamelets]
      properties:
        kamelets:
          type: array
          items:
            type: object
            required: [name, routes]
            properties:
              name: { type: string }
              routes:
                type: array
                items:
                  type: object
                  required: [partnerId, version]
                  properties:
                    partnerId: { $ref: "#/components/schemas/PartnerId" }
                    version: { type: integer, minimum: 1 }
    Partner:
      type: object
      required: [partnerId, family, version, config, updatedAt, updatedBy]
      properties:
        partnerId: { $ref: "#/components/schemas/PartnerId" }
        family: { $ref: "#/components/schemas/PartnerFamily" }
        version: { type: integer, minimum: 0, description: "Last published version (0: seed, never published)" }
        config: { $ref: "#/components/schemas/PartnerConfig" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: The maker of the last change }
        approvedBy: { type: string, description: The checker of the last change }
        route: { $ref: "#/components/schemas/PartnerRouteState" }
    PartnerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Partner" }
    ChannelClientAction:
      type: string
      description: Register or replace a channel client with its full definition (ticket 100a)
      enum: [UPSERT]
    ChannelClientId:
      type: string
      description: The client id; its APISIX consumer (if any) is the id with `-` turned into `_`
      pattern: "^[a-z0-9][a-z0-9-]{1,63}$"
    ChannelClientType:
      type: string
      enum: [APP, MNO, PARTNER, MERCHANT, PORTAL]
    ChannelAuthMethod:
      type: string
      description: >-
        How the client authenticates. BASIC: an APISIX consumer with basic-auth (user = clientId,
        password in Vault `apisix/<clientId>` field `password`). JWT (Keycloak or mw-auth tokens) and
        HMAC (checked by the service, e.g. merchants and partner callbacks) have no consumer.
        OAUTH2_CC (ticket 100b) and MTLS (ticket 100c) are registered here but not projected yet.
      enum: [JWT, OAUTH2_CC, MTLS, HMAC, BASIC]
    ChannelClientSpec:
      type: object
      description: >-
        A client's definition, without secrets. `ratePerSec` (APISIX `limit-req`), `dailyQuota`
        (`limit-count`, 24 h window, 429) and `ipAllowList` (`ip-restriction`, 403) apply to clients
        with an APISIX consumer; left out = no limit of this kind. A consumer's plugin replaces a
        route's plugin of the same name for that consumer (APISIX precedence): a `dailyQuota` on a
        client whose routes have their own `limit-count` replaces that route limit for the client.
      required: [type, authMethod, allowedRoutes, ipAllowList, enabled]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/ChannelClientType" }
        authMethod: { $ref: "#/components/schemas/ChannelAuthMethod" }
        allowedRoutes:
          type: array
          maxItems: 64
          uniqueItems: true
          description: The APISIX route ids the client may call
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        ipAllowList:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Source addresses or CIDRs; empty = any source (the route's own allow-list still applies)
          items: { type: string, pattern: "^[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?$" }
        ratePerSec: { type: integer, minimum: 1, maximum: 100000 }
        dailyQuota: { type: integer, minimum: 1, maximum: 1000000000 }
        enabled: { type: boolean, description: "A disabled client keeps its row; its consumer has no credential (401)" }
    ChannelClient:
      type: object
      required: [clientId, type, authMethod, allowedRoutes, ipAllowList, enabled, version, updatedAt, updatedBy]
      properties:
        clientId: { $ref: "#/components/schemas/ChannelClientId" }
        type: { $ref: "#/components/schemas/ChannelClientType" }
        authMethod: { $ref: "#/components/schemas/ChannelAuthMethod" }
        allowedRoutes: { type: array, items: { type: string } }
        ipAllowList: { type: array, items: { type: string } }
        ratePerSec: { type: integer }
        dailyQuota: { type: integer }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1, description: The approved version (each approval adds one) }
        consumer: { type: string, description: The APISIX consumer it is projected to; absent when its auth method has none }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: The maker of the last change }
        approvedBy: { type: string, description: The checker of the last change }
    ChannelClientPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChannelClient" }
    PartnerErrorMap:
      type: object
      description: Partner code -> canonical code suffix (`MW-PTR-<PARTNER>-<suffix>`) and retryability (spec 12.1)
      maxProperties: 500
      additionalProperties:
        type: object
        required: [suffix]
        additionalProperties: false
        properties:
          suffix: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Z0-9_]+$" }
          retryable: { type: boolean }
    PartnerAmbiguousCodes:
      type: array
      description: Partner codes whose outcome is unknown (the transaction goes to inquiry)
      maxItems: 100
      items: { type: string, minLength: 1, maxLength: 64 }
    ErrorMapAction:
      type: string
      description: The response-code map change (ticket 131)
      enum: [SET_ERROR_MAP]
    CredentialAction:
      type: string
      description: A credential upload (ticket 131); a new value replaces the held one
      enum: [UPLOAD]
    CredentialType:
      type: string
      enum: [API_KEY, HMAC_SECRET, CLIENT_CERT]
    CredentialName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    Credential:
      type: object
      description: A partner credential's metadata (ticket 131). Never the secret.
      required: [credentialId, partnerId, name, adapter, type, vaultFields, kid, version, uploadedBy, approvedBy, uploadedAt]
      properties:
        credentialId: { type: string, description: "<partnerId>/<name>" }
        partnerId: { $ref: "#/components/schemas/PartnerId" }
        name: { $ref: "#/components/schemas/CredentialName" }
        adapter: { type: string, description: "The adapter whose Vault secret holds it (secret/<adapter>/<partnerId>)" }
        type: { $ref: "#/components/schemas/CredentialType" }
        vaultFields:
          type: array
          items: { type: string }
          description: The field names written in the partner's secret
        kid: { type: string, description: "<name>-v<version>" }
        fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$", description: A certificate's SHA-256 over its DER encoding }
        subject: { type: string, description: A certificate's subject DN }
        serialNumber: { type: string, description: A certificate's serial number (hex) }
        notAfter: { type: string, format: date-time }
        daysLeft: { type: integer, description: Whole days until notAfter (negative once expired) }
        version: { type: integer, minimum: 1 }
        uploadedBy: { type: string, description: The maker }
        approvedBy: { type: string, description: The checker }
        uploadedAt: { type: string, format: date-time, description: When the approval wrote it }
    CredentialPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Credential" }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time, description: "When the error was built, UTC ISO-8601 to the millisecond (FRS 3.7, ticket 92). Set by every service; optional for older senders." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
