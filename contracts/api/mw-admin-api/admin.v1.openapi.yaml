openapi: 3.1.0
info:
  title: upay admin API v1 (mw-admin-api)
  version: 1.0.0
  description: |
    Operations console API (ticket 36, spec 15). Reached by mw-admin-ui server-side through the
    internal APISIX route `/admin/v1/*` (Keycloak realm `ops`, password + TOTP); never by a browser
    directly. mw-admin-api checks the bearer token again (signature, expiry, issuer realm `ops`).
    Roles are the realm roles of spec 15.4 (`realm_access.roles`); a role name outside 15.4 grants
    nothing:
      - transactions (search, detail with saga timeline and audit trail): viewer, ops-maker,
        ops-checker, ops-emergency, recon-maker, recon-checker, compliance-officer, auditor;
      - `viewer` and `auditor` are read-only: any method other than GET/HEAD/OPTIONS under
        `/admin/**` is 403 MW-AUTH-002 unless the operator also holds a role that may write;
      - unmasked MSISDN (`reveal=true` on the detail): compliance-officer and auditor only; every
        reveal is audited (`mw.audit.event.v1`, action `admin.txn.msisdn.revealed`). Other roles
        asking for a reveal get the masked view (`revealed: false`) and no audit record.
    Customer data is masked (spec 18.3) as mw-orchestrator returns it: MSISDN `0171****789`,
    accounts last 4, names to the initial. Audit entries are returned as mw-audit-dw stores them
    (already masked). Every error is the 5.3 envelope: 401 MW-AUTH-001 (no or bad token), 403
    MW-AUTH-002 (role), 400 MW-VAL-001, 404 MW-VAL-003, 503 MW-SYS-040 (a query API is down,
    retryable).

    Maker-checker (ticket 37, spec 15.3): an operator action on a transaction (manual TSQ, force
    commit / release from MANUAL_REVIEW, reversal of a COMPLETED one) is never applied directly. The
    maker (`ops-maker`) creates a change request; a checker (`ops-checker`) who is a different user
    (token subject and username) approves or rejects it; a request not decided within 72 h
    expires. On approval the request is marked APPROVED, audited (before/after) and the action is
    sent to mw-orchestrator in one database transaction (`mw.txn.action.v1`, or a REVERSAL on
    `mw.txn.request.v1`); the orchestrator then moves the transaction, which the detail view shows.
    Every decision (create, approve, reject, expire) is audited on `mw.audit.event.v1` with
    `before`/`after`. Codes: 403 MW-AUTH-030 (the maker decides own request), 409 MW-VAL-030 (the
    action does not fit the transaction's current state), 409 MW-VAL-031 (the transaction already
    has an open request), 409 MW-VAL-032 (expired), 409 MW-VAL-033 (already decided).
    Partner config (ticket 38, spec 15.2 Partners, 15.3, 20.4): partners (schema `partner`) are
    changed only through a change request (resourceType `partner`): ENABLE, DISABLE, SET_TIMEOUTS
    or UPSERT (onboard / replace the full config). Makers `ops-maker` or `integration-maker`,
    checkers `ops-checker` or `integration-checker` (never the maker). On approval the partner
    tables are updated, the version goes up by one and the full config is published on the
    compacted topic `mw.config.changed.v1` (key `partner/<id>`), all in one database transaction;
    the adapters swap it in without a restart. A disabled partner refuses new calls unsent
    (`MW-SYS-PARTNER_DISABLED`). 409 MW-VAL-030 also means the change would change nothing or the
    partner changed after the request was made (the request stays PENDING).

    USSD menus and notification templates (ticket 39, spec 9.2, 10.3, 15.2): customer-facing text
    goes through the same maker-checker. An `ops-maker` proposes a version (checked at once: 400
    MW-VAL-040 with one `details` entry per problem); a different `ops-checker` approves it with
    the same approve endpoint, which marks the version PUBLISHED, audits it (resource
    `ussd_menu/<menuId>` or `notify_template/<code>/<channel>/<locale>`) and broadcasts it on
    `mw.config.changed.v1` in one database transaction. mw-ussd activates a menu per MNO at its
    go-live (running sessions keep their version); mw-notify switches to a template at its
    `validFrom`.
servers:
  - url: https://localhost
security:
  - opsBearer: []
paths:
  /admin/v1/transactions:
    get:
      operationId: searchTransactions
      summary: Search transactions, newest first
      description: >-
        Every filter is optional; filters are ANDed. `msisdn` in any accepted form (01..., 880...,
        +880..., with spaces or dashes) matches the initiator through the orchestrator's keyed hash.
      parameters:
        - { name: txnId, in: query, schema: { type: string, format: uuid } }
        - { name: msisdn, in: query, schema: { type: string, pattern: "^\\+?[0-9 -]{8,20}$" } }
        - { name: partnerRef, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: txnType, in: query, schema: { type: string, pattern: "^[A-Z0-9_]{1,32}$" } }
        - { name: from, in: query, description: Inclusive lower bound of createdAt, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive upper bound of createdAt, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/transactions/{txnId}:
    get:
      operationId: getTransaction
      summary: One transaction with its saga timeline, partner calls and audit trail
      description: >-
        `timeline` lists every state change (kind STATE) and core command (kind CORE) in order;
        `partnerCalls` every partner call; `auditTrail` the transaction's audit events in the order
        they happened (first 500). With `reveal=true` a compliance-officer or auditor gets MSISDN
        party ids unmasked (`revealed: true`) and the reveal is audited; anyone else gets the masked
        view (`revealed: false`).
      parameters:
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reveal, in: query, schema: { type: boolean, default: false } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The transaction, its timeline and its audit trail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/transactions/{txnId}/change-requests:
    post:
      operationId: requestTransactionAction
      summary: Ask for an operator action on a transaction (maker)
      description: >-
        Role `ops-maker`. Allowed actions per current status: INQUIRE in UNKNOWN or MANUAL_REVIEW;
        FORCE_COMMIT / FORCE_RELEASE in MANUAL_REVIEW; REVERSE in COMPLETED (not reversed yet, full
        amount). Nothing is applied until a different user approves. One open request per
        transaction. The request expires 72 h after creation.
      parameters:
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/TxnAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/wallets/{walletId}/change-requests:
    post:
      operationId: requestWalletAction
      summary: Ask for an operator action on a wallet (maker)
      description: >-
        Role `ops-maker` (ticket 52). UNLOCK clears the PIN lockout of a wallet locked after 5 wrong
        PINs. Nothing is applied until a different user (`ops-checker`) approves; the approval sends
        `UnlockWallet` to the core, which refuses it when the wallet is not locked. One open request
        per wallet. The request expires 72 h after creation. The wallet id is shown masked in every
        answer.
      parameters:
        - { name: walletId, in: path, required: true, schema: { type: string, pattern: "^01[3-9][0-9]{8}$" }, description: The wallet id (its MSISDN, 11 digits) }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/WalletAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/partners:
    get:
      operationId: listPartners
      summary: Partner configs (ticket 38)
      description: Roles that may read transactions, and integration-maker / integration-checker.
      parameters:
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Every partner, by id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/partners/{partnerId}:
    get:
      operationId: getPartner
      summary: One partner config, as published
      parameters:
        - { name: partnerId, in: path, required: true, schema: { $ref: "#/components/schemas/PartnerId" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/partners/{partnerId}/change-requests:
    post:
      operationId: requestPartnerChange
      summary: Ask for a partner config change (maker)
      description: >-
        Role `ops-maker` or `integration-maker`. ENABLE / DISABLE / SET_TIMEOUTS change an existing
        partner (404 MW-VAL-003 otherwise); SET_TIMEOUTS needs `timeouts`; UPSERT needs `config`
        (the full config) and, for a new partner, `family`. A change that changes nothing is 409
        MW-VAL-030. One open request per partner (409 MW-VAL-031). `diff` shows the changed fields
        before and after; `payload.config` the full config that is published on approval.
      parameters:
        - { name: partnerId, in: path, required: true, schema: { $ref: "#/components/schemas/PartnerId" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action: { $ref: "#/components/schemas/PartnerAction" }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
                family: { $ref: "#/components/schemas/PartnerFamily" }
                timeouts: { $ref: "#/components/schemas/PartnerTimeouts" }
                config: { $ref: "#/components/schemas/PartnerConfig" }
      responses:
        "201":
          description: The change request, PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/change-requests:
    get:
      operationId: listChangeRequests
      summary: Change requests, newest first
      description: Roles that may read transactions or partners. Filters are ANDed.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ChangeRequestStatus" } }
        - { name: resourceType, in: query, schema: { $ref: "#/components/schemas/ResourceType" } }
        - { name: resourceId, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of change requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequestPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/change-requests/{id}:
    get:
      operationId: getChangeRequest
      summary: One change request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The change request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/change-requests/{id}/approve:
    post:
      operationId: approveChangeRequest
      summary: Approve a pending change request (checker) and apply it
      description: >-
        Role `ops-checker` (transactions; partners also `integration-checker`), and not the maker
        (403 MW-AUTH-030). The transaction must still be in a status the action fits, a partner
        still at the version the maker saw (409 MW-VAL-030, the request stays PENDING). An expired request is
        marked EXPIRED and refused (409 MW-VAL-032). No request body.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The change request, APPROVED (the action is on its way to the orchestrator)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/change-requests/{id}/reject:
    post:
      operationId: rejectChangeRequest
      summary: Reject a pending change request (checker); nothing is applied
      description: >-
        Role `ops-checker` (transactions; partners also `integration-checker`), and not the maker
        (403 MW-AUTH-030).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The change request, REJECTED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/ussd-menus/{menuId}/change-requests:
    post:
      operationId: proposeUssdMenu
      summary: Propose a new version of a USSD menu and its go-live per MNO (maker)
      description: >-
        Role `ops-maker` (ticket 39, spec 9.2, 15.2). The tree is mw-ussd's menu JSON (`start`,
        `messages`, `nodes`); `menuId` and `version` inside it are set by the service. The tree is
        checked before anything is stored: every reference resolves, every node has what its type
        needs, a PIN input leads straight to an ACTION and is never stored, and every text (node
        texts, option labels, validator errors, the six engine messages) has both `bn` and `en`;
        otherwise 400 MW-VAL-040 with one `details` entry per problem. `activations` names each MNO
        (gp, robi, bl, teletalk) once, with an optional go-live time (the approval time when absent or
        earlier). The new version is PENDING with its change request (one open request per menu, 409
        MW-VAL-031); a different `ops-checker` approves it with `/admin/v1/change-requests/{id}/approve`,
        which publishes it on `mw.config.changed.v1` (configType USSD_MENU, configKey
        `ussd-menu/<menuId>`). mw-ussd then serves it to sessions that start after the go-live;
        running sessions finish on the version they started with.
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu, activations, reason]
              additionalProperties: false
              properties:
                menu:
                  type: object
                  required: [start, messages, nodes]
                  properties:
                    start: { type: string, minLength: 1 }
                    messages: { type: object }
                    nodes: { type: object, minProperties: 1 }
                activations:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [mno]
                    additionalProperties: false
                    properties:
                      mno: { type: string, minLength: 1, maxLength: 16 }
                      goLiveAt: { type: string, format: date-time }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING (`payload` = the version to publish)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/ussd-menus/{menuId}/versions:
    get:
      operationId: listUssdMenuVersions
      summary: Versions of a USSD menu, newest first (without the tree)
      description: Any spec 15.4 role.
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersionPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/ussd-menus/{menuId}/versions/{version}:
    get:
      operationId: getUssdMenuVersion
      summary: One version of a USSD menu, with its tree and go-live schedule
      description: Any spec 15.4 role.
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The version (`value` = `{menuId, version, menu, activations}`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/notify-templates/{code}/{channel}/{locale}/change-requests:
    post:
      operationId: proposeNotifyTemplate
      summary: Propose a new version of a notification template (maker)
      description: >-
        Role `ops-maker` (ticket 39, spec 10.3, 15.2). One template is a code (`A-Z0-9_`), channel
        (SMS, EMAIL) and locale (bn, en). The texts are logic-less: only plain `{{name}}`
        placeholders (no sections, partials, comments or triple braces); EMAIL needs a `subject` and
        may carry an `htmlBody`, SMS takes neither; `senderId` 1-11 letters, digits or spaces.
        Otherwise 400 MW-VAL-040 with one `details` entry per problem. The version is PENDING with its
        change request (one open request per template, 409 MW-VAL-031); a different `ops-checker`
        approves it with `/admin/v1/change-requests/{id}/approve`, which publishes it on
        `mw.config.changed.v1` (configType TEMPLATE, configKey `template/<code>/<channel>/<locale>`);
        mw-notify uses it for every message rendered from `validFrom` on (the approval time when
        absent or earlier).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" } }
        - { name: channel, in: path, required: true, schema: { type: string, enum: [SMS, EMAIL] } }
        - { name: locale, in: path, required: true, schema: { type: string, enum: [bn, en] } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, reason]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                subject: { type: string, minLength: 1, maxLength: 200 }
                htmlBody: { type: string, minLength: 1, maxLength: 20000 }
                senderId: { type: string, minLength: 1, maxLength: 11 }
                validFrom: { type: string, format: date-time }
                reason: { type: string, minLength: 1, maxLength: 500, description: Why (free text; masked in logs) }
      responses:
        "201":
          description: The change request, PENDING (`payload` = the version to publish)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/notify-templates/{code}/{channel}/{locale}/versions:
    get:
      operationId: listNotifyTemplateVersions
      summary: Versions of a notification template, newest first (without the texts)
      description: Any spec 15.4 role. Lists the versions made through this API (the seeded first versions live in mw-notify).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: channel, in: path, required: true, schema: { type: string } }
        - { name: locale, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersionPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/v1/notify-templates/{code}/{channel}/{locale}/versions/{version}:
    get:
      operationId: getNotifyTemplateVersion
      summary: One version of a notification template, with its texts
      description: Any spec 15.4 role.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: channel, in: path, required: true, schema: { type: string } }
        - { name: locale, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: "The version (`value` = `{code, channel, locale, version, body, subject?, htmlBody?, senderId?, validFrom?}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    opsBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of Keycloak realm `ops` (Authorization Code + PKCE, TOTP required)
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Status:
      type: string
      enum:
        [RECEIVED, VALIDATING, HOLDING, POSTING, PARTNER_PENDING, COMMITTING, RELEASING, UNKNOWN,
         COMPLETED, REJECTED, FAILED, REVERSING, REVERSED, MANUAL_REVIEW]
    Amount:
      type: object
      required: [valueMinor, currency]
      properties:
        valueMinor: { type: integer, minimum: 0, description: Poisha }
        currency: { type: string, const: BDT }
    Party:
      type: object
      description: A party; id masked by type unless revealed, name reduced to the initial.
      properties:
        type: { type: string }
        id: { type: string }
        name: { type: string }
        walletType: { type: string }
    Txn:
      type: object
      required: [txnId, txnType, channel, status, createdAt, updatedAt, amount]
      properties:
        txnId: { type: string, format: uuid }
        txnType: { type: string }
        channel: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        previousStatus: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        correlationId: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        fee: { $ref: "#/components/schemas/Amount" }
        initiator: { $ref: "#/components/schemas/Party" }
        debitParty: { $ref: "#/components/schemas/Party" }
        creditParty: { $ref: "#/components/schemas/Party" }
        partner:
          type: object
          properties:
            partnerId: { type: string }
            productCode: { type: string }
            billerCode: { type: string }
        partnerRef: { type: string }
        coreRef: { type: string }
        originalTxnId: { type: string }
        reversalTxnId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            messageBn: { type: string }
            retryable: { type: boolean }
        attributes:
          type: object
          additionalProperties: { type: string }
    TxnPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Txn" }
        limit: { type: integer }
        offset: { type: integer }
    TimelineEntry:
      type: object
      required: [kind, at]
      properties:
        kind: { type: string, enum: [STATE, CORE] }
        from: { $ref: "#/components/schemas/Status" }
        to: { $ref: "#/components/schemas/Status" }
        trigger: { type: string }
        command: { type: string }
        commandId: { type: string }
        sends: { type: integer, minimum: 1 }
        result: { type: string }
        outcome: { type: string, enum: [SUCCESS, FAILURE] }
        reasonCode: { type: string }
        at: { type: string, format: date-time }
        resultAt: { type: string, format: date-time }
    PartnerCall:
      type: object
      required: [requestId, operation, family, sentAt]
      properties:
        requestId: { type: string }
        operation: { type: string, enum: [PAY, STATUS_QUERY, CALLBACK] }
        family: { type: string }
        partnerId: { type: string }
        sentAt: { type: string, format: date-time }
        outcome: { type: string }
        partnerRef: { type: string }
        errorCode: { type: string }
        answeredAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [auditId, at, correlationId, actor, action, resource, outcome, service]
      properties:
        auditId: { type: string, format: uuid }
        month: { type: string }
        seq: { type: integer }
        recordedAt: { type: string, format: date-time }
        at: { type: string, format: date-time }
        txnId: { type: string, format: uuid }
        correlationId: { type: string }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        service: { type: string }
        sourceIp: { type: string }
        payloadRef: { type: string }
        before: { type: object }
        after: { type: object }
    TxnDetail:
      type: object
      required: [transaction, timeline, partnerCalls, auditTrail, revealed]
      properties:
        transaction: { $ref: "#/components/schemas/Txn" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        partnerCalls:
          type: array
          items: { $ref: "#/components/schemas/PartnerCall" }
        auditTrail:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        revealed:
          type: boolean
          description: true when MSISDN party ids are unmasked (and the reveal was audited)
    TxnAction:
      type: string
      enum: [INQUIRE, FORCE_COMMIT, FORCE_RELEASE, REVERSE]
    WalletAction:
      type: string
      enum: [UNLOCK]
    WalletStatus:
      type: string
      description: The wallet's PIN-lock state an UNLOCK expects (LOCKED) and leads to (ACTIVE); the core decides.
      enum: [LOCKED, ACTIVE]
    ChangeRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]
    ChangeRequest:
      type: object
      description: >-
        An `admin.change_request` (spec 15.3). For a transaction `diff` is the status the maker saw
        and the one the action leads to; `payload` what will be (or was) sent: for REVERSE the
        amount and, once approved, `reversalTxnId`; for the other actions, once approved,
        `actionId`. For a partner `diff` holds the changed config fields before and after;
        `payload` the `family`, the `baseVersion` the maker saw, the full `config` and, once
        approved, the published `version`.
        A `wallet` request (UNLOCK, ticket 52): `resourceId` the masked wallet id, `diff` LOCKED ->
        ACTIVE, `payload.unlockTxnId` (the UUIDv7 the core command and the audit carry) and, once
        approved, `commandId`. A `ussd_menu` / `notify_template` request (ticket 39, action PUBLISH):
        `payload` the version to publish and, once approved, its `configKey` and `version`.
      required: [id, resourceType, resourceId, action, payload, diff, makerId, status, reason, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: "#/components/schemas/ResourceType" }
        resourceId: { type: string, description: "txnId; wallet id (masked); partnerId; menuId; or <code>/<channel>/<locale>" }
        action:
          anyOf:
            - { $ref: "#/components/schemas/TxnAction" }
            - { $ref: "#/components/schemas/WalletAction" }
            - { $ref: "#/components/schemas/PartnerAction" }
            - { $ref: "#/components/schemas/ContentAction" }
        payload: { type: object }
        diff:
          type: object
          required: [before, after]
          properties:
            before: { $ref: "#/components/schemas/ChangeSide" }
            after: { $ref: "#/components/schemas/ChangeSide" }
        makerId: { type: string }
        status: { $ref: "#/components/schemas/ChangeRequestStatus" }
        checkerId: { type: string }
        reason: { type: string, description: The maker's reason }
        decisionReason: { type: string, description: The checker's reason for a rejection }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ChangeSide:
      type: object
      description: >-
        A transaction or wallet request: the `status`. A partner request: the changed config
        fields. A menu / template request (ticket 39): its `configKey` and `version` (before: the
        latest published version made here, absent for the first).
      properties:
        status:
          anyOf:
            - { $ref: "#/components/schemas/Status" }
            - { $ref: "#/components/schemas/WalletStatus" }
        configKey: { type: string }
        version: { type: integer, minimum: 1 }
    ContentVersion:
      type: object
      description: >-
        A version of a USSD menu or notification template (`admin.content_version`, ticket 39).
        PENDING while its change request waits, then PUBLISHED, REJECTED or EXPIRED. `value` (single
        version only) is what is (or would be) broadcast on `mw.config.changed.v1`; once published,
        its go-live times are the resolved ones.
      required: [configKey, version, status, changeRequestId, makerId, createdAt]
      properties:
        configKey: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [PENDING, PUBLISHED, REJECTED, EXPIRED] }
        changeRequestId: { type: string, format: uuid }
        makerId: { type: string }
        checkerId: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        value: { type: object }
    ContentVersionPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContentVersion" }
        limit: { type: integer }
        offset: { type: integer }
    ChangeRequestPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChangeRequest" }
        limit: { type: integer }
        offset: { type: integer }
    ResourceType:
      type: string
      enum: [transaction, wallet, partner, ussd_menu, notify_template]
    ContentAction:
      type: string
      description: A USSD menu or notify template version to publish (ticket 39)
      enum: [PUBLISH]
    PartnerAction:
      type: string
      enum: [ENABLE, DISABLE, SET_TIMEOUTS, UPSERT]
    PartnerId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    PartnerFamily:
      type: string
      enum: [telco, billpay, bank]
      description: The adapter that serves the partner
    PartnerTimeouts:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        connectTimeoutMs: { type: integer, minimum: 1, maximum: 120000 }
        timeoutMs: { type: integer, minimum: 1, maximum: 120000, description: Time limit of one call (past it UNKNOWN) }
        readTimeoutMs: { type: integer, minimum: 1, maximum: 125000, description: Socket read timeout (default timeoutMs + 2000) }
    PartnerOperation:
      type: object
      required: [method, path, response]
      additionalProperties: false
      properties:
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string, minLength: 1, maxLength: 256, pattern: "^/[A-Za-z0-9._~/{}-]*$" }
        definiteStatuses:
          type: array
          maxItems: 20
          items: { type: integer, minimum: 100, maximum: 599 }
        request: { type: string, maxLength: 8000, description: JSONata from the canonical call to the request body }
        response: { type: string, minLength: 1, maxLength: 8000, description: "JSONata from {status, body} to {outcome, partnerRef, code, message, reason}" }
    PartnerConfig:
      type: object
      description: >-
        The full config of one partner instance, in the field names of the adapters' partner
        framework (spec 12.1); published unchanged as the `value` of `mw.config.changed.v1`. Never a
        secret: `auth.credentialsRef` names one of the partner's secrets in OpenBao. The adapters
        check it again (endpoint host allowlist, https, JSONata compiles) and keep the previous
        config when they refuse it.
      required: [baseUrl, operations]
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: "false: every new call is refused unsent (default true)" }
        template: { type: string, enum: [rest-json-request-reply, rest-json-async-callback] }
        baseUrl: { type: string, minLength: 8, maxLength: 512, format: uri }
        connectTimeoutMs: { type: integer, minimum: 1, maximum: 120000 }
        timeoutMs: { type: integer, minimum: 1, maximum: 120000 }
        readTimeoutMs: { type: integer, minimum: 1, maximum: 125000 }
        headers:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 256 }
        auth:
          type: object
          additionalProperties: false
          properties:
            scheme: { type: string, enum: [none, api-key, hmac-sha256] }
            credentialsRef: { type: string, maxLength: 64, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
            params:
              type: object
              maxProperties: 20
              additionalProperties: { type: string, maxLength: 256 }
        operations:
          type: object
          minProperties: 1
          maxProperties: 20
          additionalProperties: { $ref: "#/components/schemas/PartnerOperation" }
        errorMap:
          type: object
          maxProperties: 500
          additionalProperties:
            type: object
            required: [suffix]
            additionalProperties: false
            properties:
              suffix: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Z0-9_]+$" }
              retryable: { type: boolean }
        ambiguousCodes:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 64 }
        sensitiveFields:
          type: object
          maxProperties: 100
          additionalProperties: { type: string, enum: [MSISDN, NID, ACCOUNT, NAME, SECRET, PARTY_ID] }
        resilience: { type: string, minLength: 1, maxLength: 64 }
    Partner:
      type: object
      required: [partnerId, family, version, config, updatedAt, updatedBy]
      properties:
        partnerId: { $ref: "#/components/schemas/PartnerId" }
        family: { $ref: "#/components/schemas/PartnerFamily" }
        version: { type: integer, minimum: 0, description: "Last published version (0: seed, never published)" }
        config: { $ref: "#/components/schemas/PartnerConfig" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: The maker of the last change }
        approvedBy: { type: string, description: The checker of the last change }
    PartnerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Partner" }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
