openapi: 3.1.0
info:
  title: Bits orchestrator test API v1 (mw-orchestrator, test-only)
  version: 1.1.0
  description: |
    Test-only API of mw-orchestrator (ticket 58), never part of the product. The host API suite
    (`tests/api`, Newman) plays operations' REVERSAL producer with it, checks that a request
    was taken in and walks a refused request to the DLQ, without the Docker CLI. Off unless mw-orchestrator runs with
    `MW_ORCHESTRATOR_TEST_API_ENABLED=true` (`mw.orchestrator.test-api.enabled`; the dev stack sets
    it); off, every path is 404. No auth in the service: APISIX exposes it only with
    `MW_E2E_ROUTES=1` as `/test/orchestrator/v1/*` (route `deploy/apisix/routes-test/
    test-orchestrator.json`, key-auth `apikey` of the test consumer `mw_e2e`, private source
    addresses only). Every error is the 5.3 envelope.
servers:
  - url: http://mw-orchestrator:8080
paths:
  /test/v1/reversals:
    post:
      operationId: publishTestReversal
      summary: Publish a REVERSAL of a stored transaction on mw.txn.request.v1
      description: >-
        Builds the REVERSAL as operations sends it (schemaVersion 1, fresh UUIDv7 txnId,
        idempotencyKey `test-rev-<uuidv7>`, channel SYSTEM, initiator ORG `bits-ops-test`, the
        original's credit party as debit party and debit party as credit party, the original's
        amount, `originalTxnId`, `attributes.reason`) and publishes it keyed by its txnId. The
        answer only says it was published: the orchestrator then handles it like any other
        request (the original shows REVERSING, REVERSED or MANUAL_REVIEW; a refusal is a REJECTED
        status under the new txnId). Errors: 400 MW-VAL-001/002 (bad body), 404 MW-VAL-003 (no
        such transaction).
      parameters:
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalTxnId]
              properties:
                originalTxnId: { type: string, format: uuid }
                reason: { type: string, maxLength: 200, description: "attributes.reason; default 'test reversal'" }
      responses:
        "202":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReversalAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /test/v1/txn-requests/{idempotencyKey}:
    get:
      operationId: getTxnRequestHandled
      summary: Whether the orchestrator recorded a request's idempotency key
      description: >-
        200 once `txn.idempotency` holds the key (any channel and initiator); 404 MW-VAL-003 while
        it does not. A repeated REVERSAL changes nothing else, so this is its only trace.
      parameters:
        - { name: idempotencyKey, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Handled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnRequestHandled" }
        "404": { $ref: "#/components/responses/Error" }
  /test/v1/poison-requests:
    post:
      operationId: publishTestPoisonRequest
      summary: Publish a request mw-orchestrator always refuses, to walk the retry topics to the DLQ
      description: >-
        Publishes on mw.txn.request.v1, keyed by a fresh UUIDv7 txnId, a record the listener can
        read but refuses on every attempt (schemaVersion, txnId and txnType only: no initiator,
        amount or requestedAt). It is retried on
        `mw.txn.request.v1.mw-orchestrator.retry.1..3` (`MW_KAFKA_RETRY_DELAYS`, production 10 s,
        1 min, 10 min) and then parked on `dlqTopic`. Nothing is stored. No body.
      parameters:
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "202":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoisonAccepted" }
  /test/v1/dlq-records/{txnId}:
    get:
      operationId: getTestDlqRecord
      summary: Whether a record keyed by txnId is parked on the mw.txn.request.v1 DLQ
      description: >-
        Reads mw-orchestrator's DLQ of mw.txn.request.v1 from its start to its current end
        (no consumer group, nothing committed). 200 once a record with the key is there; 404
        MW-VAL-003 while it is not; 400 MW-VAL-001 for a txnId that is not a UUID.
      parameters:
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Parked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DlqRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ReversalAccepted:
      type: object
      required: [txnId, idempotencyKey]
      additionalProperties: false
      properties:
        txnId: { type: string, format: uuid }
        idempotencyKey: { type: string }
    TxnRequestHandled:
      type: object
      required: [idempotencyKey, handled]
      additionalProperties: false
      properties:
        idempotencyKey: { type: string }
        handled: { type: boolean, const: true }
    PoisonAccepted:
      type: object
      required: [txnId, dlqTopic]
      additionalProperties: false
      properties:
        txnId: { type: string, format: uuid }
        dlqTopic: { type: string }
    DlqRecord:
      type: object
      required: [txnId, topic, parked]
      additionalProperties: false
      properties:
        txnId: { type: string, format: uuid }
        topic: { type: string }
        parked: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
