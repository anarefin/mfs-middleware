openapi: 3.1.0
info:
  title: Bits transaction query internal API (mw-orchestrator)
  version: 1.5.0
  description: |
    Internal, read-only API of mw-orchestrator (ticket 35, spec 15.2, 16.2): transaction search
    and the saga timeline. Clients: mw-admin-api (operators), mw-portal-api (an org sees only
    its own transactions: it always passes `orgId`) and mw-app-gateway (one wallet's history: it
    always passes `walletId`, 1.3.0), over the `app` zone network
    (`http://mw-orchestrator:8080`). Not routed by APISIX; no edge route. Nobody reads the `txn`
    schema directly.
    Customer data is masked in every response (spec 18.3): party ids by party type (MSISDN
    `0171****789`, accounts last 4), names to the initial; no PIN, no idempotency key. The MSISDN
    filter is matched through the keyed hash `initiator_hash` (HMAC-SHA256 over `<type>:<id>`, key
    in Vault), so the raw number is never indexed and an org id never matches an MSISDN. Every
    error is the 5.3 envelope.
    Reveal (1.2.0, ticket 36, spec 15.4): mw-admin-api may ask for one transaction with
    `reveal=true`; MSISDN party ids then come whole (account ids, names and free text stay masked).
    mw-admin-api grants it only to the roles compliance-officer and auditor and audits every reveal.
    Org scope: with `orgId` a transaction belongs to the org when the org initiated it (initiator
    `{ORG, orgId}`) or when it pays a biller or merchant wallet the org collects for (orchestrator
    config `mw.orchestrator.search.org-payees`); each such transaction carries `role` INITIATOR or
    PAYEE.
    Wallet scope (1.3.0, ADR D25): with `walletId` a transaction belongs to the wallet when the
    wallet is its debit party (`direction` OUT, any status) or its credit party (`direction` IN,
    only once the money reached it: COMPLETED, REVERSING or REVERSED; orchestrator config
    `mw.orchestrator.search.wallet-in-statuses`), for every channel (app, USSD, bulk credits).
    A wallet party is a party of type WALLET (any walletType) or MERCHANT, matched through a
    keyed hash of `WALLET:<MSISDN>`; an org, a top-up MSISDN, a bank account or a biller account
    is never one. Each such transaction carries `direction`.
    Quote (1.4.0, ticket 105, FRS CH-APP-05, PLT-026): `POST /internal/v1/quotes` answers what a
    transaction would cost before the customer enters the PIN: the core's charges (WAL-04), the
    payer's limit check (WAL-05) and, for a wallet payee, the payee's account (WAL-01) with the name
    to the initial. A read: no saga, no transaction, nothing stored, no money moves. Only
    mw-app-gateway calls it (a wallet-scoped client), always for the signed-in wallet.
servers:
  - url: http://mw-orchestrator:8080
security:
  - internalClientCredentials: []
paths:
  /internal/v1/transactions:
    get:
      operationId: searchTransactions
      summary: Search transactions, newest first
      description: >-
        Every filter is optional; filters are ANDed. `msisdn` matches an initiator of type MSISDN
        or WALLET (MSISDN in any accepted form: 01..., 880..., +880..., with spaces or dashes).
        `orgId` matches the transactions the org initiated (initiator type ORG) or is the payee
        of, each tagged with `role`. `walletId` matches the transactions the wallet paid or was
        paid by (see Wallet scope), each tagged with `direction`; `direction` narrows it to one
        side. Errors: 400 MW-VAL-001 (bad filter, limit outside 1..200, from not before to,
        direction without walletId).
      parameters:
        - { name: txnId, in: query, schema: { type: string, format: uuid } }
        - { name: msisdn, in: query, schema: { type: string, pattern: "^\\+?[0-9 -]{8,20}$" } }
        - { name: orgId, in: query, schema: { type: string, minLength: 1, maxLength: 64 } }
        - name: walletId
          in: query
          description: One wallet's history (1.3.0); an MSISDN in any accepted form
          schema: { type: string, pattern: "^\\+?[0-9 -]{8,20}$" }
        - name: direction
          in: query
          description: With walletId only; OUT what the wallet paid, IN what reached it
          schema: { type: string, enum: [IN, OUT] }
        - { name: partnerRef, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: txnType, in: query, schema: { type: string, pattern: "^[A-Z0-9_]{1,32}$" } }
        - name: parentTxnId
          in: query
          description: Children of one org bulk batch (`attributes.parentTxnId`, ticket 34)
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: from
          in: query
          description: Inclusive lower bound of createdAt
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive upper bound of createdAt
          schema: { type: string, format: date-time }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /internal/v1/quotes:
    post:
      operationId: quoteTransaction
      summary: Fee, VAT, commission, limit check and payee of a transaction, before the PIN (ticket 105)
      description: >-
        Asks the core (ADR D31) for the charges of `txnType` and `amount` for the payer's wallet
        type and channel, the payer's limit check and, when the payee is a wallet (`counterparty.type`
        WALLET), the payee's account. A limit the payer would break is not an error here:
        `limits.allowed` false with the core's `reasonCode` (the channel answers it). Errors: 400
        MW-VAL-001 (body), 401 / 403 (token, caller), 422 MW-CORE-CREDIT_WALLET_NOT_FOUND (no such
        payee wallet), 503 MW-SYS-CORE_UNAVAILABLE (the core gave no answer in time, retryable).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/transactions/{txnId}:
    get:
      operationId: getTransaction
      summary: One transaction with its saga timeline
      description: >-
        The timeline lists every state change (`kind` STATE) and every core command with its
        result (`kind` CORE: ValidateTransaction, PostTransfer, HoldFunds, CommitHold, ReleaseHold,
        CreditWallet, ReverseTransaction, QueryTransaction) in the order they happened;
        `partnerCalls` lists every partner call (PAY, STATUS_QUERY, CALLBACK) with its answer.
        With `orgId`, a transaction that org neither initiated nor is the payee of is 404, exactly
        like one that does not exist; otherwise the transaction carries the org's `role`. With
        `reveal=true` (reveal clients only, mw-admin-api) MSISDN party ids are not masked. Errors:
        400 MW-VAL-001 (bad txnId); 403 MW-AUTH-002 (reveal by another client); 404 MW-VAL-003.
      parameters:
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: orgId, in: query, schema: { type: string, minLength: 1, maxLength: 64 } }
        - name: reveal
          in: query
          description: MSISDN party ids unmasked (mw-admin-api only, audited there)
          schema: { type: boolean, default: false }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The transaction and its timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    internalClientCredentials:
      type: oauth2
      description: >-
        Keycloak realm `services` client-credentials JWT (spec 18.2, M3 gate decision). The
        service checks signature, expiry, exact issuer and that `aud` contains `mw-orchestrator`;
        the caller (`azp`) must be mw-portal-api (which must send `orgId` on every call),
        mw-admin-api or mw-app-gateway (wallet-scoped, 1.3.0: only the search, always with a
        non-blank `walletId`, and only the query parameters walletId, direction, txnType, status,
        from, to, limit and offset). No or bad token: 401 MW-AUTH-001; another client,
        mw-portal-api without `orgId`, mw-app-gateway outside its scope, or `reveal` from a client
        other than mw-admin-api: 403 MW-AUTH-002.
      flows:
        clientCredentials:
          tokenUrl: http://keycloak:8080/realms/services/protocol/openid-connect/token
          scopes: {}
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Status:
      type: string
      enum:
        [RECEIVED, VALIDATING, HOLDING, POSTING, PARTNER_PENDING, COMMITTING, RELEASING, UNKNOWN,
         COMPLETED, REJECTED, FAILED, REVERSING, REVERSED, MANUAL_REVIEW]
    Amount:
      type: object
      required: [valueMinor, currency]
      properties:
        valueMinor: { type: integer, minimum: 0, description: Poisha }
        currency: { type: string, const: BDT }
    Party:
      type: object
      description: A party with its id masked by type and its name reduced to the initial.
      properties:
        type: { type: string }
        id: { type: string }
        name: { type: string }
        walletType: { type: string }
    Txn:
      type: object
      required: [txnId, txnType, channel, status, createdAt, updatedAt, amount]
      properties:
        role:
          type: string
          enum: [INITIATOR, PAYEE]
          description: >-
            Only with `orgId`: INITIATOR when the org initiated the transaction, PAYEE when it pays
            a biller or merchant wallet the org collects for (INITIATOR wins when both hold).
        direction:
          type: string
          enum: [IN, OUT]
          description: >-
            Only with `walletId` (1.3.0): OUT when the wallet paid (debit party), IN when it was
            paid (credit party).
        txnId: { type: string, format: uuid }
        txnType: { type: string }
        channel: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        previousStatus: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        correlationId: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        fee: { $ref: "#/components/schemas/Amount" }
        initiator: { $ref: "#/components/schemas/Party" }
        debitParty: { $ref: "#/components/schemas/Party" }
        creditParty: { $ref: "#/components/schemas/Party" }
        partner:
          type: object
          properties:
            partnerId: { type: string }
            productCode: { type: string }
            billerCode: { type: string }
        partnerRef: { type: string }
        coreRef: { type: string }
        originalTxnId: { type: string }
        reversalTxnId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            messageBn: { type: string }
            retryable: { type: boolean }
        attributes:
          type: object
          description: Only the bulk links (parentTxnId, batchId, lineNo) and the SP's row reference.
          additionalProperties: { type: string }
    TxnPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Txn" }
        limit: { type: integer }
        offset: { type: integer }
    TxnDetail:
      type: object
      required: [transaction, timeline, partnerCalls]
      properties:
        transaction: { $ref: "#/components/schemas/Txn" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        partnerCalls:
          type: array
          items:
            type: object
            required: [requestId, operation, family, sentAt]
            properties:
              requestId: { type: string }
              operation: { type: string, enum: [PAY, STATUS_QUERY, CALLBACK] }
              family: { type: string }
              partnerId: { type: string }
              sentAt: { type: string, format: date-time }
              outcome: { type: string, description: Absent until the partner answered }
              partnerRef: { type: string }
              errorCode: { type: string }
              answeredAt: { type: string, format: date-time }
    TimelineEntry:
      type: object
      description: >-
        One saga timeline entry, ordered as it happened. STATE: a state change (`from`, `to`,
        `trigger`, `at`). CORE: a core command (`command`, `commandId`, first sent `at`, `sends` in
        all, resends keep the commandId) and, once the core answered, its `result` (the core event
        type, e.g. FundsHeld, HoldRejected, HoldCommitted), `outcome`, `reasonCode` and `resultAt`.
      required: [kind, at]
      properties:
        kind: { type: string, enum: [STATE, CORE] }
        from: { $ref: "#/components/schemas/Status" }
        to: { $ref: "#/components/schemas/Status" }
        trigger: { type: string, description: The saga event that caused the change }
        command:
          type: string
          enum:
            [ValidateTransaction, PostTransfer, HoldFunds, CommitHold, ReleaseHold, CreditWallet,
             ReverseTransaction, QueryTransaction]
        commandId: { type: string }
        sends: { type: integer, minimum: 1 }
        result: { type: string, description: Core event type; absent until the core answered }
        outcome: { type: string, enum: [SUCCESS, FAILURE] }
        reasonCode: { type: string }
        at: { type: string, format: date-time }
        resultAt: { type: string, format: date-time }
    QuoteRequest:
      type: object
      required: [walletId, walletType, txnType, amount]
      additionalProperties: false
      properties:
        walletId: { type: string, pattern: "^01[3-9][0-9]{8}$", description: "The payer's wallet (canonical MSISDN)" }
        walletType: { type: string, enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, DSO, PARTNER, ORGANISATION] }
        txnType: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        channel: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        amount: { $ref: "#/components/schemas/Amount" }
        counterparty:
          type: object
          required: [type, id]
          additionalProperties: false
          description: The payee; its account is read only for type WALLET
          properties:
            type: { type: string, enum: [WALLET, MSISDN, BILLER_ACCOUNT, BANK_ACCOUNT] }
            id: { type: string, minLength: 1, maxLength: 64 }
        productCode:
          type: string
          enum: [PREPAID, POSTPAID]
          description: >-
            A top-up only. POSTPAID fetches the bill once and returns outstanding and minimum;
            confirm does not fetch again. PREPAID is checked against the operator's denomination list.
    Quote:
      type: object
      required: [txnType, amount, fee, vat, commission, total, limits]
      properties:
        txnType: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        fee: { $ref: "#/components/schemas/Amount", description: "What the payer pays on top of the amount, VAT included" }
        vat: { $ref: "#/components/schemas/Amount", description: The VAT inside the fee }
        commission: { $ref: "#/components/schemas/Amount", description: The commission shares of the fee }
        total: { $ref: "#/components/schemas/Amount", description: amount + fee }
        limits:
          type: object
          required: [allowed]
          properties:
            allowed: { type: boolean }
            reasonCode:
              type: string
              description: The core's limit reason, only when not allowed (e.g. LIMIT_EXCEEDED_DAILY)
            remaining:
              type: object
              description: What is left before this amount; a limit the payer's rule does not set is left out
              properties:
                perTxn: { $ref: "#/components/schemas/Amount" }
                daily: { $ref: "#/components/schemas/Amount" }
                monthly: { $ref: "#/components/schemas/Amount" }
                dailyCount: { type: integer, minimum: 0 }
                monthlyCount: { type: integer, minimum: 0 }
        counterparty:
          type: object
          description: The payee, masked (MSISDN `0171****789`, name to the initial); a wallet payee's name and type from the core
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
            walletType: { type: string }
        outstanding:
          $ref: "#/components/schemas/Amount"
          description: Postpaid bill fetched for this quote (ticket 112b). Confirm pays up to this amount.
        minimum:
          $ref: "#/components/schemas/Amount"
          description: Minimum due of that bill. Confirm pays at least this amount.
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR(-[A-Z0-9_]+)?)(-[A-Z0-9_]+)$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time, description: "When the error was built, UTC ISO-8601 to the millisecond (FRS 3.7, ticket 92). Set by every service; optional for older senders." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
