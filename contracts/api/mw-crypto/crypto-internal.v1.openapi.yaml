openapi: 3.1.0
info:
  title: Bits HSM gateway internal API (mw-crypto)
  version: 1.0.0
  description: |
    Internal API of mw-crypto, the only HSM client (ticket 62, spec 18.8, ADR D23): key management
    by keyId. Every other service asks it by keyId and never holds key material; only key metadata
    is returned, and public keys. Its callers are mw-admin-api (key screens, ticket 75), mw-auth
    (ticket 67) and mw-audit-dw (ticket 74), over the `app` zone network (`https://mw-crypto:8080`);
    it is not routed by APISIX. The operations of ticket 63: PIN verify and derive, JWS sign and
    JWKS, HMAC sign and verify, tokenisation, envelope encryption (XML-DSig and HTTP signatures
    follow in ticket 65).

    mTLS is mandatory (ticket 66, D24): the TLS handshake needs a client certificate issued by the
    OpenBao services intermediate CA (`pki_int`, one role per service, CN = service name); without
    one the handshake fails. The caller also sends its client-credentials JWT, whose `azp` must
    equal the certificate's CN (else 403 MW-AUTH-002). Generating and rotating keys is narrower than
    reading: only the key-admin clients (`mw.internal-auth.key-admin-clients`, mw-admin-api), and
    generation only while the dev key bootstrap is on (`mw.crypto.bootstrap-keys`) until the key
    ceremony (ticket 75); otherwise 403 MW-AUTH-002.

    Operations are authorised per caller (the JWT `azp`, equal to the certificate CN), deny by
    default, 403 MW-AUTH-002 otherwise (`mw.crypto.authz`): `/pin/**` only mw-auth; `/jws/sign` by
    the key's purpose (also when named by keyId): JWT_SIGN and ASSERTION_SIGN mw-auth,
    AUDIT_ANCHOR_SIGN mw-audit-dw; `/tokens`, `/envelope/**` and `/hmac/**` by the key's purpose
    (TOKENISE_<domain>, KEK_<purpose>, HMAC_<use>) bound to its clients in configuration (dev
    defaults: TOKENISE_MSISDN and TOKENISE_NID mw-auth and mw-audit-dw, TOKENISE_ACCOUNT mw-audit-dw,
    KEK_COLUMN mw-auth; no HMAC_<use> and no other KEK_<purpose> yet). Public keys and
    `/jwks/{purpose}` stay open to every allowed caller.

    Key references: an operation names a key by keyId (its ACTIVE version) or by kid
    (`<keyId>.v<n>`, that version). New values (sign, derive, tokenise, encrypt) use the ACTIVE
    version only; checks of existing values (verify, decrypt) also accept the VERIFY_ONLY one. Errors
    of the operations: 400 MW-VAL-001 (bad body: shape, base64, length), 404 MW-VAL-010 (no such key
    or version), 400 MW-VAL-014 (PIN block does not decrypt or holds no 5-digit PIN), 400 MW-VAL-015
    (key of another purpose, or a version not usable for this), 400 MW-VAL-016 (envelope fails its
    integrity check), 503 MW-SYS-010 (HSM down, retryable, fail closed). A wrong PIN is not an error
    (`match: false`). Request values are never logged and never echoed in an error.

    Key versions: a key has versions `<keyId>.v<n>` (the JWS `kid` and HSM label). Rotation adds a
    version; the previous ACTIVE one becomes VERIFY_ONLY (verification still accepts it), an older
    VERIFY_ONLY one RETIRED. When the HSM cannot be reached the request fails closed with 503
    MW-SYS-010 (retryable). Every error is the 5.3 envelope.
servers:
  - url: https://mw-crypto:8080
security:
  - internalClientCredentials: []
    serviceCertificate: []
paths:
  /internal/v1/keys:
    get:
      operationId: listKeys
      summary: Every key and its versions (metadata only)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The keys, by keyId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: generateKey
      summary: Generate a key (dev and bootstrap only until the key ceremony, ticket 75)
      description: >-
        Generates version 1 of a new key in the HSM. Key-admin clients only, and only while the
        dev key bootstrap is on (403 MW-AUTH-002 otherwise). Errors: 400 MW-VAL-001 (bad body), 400
        MW-VAL-011 (unknown purpose), 409 MW-VAL-012 (keyId exists), 503 MW-SYS-010 (HSM down).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateKeyRequest" }
      responses:
        "201":
          description: The new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/keys/{keyId}/rotate:
    post:
      operationId: rotateKey
      summary: Add a version; the previous one stays VERIFY_ONLY until retired
      description: >-
        Key-admin clients only (403 MW-AUTH-002 otherwise). Errors: 404 MW-VAL-010 (unknown keyId),
        503 MW-SYS-010 (HSM down).
      parameters:
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The key with its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/keys/{keyId}/public:
    get:
      operationId: getPublicKey
      summary: Public key of every version in use, as PEM and JWK, plus a JWK Set
      description: >-
        Versions ACTIVE and VERIFY_ONLY. Errors: 404 MW-VAL-010 (unknown keyId), 400 MW-VAL-013
        (symmetric key: no public key), 503 MW-SYS-010 (HSM down).
      parameters:
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The public keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pin/verify:
    post:
      operationId: verifyPin
      summary: Check a PIN block against the stored PIN HMAC (mw-auth)
      description: >-
        Decrypts the transport block (RSA-OAEP SHA-256, MGF1-SHA-256) under PIN_TRANSPORT, checks the
        PIN is exactly 5 ASCII digits, takes HMAC-SHA256 under the PIN_HMAC version hmacKeyId over
        walletId 0x00 PIN and compares it with storedHmac in constant time. On a match under a
        VERIFY_ONLY version, `rehash` carries the value under the ACTIVE version to store instead.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPinRequest" }
      responses:
        "200":
          description: Match or no match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyPinResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pin/derive:
    post:
      operationId: derivePin
      summary: The PIN HMAC to store for a new PIN, or the weak-PIN rule it breaks (mw-auth)
      description: >-
        PIN set, change and reset. The weak-PIN rules of spec 18.7 run here on the clear PIN (all one
        digit, ascending or descending run, 5 consecutive MSISDN digits, the birth year, the last PIN),
        with the inputs mw-auth passes in policyInput. A weak PIN is answered 200 `{weak: true, rule}`
        without an HMAC.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DerivePinRequest" }
      responses:
        "200":
          description: The HMAC under the ACTIVE PIN_HMAC version, or the rule the PIN breaks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DerivePinResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/jws/sign:
    post:
      operationId: signJws
      summary: A compact JWS signed in the HSM (RS256, PS256, ES256)
      description: >-
        By the ACTIVE version of keyId or of the key of purpose (exactly one; JWT_SIGN,
        ASSERTION_SIGN, AUDIT_ANCHOR_SIGN). The header kid is the key version. RSA keys sign RS256
        (default) or PS256, EC keys ES256.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JwsSignRequest" }
      responses:
        "200":
          description: The JWS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwsSignResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/jwks/{purpose}:
    get:
      operationId: getJwks
      summary: JWK Set of every version in use (current and previous) of the keys of a purpose
      description: >-
        For an asymmetric purpose (JWT_SIGN, ASSERTION_SIGN, AUDIT_ANCHOR_SIGN, PIN_TRANSPORT,
        XMLDSIG); kid = `<keyId>.v<n>`. A purpose without keys gives an empty set. Errors: 400
        MW-VAL-011 (unknown purpose), 400 MW-VAL-013 (symmetric purpose), 503 MW-SYS-010.
      parameters:
        - name: purpose
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Purpose" }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The JWK Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/hmac/sign:
    post:
      operationId: signHmac
      summary: HMAC-SHA256 under an HMAC_<use> key (partner signatures, webhooks)
      description: >-
        Only HMAC_<use> keys: PIN_HMAC and TOKENISE_<domain> keys answer 400 MW-VAL-015 here.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HmacSignRequest" }
      responses:
        "200":
          description: The HMAC and the key version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HmacSigned" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/hmac/verify:
    post:
      operationId: verifyHmac
      summary: Check an HMAC (constant time) under the ACTIVE or VERIFY_ONLY version
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HmacVerifyRequest" }
      responses:
        "200":
          description: Valid or not, and the version that matched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HmacVerified" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/tokens:
    post:
      operationId: tokenise
      summary: Deterministic tokens of up to 500 values of one domain
      description: >-
        Token = `<DOMAIN>_` + base32 (RFC 4648, no padding) of HMAC-SHA256 under the ACTIVE
        TOKENISE_<domain> key over the value's UTF-8 bytes, as given (the caller normalises). The same
        value gives the same token until the key is rotated.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokeniseRequest" }
      responses:
        "200":
          description: One token per value, in order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/envelope/encrypt:
    post:
      operationId: encryptEnvelope
      summary: AES-256-GCM under a fresh data key wrapped by a KEK in the HSM
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvelopeEncryptRequest" }
      responses:
        "200":
          description: The envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/envelope/decrypt:
    post:
      operationId: decryptEnvelope
      summary: Open an envelope (the KEK version it names, ACTIVE or VERIFY_ONLY)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
      responses:
        "200":
          description: The plaintext
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plaintext" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    internalClientCredentials:
      type: oauth2
      description: >-
        Keycloak realm `services` client-credentials JWT (spec 18.2). The service checks
        signature, expiry, exact issuer and that `aud` contains `mw-crypto`; the caller (`azp`)
        must be mw-admin-api, mw-auth or mw-audit-dw and equal the client certificate's CN. No or
        bad token: 401 MW-AUTH-001; another client: 403 MW-AUTH-002.
      flows:
        clientCredentials:
          tokenUrl: http://keycloak:8080/realms/services/protocol/openid-connect/token
          scopes: {}
    serviceCertificate:
      type: mutualTLS
      description: >-
        A client certificate of the OpenBao services intermediate CA (`pki_int/issue/<service>`, CN
        = the calling service, at most 72 h). Required by the handshake (D24).
  parameters:
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/KeyId" }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    KeyId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    Purpose:
      type: string
      description: >-
        Spec 18.8 key purpose: PIN_TRANSPORT (RSA 3072), PIN_HMAC (HMAC-SHA256), JWT_SIGN (RSA
        3072, RS256), ASSERTION_SIGN and AUDIT_ANCHOR_SIGN (EC P-256, ES256), TOKENISE_<domain>
        (HMAC-SHA256), HMAC_<use> (HMAC-SHA256: partner signatures, webhooks), KEK_<purpose>
        (AES-256), XMLDSIG (RSA 3072).
      pattern: "^(PIN_TRANSPORT|PIN_HMAC|JWT_SIGN|ASSERTION_SIGN|AUDIT_ANCHOR_SIGN|XMLDSIG|TOKENISE_[A-Z][A-Z0-9]{0,23}|HMAC_[A-Z][A-Z0-9]{0,23}|KEK_[A-Z][A-Z0-9]{0,23})$"
    GenerateKeyRequest:
      type: object
      required: [purpose]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/Purpose" }
        keyId:
          description: Default the purpose in lower case with hyphens (JWT_SIGN -> jwt-sign)
          $ref: "#/components/schemas/KeyId"
    KeyVersion:
      type: object
      required: [version, kid, state, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        kid: { type: string, description: "<keyId>.v<version>: JWS kid and HSM label" }
        state: { type: string, enum: [ACTIVE, VERIFY_ONLY, RETIRED] }
        createdAt: { type: string, format: date-time }
        rotatedAt:
          type: [string, "null"]
          format: date-time
          description: When it left ACTIVE (or VERIFY_ONLY); null while ACTIVE
    Key:
      type: object
      required: [keyId, purpose, algorithm, provider, versions]
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        algorithm: { type: string, enum: [RSA_3072, EC_P256, HMAC_SHA256, AES_256] }
        provider: { type: string, description: "The provider holding the key (pkcs11)" }
        versions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/KeyVersion" }
    KeyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Key" }
    Jwk:
      type: object
      description: RFC 7517 public JWK (RSA n/e or EC crv/x/y), never a private member
      required: [kty, kid, alg, use]
      properties:
        kty: { type: string, enum: [RSA, EC] }
        kid: { type: string }
        alg: { type: string, enum: [RS256, ES256, RSA-OAEP-256] }
        use: { type: string, enum: [sig, enc] }
        n: { type: string }
        e: { type: string }
        crv: { type: string, enum: [P-256] }
        x: { type: string }
        "y": { type: string }
      not:
        anyOf:
          - required: [d]
          - required: [p]
          - required: [q]
    PublicKeyVersion:
      type: object
      required: [version, kid, state, pem, jwk]
      properties:
        version: { type: integer, minimum: 1 }
        kid: { type: string }
        state: { type: string, enum: [ACTIVE, VERIFY_ONLY] }
        pem: { type: string, pattern: "^-----BEGIN PUBLIC KEY-----\\n" }
        jwk: { $ref: "#/components/schemas/Jwk" }
    PublicKey:
      type: object
      required: [keyId, purpose, algorithm, versions, jwks]
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        algorithm: { type: string, enum: [RSA_3072, EC_P256] }
        versions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PublicKeyVersion" }
        jwks:
          type: object
          required: [keys]
          properties:
            keys:
              type: array
              items: { $ref: "#/components/schemas/Jwk" }
    KeyRef:
      type: string
      description: A keyId (its ACTIVE version) or a kid `<keyId>.v<n>` (that version)
      pattern: "^[a-z0-9][a-z0-9-]{0,62}(\\.v[1-9][0-9]{0,5})?$"
    Base64:
      type: string
      contentEncoding: base64
      pattern: "^[A-Za-z0-9+/]*={0,2}$"
    Hmac:
      type: string
      description: HMAC-SHA256, 32 bytes, standard base64
      pattern: "^[A-Za-z0-9+/]{43}=$"
    WalletId:
      type: string
      pattern: "^[A-Za-z0-9._:+-]{1,64}$"
    EncryptedPin:
      type: object
      description: >-
        PIN transport block: the PIN's ASCII digits encrypted RSA-OAEP (SHA-256, MGF1-SHA-256, empty
        label) under the PIN_TRANSPORT key keyId. Never logged.
      required: [keyId, ciphertext]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyRef" }
        ciphertext:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          minLength: 1
          maxLength: 4096
    PinHmac:
      type: object
      required: [hmac, hmacKeyId]
      additionalProperties: false
      properties:
        hmac: { $ref: "#/components/schemas/Hmac" }
        hmacKeyId: { $ref: "#/components/schemas/KeyRef" }
    VerifyPinRequest:
      type: object
      required: [walletId, encryptedPin, storedHmac, hmacKeyId]
      additionalProperties: false
      properties:
        walletId: { $ref: "#/components/schemas/WalletId" }
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
        storedHmac: { $ref: "#/components/schemas/Hmac" }
        hmacKeyId:
          description: The PIN_HMAC version storedHmac was made with (pin-hmac.v1)
          $ref: "#/components/schemas/KeyRef"
    VerifyPinResponse:
      type: object
      required: [match]
      additionalProperties: false
      properties:
        match: { type: boolean }
        rehash:
          description: Only on a match under a VERIFY_ONLY version; store it in place of the old value
          $ref: "#/components/schemas/PinHmac"
    PinPolicyInput:
      type: object
      description: Inputs of the weak-PIN rules (spec 18.7), configured in mw-auth; every field optional
      additionalProperties: false
      properties:
        msisdn: { type: string, pattern: "^\\+?[0-9]{8,15}$" }
        birthYear: { type: integer, minimum: 1900, maximum: 2100 }
        lastHmac: { $ref: "#/components/schemas/Hmac" }
        lastHmacKeyId:
          description: Required with lastHmac
          $ref: "#/components/schemas/KeyRef"
    DerivePinRequest:
      type: object
      required: [walletId, encryptedPin]
      additionalProperties: false
      properties:
        walletId: { $ref: "#/components/schemas/WalletId" }
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
        policyInput: { $ref: "#/components/schemas/PinPolicyInput" }
        hmacKeyId:
          description: >-
            Optional keyId of the PIN_HMAC key to use (its ACTIVE version); default the key of the
            purpose PIN_HMAC (pin-hmac)
          $ref: "#/components/schemas/KeyId"
    DerivePinResponse:
      type: object
      required: [weak]
      additionalProperties: false
      properties:
        weak: { type: boolean }
        rule:
          type: string
          enum: [REPEATED_DIGIT, SEQUENCE, MSISDN_DIGITS, BIRTH_YEAR, LAST_PIN]
        hmac: { $ref: "#/components/schemas/Hmac" }
        hmacKeyId: { $ref: "#/components/schemas/KeyRef" }
      oneOf:
        - properties: { weak: { const: false } }
          required: [hmac, hmacKeyId]
          not: { required: [rule] }
        - properties: { weak: { const: true } }
          required: [rule]
          not: { anyOf: [{ required: [hmac] }, { required: [hmacKeyId] }] }
    JwsSignRequest:
      type: object
      required: [payload]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyRef" }
        purpose: { type: string, enum: [JWT_SIGN, ASSERTION_SIGN, AUDIT_ANCHOR_SIGN] }
        alg:
          type: string
          enum: [RS256, PS256, ES256]
          description: Default RS256 for an RSA key, ES256 for an EC key
        header:
          type: object
          description: >-
            Extra protected header members (typ, cty, private names); alg, kid, jku, jwk, x5u, x5c,
            x5t, x5t#S256, crit, b64, enc, zip are refused (400 MW-VAL-001)
        payload:
          type: object
          description: The JSON claims, at most 64 KiB serialised
      oneOf:
        - required: [keyId]
          not: { required: [purpose] }
        - required: [purpose]
          not: { required: [keyId] }
    JwsSignResponse:
      type: object
      required: [jws, kid, alg]
      additionalProperties: false
      properties:
        jws: { type: string, pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]+$" }
        kid: { type: string, description: "<keyId>.v<n>, the header kid" }
        alg: { type: string, enum: [RS256, PS256, ES256] }
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/Jwk" }
    HmacSignRequest:
      type: object
      required: [keyId, data]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyRef" }
        data:
          description: The bytes to sign, at most 64 KiB
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 87384
    HmacVerifyRequest:
      type: object
      required: [keyId, data, mac]
      additionalProperties: false
      properties:
        keyId:
          description: A keyId (ACTIVE and VERIFY_ONLY versions are tried) or a kid (that version)
          $ref: "#/components/schemas/KeyRef"
        data:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 87384
        mac: { $ref: "#/components/schemas/Hmac" }
    HmacSigned:
      type: object
      required: [mac, kid]
      additionalProperties: false
      properties:
        mac: { $ref: "#/components/schemas/Hmac" }
        kid: { type: string }
    HmacVerified:
      type: object
      required: [valid]
      additionalProperties: false
      properties:
        valid: { type: boolean }
        kid: { type: string, description: The version that matched (when valid) }
    TokeniseRequest:
      type: object
      required: [domain, values]
      additionalProperties: false
      properties:
        domain: { type: string, enum: [MSISDN, NID, ACCOUNT] }
        values:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 64 }
    Tokens:
      type: object
      required: [domain, kid, tokens]
      additionalProperties: false
      properties:
        domain: { type: string, enum: [MSISDN, NID, ACCOUNT] }
        kid: { type: string, description: The TOKENISE_<domain> key version }
        tokens:
          type: array
          items: { type: string, pattern: "^(MSISDN|NID|ACCOUNT)_[A-Z2-7]{52}$" }
    EnvelopeEncryptRequest:
      type: object
      required: [plaintext]
      additionalProperties: false
      properties:
        kekId: { $ref: "#/components/schemas/KeyRef" }
        purpose: { type: string, pattern: "^KEK_[A-Z][A-Z0-9]{0,23}$" }
        plaintext:
          description: At most 1 MiB
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 1398104
        aad:
          description: Optional additional authenticated data, bound to the ciphertext
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 87384
      oneOf:
        - required: [kekId]
          not: { required: [purpose] }
        - required: [purpose]
          not: { required: [kekId] }
    Envelope:
      type: object
      required: [kekId, wrappedKey, iv, ciphertext]
      additionalProperties: false
      properties:
        kekId:
          description: The KEK version that wrapped the data key (kek-column.v1)
          $ref: "#/components/schemas/KeyRef"
        wrappedKey:
          description: The AES-256 data key wrapped in the HSM (opaque)
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          minLength: 1
          maxLength: 1024
        iv: { type: string, pattern: "^[A-Za-z0-9+/]{16}$", description: 12-byte GCM nonce }
        ciphertext:
          description: AES-256-GCM output with the 16-byte tag at the end
          allOf: [{ $ref: "#/components/schemas/Base64" }]
        aad: { $ref: "#/components/schemas/Base64" }
    Plaintext:
      type: object
      required: [plaintext]
      additionalProperties: false
      properties:
        plaintext: { $ref: "#/components/schemas/Base64" }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
