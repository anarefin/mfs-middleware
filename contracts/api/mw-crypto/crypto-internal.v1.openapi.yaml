openapi: 3.1.0
info:
  title: Bits HSM gateway internal API (mw-crypto)
  version: 1.0.0
  description: |
    Internal API of mw-crypto, the only HSM client (ticket 62, spec 18.8, ADR D23): key management
    by keyId. Every other service asks it by keyId and never holds key material; only key metadata
    is returned, and public keys. Its callers are mw-admin-api (key screens, ticket 75), mw-auth
    (ticket 67) and mw-audit-dw (ticket 74), over the `app` zone network (`https://mw-crypto:8080`);
    it is not routed by APISIX. The operations of ticket 63: PIN verify and derive, JWS sign and
    JWKS, HMAC sign and verify, tokenisation, envelope encryption. Ticket 65: XML-DSig sign and verify
    (`/xmldsig/**`) and RFC 9421 HTTP message signatures (`/http-signature/**`), building blocks
    for the ATM, interop and merchant SOAP adapters (no caller bound yet: purposes XMLDSIG,
    HTTP_SIGN_RSA, HTTP_SIGN_EC and HMAC_<use> are denied until an adapter ticket binds its client).
    Ticket 64: ISO 9564 PIN block translation and Visa PVV on the payShield provider
    (`/pinblock/translate`, `/pvv/{generate,verify}`; purposes TPK, ZPK, TPK_AES, ZPK_AES, PVK, no
    caller bound yet).

    mTLS is mandatory (ticket 66, D24): the TLS handshake needs a client certificate issued by the
    Vault services intermediate CA (`pki_int`, one role per service, CN = service name); without
    one the handshake fails. The caller also sends its client-credentials JWT, whose `azp` must
    equal the certificate's CN (else 403 MW-AUTH-002). Generating and rotating keys is narrower than
    reading: only the key-admin clients (`mw.internal-auth.key-admin-clients`, mw-admin-api), and
    generation only while the dev key bootstrap is on (`mw.crypto.bootstrap-keys`); otherwise 403
    MW-AUTH-002. The production route (ticket 75, OWN-08) is dual control in mw-admin-api: an
    approved change request applied with `PUT /key-changes/{changeRequestId}` (generate, rotate,
    retire; no bootstrap flag needed) or the key ceremony `/ceremonies/**` (two custodians'
    components combined inside the HSM, the KCV returned only). Both are key-admin clients only.

    Operations are authorised per caller (the JWT `azp`, equal to the certificate CN), deny by
    default, 403 MW-AUTH-002 otherwise (`mw.crypto.authz`): `/pin/**` only mw-auth; `/jws/sign` by
    the key's purpose (also when named by keyId): JWT_SIGN and ASSERTION_SIGN mw-auth,
    AUDIT_ANCHOR_SIGN mw-audit-dw; `/tokens`, `/envelope/**` and `/hmac/**` by the key's purpose
    (TOKENISE_<domain>, KEK_<purpose>, HMAC_<use>) bound to its clients in configuration (dev
    defaults: TOKENISE_MSISDN and TOKENISE_NID mw-auth and mw-audit-dw, TOKENISE_ACCOUNT mw-audit-dw,
    KEK_COLUMN mw-auth; no HMAC_<use> and no other KEK_<purpose> yet). Public keys and
    `/jwks/{purpose}` stay open to every allowed caller.

    Key references: an operation names a key by keyId (its ACTIVE version) or by kid
    (`<keyId>.v<n>`, that version). New values (sign, derive, tokenise, encrypt) use the ACTIVE
    version only; checks of existing values (verify, decrypt) also accept the VERIFY_ONLY one. Errors
    of the operations: 400 MW-VAL-001 (bad body: shape, base64, length), 404 MW-VAL-010 (no such key
    or version), 400 MW-VAL-014 (PIN block does not decrypt or holds no 5-digit PIN), 400 MW-VAL-015
    (key of another purpose, or a version not usable for this), 400 MW-VAL-016 (envelope fails its
    integrity check), 503 MW-SYS-010 (HSM down, retryable, fail closed). A wrong PIN is not an error
    (`match: false`). Request values are never logged and never echoed in an error.

    Key versions: a key has versions `<keyId>.v<n>` (the JWS `kid` and HSM label). Rotation adds a
    version; the previous ACTIVE one becomes VERIFY_ONLY (verification still accepts it), an older
    VERIFY_ONLY one RETIRED. When the HSM cannot be reached the request fails closed with 503
    MW-SYS-010 (retryable). Every error is the 5.3 envelope.
servers:
  - url: https://mw-crypto:8080
security:
  - internalClientCredentials: []
    serviceCertificate: []
paths:
  /internal/v1/keys:
    get:
      operationId: listKeys
      summary: Every key and its versions (metadata only)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The keys, by keyId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: generateKey
      summary: Generate a key (dev and bootstrap only until the key ceremony, ticket 75)
      description: >-
        Generates version 1 of a new key in the HSM. Key-admin clients only, and only while the
        dev key bootstrap is on (403 MW-AUTH-002 otherwise). Errors: 400 MW-VAL-001 (bad body), 400
        MW-VAL-011 (unknown purpose), 409 MW-VAL-012 (keyId exists), 503 MW-SYS-010 (HSM down).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateKeyRequest" }
      responses:
        "201":
          description: The new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/keys/{keyId}/rotate:
    post:
      operationId: rotateKey
      summary: Add a version; the previous one stays VERIFY_ONLY until retired
      description: >-
        Key-admin clients only (403 MW-AUTH-002 otherwise). Errors: 404 MW-VAL-010 (unknown keyId),
        503 MW-SYS-010 (HSM down).
      parameters:
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The key with its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/keys/{keyId}/public:
    get:
      operationId: getPublicKey
      summary: Public key of every version in use, as PEM and JWK, plus a JWK Set
      description: >-
        Versions ACTIVE and VERIFY_ONLY. Errors: 404 MW-VAL-010 (unknown keyId), 400 MW-VAL-013
        (symmetric key: no public key), 503 MW-SYS-010 (HSM down).
      parameters:
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The public keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/key-changes/{changeRequestId}:
    get:
      operationId: getKeyChange
      summary: Whether approval attempt {changeRequestId} was applied, cancelled, or neither yet
      description: >-
        The id is mw-admin-api's approval attempt (the claim token of one claim; a request released to
        PENDING is approved later under a new id).
      parameters:
        - $ref: "#/components/parameters/ChangeRequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The change's state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyChangeState" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: applyKeyChange
      summary: Apply a key change approved under dual control in mw-admin-api (ticket 75)
      description: >-
        GENERATE (version 1 of a new key, no bootstrap flag needed), ROTATE (add a version) or
        RETIRE (a VERIFY_ONLY version). The id is mw-admin-api's approval attempt (claim token);
        a cancelled id is refused (409 MW-VAL-018). Applied once per id; a repeat with the same
        action and keyId answers the key as it is now. Key-admin clients only (403 MW-AUTH-002).
        Errors: 400 MW-VAL-001 (bad body), 400 MW-VAL-011 (unknown purpose), 404 MW-VAL-010
        (unknown key or version), 409 MW-VAL-012 (keyId exists), 409 MW-VAL-018 (maker equals
        checker, a replay with other values, the ACTIVE version to retire), 503 MW-SYS-010.
      parameters:
        - $ref: "#/components/parameters/ChangeRequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyChangeRequest" }
      responses:
        "200":
          description: The key after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/key-changes/{changeRequestId}/cancel:
    post:
      operationId: cancelKeyChange
      summary: Make "not applied" binding for an approval attempt (idempotent)
      description: >-
        Writes a terminal CANCELLED tombstone for the id unless the change was applied, atomically with
        the PUT (whichever comes first wins); a later PUT of a cancelled id is 409 MW-VAL-018. Answers
        applied (with the key's ACTIVE kid) or cancelled. mw-admin-api calls it before it gives a
        claimed approval up (a refusal, or the reconciler after the lease).
      parameters:
        - $ref: "#/components/parameters/ChangeRequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Applied or cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyChangeState" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/ceremonies:
    get:
      operationId: listLiveCeremonies
      summary: The live (OPEN, COMBINED) ceremonies, for mw-admin-api's reconciler
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, enum: [LIVE] } }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The live ceremonies, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [ceremonyId, keyId, state, createdAt]
                      properties:
                        ceremonyId: { type: string, format: uuid }
                        keyId: { $ref: "#/components/schemas/KeyId" }
                        state: { type: string, enum: [OPEN, COMBINED] }
                        createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /internal/v1/ceremonies/{ceremonyId}:
    put:
      operationId: openCeremony
      summary: Open the ceremony of a KEY_CEREMONY change request (at filing time; idempotent)
      description: >-
        Version 1 of a new key or the next version of an existing one. The same values answer the
        ceremony as it is. Errors: 400 MW-VAL-015 (purpose not for a ceremony or another purpose
        than the key's), 409 MW-VAL-018 (other values, another live ceremony of the key, or the id
        was aborted: abort is terminal per id).
      parameters:
        - $ref: "#/components/parameters/CeremonyId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CeremonyOpenRequest" }
      responses:
        "200":
          description: The ceremony
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ceremony" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: getCeremony
      summary: A key ceremony (who entered which share, when; the KCV once combined)
      parameters:
        - $ref: "#/components/parameters/CeremonyId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The ceremony
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ceremony" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /internal/v1/ceremonies/{ceremonyId}/components:
    post:
      operationId: enterCeremonyComponent
      summary: One custodian's component; the second is combined with the first inside the HSM
      description: >-
        The ceremony id is mw-admin-api's KEY_CEREMONY change request; the ceremony must be OPEN
        (opened by `PUT /ceremonies/{ceremonyId}`, never by a component: 404 MW-VAL-003 for an id not
        opened, 409 MW-VAL-018 once aborted). The first component is stored in the HSM as a
        derive-only object; the second, from another custodian, is combined
        with it inside the HSM (ECDH of the two P-256 scalars, CKM_ECDH1_DERIVE) into the staged
        key version, and only its KCV is returned. The key is not usable before commit. Components
        are never stored or logged. Purposes: HMAC-SHA256 keys (PIN_HMAC, TOKENISE_<domain>,
        HMAC_<use>). Key-admin clients only. Errors: 400 MW-VAL-001 (bad body), 400 MW-VAL-015
        (purpose not for a ceremony, or another purpose than the key's), 400 MW-VAL-017 (component
        is no scalar or does not match its check value), 409 MW-VAL-018 (another live ceremony of
        the key, same custodian twice, no more components taken), 503 MW-SYS-010.
      parameters:
        - $ref: "#/components/parameters/CeremonyId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CeremonyComponentRequest" }
      responses:
        "200":
          description: The ceremony after the share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ceremony" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/ceremonies/{ceremonyId}/commit:
    post:
      operationId: commitCeremony
      summary: The approved ceremony's key version becomes ACTIVE (idempotent)
      description: >-
        Errors: 404 MW-VAL-003 (no such ceremony), 409 MW-VAL-018 (not both shares in, maker equals
        checker, the key changed meanwhile).
      parameters:
        - $ref: "#/components/parameters/CeremonyId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CeremonyCommitRequest" }
      responses:
        "200":
          description: The key with the new ACTIVE version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/ceremonies/{ceremonyId}/abort:
    post:
      operationId: abortCeremony
      summary: Destroy the ceremony's staged HSM objects (rejected or expired request; idempotent)
      description: >-
        Terminal per id: an id never opened gets an ABORTED tombstone, so a late open or component is
        refused; aborted again is no error. Errors 409 MW-VAL-018 (committed).
      parameters:
        - $ref: "#/components/parameters/CeremonyId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204": { description: Aborted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pin/verify:
    post:
      operationId: verifyPin
      summary: Check a PIN block against the stored PIN HMAC (mw-auth)
      description: >-
        Decrypts the transport block (RSA-OAEP SHA-256, MGF1-SHA-256) under PIN_TRANSPORT, checks the
        PIN is exactly 5 ASCII digits, takes HMAC-SHA256 under the PIN_HMAC version hmacKeyId over
        walletId 0x00 PIN and compares it with storedHmac in constant time. On a match under a
        VERIFY_ONLY version, `rehash` carries the value under the ACTIVE version to store instead.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPinRequest" }
      responses:
        "200":
          description: Match or no match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyPinResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pin/derive:
    post:
      operationId: derivePin
      summary: The PIN HMAC to store for a new PIN, or the weak-PIN rule it breaks (mw-auth)
      description: >-
        PIN set, change and reset. The weak-PIN rules of spec 18.7 run here on the clear PIN (all one
        digit, ascending or descending run, 5 consecutive MSISDN digits, the birth year, the last PIN),
        with the inputs mw-auth passes in policyInput. A weak PIN is answered 200 `{weak: true, rule}`
        without an HMAC.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DerivePinRequest" }
      responses:
        "200":
          description: The HMAC under the ACTIVE PIN_HMAC version, or the rule the PIN breaks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DerivePinResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/jws/sign:
    post:
      operationId: signJws
      summary: A compact JWS signed in the HSM (RS256, PS256, ES256)
      description: >-
        By the ACTIVE version of keyId or of the key of purpose (exactly one; JWT_SIGN,
        ASSERTION_SIGN, AUDIT_ANCHOR_SIGN). The header kid is the key version. RSA keys sign RS256
        (default) or PS256, EC keys ES256.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JwsSignRequest" }
      responses:
        "200":
          description: The JWS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwsSignResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/jwks/{purpose}:
    get:
      operationId: getJwks
      summary: JWK Set of every version in use (current and previous) of the keys of a purpose
      description: >-
        For an asymmetric purpose (JWT_SIGN, ASSERTION_SIGN, AUDIT_ANCHOR_SIGN, PIN_TRANSPORT,
        XMLDSIG, HTTP_SIGN_RSA, HTTP_SIGN_EC); kid = `<keyId>.v<n>`. A purpose without keys gives an empty set. Errors: 400
        MW-VAL-011 (unknown purpose), 400 MW-VAL-013 (symmetric purpose), 503 MW-SYS-010.
      parameters:
        - name: purpose
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Purpose" }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The JWK Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/hmac/sign:
    post:
      operationId: signHmac
      summary: HMAC-SHA256 under an HMAC_<use> key (partner signatures, webhooks)
      description: >-
        Only HMAC_<use> keys: PIN_HMAC and TOKENISE_<domain> keys answer 400 MW-VAL-015 here.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HmacSignRequest" }
      responses:
        "200":
          description: The HMAC and the key version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HmacSigned" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/hmac/verify:
    post:
      operationId: verifyHmac
      summary: Check an HMAC (constant time) under the ACTIVE or VERIFY_ONLY version
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HmacVerifyRequest" }
      responses:
        "200":
          description: Valid or not, and the version that matched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HmacVerified" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/tokens:
    post:
      operationId: tokenise
      summary: Deterministic tokens of up to 500 values of one domain
      description: >-
        Token = `<DOMAIN>_` + base32 (RFC 4648, no padding) of HMAC-SHA256 under the ACTIVE
        TOKENISE_<domain> key over the value's UTF-8 bytes, as given (the caller normalises). The same
        value gives the same token until the key is rotated.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokeniseRequest" }
      responses:
        "200":
          description: One token per value, in order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/envelope/encrypt:
    post:
      operationId: encryptEnvelope
      summary: AES-256-GCM under a fresh data key wrapped by a KEK in the HSM
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvelopeEncryptRequest" }
      responses:
        "200":
          description: The envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/envelope/decrypt:
    post:
      operationId: decryptEnvelope
      summary: Open an envelope (the KEK version it names, ACTIVE or VERIFY_ONLY)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
      responses:
        "200":
          description: The plaintext
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plaintext" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/xmldsig/sign:
    post:
      operationId: signXml
      summary: Enveloped XML-DSig signature (RSA-SHA256, exclusive C14N) by an XMLDSIG key (ticket 65)
      description: >-
        One profile (NPSB / BanglaQR ISO 20022, SOAP partners): `ds:Signature` appended as the last
        child of the document element, one `Reference URI=""` with the enveloped-signature and
        exclusive C14N transforms and SHA-256, `SignedInfo` in exclusive C14N, RSA-SHA256 in the HSM,
        `KeyInfo/KeyName` = the key version. The document is at most 1 MiB and has no DOCTYPE (XXE
        off): otherwise 400 MW-VAL-001. Caller policy: purpose XMLDSIG (no caller bound yet).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XmlDsigSignRequest" }
      responses:
        "200":
          description: The signed document and the key version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XmlDsigSigned" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/xmldsig/verify:
    post:
      operationId: verifyXml
      summary: Verify an enveloped XML-DSig signature under an XMLDSIG key or a partner PEM (ticket 65)
      description: >-
        Only the sign profile verifies, which refuses signature wrapping: exactly one `ds:Signature`
        (else MULTIPLE_SIGNATURES / SIGNATURE_MISSING), a child of the document element
        (SIGNATURE_PLACEMENT), one reference to the whole document and no `ds:Object`
        (REFERENCE_NOT_ALLOWED), RSA-SHA256, SHA-256 and exclusive C14N (ALGORITHM_NOT_ALLOWED). The
        key is the one named here, never the document's KeyInfo; a certificate outside its validity
        is CERTIFICATE_NOT_VALID. A signature that does not verify is `valid: false` with a reason,
        not an error. Caller policy: purpose XMLDSIG, also with a PEM.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XmlDsigVerifyRequest" }
      responses:
        "200":
          description: Valid or not, the key version that matched, or the reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureCheck" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/http-signature/sign:
    post:
      operationId: signHttpMessage
      summary: RFC 9421 HTTP message signature over the given components (ticket 65)
      description: >-
        The caller derives the component values from its message (RFC 9421 section 2); mw-crypto
        builds the signature base, signs it in the HSM and answers the `Signature-Input` and
        `Signature` dictionary members. Keys: HTTP_SIGN_EC (ecdsa-p256-sha256), HTTP_SIGN_RSA
        (rsa-pss-sha512, default, or rsa-v1_5-sha256), HMAC_<use> (hmac-sha256). Parameters `created`
        (default now), `expires`, `nonce`, `keyid` (the key version), `alg`, `tag`. A value with a
        line break or a non-printable character, a component named twice, `@signature-params` or an
        unknown component parameter is 400 MW-VAL-001. Caller policy: the key's purpose (none bound yet).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HttpSignatureSignRequest" }
      responses:
        "200":
          description: The Signature-Input and Signature members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HttpSignatureSigned" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/http-signature/verify:
    post:
      operationId: verifyHttpMessage
      summary: Verify an RFC 9421 HTTP message signature (ticket 65)
      description: >-
        Parses the received `Signature-Input` and `Signature` field values (RFC 8941), rebuilds the
        signature base from the caller's component values and checks, in this order: the fields
        parse and hold `label` (MALFORMED_SIGNATURE), `requiredComponents` are covered, compared by
        full identity (name and parameters, so a covered `"content-digest";req` does not satisfy a
        required `content-digest`) (REQUIRED_COMPONENT_NOT_COVERED), every covered component has a value (COMPONENT_MISSING),
        `keyid` equals `expectedKeyid` (KEY_MISMATCH), `alg` fits (ALGORITHM_NOT_ALLOWED), `expires`
        (EXPIRED), `created` at most 60 s ahead (CREATED_IN_FUTURE) and within `maxAgeSeconds`
        (CREATED_MISSING, TOO_OLD), then the signature (SIGNATURE_MISMATCH). Under a keyId its ACTIVE
        and VERIFY_ONLY versions are tried (a kid in `keyid` picks one); a partner PEM is RSA or EC
        P-256. Caller policy: the key's purpose; a PEM by its type (HTTP_SIGN_RSA or HTTP_SIGN_EC).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HttpSignatureVerifyRequest" }
      responses:
        "200":
          description: Valid or not, the key version that matched, or the reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureCheck" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pinblock/translate:
    post:
      operationId: translatePinBlock
      summary: Re-encipher an ISO 9564 PIN block under a ZPK (payShield CA / CC, ticket 64)
      description: >-
        The PIN block under a TPK (payShield CA) or ZPK (CC) as a block of the destination format
        under a ZPK; the clear PIN exists only inside the HSM. ISO4 needs an AES key (TPK_AES,
        ZPK_AES), ISO0, ISO1 and ISO3 a triple DES key (TPK, ZPK), else 400 MW-VAL-015. Authorised by
        the purpose of both keys (`mw.crypto.authz.purposes`; no caller is bound yet: the ATM and
        interop adapters will be). Only the configured format pairs translate (never ISO0, ISO3 or
        ISO4 into ISO1, which binds the PIN to no account): else 400 MW-VAL-015. A block the HSM
        refuses is 400 MW-VAL-014; a key it refuses (parity) 400 MW-VAL-015; the HSM down or refusing
        the command 503 MW-SYS-010.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslatePinBlockRequest" }
      responses:
        "200":
          description: The translated block and the ZPK version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslatedPinBlock" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pvv/generate:
    post:
      operationId: generatePvv
      summary: Visa PVV of the PIN in a PIN block (payShield JC / JE + DG, ticket 64)
      description: >-
        The 4-digit Visa PIN verification value of the PIN in `pinBlock` (under a TPK or ZPK) under
        the ACTIVE version of the PVK pair `pvkId` and the index `pvki`. Authorised by the purpose of
        both keys (no caller bound yet). Errors as /pinblock/translate.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PvvGenerateRequest" }
      responses:
        "200":
          description: The PVV and the PVK version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PvvGenerated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pvv/verify:
    post:
      operationId: verifyPvv
      summary: Check the PIN in a PIN block against a stored PVV (payShield DC / EC, ticket 64)
      description: >-
        A wrong PIN (payShield error 01) and any PIN block the HSM refuses are both `match: false`,
        not an error, so the answer is no oracle on the PIN; only request-shape checks before the HSM
        (400 MW-VAL-*) and key or HSM failures stay errors. Attempt counting and lockout are the
        caller's job. The PVK may be the ACTIVE or the VERIFY_ONLY version. Authorised by the purpose
        of both keys (no caller bound yet).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PvvVerifyRequest" }
      responses:
        "200":
          description: Match or not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PvvVerified" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    internalClientCredentials:
      type: oauth2
      description: >-
        Keycloak realm `services` client-credentials JWT (spec 18.2). The service checks
        signature, expiry, exact issuer and that `aud` contains `mw-crypto`; the caller (`azp`)
        must be mw-admin-api, mw-auth or mw-audit-dw and equal the client certificate's CN. No or
        bad token: 401 MW-AUTH-001; another client: 403 MW-AUTH-002.
      flows:
        clientCredentials:
          tokenUrl: http://keycloak:8080/realms/services/protocol/openid-connect/token
          scopes: {}
    serviceCertificate:
      type: mutualTLS
      description: >-
        A client certificate of the Vault services intermediate CA (`pki_int/issue/<service>`, CN
        = the calling service, at most 72 h). Required by the handshake (D24).
  parameters:
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/KeyId" }
    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CeremonyId:
      name: ceremonyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    KeyId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    Purpose:
      type: string
      description: >-
        Spec 18.8 key purpose: PIN_TRANSPORT (RSA 3072), PIN_HMAC (HMAC-SHA256), JWT_SIGN (RSA
        3072, RS256), ASSERTION_SIGN and AUDIT_ANCHOR_SIGN (EC P-256, ES256), TOKENISE_<domain>
        (HMAC-SHA256), HMAC_<use> (HMAC-SHA256: partner signatures, webhooks), KEK_<purpose>
        (AES-256), XMLDSIG (RSA 3072), HTTP_SIGN_RSA (RSA 3072, RFC 9421 rsa-pss-sha512 /
        rsa-v1_5-sha256), HTTP_SIGN_EC (EC P-256, ecdsa-p256-sha256); payShield (ticket 64): ZPK, TPK,
        PVK (double length triple DES, under the LMK), ZPK_AES, TPK_AES (AES-128, ISO format 4).
      pattern: "^(PIN_TRANSPORT|PIN_HMAC|JWT_SIGN|ASSERTION_SIGN|AUDIT_ANCHOR_SIGN|XMLDSIG|HTTP_SIGN_RSA|HTTP_SIGN_EC|ZPK|TPK|ZPK_AES|TPK_AES|PVK|TOKENISE_[A-Z][A-Z0-9]{0,23}|HMAC_[A-Z][A-Z0-9]{0,23}|KEK_[A-Z][A-Z0-9]{0,23})$"
    GenerateKeyRequest:
      type: object
      required: [purpose]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/Purpose" }
        keyId:
          description: Default the purpose in lower case with hyphens (JWT_SIGN -> jwt-sign)
          $ref: "#/components/schemas/KeyId"
    OperatorId:
      type: string
      pattern: "^[A-Za-z0-9._@-]{1,128}$"
    KeyChangeRequest:
      type: object
      required: [action, keyId, makerId, checkerId]
      additionalProperties: false
      properties:
        action: { type: string, enum: [GENERATE, ROTATE, RETIRE] }
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose:
          description: GENERATE only
          $ref: "#/components/schemas/Purpose"
        version: { type: integer, minimum: 1, maximum: 999999, description: "RETIRE only: a VERIFY_ONLY version" }
        makerId: { $ref: "#/components/schemas/OperatorId" }
        checkerId: { $ref: "#/components/schemas/OperatorId" }
    CeremonyComponentRequest:
      type: object
      required: [keyId, purpose, custodian, component, checkValue]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        custodian: { $ref: "#/components/schemas/OperatorId" }
        component:
          type: string
          pattern: "^[0-9A-Fa-f]{64}$"
          description: 32 bytes, a P-256 scalar (0 < d < n); never logged or stored
        checkValue:
          type: string
          pattern: "^[0-9A-Fa-f]{6}$"
          description: First 3 bytes of SHA-256 over the compressed point d·G
    CeremonyOpenRequest:
      type: object
      required: [keyId, purpose]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/Purpose" }
    KeyChangeState:
      type: object
      required: [changeId, applied, cancelled]
      properties:
        changeId: { type: string, format: uuid, description: The approval attempt id }
        applied: { type: boolean }
        cancelled: { type: boolean, description: "Terminal: a later PUT of the id is refused" }
        action: { type: string, enum: [GENERATE, ROTATE, RETIRE] }
        keyId: { $ref: "#/components/schemas/KeyId" }
        kid: { type: string, description: "The key's ACTIVE version now, when applied" }
    CeremonyCommitRequest:
      type: object
      required: [makerId, checkerId]
      additionalProperties: false
      properties:
        makerId: { $ref: "#/components/schemas/OperatorId" }
        checkerId: { $ref: "#/components/schemas/OperatorId" }
    Ceremony:
      type: object
      description: An ABORTED tombstone (aborted before it was opened) has keyId, purpose, version and kid null.
      required: [ceremonyId, keyId, purpose, version, kid, state, shares]
      properties:
        ceremonyId: { type: string, format: uuid }
        keyId: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        purpose: { type: [string, "null"] }
        version: { type: [integer, "null"], minimum: 1 }
        kid: { type: [string, "null"] }
        state: { type: string, enum: [OPEN, COMBINED, COMMITTED, ABORTED] }
        shares:
          type: array
          maxItems: 2
          items:
            type: object
            required: [share, custodian, enteredAt]
            properties:
              share: { type: integer, enum: [1, 2] }
              custodian: { $ref: "#/components/schemas/OperatorId" }
              enteredAt: { type: string, format: date-time }
        checkValue:
          type: [string, "null"]
          pattern: "^[0-9A-F]{6}$"
          description: The combined key's KCV (HMAC-SHA256 over 16 zero bytes, first 3 bytes)
    KeyVersion:
      type: object
      required: [version, kid, state, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        kid: { type: string, description: "<keyId>.v<version>: JWS kid and HSM label" }
        state: { type: string, enum: [ACTIVE, VERIFY_ONLY, RETIRED] }
        createdAt: { type: string, format: date-time }
        rotatedAt:
          type: [string, "null"]
          format: date-time
          description: When it left ACTIVE (or VERIFY_ONLY); null while ACTIVE
    Key:
      type: object
      required: [keyId, purpose, algorithm, provider, versions]
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        algorithm: { type: string, enum: [RSA_3072, EC_P256, HMAC_SHA256, AES_256, TDES_2KEY, AES_128] }
        provider: { type: string, description: "The provider holding the key (pkcs11, payshield)" }
        versions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/KeyVersion" }
    KeyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Key" }
    Jwk:
      type: object
      description: RFC 7517 public JWK (RSA n/e or EC crv/x/y), never a private member
      required: [kty, kid, alg, use]
      properties:
        kty: { type: string, enum: [RSA, EC] }
        kid: { type: string }
        alg: { type: string, enum: [RS256, ES256, RSA-OAEP-256] }
        use: { type: string, enum: [sig, enc] }
        n: { type: string }
        e: { type: string }
        crv: { type: string, enum: [P-256] }
        x: { type: string }
        "y": { type: string }
      not:
        anyOf:
          - required: [d]
          - required: [p]
          - required: [q]
    PublicKeyVersion:
      type: object
      required: [version, kid, state, pem, jwk]
      properties:
        version: { type: integer, minimum: 1 }
        kid: { type: string }
        state: { type: string, enum: [ACTIVE, VERIFY_ONLY] }
        pem: { type: string, pattern: "^-----BEGIN PUBLIC KEY-----\\n" }
        jwk: { $ref: "#/components/schemas/Jwk" }
    PublicKey:
      type: object
      required: [keyId, purpose, algorithm, versions, jwks]
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        algorithm: { type: string, enum: [RSA_3072, EC_P256] }
        versions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PublicKeyVersion" }
        jwks:
          type: object
          required: [keys]
          properties:
            keys:
              type: array
              items: { $ref: "#/components/schemas/Jwk" }
    KeyRef:
      type: string
      description: A keyId (its ACTIVE version) or a kid `<keyId>.v<n>` (that version)
      pattern: "^[a-z0-9][a-z0-9-]{0,62}(\\.v[1-9][0-9]{0,5})?$"
    Base64:
      type: string
      contentEncoding: base64
      pattern: "^[A-Za-z0-9+/]*={0,2}$"
    Hmac:
      type: string
      description: HMAC-SHA256, 32 bytes, standard base64
      pattern: "^[A-Za-z0-9+/]{43}=$"
    WalletId:
      type: string
      pattern: "^[A-Za-z0-9._:+-]{1,64}$"
    EncryptedPin:
      type: object
      description: >-
        PIN transport block: the PIN's ASCII digits encrypted RSA-OAEP (SHA-256, MGF1-SHA-256, empty
        label) under the PIN_TRANSPORT key keyId. Never logged.
      required: [keyId, ciphertext]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyRef" }
        ciphertext:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          minLength: 1
          maxLength: 4096
    PinHmac:
      type: object
      required: [hmac, hmacKeyId]
      additionalProperties: false
      properties:
        hmac: { $ref: "#/components/schemas/Hmac" }
        hmacKeyId: { $ref: "#/components/schemas/KeyRef" }
    VerifyPinRequest:
      type: object
      required: [walletId, encryptedPin, storedHmac, hmacKeyId]
      additionalProperties: false
      properties:
        walletId: { $ref: "#/components/schemas/WalletId" }
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
        storedHmac: { $ref: "#/components/schemas/Hmac" }
        hmacKeyId:
          description: The PIN_HMAC version storedHmac was made with (pin-hmac.v1)
          $ref: "#/components/schemas/KeyRef"
    VerifyPinResponse:
      type: object
      required: [match]
      additionalProperties: false
      properties:
        match: { type: boolean }
        rehash:
          description: Only on a match under a VERIFY_ONLY version; store it in place of the old value
          $ref: "#/components/schemas/PinHmac"
    PinPolicyInput:
      type: object
      description: Inputs of the weak-PIN rules (spec 18.7), configured in mw-auth; every field optional
      additionalProperties: false
      properties:
        msisdn: { type: string, pattern: "^\\+?[0-9]{8,15}$" }
        birthYear: { type: integer, minimum: 1900, maximum: 2100 }
        lastHmac: { $ref: "#/components/schemas/Hmac" }
        lastHmacKeyId:
          description: Required with lastHmac
          $ref: "#/components/schemas/KeyRef"
    DerivePinRequest:
      type: object
      required: [walletId, encryptedPin]
      additionalProperties: false
      properties:
        walletId: { $ref: "#/components/schemas/WalletId" }
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
        policyInput: { $ref: "#/components/schemas/PinPolicyInput" }
        hmacKeyId:
          description: >-
            Optional keyId of the PIN_HMAC key to use (its ACTIVE version); default the key of the
            purpose PIN_HMAC (pin-hmac)
          $ref: "#/components/schemas/KeyId"
    DerivePinResponse:
      type: object
      required: [weak]
      additionalProperties: false
      properties:
        weak: { type: boolean }
        rule:
          type: string
          enum: [REPEATED_DIGIT, SEQUENCE, MSISDN_DIGITS, BIRTH_YEAR, LAST_PIN]
        hmac: { $ref: "#/components/schemas/Hmac" }
        hmacKeyId: { $ref: "#/components/schemas/KeyRef" }
      oneOf:
        - properties: { weak: { const: false } }
          required: [hmac, hmacKeyId]
          not: { required: [rule] }
        - properties: { weak: { const: true } }
          required: [rule]
          not: { anyOf: [{ required: [hmac] }, { required: [hmacKeyId] }] }
    JwsSignRequest:
      type: object
      required: [payload]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyRef" }
        purpose: { type: string, enum: [JWT_SIGN, ASSERTION_SIGN, AUDIT_ANCHOR_SIGN] }
        alg:
          type: string
          enum: [RS256, PS256, ES256]
          description: Default RS256 for an RSA key, ES256 for an EC key
        header:
          type: object
          description: >-
            Extra protected header members (typ, cty, private names); alg, kid, jku, jwk, x5u, x5c,
            x5t, x5t#S256, crit, b64, enc, zip are refused (400 MW-VAL-001)
        payload:
          type: object
          description: The JSON claims, at most 64 KiB serialised
      oneOf:
        - required: [keyId]
          not: { required: [purpose] }
        - required: [purpose]
          not: { required: [keyId] }
    JwsSignResponse:
      type: object
      required: [jws, kid, alg]
      additionalProperties: false
      properties:
        jws: { type: string, pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]+$" }
        kid: { type: string, description: "<keyId>.v<n>, the header kid" }
        alg: { type: string, enum: [RS256, PS256, ES256] }
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/Jwk" }
    HmacSignRequest:
      type: object
      required: [keyId, data]
      additionalProperties: false
      properties:
        keyId: { $ref: "#/components/schemas/KeyRef" }
        data:
          description: The bytes to sign, at most 64 KiB
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 87384
    HmacVerifyRequest:
      type: object
      required: [keyId, data, mac]
      additionalProperties: false
      properties:
        keyId:
          description: A keyId (ACTIVE and VERIFY_ONLY versions are tried) or a kid (that version)
          $ref: "#/components/schemas/KeyRef"
        data:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 87384
        mac: { $ref: "#/components/schemas/Hmac" }
    HmacSigned:
      type: object
      required: [mac, kid]
      additionalProperties: false
      properties:
        mac: { $ref: "#/components/schemas/Hmac" }
        kid: { type: string }
    HmacVerified:
      type: object
      required: [valid]
      additionalProperties: false
      properties:
        valid: { type: boolean }
        kid: { type: string, description: The version that matched (when valid) }
    TokeniseRequest:
      type: object
      required: [domain, values]
      additionalProperties: false
      properties:
        domain: { type: string, enum: [MSISDN, NID, ACCOUNT] }
        values:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 64 }
    Tokens:
      type: object
      required: [domain, kid, tokens]
      additionalProperties: false
      properties:
        domain: { type: string, enum: [MSISDN, NID, ACCOUNT] }
        kid: { type: string, description: The TOKENISE_<domain> key version }
        tokens:
          type: array
          items: { type: string, pattern: "^(MSISDN|NID|ACCOUNT)_[A-Z2-7]{52}$" }
    EnvelopeEncryptRequest:
      type: object
      required: [plaintext]
      additionalProperties: false
      properties:
        kekId: { $ref: "#/components/schemas/KeyRef" }
        purpose: { type: string, pattern: "^KEK_[A-Z][A-Z0-9]{0,23}$" }
        plaintext:
          description: At most 1 MiB
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 1398104
        aad:
          description: Optional additional authenticated data, bound to the ciphertext
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          maxLength: 87384
      oneOf:
        - required: [kekId]
          not: { required: [purpose] }
        - required: [purpose]
          not: { required: [kekId] }
    Envelope:
      type: object
      required: [kekId, wrappedKey, iv, ciphertext]
      additionalProperties: false
      properties:
        kekId:
          description: The KEK version that wrapped the data key (kek-column.v1)
          $ref: "#/components/schemas/KeyRef"
        wrappedKey:
          description: The AES-256 data key wrapped in the HSM (opaque)
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          minLength: 1
          maxLength: 1024
        iv: { type: string, pattern: "^[A-Za-z0-9+/]{16}$", description: 12-byte GCM nonce }
        ciphertext:
          description: AES-256-GCM output with the 16-byte tag at the end
          allOf: [{ $ref: "#/components/schemas/Base64" }]
        aad: { $ref: "#/components/schemas/Base64" }
    Plaintext:
      type: object
      required: [plaintext]
      additionalProperties: false
      properties:
        plaintext: { $ref: "#/components/schemas/Base64" }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
    XmlDocument:
      description: A UTF-8 XML document without DOCTYPE, standard base64, at most 1 MiB
      allOf: [{ $ref: "#/components/schemas/Base64" }]
      minLength: 1
      maxLength: 1398104
    PartnerPem:
      type: string
      description: The partner's X.509 certificate or public key in PEM (RSA >= 2048 bits or EC P-256)
      pattern: "^\\s*-----BEGIN (CERTIFICATE|PUBLIC KEY)-----"
      maxLength: 16384
    XmlDsigSignRequest:
      type: object
      required: [xml]
      additionalProperties: false
      properties:
        keyId:
          description: An XMLDSIG key (its ACTIVE version); default the key of purpose XMLDSIG
          $ref: "#/components/schemas/KeyRef"
        xml: { $ref: "#/components/schemas/XmlDocument" }
    XmlDsigSigned:
      type: object
      required: [xml, kid]
      additionalProperties: false
      properties:
        xml: { $ref: "#/components/schemas/XmlDocument" }
        kid: { type: string }
    XmlDsigVerifyRequest:
      type: object
      required: [xml]
      additionalProperties: false
      properties:
        xml: { $ref: "#/components/schemas/XmlDocument" }
        keyId:
          description: An XMLDSIG key here (ACTIVE and VERIFY_ONLY versions are tried) or a kid
          $ref: "#/components/schemas/KeyRef"
        certificatePem: { $ref: "#/components/schemas/PartnerPem" }
      oneOf:
        - required: [keyId]
          not: { required: [certificatePem] }
        - required: [certificatePem]
          not: { required: [keyId] }
    SignatureCheck:
      type: object
      required: [valid]
      additionalProperties: false
      properties:
        valid: { type: boolean }
        kid: { type: string, description: The key version that matched (valid under a keyId) }
        reason:
          type: string
          description: Why the signature is not valid
          enum: [SIGNATURE_MISSING, MULTIPLE_SIGNATURES, SIGNATURE_PLACEMENT, ALGORITHM_NOT_ALLOWED,
            REFERENCE_NOT_ALLOWED, MALFORMED_SIGNATURE, DIGEST_MISMATCH, SIGNATURE_MISMATCH,
            CERTIFICATE_NOT_VALID, COMPONENT_MISSING, REQUIRED_COMPONENT_NOT_COVERED, KEY_MISMATCH,
            CREATED_MISSING, TOO_OLD, CREATED_IN_FUTURE, EXPIRED]
    HttpSignatureAlg:
      type: string
      enum: [ecdsa-p256-sha256, rsa-pss-sha512, rsa-v1_5-sha256, hmac-sha256]
    HttpComponentName:
      type: string
      description: A derived component (`@method`, `@authority`, `@path`, `@query-param`, ...) or a lower-case field name
      pattern: "^@?[a-z0-9!#$%&'*+.^_`|~-]{1,128}$"
    SfString:
      type: string
      maxLength: 256
      pattern: "^[ !#-\\[\\]-~]*$"
    HttpComponent:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/HttpComponentName" }
        params:
          type: object
          description: Component parameters (RFC 9421 2.1)
          maxProperties: 4
          additionalProperties: false
          properties:
            sf: { const: true }
            bs: { const: true }
            req: { const: true }
            tr: { const: true }
            key: { $ref: "#/components/schemas/SfString" }
            name: { $ref: "#/components/schemas/SfString" }
        value:
          type: string
          description: The component value derived from the message; printable ASCII, no line break
          maxLength: 8192
    HttpSignatureSignRequest:
      type: object
      required: [keyId, components]
      additionalProperties: false
      properties:
        keyId:
          description: An HTTP_SIGN_EC, HTTP_SIGN_RSA or HMAC_<use> key (its ACTIVE version)
          $ref: "#/components/schemas/KeyRef"
        alg:
          description: Default by key (EC ecdsa-p256-sha256, RSA rsa-pss-sha512, HMAC hmac-sha256)
          $ref: "#/components/schemas/HttpSignatureAlg"
        label: { type: string, pattern: "^[a-z*][a-z0-9_.*-]{0,63}$", description: "Default sig1" }
        components:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/HttpComponent" }
        created: { type: integer, minimum: 0, description: "Unix seconds, default now" }
        expires: { type: integer, minimum: 0, description: "Unix seconds, after created" }
        nonce: { $ref: "#/components/schemas/SfString" }
        tag: { $ref: "#/components/schemas/SfString" }
    HttpSignatureSigned:
      type: object
      required: [label, kid, alg, signatureInput, signature]
      additionalProperties: false
      properties:
        label: { type: string }
        kid: { type: string }
        alg: { $ref: "#/components/schemas/HttpSignatureAlg" }
        signatureInput:
          type: string
          description: >-
            The Signature-Input member, e.g. `sig1=("@method" "content-digest");created=1763107200;keyid="http-sign-ec.v1";alg="ecdsa-p256-sha256"`
        signature: { type: string, description: "The Signature member, `sig1=:<base64>:`" }
    HttpSignatureVerifyRequest:
      type: object
      required: [signatureInput, signature, components]
      additionalProperties: false
      properties:
        keyId:
          description: A key here (ACTIVE and VERIFY_ONLY versions are tried) or a kid
          $ref: "#/components/schemas/KeyRef"
        certificatePem: { $ref: "#/components/schemas/PartnerPem" }
        alg:
          description: The algorithm expected; else the signature's alg parameter, else by key
          $ref: "#/components/schemas/HttpSignatureAlg"
        label:
          type: string
          pattern: "^[a-z*][a-z0-9_.*-]{0,63}$"
          description: The signature to check; default the only one in the fields
        signatureInput: { type: string, minLength: 1, maxLength: 16384, description: The received Signature-Input field value }
        signature: { type: string, minLength: 1, maxLength: 16384, description: The received Signature field value }
        components:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/HttpComponent" }
        requiredComponents:
          type: array
          maxItems: 64
          description: >-
            Compared by full identity: a bare name (`content-digest`) is that component without
            parameters only; the RFC 9421 serialised identifier (`"content-digest";sf`,
            `"example-dict";key="a"`) is exactly that component with exactly those parameters
          items:
            type: string
            pattern: "^(@?[a-z0-9!#$%&'*+.^_`|~-]{1,128}|\"@?[a-z0-9!#$%&'*+.^_`|~-]{1,128}\"(;[a-z]{1,8}(=\"[ !#-\\[\\]-~]{0,256}\")?){0,4})$"
        expectedKeyid:
          description: When set, the signature's keyid parameter must equal it
          $ref: "#/components/schemas/SfString"
        maxAgeSeconds: { type: integer, minimum: 1, description: "When set, created must be present and at most this old" }
      oneOf:
        - required: [keyId]
          not: { required: [certificatePem] }
        - required: [certificatePem]
          not: { required: [keyId] }
    PinBlockFormat:
      type: string
      description: >-
        ISO 9564-1 format: ISO0, ISO1, ISO3 (16 hex digits under a triple DES key) or ISO4 (32 hex
        digits under an AES-128 key)
      enum: [ISO0, ISO1, ISO3, ISO4]
    PinBlockHex:
      type: string
      description: An enciphered PIN block, hex (16 digits, or 32 for ISO4)
      pattern: "^([0-9A-Fa-f]{16}|[0-9A-Fa-f]{32})$"
    Account:
      type: string
      description: >-
        The account number the PIN block is bound to (ISO 9564 "PAN"), with its check digit; for a
        wallet its account number (a card PAN never enters the middleware)
      pattern: "^[0-9]{12,19}$"
    PinBlockInput:
      type: object
      required: [keyId, format, block]
      additionalProperties: false
      properties:
        keyId:
          description: The TPK, ZPK, TPK_AES or ZPK_AES the block is under (keyId or kid)
          $ref: "#/components/schemas/KeyRef"
        format: { $ref: "#/components/schemas/PinBlockFormat" }
        block: { $ref: "#/components/schemas/PinBlockHex" }
    TranslatePinBlockRequest:
      type: object
      required: [source, destination, account]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/PinBlockInput" }
        destination:
          type: object
          required: [keyId, format]
          additionalProperties: false
          properties:
            keyId:
              description: The ZPK or ZPK_AES (its ACTIVE version, or a kid)
              $ref: "#/components/schemas/KeyRef"
            format: { $ref: "#/components/schemas/PinBlockFormat" }
        account: { $ref: "#/components/schemas/Account" }
    TranslatedPinBlock:
      type: object
      required: [block, format, keyId]
      additionalProperties: false
      properties:
        block:
          type: string
          description: The new block, upper-case hex
          pattern: "^([0-9A-F]{16}|[0-9A-F]{32})$"
        format: { $ref: "#/components/schemas/PinBlockFormat" }
        keyId:
          description: The ZPK version (kid) the block is under
          $ref: "#/components/schemas/KeyRef"
    PvvGenerateRequest:
      type: object
      required: [pvkId, pvki, pinBlock, account]
      additionalProperties: false
      properties:
        pvkId:
          description: "The PVK pair (keyId = its ACTIVE version)"
          $ref: "#/components/schemas/KeyRef"
        pvki: { type: integer, minimum: 0, maximum: 9, description: PVK index, part of the PVV input }
        pinBlock: { $ref: "#/components/schemas/PinBlockInput" }
        account: { $ref: "#/components/schemas/Account" }
    PvvVerifyRequest:
      type: object
      required: [pvkId, pvki, pinBlock, account, pvv]
      additionalProperties: false
      properties:
        pvkId:
          description: "The PVK pair (keyId = its ACTIVE version, or the kid the PVV was made with)"
          $ref: "#/components/schemas/KeyRef"
        pvki: { type: integer, minimum: 0, maximum: 9 }
        pinBlock: { $ref: "#/components/schemas/PinBlockInput" }
        account: { $ref: "#/components/schemas/Account" }
        pvv: { type: string, pattern: "^[0-9]{4}$", description: The stored PVV }
    PvvGenerated:
      type: object
      required: [pvv, pvkId, pvki]
      additionalProperties: false
      properties:
        pvv: { type: string, pattern: "^[0-9]{4}$" }
        pvkId:
          description: The PVK version (kid)
          $ref: "#/components/schemas/KeyRef"
        pvki: { type: integer, minimum: 0, maximum: 9 }
    PvvVerified:
      type: object
      required: [match, pvkId]
      additionalProperties: false
      properties:
        match: { type: boolean }
        pvkId: { $ref: "#/components/schemas/KeyRef" }
