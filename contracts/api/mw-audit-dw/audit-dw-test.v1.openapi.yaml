openapi: 3.1.0
info:
  title: Bits audit test API v1 (mw-audit-dw, test-only)
  version: 1.0.0
  description: |
    Test-only API of mw-audit-dw (ticket 58), never part of the product: the host Newman suite
    (`tests/api`) reads audit rows and checks the hash chain through the test-only APISIX route
    `/test/audit-dw/v1/*` (deploy/apisix/routes-test/test-audit-dw.json, applied only with
    `MW_E2E_ROUTES=1`, key-auth consumer `mw_e2e`, private source addresses only). It replaces the
    suite's read-only psql reads of `audit.event`. Off unless mw-audit-dw runs with
    `MW_AUDIT_DW_TEST_API_ENABLED=true` (`mw.audit-dw.test-api.enabled`; the dev stack sets it);
    off, neither path exists (404). No token: the route's key-auth is the only gate.
    Values are returned as stored, i.e. already masked (spec 18.3). Every error is the 5.3 envelope.
servers:
  - url: http://mw-audit-dw:8080
paths:
  /test/v1/audit/events:
    get:
      operationId: searchAuditEventsForTests
      summary: Search audit events (same filters and page as the internal searchAuditEvents)
      description: >-
        Every filter is optional; filters are ANDed. Ordered by `at`, then chain order. Errors:
        400 MW-VAL-001 (bad filter, limit outside 1..500).
      parameters:
        - { name: txnId, in: query, schema: { type: string, format: uuid } }
        - { name: actorType, in: query, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: actorId, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: action, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: resource, in: query, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: outcome, in: query, schema: { type: string, minLength: 1, maxLength: 32 } }
        - name: from
          in: query
          description: Inclusive lower bound of `at`
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive upper bound of `at`
          schema: { type: string, format: date-time }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: partner, in: query, description: Ticket 130 - the transaction's partner id, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: channel, in: query, description: Ticket 130 - the transaction's channel, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: status, in: query, description: Ticket 130 - the transaction's latest status, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: amountMin, in: query, description: Ticket 130 - inclusive, minor units, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: amountMax, in: query, description: Ticket 130 - inclusive, minor units, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: msisdn, in: query, description: Ticket 130 - a party's MSISDN (tokenised; 503 MW-SYS-002 when tokenising is off), schema: { type: string, minLength: 11, maxLength: 20 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page of audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /test/v1/audit/transactions/{txnId}/timeline:
    get:
      operationId: auditTimelineForTests
      summary: One transaction's per-hop timeline (same as the internal auditTimeline, ticket 130)
      parameters:
        - name: txnId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "400": { $ref: "#/components/responses/Error" }
  /test/v1/audit/search/export.csv:
    get:
      operationId: exportAuditEventsForTests
      summary: Audited CSV export (as the internal exportAuditEvents, ticket 130; fewer filters)
      description: >-
        Writes the same operator-action record (`audit.search.exported`) as the internal export.
        Errors: 400 MW-VAL-001 (bad filter, `X-Mw-Operator-Id` missing).
      parameters:
        - name: X-Mw-Operator-Id
          in: header
          required: false
          description: The operator who exports; required by the service (400 when missing)
          schema: { type: string, minLength: 1, maxLength: 128 }
        - { name: txnId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: partner, in: query, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: channel, in: query, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: status, in: query, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: amountMin, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: amountMax, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: RFC 4180 CSV, as the internal export
          headers:
            X-Mw-Export-Truncated:
              schema: { type: string, enum: ["true", "false"] }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /test/v1/audit/chains/{month}:
    get:
      operationId: verifyAuditChain
      summary: Recompute one month's hash chain and check it against its chain head
      description: >-
        Runs the scheduled verification's check (spec 14.3, `AuditChainVerifier`) for one month as
        the read-only role `audit_reader`. 200 whatever the outcome: `intact` false names the first
        broken `failedSeq` and why. Errors: 400 MW-VAL-001 (month not yyyy-MM), 503 MW-SYS-002
        (chain verification switched off, `mw.audit-dw.chain-verify.enabled=false`).
      parameters:
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChainVerification" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ChainVerification:
      type: object
      required: [month, intact, rows]
      properties:
        month: { type: string, description: "yyyy-MM" }
        intact: { type: boolean }
        rows: { type: integer, description: Rows checked }
        failedSeq: { type: [integer, "null"], description: "First seq at which the chain breaks (null when intact)" }
        reason: { type: [string, "null"], description: "Why it breaks (null when intact)" }
    AuditEntry:
      type: object
      required: [auditId, month, seq, recordedAt, at, correlationId, actor, action, resource, outcome, service]
      properties:
        auditId: { type: string, format: uuid }
        month: { type: string, description: "yyyy-MM: the hash chain the event belongs to" }
        seq: { type: integer, description: Position in the month's chain }
        recordedAt: { type: string, format: date-time }
        at: { type: string, format: date-time }
        txnId: { type: string, format: uuid }
        correlationId: { type: string }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        service: { type: string }
        sourceIp: { type: string }
        payloadRef: { type: string }
        before: { type: object }
        after: { type: object }
        hop: { type: string, enum: [CHANNEL_IN, ORCHESTRATOR, CORE_CALL, PARTNER_CALL, PARTNER_CALLBACK, NOTIFICATION] }
        direction: { type: string, enum: [IN, OUT] }
        durationMs: { type: integer, format: int64 }
    Timeline:
      type: object
      required: [txnId, hops, totalMs, anchor]
      properties:
        txnId: { type: string, format: uuid }
        hops:
          type: array
          items: { $ref: "#/components/schemas/TimelineHop" }
        totalMs: { type: integer, format: int64 }
        anchor: { $ref: "#/components/schemas/AnchorStatus" }
    TimelineHop:
      type: object
      required: [auditId, month, seq, at, action, service, actor, resource, outcome, sinceStartMs, payloads]
      properties:
        auditId: { type: string, format: uuid }
        month: { type: string }
        seq: { type: integer }
        at: { type: string, format: date-time }
        hop: { type: string, enum: [CHANNEL_IN, ORCHESTRATOR, CORE_CALL, PARTNER_CALL, PARTNER_CALLBACK, NOTIFICATION] }
        direction: { type: string, enum: [IN, OUT] }
        action: { type: string }
        service: { type: string }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        resource: { type: string }
        outcome: { type: string }
        durationMs: { type: integer, format: int64 }
        sinceStartMs: { type: integer, format: int64 }
        gapMs: { type: integer, format: int64 }
        payloadRef: { type: string }
        payloads:
          type: array
          items:
            type: object
            required: [direction, contentType]
            properties:
              direction: { type: string, enum: [IN, OUT] }
              contentType: { type: string }
              body: { type: string }
              payloadRef: { type: string }
              size: { type: integer }
              sha256: { type: string }
    AuditPage:
      type: object
      required: [items, limit, offset, anchor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        limit: { type: integer }
        offset: { type: integer }
        anchor: { $ref: "#/components/schemas/AnchorStatus" }
    AnchorStatus:
      type: object
      description: >-
        Status of the signed daily audit anchors (ticket 74, spec 14.3) as of the last hourly
        verification: INTACT (every anchor's signature, chain and chain heads check out), BROKEN
        (at least one does not; alert audit.anchor.broken), UNVERIFIED (not checked since the
        service started, or mw-crypto's JWKS could not be read), OFF (anchoring switched off).
      required: [status]
      properties:
        status: { type: string, enum: [INTACT, BROKEN, UNVERIFIED, "OFF"] }
        lastAnchorDate: { type: string, format: date, description: The newest anchor (UTC day) }
        verifiedAt: { type: string, format: date-time, description: When the anchors were last checked }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time, description: "When the error was built, UTC ISO-8601 to the millisecond (FRS 3.7, ticket 92). Set by every service; optional for older senders." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
