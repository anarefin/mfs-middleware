openapi: 3.1.0
info:
  title: Bits core wallet API v1 (mw-core-mock)
  version: 1.0.0
  description: |
    The core wallet over REST (FRS 7.2, ADR D31): accounts, balances, charges, limits, holds,
    transfers, credits, reversals, statements and transaction status. mw-core-mock serves it as the
    proposal for the real core's contract (the vendor has not published one, FRS 10.6); the
    orchestrator's client (ticket 95a) is written against this file; mw-admin-api unlocks accounts
    and mw-auth checks a PIN reset's KYC factors through it (ticket 95b, which retired the core command topics). WAL-02 (`POST /pin/verify`) is
    not part of it: the middleware owns the PIN (D20), mw-auth checks it and the core verifies
    mw-auth's transaction assertion instead (D22, D31).

    Amounts are integer poisha (`valueMinor`, currency BDT), never decimals (spec 5.1).

    Idempotency (FRS 7.3): every money operation is idempotent by `txnId` and the operation (holds,
    transfers, credits, reversals: the body's `txnId`; commit and release: the hold's `txnId`). A
    repeat with the same body answers the first response again and moves no money twice; the same
    `txnId` and operation with a different body is `409 MW-IDEM-001`. A refusal is stored like a
    success: its repeat gets the same `422`.

    Authorisation: a Keycloak realm `services` client-credentials JWT (spec 18.2) whose `aud`
    contains `mw-core-mock` and whose client (`azp`) is allowed (mw-orchestrator, mw-auth,
    mw-admin-api; the unlock only mw-admin-api, the factors check only mw-auth; mw-portal-api only the
    balance of an ORGANISATION wallet, ticket 129c); no or bad token `401 MW-AUTH-001`, another client `403 MW-AUTH-002`. Holds and
    transfers also carry the customer's authorisation: mw-auth's transaction assertion (a compact
    JWS, D22) in `X-Txn-Assertion`, with the request's `idempotencyKey` (part of the assertion's
    `txnHash`). Missing or refused (signature, `aud` core, `exp`, `sub` the payer, `txnHash`, a
    `jti` another transaction used): `401 MW-AUTH-046`. A `BULK_DISBURSE` row needs none (the org
    authorised the batch by maker-checker), nor does a `REMIT_IN` validation (ticket 119b: the partner's
    money for a beneficiary who authorises nothing; the receiving wallet is still checked). Credits need none (money in from a settlement wallet).
    Balance reads (ticket 95a): the orchestrator reads a customer's balance for the customer only, with
    the BALANCE check's `txnId`, its assertion and the `Idempotency-Key` it was signed over; ops callers
    (mw-admin-api, mw-auth) and system wallets read without, as does mw-portal-api for an org's payout
    wallet (the bulk balance check, ticket 129c).

    Operator rounds (ticket 95a): a commit, release or credit with `round` n >= 1 carries out an
    operator's n-th forced decision and is its own operation (`<txnId>:rest:<op>:manual-<n>`), so the
    core decides it afresh instead of repeating the refusal stored for the saga's own call (round 0 or
    absent). A hold is committed once and a transaction credited once whatever the round.

    Rejections by the core are `422 MW-CORE-<reason>` with the core reason (`INSUFFICIENT_BALANCE`,
    `LIMIT_EXCEEDED_PER_TXN`, `LIMIT_EXCEEDED_DAILY`, `WALLET_NOT_FOUND`, `CREDIT_WALLET_NOT_FOUND`,
    `ACCOUNT_LOCKED`, `ACCOUNT_BLOCKED`, `CREDIT_ACCOUNT_BLOCKED`, `INVALID_COUNTERPARTY`,
    `SAME_WALLET`, `INVALID_AMOUNT`, `HOLD_NOT_FOUND`, `HOLD_RELEASED`, `HOLD_ALREADY_COMMITTED`,
    `HOLD_EXPIRED`, `ACCOUNT_DORMANT`, `ACCOUNT_CLOSED`, `SETTLEMENT_WALLET_NOT_FOUND`,
    `LIMIT_BELOW_MIN_PER_TXN`, `LIMIT_EXCEEDED_DAILY_COUNT`, `LIMIT_EXCEEDED_MONTHLY`,
    `LIMIT_EXCEEDED_MONTHLY_COUNT`,
    `ORIGINAL_NOT_FOUND`, `ORIGINAL_NOT_REVERSIBLE`, `ALREADY_REVERSED`, `AMOUNT_MISMATCH`, `REFUND_EXCEEDS`, or an
    injected fault's reason).

    Events stay on Kafka (D31): every money operation still writes its `core.event.v1` result
    (`FundsHeld`, `HoldCommitted`, `TransferPosted`, ...) through the outbox in the transaction of
    the ledger change, holds on `core.payment.event.v1`, the rest on `core.wallet.event.v1`. A hold
    the core releases on expiry (default 30 min) is announced as `HoldExpired` on `core.payment.event.v1`.

    E-money total (ticket 127c, FRS REC-07): `GET /core/v1/reports/emoney-total` is the sum of the
    balances of every e-money wallet, read by mw-recon's trust position job (the only caller) after the
    trust bank's MT940 cut-off. OPEN ITEM for Upay: the real core must provide this endpoint with the
    same shape (ideally its end-of-day snapshot); mw-core-mock answers the ledger as it is now.
servers:
  - url: http://mw-core-mock:8080
security:
  - internalClientCredentials: []
paths:
  /core/v1/accounts/{msisdn}:
    parameters:
      - { name: msisdn, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getAccount
      summary: "WAL-01: account info, type, status, KYC level and holder name (wallet id or MSISDN)"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /core/v1/balance/{walletId}:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getBalance
      summary: "WAL-03: available, held and total balance"
      description: >-
        With `X-Txn-Assertion` (a customer's own read, the BALANCE check of ADR D26; ticket 95a): the
        BalanceInquiry of `txnId`, idempotent by it, the assertion checked (subject the wallet, txnHash over
        BALANCE, amount 0, the wallet on both sides, `Idempotency-Key`, the channel) and its jti claimed;
        a wallet that is not ACTIVE is 422 MW-CORE-WALLET_NOT_ACTIVE. Without it: an ops caller
        (mw-admin-api, mw-auth), a system wallet, or mw-portal-api reading an ORGANISATION wallet
        (ticket 129c; the only operation that client may call), else 401 MW-AUTH-046.
      parameters:
        - { name: txnId, in: query, required: false, description: "The BALANCE check's txnId (with X-Txn-Assertion)", schema: { $ref: "#/components/schemas/TxnId" } }
        - $ref: "#/components/parameters/TxnAssertion"
        - { name: Idempotency-Key, in: header, required: false, description: "The channel's key the assertion was signed over (with X-Txn-Assertion)", schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        "200":
          description: The balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/charges/calculate:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: calculateCharges
      summary: "WAL-04: fee, VAT and commission of a transaction type and amount"
      description: >-
        From the tariff sheet (ticket 94): the row of the txnType whose slab holds the amount, for the
        channel and the payer's wallet type (`customerType`, default CUSTOMER; a row may say any). The
        fee is VAT-inclusive (`vat = fee * pct / (100 + pct)`, half up); the commission shares are
        percentages of the fee net of VAT, rounded down; fee income keeps the rest. No row: all 0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargesRequest" }
      responses:
        "200":
          description: The charges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charges" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /core/v1/limits/check:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: checkLimits
      summary: "WAL-05: whether the wallet may pay the amount, with what is left"
      description: >-
        The payer's rule of the limit sheet (ticket 94): the most specific of txnType, wallet type and
        KYC level. Per transaction minimum and maximum, daily and monthly (UTC) amount and count; a
        txnType rule counts only that type's debits. `remaining` is what is left before this amount.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitsRequest" }
      responses:
        "200":
          description: Pass or fail (`allowed`, with the reason when false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /core/v1/transactions/validate:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/TxnAssertion"
    post:
      operationId: validateTransaction
      summary: "Validate a transaction before any money moves: payer and payee, limits, fee (ticket 95a)"
      description: >-
        The rules of a transfer without the posting: the payer (and the payee when it is a wallet of the
        core) found and allowed, the limits, the fee from the tariff sheet, the assertion checked and its
        jti claimed for this txnId (the later hold or transfer of the same txnId is authorised by it).
        Idempotent by txnId (`<txnId>:rest:validate`). Nothing moves; no hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: It would pass (status VALIDATED), at this fee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/holds:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/TxnAssertion"
    post:
      operationId: holdFunds
      summary: "WAL-06: reserve amount + fee on the payer (available shrinks, balance unchanged)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: Held (status HELD, with the holdId)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/holds/{holdId}/commit:
    parameters:
      - $ref: "#/components/parameters/HoldId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: commitHold
      summary: "WAL-07: debit the held amount to the hold's settlement wallet and the fee to FEE_INCOME, VAT_PAYABLE and COMMISSION_PAYABLE (double entries)"
      description: >-
        The settlement wallet is the hold's `settlementWallet` (default SETTLEMENT), the fee split the
        one decided when it was placed. A hold not committed within its expiry (default 30 min) is
        released by the core with the event HoldExpired; committing it then is 422 MW-CORE-HOLD_EXPIRED.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldActionRequest" }
      responses:
        "200":
          description: Committed (a committed hold is answered COMMITTED without effect)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/holds/{holdId}/release:
    parameters:
      - $ref: "#/components/parameters/HoldId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: releaseHold
      summary: "WAL-08: return the held amount to available"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldActionRequest" }
      responses:
        "200":
          description: Released (a released hold is answered RELEASED without effect)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/transfers:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/TxnAssertion"
    post:
      operationId: transfer
      summary: "WAL-09: direct debit and credit between two wallets of the core (P2P, cash-in, cash-out, B2B, disbursement row)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: Posted (status POSTED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/credits:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: credit
      summary: "WAL-10: credit a wallet from a partner settlement wallet (add money, remittance, NPSB in, ATM cash-in)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditRequest" }
      responses:
        "200":
          description: Credited (status CREDITED; a txn is credited once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/reversals:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: reverse
      summary: "WAL-11: reverse a posted transfer or credit by its txnId, fee included, once"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReversalRequest" }
      responses:
        "200":
          description: Reversed (status REVERSED); a second reversal of the same original is 422 MW-CORE-ALREADY_REVERSED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/accounts/{walletId}/unlock:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: unlockAccount
      summary: "Ops unlock of a core-side lock (status LOCKED -> ACTIVE) after maker-checker (ticket 95b); only mw-admin-api"
      description: >-
        Idempotent by `txnId` (the change request's unlockTxnId). A wallet that is not LOCKED (ACTIVE, or
        BLOCKED: an unlock never lifts a block) is `422 MW-CORE-WALLET_NOT_LOCKED`, an unknown one `422
        MW-CORE-WALLET_NOT_FOUND`; nothing changes. Another client is `403 MW-AUTH-002`. The status change is
        announced as `WalletStateChanged` on `core.wallet.event.v1`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlockRequest" }
      responses:
        "200":
          description: Unlocked (status UNLOCKED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountActionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/customers/{walletId}/verify-factors:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: verifyCustomerFactors
      summary: "Self-service PIN reset: do the customer's KYC factors match the wallet's KYC record (ticket 95b); only mw-auth"
      description: >-
        The factors never travel in clear: each is a keyed hash made by mw-crypto under TOKENISE_NID over
        `<walletId>:<factor>` (the date as YYYY-MM-DD), bound to the wallet. Idempotent by `txnId`. Refused
        `422 MW-CORE-FACTORS_MISMATCH`, `MW-CORE-WALLET_NOT_FOUND` or `MW-CORE-WALLET_NOT_ACTIVE` (BLOCKED,
        HOLD; a core LOCKED wallet may still reset). Another client is `403 MW-AUTH-002`. Carries no PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorsRequest" }
      responses:
        "200":
          description: Verified (status VERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountActionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /core/v1/statements:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getStatement
      summary: "WAL-12: ledger entries of a wallet in a time range, oldest first"
      description: >-
        One page of at most `limit` entries (default 100, at most 500), page `page` from 0; `hasMore`
        when the next page has entries. Each entry carries the wallet's balance after it (ticket 94).
      parameters:
        - { name: walletId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: The entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /core/v1/transactions/{txnId}:
    parameters:
      - { name: txnId, in: path, required: true, schema: { $ref: "#/components/schemas/TxnId" } }
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getTransaction
      summary: "WAL-13: the core's true status of a transaction and its ledger entries (status inquiry, reconciliation)"
      description: >-
        Read from the ledger, the holds and the operation log, never from the event outbox, so a
        lost answer is still told. `REVERSED` when reversed, else the hold's state (`HELD`,
        `COMMITTED`, `RELEASED`), else the latest operation's outcome (`VALIDATED`, `POSTED`,
        `CREDITED`, `REJECTED`), else `NOT_FOUND` (200, nothing happened). Changes nothing.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /core/v1/reports/emoney-total:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getEmoneyTotal
      summary: "REC-07: the sum of all e-money wallet balances (trust account position), only mw-recon"
      description: >-
        Every wallet that holds e-money: CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, ORGANISATION, DSO and
        PARTNER, whatever its status (a locked, dormant or closed wallet's balance is still e-money).
        SYSTEM wallets (settlement, fee, VAT pools) are the scheme's own and not counted. `total` is the
        ledger balance (held money included), `byType` its split, `asOf` when the core read it. Only the
        client mw-recon (`403 MW-AUTH-002` for another). Changes nothing. OPEN ITEM for Upay: the real
        core must serve this endpoint (ticket 127c).
      responses:
        "200":
          description: The total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmoneyTotal" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    internalClientCredentials:
      type: oauth2
      description: >-
        Keycloak realm `services` client-credentials JWT (spec 18.2): signature, expiry, exact
        issuer, `aud` contains `mw-core-mock`, `azp` one of mw-orchestrator, mw-auth, mw-admin-api,
        mw-app-gateway (profile, limits and statement, ticket 107b), mw-ussd (fee quote and mini
        statement, ticket 109c). The dev stack also allows mw-simulators.
      flows:
        clientCredentials:
          tokenUrl: http://keycloak:8080/realms/services/protocol/openid-connect/token
          scopes: {}
  parameters:
    CorrelationId: { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
    TxnAssertion:
      name: X-Txn-Assertion
      in: header
      required: false
      description: mw-auth's transaction assertion (compact JWS, D22); required unless txnType is BULK_DISBURSE or REMIT_IN
      schema: { type: string, minLength: 1, maxLength: 4096 }
    HoldId: { name: holdId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
  responses:
    Error:
      description: The error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    TxnId:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7, lower case, minted by the middleware (spec 5.1)
    Amount:
      type: object
      required: [valueMinor, currency]
      additionalProperties: false
      properties:
        valueMinor: { type: integer, minimum: 0, description: Poisha }
        currency: { const: BDT }
    TxnType: { type: string, minLength: 1, maxLength: 32, pattern: "^[A-Z][A-Z0-9_]*$" }
    Party:
      type: object
      required: [type, id]
      properties:
        type: { enum: [WALLET, BANK_ACCOUNT, CARD_TOKEN, BILLER_ACCOUNT, MSISDN, MERCHANT, ORG] }
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string }
        walletType: { enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, DSO] }
    Account:
      type: object
      required: [walletId, type, status]
      properties:
        walletId: { type: string }
        msisdn: { type: [string, "null"], description: null for system wallets }
        type: { type: string, enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, ORGANISATION, SYSTEM] }
        status: { type: string, enum: [ACTIVE, LOCKED, DORMANT, CLOSED, BLOCKED, HOLD], description: "DORMANT cannot pay but can receive; CLOSED neither" }
        kycLevel: { type: string, enum: [BASIC, FULL] }
        holderName: { type: [string, "null"], maxLength: 120, description: "Holder's display name; personal data" }
    Balance:
      type: object
      required: [walletId, available, held, total]
      properties:
        walletId: { type: string }
        available: { $ref: "#/components/schemas/Amount" }
        held: { $ref: "#/components/schemas/Amount" }
        total: { $ref: "#/components/schemas/Amount" }
        asOf: { type: string, format: date-time, description: "When the core read it (a customer's read: when its BalanceInquiry was first answered)" }
    ValidationResult:
      type: object
      required: [txnId, status, coreRef, fee]
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        status: { const: VALIDATED }
        coreRef: { type: string }
        fee: { $ref: "#/components/schemas/Amount", description: "What the payer would pay on top of the amount, VAT included" }
        vat: { $ref: "#/components/schemas/Amount", description: The VAT inside the fee }
        limitsLeft:
          type: object
          description: What is left of the payer's limits before this amount (PER_TXN, DAILY, MONTHLY, ...)
          additionalProperties: { $ref: "#/components/schemas/Amount" }
    ChargesRequest:
      type: object
      required: [txnType, amount]
      properties:
        txnType: { $ref: "#/components/schemas/TxnType" }
        amount: { $ref: "#/components/schemas/Amount" }
        channel: { type: string, maxLength: 32 }
        customerType: { type: string, enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, ORGANISATION], description: "The payer's wallet type; default CUSTOMER" }
    Charges:
      type: object
      required: [txnType, amount, fee, vat, commission, total]
      properties:
        txnType: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        fee: { $ref: "#/components/schemas/Amount", description: "What the payer pays on top of the amount, VAT included" }
        vat: { $ref: "#/components/schemas/Amount", description: The VAT inside the fee (to VAT_PAYABLE) }
        commission: { $ref: "#/components/schemas/Amount", description: The commission shares of the fee (to COMMISSION_PAYABLE) }
        commissionSplit:
          type: object
          description: Each party's share (AGENT, DISTRIBUTOR)
          additionalProperties: { $ref: "#/components/schemas/Amount" }
        total: { $ref: "#/components/schemas/Amount", description: amount + fee (what the payer is debited) }
    LimitsRequest:
      type: object
      required: [walletId, txnType, amount]
      properties:
        walletId: { type: string, minLength: 1, maxLength: 64 }
        txnType: { $ref: "#/components/schemas/TxnType" }
        amount: { $ref: "#/components/schemas/Amount" }
    Limits:
      type: object
      required: [walletId, allowed, remaining]
      properties:
        walletId: { type: string }
        allowed: { type: boolean }
        reasonCode:
          type: string
          enum: [LIMIT_BELOW_MIN_PER_TXN, LIMIT_EXCEEDED_PER_TXN, LIMIT_EXCEEDED_DAILY, LIMIT_EXCEEDED_DAILY_COUNT, LIMIT_EXCEEDED_MONTHLY, LIMIT_EXCEEDED_MONTHLY_COUNT]
          description: Only when not allowed
        remaining:
          type: object
          description: A limit the wallet's rule does not set is left out
          properties:
            perTxn: { $ref: "#/components/schemas/Amount", description: The per-transaction maximum }
            daily: { $ref: "#/components/schemas/Amount", description: What the wallet may still pay today (UTC) before this amount }
            monthly: { $ref: "#/components/schemas/Amount", description: What the wallet may still pay this month (UTC) before this amount }
            dailyCount: { type: integer, minimum: 0, description: Transactions left today before this one }
            monthlyCount: { type: integer, minimum: 0, description: Transactions left this month before this one }
    TransferRequest:
      type: object
      required: [txnId, txnType, debitParty, creditParty, amount]
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        txnType: { $ref: "#/components/schemas/TxnType" }
        debitParty: { $ref: "#/components/schemas/Party" }
        creditParty: { $ref: "#/components/schemas/Party" }
        amount: { $ref: "#/components/schemas/Amount" }
        idempotencyKey: { type: string, minLength: 1, maxLength: 64, description: "The channel's key; required with X-Txn-Assertion (part of its txnHash)" }
        settlementWallet: { $ref: "#/components/schemas/SettlementWallet" }
    SettlementWallet:
      type: string
      pattern: "^SETTLEMENT(_[A-Z0-9_]+)?$"
      maxLength: 64
      description: >-
        A partner settlement wallet (ticket 94: SETTLEMENT_OCS_GP, SETTLEMENT_BILLER_DESCO, SETTLEMENT_NPSB,
        SETTLEMENT_UCB_IMT, ...): the one a hold's commit credits or a credit draws on; absent = SETTLEMENT.
        Ignored on a transfer. An unknown one is 422 MW-CORE-SETTLEMENT_WALLET_NOT_FOUND.
    HoldActionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 200 }
        round: { type: integer, minimum: 0, maximum: 1000, description: "The operator decision it carries out (ticket 95a); 0 or absent: the saga's own call" }
    CreditRequest:
      type: object
      required: [txnId, txnType, creditParty, amount]
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        txnType: { $ref: "#/components/schemas/TxnType" }
        creditParty: { $ref: "#/components/schemas/Party" }
        amount: { $ref: "#/components/schemas/Amount" }
        settlementWallet: { $ref: "#/components/schemas/SettlementWallet" }
        round: { type: integer, minimum: 0, maximum: 1000, description: "An operator's forced credit (ticket 95a); 0 or absent: the saga's own call" }
    ReversalRequest:
      type: object
      required: [txnId, originalTxnId]
      properties:
        txnId: { $ref: "#/components/schemas/TxnId", description: The reversal's own txnId }
        originalTxnId: { $ref: "#/components/schemas/TxnId" }
        amount:
          $ref: "#/components/schemas/Amount"
          description: "Optional; absent = the whole original. A smaller amount is a partial reversal (a refund, ticket 116), the fee stays charged; the refunded total of an original may not exceed it (REFUND_EXCEEDS); once it reaches it, a further reversal is ALREADY_REVERSED"
        reason: { type: string, maxLength: 200 }
    BalanceAfter:
      type: object
      required: [walletId, balance]
      properties:
        walletId: { type: string }
        balance: { $ref: "#/components/schemas/Amount" }
    OperationResult:
      type: object
      required: [txnId, status, coreRef]
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        status: { enum: [HELD, COMMITTED, RELEASED, POSTED, CREDITED, REVERSED] }
        coreRef: { type: string }
        holdId: { type: string, description: "Holds, commits and releases" }
        originalTxnId: { $ref: "#/components/schemas/TxnId", description: Reversals }
        balancesAfter:
          type: array
          items: { $ref: "#/components/schemas/BalanceAfter" }
    Entry:
      type: object
      required: [txnId, walletId, direction, kind, amount, at]
      properties:
        txnId: { type: string }
        walletId: { type: string }
        direction: { enum: [DEBIT, CREDIT] }
        kind: { enum: [TRANSFER, FEE, VAT, COMMISSION, REVERSAL, ADJUSTMENT] }
        amount: { $ref: "#/components/schemas/Amount" }
        balanceAfter: { $ref: "#/components/schemas/Amount", description: "The wallet's balance right after this entry (absent on entries older than ticket 94)" }
        at: { type: string, format: date-time }
    Statement:
      type: object
      required: [walletId, from, to, page, hasMore, entries]
      properties:
        walletId: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        page: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
    EmoneyTotal:
      type: object
      required: [asOf, total, walletCount, byType]
      additionalProperties: false
      properties:
        asOf: { type: string, format: date-time }
        total: { $ref: "#/components/schemas/Amount" }
        walletCount: { type: integer, minimum: 0 }
        byType:
          type: array
          items:
            type: object
            required: [type, walletCount, total]
            additionalProperties: false
            properties:
              type: { enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, ORGANISATION, DSO, PARTNER] }
              walletCount: { type: integer, minimum: 0 }
              total: { $ref: "#/components/schemas/Amount" }
    TransactionStatus:
      type: object
      required: [txnId, status, entries]
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        status: { enum: [NOT_FOUND, VALIDATED, HELD, COMMITTED, RELEASED, POSTED, CREDITED, REVERSED, REJECTED] }
        holdId: { type: string }
        entries:
          type: array
          description: Every ledger entry under this txnId (debits equal credits)
          items: { $ref: "#/components/schemas/Entry" }
    UnlockRequest:
      type: object
      required: [txnId, changeRequestId]
      additionalProperties: false
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        changeRequestId: { type: string, format: uuid, description: The approved mw-admin-api change request }
        makerId: { type: string, minLength: 1, maxLength: 128, description: Operator who asked for the unlock }
        checkerId: { type: string, minLength: 1, maxLength: 128, description: Operator who approved it }
    FactorsRequest:
      type: object
      required: [txnId, resetId, factors]
      additionalProperties: false
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        resetId: { type: string, format: uuid, description: The mw-auth PIN reset }
        factors:
          type: object
          required: [nidLast4Token, dateOfBirthToken, tokenKid]
          additionalProperties: false
          properties:
            nidLast4Token: { type: string, pattern: "^NID_[A-Z2-7]+$", maxLength: 256, description: "TOKENISE_NID hash of '<walletId>:<last 4 NID digits>'" }
            dateOfBirthToken: { type: string, pattern: "^NID_[A-Z2-7]+$", maxLength: 256, description: "TOKENISE_NID hash of '<walletId>:<YYYY-MM-DD>'" }
            tokenKid: { type: string, minLength: 1, maxLength: 128, description: "The TOKENISE_NID key version both hashes were made with" }
    AccountActionResult:
      type: object
      required: [txnId, walletId, status, coreRef]
      properties:
        txnId: { $ref: "#/components/schemas/TxnId" }
        walletId: { type: string }
        status: { enum: [UNLOCKED, VERIFIED] }
        coreRef: { type: string }
        resetId: { type: string, format: uuid, description: The PIN reset a factors check belongs to }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
