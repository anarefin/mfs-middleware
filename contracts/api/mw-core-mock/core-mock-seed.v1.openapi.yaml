openapi: 3.1.0
info:
  title: Bits core-mock seed API v1 (mw-core-mock, test-only)
  version: 1.0.0
  description: |
    Test-only wallet API of the core test double (ticket 57), never part of the product and never
    offered by the real core. Called by mw-seeder inside the stack network (no APISIX route, no
    auth: the mock is dev/test only). The PUT is off unless mw-core-mock runs with
    `MW_COREMOCK_SEED_API_ENABLED=true` (`mw.coremock.seed-api.enabled`; the dev stack sets it);
    off, a PUT is 405 and the mock seeds only its own fixed ranges on start.

    A seeded wallet's id is its MSISDN; it gets no PIN (the core holds none since ticket 72;
    first PINs are set at mw-auth) and its opening balance without ledger entries, as the mock's own start-up seed does. The PUT
    is create-if-absent: an existing wallet is answered as it is (200) and never changed, whatever
    the body says, so tests that moved its balance keep their numbers. The one exception: an
    optional `holderName` is stored on an existing wallet that has none yet (never overwritten).

    Setting a balance (test-only, the test console's "Set balance"): with the optional
    `balanceMinor`, the wallet (new or existing) ends with exactly that AVAILABLE balance
    (`balanceMinor` of the answer = it + `heldMinor`, so open holds stay covered). The mock never
    edits a balance silently: the difference is posted as a double entry of kind `ADJUSTMENT`
    between the wallet and the `SETTLEMENT` system wallet (the outside world), so the ledger stays
    balanced; it is no transfer and never counts against the daily debit limit. A wallet already at
    that balance gets no entry. Without `balanceMinor` nothing about the balance changes, and
    `openingBalanceMinor` keeps its meaning (the balance a NEW wallet starts with; ignored for an
    existing one). With both on a new wallet: created at `openingBalanceMinor`, then adjusted.

    `holderName` is the holder's display name (a person, an agent's shop, a merchant's business, an
    org's company): the mock gives its own seeded ranges fixed realistic names, null for system
    wallets. It is personal data: services log it masked to the first initial.
servers:
  - url: http://mw-core-mock:8080
paths:
  /core-mock/v1/wallets/{walletId}:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      - { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
    get:
      operationId: getWallet
      summary: A wallet's type, status, balances and holder name (id or MSISDN)
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "400":
          description: Unknown wallet (MW-VAL-003)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    put:
      operationId: seedWallet
      summary: Create the wallet with its opening balance unless it exists; optionally set its available balance (test-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, openingBalanceMinor]
              additionalProperties: false
              properties:
                type: { type: string, enum: [CUSTOMER, AGENT, MERCHANT, ORG] }
                openingBalanceMinor: { type: integer, minimum: 0, maximum: 100000000000, description: Poisha }
                holderName:
                  type: string
                  minLength: 1
                  maxLength: 120
                  pattern: "\\S"
                  description: Holder's display name; set on create, or on an existing wallet that has none
                balanceMinor:
                  type: integer
                  minimum: 0
                  maximum: 100000000000
                  description: Poisha. The available balance to set (new or existing wallet), posted as an ADJUSTMENT against SETTLEMENT
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "200":
          description: Already there; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "400":
          description: Not a mobile number (`01[3-9]` + 8 digits) or a bad body (MW-VAL-001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "405":
          description: Seed API switched off (the GET on the same path stays; MW-VAL-004)
components:
  schemas:
    Wallet:
      type: object
      required: [walletId, type, status, balanceMinor, heldMinor, availableMinor]
      properties:
        walletId: { type: string }
        type: { type: string, enum: [CUSTOMER, AGENT, MERCHANT, ORG, SYSTEM] }
        status: { type: string }
        balanceMinor: { type: integer }
        heldMinor: { type: integer }
        availableMinor: { type: integer, description: balanceMinor - heldMinor }
        holderName:
          type: [string, "null"]
          maxLength: 120
          description: Holder's display name (person, shop, business, company); null when none (system wallets)
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time, description: "When the error was built, UTC ISO-8601 to the millisecond (FRS 3.7, ticket 92). Set by every service; optional for older senders." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
