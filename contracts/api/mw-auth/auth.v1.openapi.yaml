openapi: 3.1.0
info:
  title: Bits wallet authentication API (mw-auth)
  version: 1.0.0
  description: |
    Public API v1 of mw-auth (spec 9.1, 18.7), behind APISIX route `/auth/v1/*` (not rewritten: the
    device signs the path it sends). Ticket 68 moved device binding, the binding OTP and sessions here
    from mw-app-gateway (`/app/v1/devices/otp`, `/app/v1/devices`, `/app/v1/sessions`), with the same
    behaviour and error codes. Until mw-auth issues its own tokens (ticket 69) the bearer JWT is the
    Keycloak realm `customers` token; the wallet is its `msisdn` claim and the app its realm role
    (`customer`, `agent`, `merchant`; any other is 403 MW-AUTH-002). The wallet must be known to
    mw-auth (its projection of the core's wallets), else 403 MW-AUTH-002. Every error is the 5.3
    envelope; the edge answers some itself: 401 MW-AUTH-001, 413 MW-VAL-BODY_TOO_LARGE, 429
    MW-SYS-RATE_LIMITED. Bodies are checked against the request schemas below (a derived copy in
    mw-auth) on the exact bytes sent: a body that breaks one, is not one JSON object or repeats a key
    is 400 MW-VAL-001.

    Devices and sessions. A wallet has one bound device at a time (`auth.device`): binding a device
    unbinds the wallet's other device and ends its session; a device id bound to another wallet
    moves to this one. A session (Valkey `sess:{walletId}:{deviceId}`, idle timeout 5 min) is opened
    by a binding or `POST /auth/v1/sessions` and extended by every app request (mw-app-gateway asks
    mw-auth on each one, internal API). Signed requests carry `X-Device-Id`, `X-Timestamp` (epoch
    milliseconds, within ±5 min of mw-auth's clock), `X-Nonce` (used once per device) and
    `X-Signature`: base64 ECDSA P-256 SHA-256 (ASN.1 DER or 64-byte r||s) by the device key over the
    UTF-8 text of these six lines joined by a line feed: method, path (with "?query" if any),
    lower-case hex SHA-256 of the exact body bytes (of nothing when there is no body), X-Timestamp,
    X-Nonce, X-Device-Id. Errors (401): MW-AUTH-003 device missing, malformed or not bound to this
    wallet, MW-AUTH-004 signature missing or not valid, MW-AUTH-005 timestamp outside the window,
    MW-AUTH-006 nonce already used (replay); 503 MW-SYS-012 (retryable) when the session store
    cannot be asked.

    Binding OTP (review A5): binding a device needs an OTP, asked for with `POST /auth/v1/otp`
    (X-Device-Id of the device to bind) and sent by SMS to the token's wallet (mw-notify, OTP
    priority, valid 2 min). It binds only that device, once; 3 checks per OTP (the third wrong one
    voids it), at most 5 OTPs per wallet in 15 min. Errors: 401 MW-AUTH-010 wrong OTP, MW-AUTH-011 no
    OTP for this device (none asked, expired, spent or replaced), MW-AUTH-012 checks used up; 429
    MW-VAL-022 OTP limit reached; 503 MW-SYS-010 (retryable) when the SMS could not be queued. After
    a binding the wallet gets an SMS that a new device was bound.
servers:
  - url: https://localhost
security:
  - bearer: []
paths:
  /auth/v1/otp:
    post:
      operationId: sendDeviceOtp
      summary: Send a binding OTP for this device by SMS to the token's wallet
      description: >-
        Not signed (the device key is not bound yet). A new OTP replaces the wallet's previous one
        and resets its checks. The body is optional; `locale` picks the SMS language (default bn),
        also used for the "new device bound" SMS. A missing or malformed X-Device-Id is 401
        MW-AUTH-003; 429 MW-VAL-022 when the wallet's OTP limit is reached.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceOtpRequest" }
      responses:
        "202":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceOtpSent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/devices:
    post:
      operationId: bindDevice
      summary: Bind this device to the token's wallet and open a session
      description: >-
        Needs the OTP sent for this device (POST /auth/v1/otp; 401 MW-AUTH-010/011/012 otherwise),
        checked after the signature and nonce. Signed with the private key of the public key in the
        body (proof of possession). Binding the same X-Device-Id again replaces its key. The
        wallet's other device is unbound (its requests then get MW-AUTH-003 or MW-AUTH-007) and its
        session ended. A key that is not EC P-256 is 400 MW-VAL-001 naming `publicKey`.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceBindingRequest" }
      responses:
        "201":
          description: Bound; a session is open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/sessions:
    post:
      operationId: openSession
      summary: Open a new session on the wallet's bound device (no body)
      description: >-
        After the idle timeout (the app API answers MW-AUTH-007). Signed by the bound device key
        over an empty body; a device not bound to the token's wallet is 401 MW-AUTH-003.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
      responses:
        "200":
          description: Session open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The device to bind, or bound to the token's wallet.
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Signing time, epoch milliseconds; within 5 min of mw-auth's clock.
      schema: { type: string, pattern: "^[0-9]{1,15}$" }
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: Unique per signed request of this device; a reused nonce is 401 MW-AUTH-006.
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{16,128}$" }
    Signature:
      name: X-Signature
      in: header
      required: true
      description: Base64 ECDSA P-256 SHA-256 signature of the canonical request text (see info).
      schema: { type: string, maxLength: 256 }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    DeviceBindingRequest:
      type: object
      additionalProperties: false
      required: [publicKey, otp]
      properties:
        publicKey:
          type: string
          maxLength: 512
          description: The device's EC P-256 public key, base64 X.509 SubjectPublicKeyInfo (DER).
        otp:
          type: string
          pattern: "^[0-9]{6}$"
          description: The OTP sent by SMS for this device (POST /auth/v1/otp).
    DeviceOtpRequest:
      type: object
      additionalProperties: false
      properties:
        locale: { type: string, enum: [bn, en] }
    DeviceOtpSent:
      type: object
      required: [wallet, otpExpiresAt, sendsLeft]
      properties:
        wallet: { type: string, description: "The wallet the SMS went to, masked (0171****789)" }
        otpExpiresAt: { type: string, format: date-time }
        sendsLeft: { type: integer, description: OTPs the wallet may still ask for in the current window }
    DeviceSession:
      type: object
      required: [deviceId, idleTimeoutSeconds]
      properties:
        deviceId: { type: string }
        idleTimeoutSeconds: { type: integer, description: Session idle timeout in seconds }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
