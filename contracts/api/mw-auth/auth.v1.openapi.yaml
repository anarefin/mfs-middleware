openapi: 3.1.0
info:
  title: Bits wallet authentication API (mw-auth)
  version: 1.3.0
  description: |
    Public API v1 of mw-auth (spec 9.1, 18.7, D21), behind APISIX route `/auth/v1/*` (no auth plugin
    at the edge, rate limited per MSISDN and per address; not rewritten: the device signs the path it
    sends). Ticket 68 moved device binding, the binding OTP and sessions here from mw-app-gateway;
    ticket 69 made mw-auth the token issuer: a wallet user logs in with MSISDN + PIN + bound device
    and gets an access JWT (RS256, 5 min) and a refresh token (opaque, 30 days, device-bound,
    rotated on every use). The access token is what `/app/v1/*` (mw-app-gateway, and APISIX route
    `app-v1` through the discovery document below) accepts. Every error is the 5.3 envelope; the edge
    answers some itself: 401 MW-AUTH-001, 413 MW-VAL-BODY_TOO_LARGE, 429 MW-SYS-RATE_LIMITED. Bodies
    are checked against the request schemas below (a derived copy in mw-auth) on the exact bytes
    sent: a body that breaks one, is not one JSON object or repeats a key is 400 MW-VAL-001.

    The wallet is named by its MSISDN (`01XXXXXXXXX`, or with `880` / `+880`); mw-auth finds it in
    its projection of the core's wallets by a keyed hash of the MSISDN. An MSISDN mw-auth does not
    know is 403 MW-AUTH-002 (OTP, binding) or 401 MW-AUTH-047 (login). PINs travel only as
    `encryptedPin` (RSA-OAEP SHA-256 / MGF1-SHA-256 under the mw-crypto `PIN_TRANSPORT` key of
    `GET /auth/v1/pin-key`); mw-auth never sees a clear PIN.

    Devices. A wallet has one bound device at a time (`auth.device`): binding a device unbinds the
    wallet's other device, ends its session and revokes the wallet's refresh tokens; a device id
    bound to another wallet moves to this one. Signed requests carry `X-Device-Id`, `X-Timestamp`
    (epoch milliseconds, within ±5 min of mw-auth's clock), `X-Nonce` (used once per device) and
    `X-Signature`: base64 ECDSA P-256 SHA-256 (ASN.1 DER or 64-byte r||s) by the device key over the
    UTF-8 text of these six lines joined by a line feed: method, path (with "?query" if any),
    lower-case hex SHA-256 of the exact body bytes (of nothing when there is no body), X-Timestamp,
    X-Nonce, X-Device-Id. Errors (401): MW-AUTH-003 device missing or malformed, MW-AUTH-004 signature
    missing or not valid, MW-AUTH-005 timestamp outside the window, MW-AUTH-006 nonce already used
    (replay); 503 MW-SYS-012 (retryable) when the session store cannot be asked.

    OTP (review A5, spec 18.7 step 1): purpose `BIND` (binding a device), `LOGIN` (the first PIN of
    a wallet without one) or `RESET` (a PIN reset, ticket 70: only on the wallet's bound device, or on
    any device while the wallet has an approved care reset; else 403 MW-AUTH-002). Sent by SMS to the wallet (mw-notify, OTP priority, valid 2 min), stored
    only as a hash bound to wallet, device and purpose; one current OTP per wallet; 3 checks per OTP
    (the third wrong one voids it), at most 5 OTPs per wallet in 15 min. Errors: 401 MW-AUTH-010
    wrong OTP, MW-AUTH-011 no OTP for this device and purpose (none asked, expired, spent or
    replaced), MW-AUTH-012 checks used up; 429 MW-VAL-022 OTP limit reached; 503 MW-SYS-010
    (retryable) when the SMS could not be queued.

    Login (spec 18.7 step 3) checks, in this order: the wallet's status at the core (not ACTIVE: 403
    MW-AUTH-043), its locks (PIN lock: 423 MW-AUTH-041 with `retryAfter`, or MW-AUTH-042 until a
    reset; admin lock: 403 MW-AUTH-043), the device bound to this wallet and its signature (401
    MW-AUTH-047, MW-AUTH-004..006), then the PIN through mw-crypto (wrong: 401 MW-AUTH-040, the
    failure counted, `triesLeft` in `details`; see the lockout below). A wallet without a PIN (first PIN) logs
    in with a `LOGIN` OTP instead: its token has `amr` [otp, device], `pinSet` false, and only `POST
    /auth/v1/pin` accepts it (mw-app-gateway answers 403 MW-AUTH-045). A login opens the session
    `sess:{walletId}:{deviceId}` (idle timeout 5 min, sliding: every app request extends it).
    mw-crypto unreachable: 503 MW-SYS-050 (retryable), nothing is let through.

    PIN policy and lockout (spec 18.7, D20, ticket 70). A new PIN (first PIN, change, reset) is 5
    digits and refused with 400 MW-AUTH-044 (the rule in `details`: REPEATED_DIGIT, SEQUENCE,
    MSISDN_DIGITS, BIRTH_YEAR, LAST_PIN) when it is one digit repeated, an ascending or descending
    run, 5 consecutive digits of the MSISDN, contains the birth year (when the core supplies it) or
    is one of the last 3 PINs. Every PIN check (login, binding, change) counts a wrong PIN; after 3
    wrong PINs the PIN is locked for 1 h (level 1), after 3 more for 24 h (level 2), after 3 more
    until a reset (level 3); the wrong PIN that locks is answered with the lock itself. A locked
    PIN is refused before it reaches mw-crypto: 423 MW-AUTH-041 (`retryAfter` seconds in
    `details`) or MW-AUTH-042 (until a reset). A correct PIN resets the count, not the level: the
    level history decays after 30 days without a lock (all of these are configuration). A PIN reset
    or an ops unlock clears the lock.

    PIN reset (spec 18.7, ticket 70). Self-service: `POST /auth/v1/otp` purpose `RESET` on the bound
    device, then `POST /auth/v1/pin-resets` (signed) with the OTP, the last 4 NID digits and the date
    of birth: mw-auth asks the core to check the factors (hashed, never in clear) and answers 202
    `PENDING_KYC`; the app polls `GET /auth/v1/pin-resets/{resetId}` until `VERIFIED` (or
    `REJECTED`), then sets the PIN with `PUT /auth/v1/pin-resets/{resetId}/pin`. Care: an operator's
    approved request (mw-admin-api maker-checker) opens a reset in status `APPROVED` and the customer
    gets an SMS; on any device (a lost phone) the app asks for a `RESET` OTP and calls `POST
    /auth/v1/pin-resets` without factors and unsigned: the reset becomes `VERIFIED` for that device.
    Setting the PIN clears the PIN lock, ends every session and revokes every refresh token of the
    wallet; then log in (on a new device: bind it first). A reset lives 15 min (care: 72 h until its
    OTP); the reset id is the capability of the device that opened it (other devices: 404).

    Access token claims: `iss` (the discovery `issuer`), `aud` `mw-app`, `sub` walletId, `msisdn`,
    `role` (customer, agent, merchant, distributor, dso: from the wallet type), `deviceId`, `amr`,
    `sid` (the session: its refresh token family), `jti`, `iat`, `exp`. Header `typ` `at+jwt`, `kid`
    `<keyId>.v<n>` of the mw-crypto key `JWT_SIGN` (RSA 3072, RS256; D21 amendment).
servers:
  - url: https://localhost
paths:
  /auth/v1/otp:
    post:
      operationId: sendOtp
      summary: Send an OTP for this device by SMS to the wallet of the MSISDN
      description: >-
        Not signed (the device key may not be bound yet). A new OTP replaces the wallet's previous
        one (of either purpose) and resets its checks. `locale` picks the SMS language (default bn),
        also used for the "new device bound" SMS. Purpose `LOGIN` only for a wallet without a PIN
        (else 403 MW-AUTH-002). A missing or malformed X-Device-Id is 401 MW-AUTH-003.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "202":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceOtpSent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/devices:
    post:
      operationId: bindDevice
      summary: Bind this device to the wallet of the MSISDN
      description: >-
        Signed with the private key of the public key in the body (proof of possession); needs the
        `BIND` OTP sent for this device (401 MW-AUTH-010/011/012 otherwise), checked after the
        signature and nonce, and, when the wallet has a PIN, its PIN (`encryptedPin`, 401 MW-AUTH-040;
        missing: 403 MW-AUTH-045); the wallet's status and locks are checked as at login. Binding the
        same X-Device-Id again replaces its key. The wallet's other device is unbound, its session
        ended and the wallet's refresh tokens revoked; the wallet gets an SMS that a new device was
        bound. No session is opened: log in next. A key that is not EC P-256 is 400 MW-VAL-001 naming
        `publicKey`.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceBindingRequest" }
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceBound" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/sessions:
    post:
      operationId: login
      summary: Log in (MSISDN + PIN on the bound device) and get the tokens
      description: >-
        Signed by the wallet's bound device. `encryptedPin` for a wallet with a PIN; `otp` (a `LOGIN`
        OTP) for a wallet without one (first PIN). Exactly one of them. See the info for the checks.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; a session is open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/tokens/refresh:
    post:
      operationId: refreshTokens
      summary: New tokens for a refresh token (rotation), on the device it was issued to
      description: >-
        Signed by the device the refresh token was issued to (another device: 401 MW-AUTH-047 and
        the session is revoked). The refresh token is rotated: the answer carries a new one and the
        old one is spent; a spent (rotated) or revoked token presented again is 401 MW-AUTH-048 and
        revokes the whole session (its family). Unknown or expired: 401 MW-AUTH-001. The wallet's
        status and locks are checked as at login. Re-opens the session's idle timeout.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/Timestamp" }
        - { $ref: "#/components/parameters/Nonce" }
        - { $ref: "#/components/parameters/Signature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/sessions/logout:
    post:
      operationId: logout
      summary: End the token's session (refresh family and idle session)
      description: No body. Further refreshes of the session are 401 MW-AUTH-048; app requests MW-AUTH-007.
      security:
        - bearer: []
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/pin:
    post:
      operationId: setFirstPin
      summary: Set the first PIN (after an OTP login) and get tokens with `amr` [pin, device]
      description: >-
        Only for a wallet without a PIN (else 403 MW-AUTH-002; change it with PUT), with the token of
        its OTP login (session still open, else 401 MW-AUTH-001). The PIN policy applies (400
        MW-AUTH-044 naming the rule). The OTP session is replaced by a new one.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPinRequest" }
      responses:
        "200":
          description: PIN set; new tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      operationId: changePin
      summary: Change the PIN (logged in; step-up with the current PIN in the request)
      description: >-
        Ticket 70. The bearer of a PIN session (`amr` with `pin`; an OTP session: 403 MW-AUTH-045),
        its family still live (else 401 MW-AUTH-001). The wallet's status and locks as at login, then
        the current PIN (`encryptedPin`, counted and locked as at login: 401 MW-AUTH-040, 423
        MW-AUTH-041/042), then the new PIN against the policy (400 MW-AUTH-044). The session is
        replaced by a new one with a fresh `amr` [pin, device]; the wallet gets an SMS that its PIN
        was changed.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePinRequest" }
      responses:
        "200":
          description: PIN changed; new tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/pin-resets:
    post:
      operationId: startPinReset
      summary: Start a self-service PIN reset, or take up an approved care reset
      description: >-
        With `nidLast4` and `dateOfBirth` (self-service): signed by the wallet's bound device (401
        MW-AUTH-047 otherwise), needs the `RESET` OTP of this device; the wallet must be active (403
        MW-AUTH-043; a PIN lock does not stop a reset); 202 `PENDING_KYC` and the core checks the
        factors. An open care reset of the wallet: 409 MW-VAL-030. Without factors (care): unsigned,
        only when the wallet has an approved care reset (else 403 MW-AUTH-002), needs the `RESET` OTP
        of this device; 202 `VERIFIED` for this device. An earlier open self-service reset of the
        wallet is replaced.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/OptionalTimestamp" }
        - { $ref: "#/components/parameters/OptionalNonce" }
        - { $ref: "#/components/parameters/OptionalSignature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinResetRequest" }
      responses:
        "202":
          description: Reset opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinReset" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/pin-resets/{resetId}:
    get:
      operationId: getPinReset
      summary: The state of a PIN reset (the app polls it while the core checks the factors)
      description: >-
        Only for the device that opened the reset (any other: 404 MW-VAL-003). An open reset past its
        `expiresAt` is `EXPIRED`. `REJECTED` carries the core's reason (`FACTORS_MISMATCH`,
        `WALLET_NOT_FOUND`, `WALLET_NOT_ACTIVE`).
      security: []
      parameters:
        - { $ref: "#/components/parameters/ResetId" }
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200":
          description: The reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinReset" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/v1/pin-resets/{resetId}/pin:
    put:
      operationId: setResetPin
      summary: Set the new PIN of a verified reset
      description: >-
        Only for the device that opened the reset (else 404 MW-VAL-003) and only while it is
        `VERIFIED` and not expired (else 409 MW-VAL-031). The PIN policy applies (400 MW-AUTH-044;
        the reset stays `VERIFIED`, try another PIN). Sets the PIN, clears the PIN lock and the
        wrong-PIN count, ends every session and refresh token of the wallet; the reset is `DONE`.
      security: []
      parameters:
        - { $ref: "#/components/parameters/ResetId" }
        - { $ref: "#/components/parameters/DeviceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPinRequest" }
      responses:
        "200":
          description: PIN set; the reset is DONE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinReset" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/pin-key:
    get:
      operationId: getPinKey
      summary: The PIN transport public key apps encrypt the PIN with
      description: >-
        The newest version of the mw-crypto `PIN_TRANSPORT` key (RSA 3072), from mw-crypto's JWK Set
        (cached). `keyId` is the kid to send in `encryptedPin`.
      security: []
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinKey" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: The access tokens' JWK Set
      description: >-
        Every version in use of the mw-crypto key `JWT_SIGN` (public members only), from mw-crypto
        (cached, `mw.auth.tokens.jwks-cache-ttl`). APISIX and mw-app-gateway read it; an unknown kid
        makes them fetch it again.
      security: []
      responses:
        "200":
          description: The JWK Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/.well-known/assertion-jwks.json:
    get:
      operationId: getAssertionJwks
      summary: The transaction assertions' JWK Set (ticket 71)
      description: >-
        Every version in use of the mw-crypto key `ASSERTION_SIGN` (EC P-256, ES256; public members
        only), from mw-crypto (cached, `mw.auth.tokens.jwks-cache-ttl`). The core (mw-core-mock)
        fetches it at start and refreshes it on a timer, never on the money path, and verifies the
        assertions of `POST /internal/v1/txn-authorisations` (auth-internal.v1) with it.
      security: []
      responses:
        "200":
          description: The JWK Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EcJwkSet" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/v1/.well-known/openid-configuration:
    get:
      operationId: getDiscovery
      summary: The discovery document of the access tokens (for the APISIX openid-connect plugin)
      description: >-
        `issuer` is the access tokens' `iss`; `jwks_uri` the in-stack URL of the JWK Set
        (`mw.auth.tokens.jwks-uri`). mw-auth is not an OpenID provider: there is no authorization or
        token endpoint, only what a bearer-only verifier needs.
      security: []
      responses:
        "200":
          description: The discovery document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The device to bind, or the wallet's bound device.
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Signing time, epoch milliseconds; within 5 min of mw-auth's clock.
      schema: { type: string, pattern: "^[0-9]{1,15}$" }
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: Unique per signed request of this device; a reused nonce is 401 MW-AUTH-006.
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{16,128}$" }
    Signature:
      name: X-Signature
      in: header
      required: true
      description: Base64 ECDSA P-256 SHA-256 signature of the canonical request text (see info).
      schema: { type: string, maxLength: 256 }
    OptionalTimestamp:
      name: X-Timestamp
      in: header
      required: false
      description: As X-Timestamp; required for a self-service reset (signed).
      schema: { type: string, pattern: "^[0-9]{1,15}$" }
    OptionalNonce:
      name: X-Nonce
      in: header
      required: false
      description: As X-Nonce; required for a self-service reset (signed).
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{16,128}$" }
    OptionalSignature:
      name: X-Signature
      in: header
      required: false
      description: As X-Signature; required for a self-service reset (signed by the bound device).
      schema: { type: string, maxLength: 256 }
    ResetId:
      name: resetId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token of `POST /auth/v1/sessions` (mw-auth itself).
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Msisdn:
      type: string
      pattern: "^(01[3-9][0-9]{8}|\\+?8801[3-9][0-9]{8})$"
      description: The wallet's MSISDN.
    EncryptedPin:
      type: object
      additionalProperties: false
      required: [keyId, ciphertext]
      description: >-
        The PIN's ASCII digits, RSA-OAEP (SHA-256, MGF1-SHA-256, empty label) under the PIN transport
        key `keyId` of GET /auth/v1/pin-key, base64. Never logged.
      properties:
        keyId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}(\\.v[1-9][0-9]{0,5})?$" }
        ciphertext: { type: string, minLength: 1, maxLength: 4096, pattern: "^[A-Za-z0-9+/]*={0,2}$" }
    Otp:
      type: string
      pattern: "^[0-9]{6}$"
      description: The OTP sent by SMS for this device.
    OtpRequest:
      type: object
      additionalProperties: false
      required: [msisdn]
      properties:
        msisdn: { $ref: "#/components/schemas/Msisdn" }
        purpose: { type: string, enum: [BIND, LOGIN, RESET], description: "Default BIND" }
        locale: { type: string, enum: [bn, en] }
    DeviceBindingRequest:
      type: object
      additionalProperties: false
      required: [msisdn, publicKey, otp]
      properties:
        msisdn: { $ref: "#/components/schemas/Msisdn" }
        publicKey:
          type: string
          maxLength: 512
          description: The device's EC P-256 public key, base64 X.509 SubjectPublicKeyInfo (DER).
        otp: { $ref: "#/components/schemas/Otp" }
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [msisdn]
      properties:
        msisdn: { $ref: "#/components/schemas/Msisdn" }
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
        otp: { $ref: "#/components/schemas/Otp" }
      oneOf:
        - { required: [encryptedPin] }
        - { required: [otp] }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    SetPinRequest:
      type: object
      additionalProperties: false
      required: [encryptedPin]
      properties:
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
    ChangePinRequest:
      type: object
      additionalProperties: false
      required: [encryptedPin, newEncryptedPin]
      properties:
        encryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
        newEncryptedPin: { $ref: "#/components/schemas/EncryptedPin" }
    PinResetRequest:
      type: object
      additionalProperties: false
      required: [msisdn, otp]
      properties:
        msisdn: { $ref: "#/components/schemas/Msisdn" }
        otp: { $ref: "#/components/schemas/Otp" }
        nidLast4: { type: string, pattern: "^[0-9]{4}$", description: "The last 4 digits of the NID (self-service)" }
        dateOfBirth: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Date of birth, YYYY-MM-DD (self-service)" }
      anyOf:
        - { required: [nidLast4, dateOfBirth] }
        - { not: { anyOf: [{ required: [nidLast4] }, { required: [dateOfBirth] }] } }
    PinReset:
      type: object
      required: [resetId, kind, status, expiresAt]
      properties:
        resetId: { type: string, format: uuid }
        kind: { type: string, enum: [SELF, CARE] }
        status: { type: string, enum: [PENDING_KYC, APPROVED, VERIFIED, DONE, REJECTED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        reason: { type: string, description: "REJECTED: the core's reason code" }
    DeviceOtpSent:
      type: object
      required: [wallet, otpExpiresAt, sendsLeft]
      properties:
        wallet: { type: string, description: "The wallet the SMS went to, masked (0171****789)" }
        otpExpiresAt: { type: string, format: date-time }
        sendsLeft: { type: integer, description: OTPs the wallet may still ask for in the current window }
    DeviceBound:
      type: object
      required: [deviceId, wallet, boundAt]
      properties:
        deviceId: { type: string }
        wallet: { type: string, description: "The wallet, masked (0171****789)" }
        boundAt: { type: string, format: date-time }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn, sessionId, idleTimeoutSeconds, pinSet]
      properties:
        accessToken: { type: string, description: The access JWT (RS256, 5 min) }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        refreshToken: { type: string, description: "Opaque, 256 bit, base64url; for POST /auth/v1/tokens/refresh" }
        refreshExpiresIn: { type: integer, description: Refresh token lifetime in seconds }
        sessionId: { type: string, description: "The token's `sid`" }
        idleTimeoutSeconds: { type: integer, description: Session idle timeout in seconds }
        pinSet: { type: boolean, description: "false: first PIN; set it with POST /auth/v1/pin" }
    PinKey:
      type: object
      required: [keyId, algorithm, publicKeyPem]
      properties:
        keyId: { type: string, description: "kid <keyId>.v<n>, sent back in encryptedPin.keyId" }
        algorithm: { type: string, enum: [RSA-OAEP-SHA-256] }
        publicKeyPem: { type: string, description: PEM SubjectPublicKeyInfo }
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, alg, use]
            properties:
              kty: { type: string, enum: [RSA] }
              kid: { type: string }
              alg: { type: string, enum: [RS256] }
              use: { type: string, enum: [sig] }
              n: { type: string }
              e: { type: string }
            not:
              anyOf:
                - { required: [d] }
                - { required: [p] }
                - { required: [q] }
    EcJwkSet:
      type: object
      description: The ASSERTION_SIGN keys (EC P-256), public members only
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, alg, crv, x, y]
            properties:
              kty: { type: string, enum: [EC] }
              kid: { type: string }
              alg: { type: string, enum: [ES256] }
              use: { type: string, enum: [sig] }
              crv: { type: string, enum: [P-256] }
              x: { type: string }
              y: { type: string }
            not: { required: [d] }
    Discovery:
      type: object
      required: [issuer, jwks_uri, id_token_signing_alg_values_supported]
      properties:
        issuer: { type: string }
        jwks_uri: { type: string }
        id_token_signing_alg_values_supported: { type: array, items: { type: string, enum: [RS256] } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        subject_types_supported: { type: array, items: { type: string } }
        response_types_supported: { type: array, items: { type: string } }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
