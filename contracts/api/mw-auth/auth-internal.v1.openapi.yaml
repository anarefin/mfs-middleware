openapi: 3.1.0
info:
  title: Bits wallet authentication internal API (mw-auth)
  version: 1.5.0
  description: |
    Internal API of mw-auth (spec 18.7, ADR D24), on its internal port (`https://mw-auth:8443`, the
    `app` zone network; not routed by APISIX). mTLS is mandatory: the TLS handshake needs a client
    certificate issued by the Vault services intermediate CA (`pki_int`, CN = service name), and
    the caller sends its Keycloak realm `services` client-credentials JWT (`aud` contains `mw-auth`),
    whose `azp` must be on the allow-list (mw-app-gateway, mw-ussd, mw-checkout, mw-admin-api) and
    equal the certificate's CN. No or bad token: 401 MW-AUTH-001; another client, a certificate of
    another service, or the public port: 403 MW-AUTH-002. Every error is the 5.3 envelope.

    Ticket 68: the device lookups of mw-app-gateway's device gate. The gateway verifies a signed
    app request itself with the device's public key (cached up to 5 min) and asks for the session
    on every app request; the session answer carries the fingerprint of the device's current key and
    its binding time (ticket 69, security review of 68), so a key cached before a rebind or a key
    replacement is dropped within the gateway's session-confirmation cache (10 s). Later tickets add
    the PIN and lock operations (70).

    Ticket 71 (spec 18.7, D22): `POST /internal/v1/txn-authorisations`, the transaction
    authorisation assertion the channels (mw-app-gateway, mw-ussd, mw-checkout only; mw-admin-api
    403 MW-AUTH-002) fetch before they publish `mw.txn.request.v1`. The core verifies it with the
    public set at `GET /auth/v1/.well-known/assertion-jwks.json` (auth.v1).

    Ticket 72: `POST /internal/v1/otp` and `POST /internal/v1/otp/verifications`, the hosted
    checkout page's OTP (purpose CHECKOUT, bound to the checkout sessionId; mw-checkout only).

    Dev only (ticket 69): `POST /internal/v1/seed/pins`, the seeder's first PINs, exists only with
    `mw.auth.seed-api.enabled=true` (the dev stack), on the plain public port (the seeder has no
    client certificate) and without a token; APISIX never routes `/internal/*`.
servers:
  - url: https://mw-auth:8443
security:
  - internalClientCredentials: []
    serviceCertificate: []
paths:
  /internal/v1/devices/{deviceId}:
    get:
      operationId: getBoundDevice
      summary: A bound device, its wallet and public key
      description: >-
        For the caller's request signature check: the device must be bound to the wallet of the
        app's token (the caller compares `walletId`). A device that is not bound (never, or unbound
        by a later binding of its wallet) is 404 MW-AUTH-003; a malformed device id 401 MW-AUTH-003.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The bound device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoundDevice" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/sessions/{walletId}/{deviceId}:
    get:
      operationId: checkSession
      summary: The wallet's live session on the device, extended by its idle timeout
      description: >-
        Every app request asks for it: a live session (`sess:{walletId}:{deviceId}`) is extended by
        its idle timeout (sliding) and returned with the device's current key fingerprint and binding
        time; none (idle timeout, logout, ended by a binding of another device) is 404 MW-AUTH-007; a
        device no longer bound to this wallet is 404 MW-AUTH-003. 503 MW-SYS-012 (retryable) when the
        session store cannot be asked.
      parameters:
        - name: walletId
          in: path
          required: true
          description: The wallet of the app's token (mw-core-mock uses the MSISDN).
          schema: { type: string, maxLength: 64 }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The live session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/txn-authorisations:
    post:
      operationId: authoriseTransaction
      summary: PIN check, then a single-use transaction assertion bound to the transaction
      description: >-
        Callers: mw-app-gateway, mw-ussd, mw-checkout (else 403 MW-AUTH-002). In this order: the
        wallet (exactly one of walletId and msisdn, else 400 MW-VAL-001; unknown 403 MW-AUTH-002) is
        ACTIVE and not locked (403 MW-AUTH-043, 423 MW-AUTH-041 with retryAfter, 423 MW-AUTH-042); an
        app's deviceId is the wallet's bound device (401 MW-AUTH-047); a live assertion under the
        same wallet and idempotency key is returned again without a PIN check when the transaction
        is the same, and refused 409 MW-IDEM-001 when it differs; then the PIN through mw-crypto
        (wrong 401 MW-AUTH-040, counted; no PIN 403 MW-AUTH-045). The answer is a compact JWS
        (ES256, mw-crypto ASSERTION_SIGN, header kid `<keyId>.v<n>` and typ `txn-assertion+jwt`)
        with claims `iss` mw-auth, `aud` core, `sub` walletId, `jti` (UUIDv7), `iat`, `exp` (iat +
        60 s), `txnHash`, `channel`, `authMethod` PIN, `deviceId` (when sent), `newDevice` (the
        wallet's device was bound less than 24 h ago). `txnHash` is the base64url SHA-256 (no
        padding) of the RFC 8785 canonical JSON of `{txnType, amount, currency, payer {type, id},
        payee {type, id}, idempotencyKey, channel}`, the values of the `mw.txn.request.v1` the
        channel then publishes (payer = debitParty, payee = creditParty, amount = valueMinor).
        mw-crypto or the session store down: 503 MW-SYS-050 / MW-SYS-012 (retryable).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TxnAuthorisationRequest" }
      responses:
        "200":
          description: The assertion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnAuthorisation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/seed/pins:
    post:
      operationId: seedPins
      summary: "Dev only: first PINs of seeded wallets (mw-seeder)"
      description: >-
        Only with `mw.auth.seed-api.enabled=true`; no token, plain public port. Each PIN is an
        `encryptedPin` under the PIN transport key (GET /auth/v1/pin-key): mw-auth stores the HMAC
        mw-crypto derives. A wallet that already has a PIN is left alone (UNCHANGED); a wallet not
        projected yet is UNKNOWN_WALLET (the seeder retries); a PIN mw-crypto refuses as weak is WEAK.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedPinsRequest" }
      responses:
        "200":
          description: One outcome per wallet, in request order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedPinsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pin-key:
    get:
      operationId: getChannelPinKey
      summary: The PIN transport key for the channels
      description: >-
        Security review of ticket 72. Callers: mw-app-gateway, mw-ussd, mw-checkout (the assertion's
        callers; anyone else 403 MW-AUTH-002), over mTLS with their services token. The same newest
        mw-crypto `PIN_TRANSPORT` version as the public `GET /auth/v1/pin-key` (auth.v1, kept for
        the apps), with its key `purpose`: a channel refuses a key of any other purpose. mw-crypto
        down and nothing cached: 503 MW-SYS-050 (retryable).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelPinKey" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/otp:
    post:
      operationId: sendChannelOtp
      summary: An OTP by SMS for a channel's own binding (the hosted checkout page)
      description: >-
        Ticket 72, spec 9.3. Only the client `mw-checkout` (any other allowed client: 403
        MW-AUTH-002). Purpose `CHECKOUT`, bound to `bindingId` (the checkout sessionId) instead of a
        device. The same rules as a device OTP (auth.v1 `POST /auth/v1/otp`): 6 digits by SMS through
        mw-notify (template `CHECKOUT_OTP` with `amount` and `merchant`, OTP priority, valid 2 min),
        stored as a hash only in its own slot: one current OTP per wallet, purpose and session, so it
        never replaces or uses up a device OTP (BIND, LOGIN, RESET) of the wallet nor another
        session's OTP; 3 checks; its own quota of at most 5 checkout OTPs per wallet in 15 min, over
        all its sessions and apart from the device OTP's (429 MW-VAL-022). The wallet
        must be known (else 403 MW-AUTH-002) and ACTIVE without an admin lock (403 MW-AUTH-043); a PIN
        lock is answered by the assertion. Kafka down: 503 MW-SYS-010 (retryable).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelOtpRequest" }
      responses:
        "202":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelOtpSent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/otp/verifications:
    post:
      operationId: verifyChannelOtp
      summary: Checks a channel OTP and spends it
      description: >-
        Ticket 72. Only the client `mw-checkout`. A match spends the OTP (204; once: a second check of
        the same OTP is 401 MW-AUTH-011). Wrong: 401 MW-AUTH-010 (the third wrong one voids it); no OTP
        for this wallet, purpose and binding (none asked, expired, spent or replaced): 401 MW-AUTH-011;
        checks used up: 401 MW-AUTH-012; unknown wallet 403 MW-AUTH-002.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelOtpVerification" }
      responses:
        "204":
          description: The OTP matched and is spent
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/pin-resets:
    post:
      operationId: approveCarePinReset
      summary: An approved care PIN reset (mw-admin-api, after maker-checker)
      description: >-
        Ticket 70, spec 18.7 care reset. Only the client `mw-admin-api` (any other allowed client: 403
        MW-AUTH-002). Called when an ops-checker approves an ops-maker's PIN_RESET change request:
        mw-auth opens a `CARE` reset in status `APPROVED` (an open self-service reset of the wallet is
        expired) and sends the customer an SMS to ask for a `RESET` OTP in the app and set a new PIN
        (no KYC step). Idempotent on `changeRequestId`: the same request again answers the same reset
        (200). A wallet mw-auth does not know is 404 MW-VAL-003.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarePinResetRequest" }
      responses:
        "200":
          description: The reset of this change request (already opened before)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarePinReset" }
        "201":
          description: Reset opened, SMS queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarePinReset" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    internalClientCredentials:
      type: oauth2
      description: >-
        Keycloak realm `services` client-credentials JWT (spec 18.2). mw-auth checks signature,
        expiry, exact issuer and that `aud` contains `mw-auth`; the caller (`azp`) must be
        mw-app-gateway, mw-ussd, mw-checkout or mw-admin-api and equal the client certificate's CN.
      flows:
        clientCredentials:
          tokenUrl: http://keycloak:8080/realms/services/protocol/openid-connect/token
          scopes: {}
    serviceCertificate:
      type: mutualTLS
      description: >-
        A client certificate of the Vault services intermediate CA (`pki_int/issue/<service>`, CN
        = the calling service, at most 72 h). Required by the handshake (D24).
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Error:
      description: Error envelope (spec 5.3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ChannelPinKey:
      type: object
      required: [keyId, algorithm, publicKeyPem, purpose]
      properties:
        keyId: { type: string, minLength: 1, description: "kid <keyId>.v<n>, sent back in encryptedPin.keyId" }
        algorithm: { type: string, enum: [RSA-OAEP-SHA-256] }
        publicKeyPem: { type: string, description: PEM SubjectPublicKeyInfo }
        purpose: { type: string, enum: [PIN_TRANSPORT], description: The mw-crypto key purpose }
    BoundDevice:
      type: object
      required: [deviceId, walletId, publicKey, boundAt]
      properties:
        deviceId: { type: string }
        walletId: { type: string }
        publicKey:
          type: string
          description: The device's EC P-256 public key, base64 X.509 SubjectPublicKeyInfo (DER).
        boundAt: { type: string, format: date-time }
    LiveSession:
      type: object
      required: [walletId, deviceId, idleTimeoutSeconds, deviceKeyFingerprint, boundAt, bindingEpoch]
      properties:
        walletId: { type: string }
        deviceId: { type: string }
        idleTimeoutSeconds: { type: integer, description: The session's idle timeout in seconds }
        deviceKeyFingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Lower-case hex SHA-256 of the device's current public key (the SubjectPublicKeyInfo DER bytes)
        boundAt: { type: string, format: date-time, description: When the device's current key was bound }
        bindingEpoch:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The epoch of this device's current binding to this wallet (ticket 110b): one database sequence over
            every binding of any device to any wallet, so a later binding always has a higher epoch, whatever
            the clocks. The DEVICE_BOUND notice to mw-notify carries the same value (param bindingEpoch);
            mw-app-gateway copies it into each push token registration so mw-notify can refuse a registration
            of an older binding.
    SeedPinsRequest:
      type: object
      additionalProperties: false
      required: [pins]
      properties:
        pins:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [walletId, encryptedPin]
            properties:
              walletId: { type: string, pattern: "^[A-Za-z0-9._:+-]{1,64}$" }
              encryptedPin:
                type: object
                additionalProperties: false
                required: [keyId, ciphertext]
                properties:
                  keyId: { type: string }
                  ciphertext: { type: string, maxLength: 4096 }
    SeedPinsResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [walletId, outcome]
            properties:
              walletId: { type: string }
              outcome: { type: string, enum: [CREATED, UNCHANGED, UNKNOWN_WALLET, WEAK] }
    ChannelOtpRequest:
      type: object
      required: [msisdn, purpose, bindingId, amount, merchant]
      properties:
        msisdn: { type: string, pattern: "^(\\+?880|0)1[3-9][0-9]{8}$" }
        purpose: { type: string, enum: [CHECKOUT] }
        bindingId: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$", description: The checkout sessionId the OTP is bound to }
        locale: { type: string, enum: [bn, en], description: The SMS language (bn when absent) }
        amount: { type: string, pattern: "^[0-9]{1,12}\\.[0-9]{2}$", description: "Taka, two decimals, for the SMS" }
        merchant: { type: string, minLength: 1, maxLength: 64, description: The merchant name for the SMS }
    ChannelOtpSent:
      type: object
      required: [wallet, otpExpiresAt, sendsLeft]
      properties:
        wallet: { type: string, description: "The wallet the SMS went to, masked (0171****789)" }
        otpExpiresAt: { type: string, format: date-time }
        sendsLeft: { type: integer, description: OTPs the wallet may still ask for in the current window }
    ChannelOtpVerification:
      type: object
      required: [msisdn, purpose, bindingId, otp]
      properties:
        msisdn: { type: string, pattern: "^(\\+?880|0)1[3-9][0-9]{8}$" }
        purpose: { type: string, enum: [CHECKOUT] }
        bindingId: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
        otp: { type: string, pattern: "^[0-9]{6}$" }
    CarePinResetRequest:
      type: object
      additionalProperties: false
      required: [walletId, changeRequestId, makerId, checkerId]
      properties:
        walletId: { type: string, pattern: "^[A-Za-z0-9._:+-]{1,64}$", description: The core's wallet id }
        changeRequestId: { type: string, format: uuid }
        makerId: { type: string, minLength: 1, maxLength: 128 }
        checkerId: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, maxLength: 500 }
        locale: { type: string, enum: [bn, en] }
    CarePinReset:
      type: object
      required: [resetId, status, expiresAt]
      properties:
        resetId: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, VERIFIED, DONE, EXPIRED] }
        expiresAt: { type: string, format: date-time }
    TxnAuthorisationRequest:
      type: object
      required: [channel, encryptedPin, txn]
      properties:
        walletId: { type: string, minLength: 1, maxLength: 64, description: "The app's wallet (exactly one of walletId and msisdn)" }
        msisdn: { type: string, pattern: "^(\\+?880|0)1[3-9][0-9]{8}$", description: USSD and checkout name the wallet by its MSISDN }
        channel: { type: string, pattern: "^[A-Z][A-Z_]{1,31}$", description: "The mw.txn.request.v1 channel, e.g. CUSTOMER_APP, USSD, WEB_CHECKOUT" }
        deviceId: { type: string, minLength: 1, maxLength: 128, description: The app's bound device (app channels only) }
        encryptedPin:
          type: object
          required: [keyId, ciphertext]
          description: The PIN encrypted under the mw-crypto PIN_TRANSPORT key (GET /auth/v1/pin-key)
          properties:
            keyId: { type: string }
            ciphertext: { type: string, maxLength: 4096 }
        txn:
          type: object
          required: [txnType, amount, currency, payer, payee, idempotencyKey]
          properties:
            txnType: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,31}$" }
            amount: { type: integer, minimum: 0, description: "Minor units (the request's amount.valueMinor); at least 1, except txnType BALANCE (ADR D26), which must be 0 with payee = payer (else 400 MW-VAL-001)" }
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            payer: { $ref: "#/components/schemas/TxnParty" }
            payee: { $ref: "#/components/schemas/TxnParty" }
            idempotencyKey: { type: string, minLength: 1, maxLength: 64 }
    TxnParty:
      type: object
      required: [type, id]
      description: The request's debitParty / creditParty, type and id only
      properties:
        type: { type: string, pattern: "^[A-Z][A-Z_]{1,31}$" }
        id: { type: string, minLength: 1, maxLength: 128 }
    TxnAuthorisation:
      type: object
      required: [assertion, expiresAt, newDevice]
      properties:
        assertion:
          type: string
          maxLength: 4096
          pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
          description: The compact JWS for mw.txn.request.v1 `assertion`
        expiresAt: { type: string, format: date-time }
        newDevice: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId, retryable, details]
      properties:
        code: { type: string, pattern: "^MW-(VAL|AUTH|IDEM|CORE|TMO|SYS|PTR-[A-Z0-9_]+)-[A-Z0-9_]+$" }
        message: { type: string }
        messageBn: { type: string }
        txnId: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        timestamp: { type: string, format: date-time, description: "When the error was built, UTC ISO-8601 to the millisecond (FRS 3.7, ticket 92). Set by every service; optional for older senders." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
